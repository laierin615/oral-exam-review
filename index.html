它分成過程評量（口語，如演講、口試；展演，如操作儀器、示範）和作品評量（書面報告、視覺作品、學習檔案）；講義也說檔案評量是實作評量的一種形式。判斷重點：學生是不是「做出來、說出來、演出來」。50 題選擇題是從選項中圈出答案，屬於傳統紙筆測驗。比喻：考球類運動，實作評量是上場運球、投籃，而不是寫一張規則考卷。","s":["題目問「不屬於」實作評量。","逐項看學生是否直接展現表現或作品：口試、示範、服務加檔案都有。","選擇題只考辨認知識，沒有實際表現，選 D。"],"w":{"A":"✗ 這屬於實作評量：口試是口語類過程評量，直接聽到學生的口說表現，所以不是本題答案。","B":"✗ 這屬於實作評量：上台示範製作流程是展演類過程評量，所以不是本題答案。","C":"✗ 這屬於實作評量：參與服務並製作學習檔案，有實際行動也有作品，所以不是本題答案。","D":"✓ 不屬於：50 題選擇題是紙筆的選出式反應，只測球類知識，沒有實際運動表現。"},"m":"做出來、說出來、演出來是實作；圈選答案不是。"},{"n":46,"q":"下列哪兩種評量的取材範圍和試題難易度分配比較接近？","o":["診斷性評量與形成性評量","安置性評量與總結性評量","安置性評量與診斷性評量","形成性評量與總結性評量"],"a":"A","al":"A","c":"診斷性與形成性","e":"診斷與形成性評量通常聚焦正在學習的具體目標、錯誤與困難，取材較細、範圍較集中，也常包含基本技能題，因此 A 最接近。安置較重先備能力；總結較重較大範圍的整體成果。題目難易仍須依實際目的調整。","p":"14、29","u":"purpose","k":"依教學歷程和目的，評量分四種。安置性：教學前了解學生的預備情形，以便分組或決定教學起點。形成性：教學中掌握進度，給師生即時回饋。診斷性：深入找出學習困難的原因，以改進教學。總結性：教學後提供成績或等第。形成性和診斷性都聚焦在正在學的具體目標，取材範圍小而細，題目多是檢查基本概念和常見錯誤的題目，講義也把診斷性評量歸在標準參照、適合形成性評量。總結性則範圍廣、題目難度分布較寬，用來區分整體成果。比喻：形成性和診斷性像學騎車時教練在旁邊看哪裡歪了，總結性像最後的騎車考試。","s":["先想每種評量的取材範圍與題目難易。","形成性、診斷性都針對特定單元的目標與錯誤，範圍集中、題目偏基本。","兩者最接近，選 A。"],"w":{"A":"✓ 兩者都聚焦正在學的具體目標與困難，取材範圍集中，題目多為基本題，最接近。","B":"✗ 安置性重在先備能力，取材是前一階段的基礎；總結性涵蓋整個學習範圍，兩者差很多。","C":"✗ 安置性看起點能力，診斷性深入特定困難，取材重點不同。","D":"✗ 形成性範圍小、針對單元；總結性範圍大、難度分布廣，差異明顯。"},"m":"形成與診斷看小範圍找錯誤，總結看大範圍給成績。"},{"n":47,"q":"下列有關「標準參照測驗」的敘述，何者正確？","o":["可以區分學生的成就水準","題目通常維持在中間難度","解釋結果的標準於教學前決定","測驗分數有較廣的範圍。"],"a":"C","al":"C","c":"標準預先設定","e":"標準參照的核心是依教學前設定的目標／標準解釋表現，故 C 最明確。B、D 比較接近強調個別差異的常模參照設計；A 若指精熟等級也可能成立，但不足以作為兩者的明確區辨，故本題取 C。","p":"12-14","u":"reference","k":"標準參照測驗的核心是：依教學「之前」就訂好的標準來解釋分數，看學生有沒有達到，而不是和別人比。講義說它的目的是了解學生學會了什麼、是否精熟；缺點是測驗範圍較小。常模參照測驗則是看學生在團體中的相對位置，講義寫明它的目的是「區別學生間的不同成就水準」、強調鑑別力、測驗範圍較廣，所以題目常維持中等難度，讓分數拉開。比喻：標準參照像體適能檢測，先公告「跑 800 公尺幾分鐘內算合格」，再看你有沒有達到。","s":["抓關鍵字「標準參照測驗」：核心是預設標準。","逐項檢查：A、B、D 都是講義列給常模參照的特徵。","C 直接說出「標準於教學前決定」，選 C。"],"w":{"A":"✗ 講義把「區別學生間的不同成就水準」列為常模參照的目的；標準參照重在是否達標。","B":"✗ 題目維持中等難度是為了拉開分數，是常模參照的設計；標準參照依目標決定題目，精熟後答對率可能很高。","C":"✓ 標準參照依教學前設定的標準解釋結果，這是它最明確的特徵。","D":"✗ 分數範圍廣是常模參照強調個別差異的結果；講義也說標準參照的測驗範圍較小。"},"m":"標準先訂好再考；分高下是常模，看過關是標準。"},{"n":48,"q":"五年仁班某次段考成績的統計結果，數學 M=65，SD=5；英文 M=80，SD=7。小明的數學考 70分，英文考 75 分。下列有關段考成績的敘述，何者最為正確？甲、仁班學生的數學程度較英文程度差  乙、仁班學生的數學成績較英文成績整齊丙、小明的數學程度較英文程度差      丁、小明的數學分數高於平均數一個標準差","o":["甲乙","甲丙","乙丁","丙丁"],"a":"C","al":"C","c":"標準差與相對表現","e":"數學 SD5＜英文 SD7，表示原始分數較集中（乙）；數學 z＝(70－65)÷5＝1（丁）。英文 z＝(75－80)÷7≈-0.71，小明數學相對表現較好。不同科目試卷難度不同，不能單由平均分數斷定能力高低。","p":"32-33、56、91","u":"stats","k":"平均數告訴你一群分數的中心在哪裡，標準差告訴你分數散得多開：標準差越小，分數越集中、越整齊。比較個人在不同科目的相對表現，要用 z 分數（離平均幾個標準差），不能只看原始分數。另外，不同科目的考卷難度不同，數學平均比英文低，可能只是數學考卷比較難，不能直接斷定全班數學程度較差。比喻：兩場比賽場地不同，只比跑出的秒數不公平，要看你在各場比賽中贏過多少人。","s":["甲：數學平均 65＜英文平均 80，但兩份考卷難度不同，不能斷定程度較差，甲錯。","乙：數學 SD＝5＜英文 SD＝7，數學分數較集中、較整齊，乙對。","丙：小明數學 z＝(70－65)÷5＝1；英文 z＝(75－80)÷7≈-0.71；數學相對較好，丙錯。","丁：數學 z＝1，正好高於平均一個標準差，丁對。選乙丁，C。"],"w":{"A":"✗ 含甲：不同科目考卷難度不同，平均分數低不代表程度差；乙則沒有被選入。","B":"✗ 甲、丙都錯：甲不能由平均斷定程度，丙算出來小明數學 z＝1 反而比英文 z≈-0.71 好。","C":"✓ 乙：數學 SD 較小、成績較整齊；丁：數學 z＝(70－65)÷5＝1。","D":"✗ 含丙：小明數學 z＝1、英文 z≈-0.71，數學相對表現較好，丙說反了。"},"m":"標準差看整齊，z 分數看相對位置，平均分數不等於程度。"},{"n":49,"q":"在一次定期評量中，甲生的分數剛好是班上的平均數。甲生的 T 分數是多少？","o":["40","50","60","70"],"a":"B","al":"B","c":"T 分數的平均","e":"剛好等於平均數時 z＝0，代入 T＝50＋10z，得 T＝50。T 分數的平均數固定設為 50、標準差 10；40 和 60 分別是低於與高於平均 1 SD。","p":"32-33","u":"normal","k":"T 分數是把 z 分數換成平均 50、標準差 10 的量尺，公式 T＝50＋10z。它的好處是消除負數和小數，比較容易讀。分數剛好等於平均數，代表離平均 0 個標準差，z＝0，所以 T 分數就是 50。比喻：T 分數就像把考試分數重新換成一把「50 分在正中間」的尺，站在正中間的人就是 50。順便記：高於平均 1 個標準差是 T60，低於 1 個標準差是 T40。","s":["分數等於平均數，z＝(X－M)÷SD＝0。","代入 T＝50＋10×0＝50。","選 B。"],"w":{"A":"✗ T40 是低於平均 1 個標準差（z＝-1）。","B":"✓ 等於平均數時 z＝0，T＝50＋10×0＝50。","C":"✗ T60 是高於平均 1 個標準差（z＝+1）。","D":"✗ T70 是高於平均 2 個標準差（z＝+2）。"},"m":"T 分數正中間是 50，每一個標準差走 10 分。"},{"n":50,"q":"教師在教學前先以學習單了解學生的先備知識，做為學生分組的依據。此做法屬於  下列何者？","o":["安置性評量","形成性評量","診斷性評量","總結性評量"],"a":"A","al":"A","c":"安置性評量","e":"在教學前檢查先備知識，並作為分組或教學起點依據，是安置性評量。形成性在學習過程中提供回饋；診斷性深入找困難原因；總結性統整階段成果。判斷時以主要用途為準。","p":"29","u":"purpose","k":"依教學歷程分：安置性評量在教學前，了解學生的預備情形（先備知識、起點能力），以便分組、編班或決定從哪裡開始教；形成性評量在教學中掌握進度、給回饋；診斷性評量深入找出學習困難的原因；總結性評量在教學後提供成績或等第。比喻：安置性評量就像游泳課第一天先讓大家下水游幾下，再依程度分成初級、中級、高級班。判斷時抓兩個重點：時機（教學前）和用途（分組依據）。","s":["抓關鍵字「教學前」「先備知識」「分組的依據」。","教學前了解預備情形並據以安排，對應安置性評量。","選 A。"],"w":{"A":"✓ 教學前檢查先備知識，作為分組與教學起點的依據，正是安置性評量。","B":"✗ 形成性評量在教學過程中進行，用來掌握進度、提供回饋，不是教學前分組。","C":"✗ 診斷性評量是深入找出學習困難的原因，題幹只是了解先備知識來分組。","D":"✗ 總結性評量在教學後統整成果、給成績，時機完全不同。"},"m":"教學前分組看安置，教學中回饋看形成。"},{"n":51,"q":"某班期中考的數學平均分數為 85 分，其中五分之三學生的成績低於該平均數。該班學生成績的中位數為下列何者？","o":["小於 85 分","大於 85 分","等於 85 分","無法判斷"],"a":"A","al":"A","c":"中位數","e":"五分之三＝60% 的學生低於 85 分，代表排到中間的 50% 位置仍在 85 以下，故中位數小於 85。平均數可能受少數高分拉高；不能因平均數是 85，就認為中位數也一定是 85。","p":"31-33；統計補充","u":"stats","k":"這題考平均數和中位數的差別。平均數是把全部分數加起來再除以人數；中位數是把分數由低排到高，站在正中間（第 50% 位置）那個人的分數。想像全班排成一列，中位數就是站在隊伍正中央的同學。平均數會被少數極端高分拉高，但中位數只看排隊位置。題目說五分之三（60%）的人低於 85，表示從最低分往上數到一半（50%）時，還沒碰到 85，所以中間那位的分數一定在 85 以下。","s":["先換算：五分之三＝60% 的學生分數低於平均數 85。","中位數是第 50% 位置的分數；50% 小於 60%，所以第 50% 位置的人也落在低於 85 的那群裡。","因此中位數小於 85，這也暗示有少數高分把平均數往上拉。"],"w":{"A":"✓ 低於 85 的人超過一半，排在正中間的人必然低於 85，所以中位數小於 85。","B":"✗ 若中位數大於 85，低於 85 的人應不到一半，和「60% 低於 85」矛盾。","C":"✗ 平均數等於中位數只在對稱分配（如常態）才成立，這裡六成人在平均以下，分配並不對稱。","D":"✗ 資訊其實足夠：只要知道超過一半的人低於 85，就能判斷中位數的位置。"},"m":"過半的人在平均以下，中位數就在平均以下。"},{"n":52,"q":"關於平時測驗結果的運用方式，下列何者較不適切？","o":["排定學生名次","了解學生學習狀況","據以調整教學計畫","了解學生學習成果的分布"],"a":"A","al":"A","c":"平時評量用途","e":"平時測驗主要提供學習回饋、了解分布與調整教學，單純排定名次較偏常模比較，也可能加重競爭而弱化回饋，故 A 較不適切。B、C、D 均可協助教師找出哪些目標需要再教。","p":"14、27、29","u":"purpose","k":"這題考平時測驗（小考、隨堂考）的用途。平時測驗通常屬於形成性評量，形成性評量是教學進行中做的評量，目的是看學生學到哪裡、哪裡還不會，好讓老師馬上調整教法，就像煮湯時邊煮邊試味道，再決定要不要加鹽。講義也提醒，只重分數和排名是評量的「傳統包袱」。排名次是拿學生互相比較，屬於常模參照的思維，對平時的學習回饋幫助不大，還可能加重競爭，所以最不適切。","s":["先看題幹關鍵字「平時測驗」，對應到教學過程中的形成性用途。","形成性評量的功能是回饋與調整教學，用這個標準檢查四個選項。","只有「排定名次」不是為了回饋教學，而是做人際比較，所以選 A。"],"w":{"A":"✓ 排名次是人與人比較的常模參照用法，不能告訴老師哪裡沒教會，最不符合平時測驗的目的。","B":"✗ 了解學生學習狀況正是形成性評量的核心功能，屬於適切用法。","C":"✗ 依結果調整教學計畫是平時測驗最重要的用途，屬於適切用法。","D":"✗ 看全班成績分布可以知道多少人學會、多少人還沒學會，有助於決定要不要補教。"},"m":"平時考是試湯的味道，不是排誰最會煮。"},{"n":53,"q":"下列何者最足以提高評量工具的信度？","o":["降低試題難度","延長施測時間","增加同質的複本試題數量","找程度相當的受試者接受施測"],"a":"C","al":"C","c":"提高信度","e":"增加能測量相同特質、品質相當的複本試題，可降低偶然因素對總分的相對影響，通常最能提高信度。單純降低難度或延長時間未必有效；受試者程度太接近會限制分數變異，通常不利於區辨型信度係數。","p":"56、58-59","u":"reliability","k":"這題考提高信度的方法。信度是測驗結果的穩定、一致程度，就像一台體重計連量三次都顯示差不多的數字，就是信度高。講義列出影響信度的因素，第一個就是題數：題數越多，信度越高。原因是每一題都有一點偶然誤差（剛好猜對、剛好看錯），題目多了，這些偶然會互相抵消。但加的題目必須測同一種能力、品質相當（同質的複本試題），不然加進來的是雜訊。這種「加長測驗」的效果可用斯皮爾曼－布朗公式推估。","s":["先看題幹：問「最足以提高信度」，回想講義影響信度的因素：題數、樣本異質性、難度適中、評分客觀。","C 增加同質試題，正對應「題數越多，信度越高」。","再檢查其他選項是否違反這些因素：難度太低、受試者同質，都會讓分數變異變小，信度反而下降。"],"w":{"A":"✗ 難度應適中（P 約 .50）分數才會拉開；一味降低難度會讓大家都高分，變異變小，信度下降。","B":"✗ 延長時間只能減少來不及作答的影響，題目沒變多，不一定提高信度。","C":"✓ 增加測同一特質的同質試題，就是加長測驗，偶然誤差互相抵消，最能提高信度。","D":"✗ 受試者程度太接近，分數變異小，相關係數會變低，講義說樣本異質性越高信度越高。"},"m":"題目多又同質，誤差互抵信度高。"},{"n":54,"q":"某次期末考，班上 50 位學生中，除了兩位得分很低，絕大多數學生都很接近滿分。這一種成績分布型態屬於下列何者？","o":["正偏態","負偏態","常態分配","雙峰分配"],"a":"B","al":"B","c":"負偏態","e":"多數接近滿分，少數極低分把尾巴拉向左側，屬負偏態（左偏）。正偏態是多數低分、右側長尾；常態分配大致對稱；題幹沒有兩個明顯高峰，因此不是雙峰。","p":"31-33；統計補充","u":"skew","k":"這題考偏態。偏態是分配不對稱、有一邊拖著長尾巴的情形。判斷方向的口訣是：看尾巴在哪一邊，不是看高峰在哪。大多數人很接近滿分，高峰擠在右邊（高分端），只有兩位很低分，把尾巴拖到左邊（低分端），這叫負偏態，也叫左偏。生活例子：一份很簡單的考卷，幾乎全班都 90 幾分，只有一兩個人沒寫完，分配就是負偏。","s":["先畫圖：多數人在接近滿分的右側堆成高峰。","找尾巴：兩位很低分的學生在左側形成一條長尾。","尾巴在左（數線負的那一邊），就是負偏態。"],"w":{"A":"✗ 正偏態是多數人低分、少數高分，尾巴在右邊，和本題相反。","B":"✓ 高峰在右、少數低分把尾巴拉向左，屬負偏態（左偏）。","C":"✗ 常態分配左右對稱，本題明顯一邊擠、一邊拖尾，不對稱。","D":"✗ 雙峰分配要有兩個明顯的高峰，本題只有一個靠近滿分的高峰。"},"m":"尾巴指哪邊就叫哪偏，尾在左是負偏。"},{"n":55,"q":"曾老師對全班學生的期中考成績進行排序，將前 27%的學生當成高分組，後 27%當成低分組，再計算每一題高分組和低分組答對人數百分比的差異。此做法是為了獲知下列何種資訊？","o":["難度","猜測度","鑑別度","評分者信度"],"a":"C","al":"C","c":"鑑別度計算","e":"分出高低分組，再算答對率之差，就是 D＝PH－PL，目的在檢查題目能否區分高低能力。難度 P 通常用答對比例或 (PH＋PL)÷2；評分者信度則比較不同評分者的評分一致程度。","p":"71、74","u":"item","k":"這題考鑑別度的計算方法。鑑別度 D 是指一道題目能不能分出程度好和程度差的學生，就像好的篩子能把大顆和小顆的豆子分開。做法是：依總分排序，取前 27% 當高分組、後 27% 當低分組，算出兩組在這題的答對率 PH 和 PL，D＝PH－PL。D 越大，表示高分組答對、低分組答錯的情形越明顯，題目越能區辨程度。難度 P 則是看答對比例，公式是 (PH＋PL)÷2，一個用「差」、一個用「平均」。","s":["抓題幹關鍵：分高低分組，再算「答對百分比的差異」。","兩組答對率相減就是 D＝PH－PL，鑑別度的公式。","對照：難度是兩組平均，評分者信度是比評分者，故選 C。"],"w":{"A":"✗ 難度 P 是答對比例，用高低分組時是 (PH＋PL)÷2，算的是平均而不是差。","B":"✗ 猜測度是低能力者猜對的機率，屬試題反應理論的參數，不是靠高低分組相減求得。","C":"✓ 高分組答對率減低分組答對率，就是鑑別度 D，看題目能否區分高低能力。","D":"✗ 評分者信度是比較不同評分者給分是否一致，和高低分組的答對率無關。"},"m":"差是鑑別度，和除二是難度。"},{"n":56,"q":"曾同學的國文考試分數之百分等級為 68，其意涵為何？","o":["滿分 100 中，曾同學獲得 68 分","在所有學生中排名第 68 名","考試成績贏過百分之 68 的學生","有 32 個學生的成績表現低於曾同學"],"a":"C","al":"C","c":"百分等級解釋","e":"百分等級 68 表示在所參照的團體中，約有 68% 的人表現低於該生。它不是原始分數 68，也不是第 68 名；剩餘比例是 32%，不是固定 32 個人。人數還須知道團體總數才可估算。","p":"21、32-34","u":"normal","k":"這題考百分等級（PR）的意思。百分等級是用 0～99 表示「你在一群人裡贏過多少百分比的人」，它是相對位置，不是考幾分，也不是第幾名。想像 100 個人排隊，PR68 就是你前面（比你低分）大約有 68 個人。考試很常把 PR 和原始分數、名次搞混：PR68 的人可能只考 50 分（考卷很難），也可能考 95 分（考卷很簡單）。另外 PR 講的是百分比，不是人數，要知道總人數才能換算成幾個人。","s":["先記定義：PR＝在參照團體中分數低於你的人所占的百分比。","PR68 → 約有 68% 的人低於曾同學。","逐一排除把 PR 當成原始分數、名次或固定人數的選項。"],"w":{"A":"✗ 這是把百分等級誤當原始分數；PR 是相對位置，和考卷滿分幾分無關。","B":"✗ 這是把 PR 當名次；PR 越高越前面，第 68 名的意義完全不同。","C":"✓ PR68 表示在參照團體中，約贏過 68% 的學生，正是百分等級的定義。","D":"✗ 百分等級講的是百分比，不是人數；而且低於他的是約 68%，不是 32。"},"m":"PR 是贏過幾成人，不是分數也不是名次。"},{"n":57,"q":"下列何者是編製測驗的第一個步驟？","o":["建置測驗的題庫","確定測驗的目的","設計雙向細目表","決定測驗的題型"],"a":"B","al":"B","c":"測驗編製起點","e":"先確定「為何測、要做什麼決定」，才能選內容、對象、題型與品質標準，故選 B。雙向細目表、選題型及建置題庫都是目的明確後的設計步驟，不能取代先界定測驗目的。","p":"28、68、70","u":"bloom","k":"這題考測驗編製的順序。講義列出實施評量要考量的 6W，第一個就是 WHY（目的）。就像出門旅行要先決定去哪裡、為什麼去，才能決定交通工具和行李。測驗也是：先確定要做什麼決定（分班？檢查學會沒？找困難？），才能決定考哪些內容、用什麼題型。雙向細目表是把「教學內容」和「認知層次（Bloom）」排成表格、分配題數的藍圖，也要等目的清楚之後才能設計。","s":["先想 6W 的第一個 W：WHY（目的）。","把四個選項排順序：確定目的 → 設計雙向細目表 → 決定題型 → 建置題庫。","第一步是確定測驗的目的，選 B。"],"w":{"A":"✗ 建置題庫是累積大量試題的後段工作，目的與藍圖未定前無從建起。","B":"✓ 測驗目的決定內容、對象、題型與解釋方式，是編製測驗的起點（6W 中的 WHY）。","C":"✗ 雙向細目表是依目的規劃內容與認知層次的藍圖，屬於目的確定後的步驟。","D":"✗ 題型要看目的與想測的能力才能決定，不能先於目的。"},"m":"先問為什麼考，再問考什麼、怎麼考。"},{"n":58,"q":"若要了解不同學校或不同班級間學生的異質性，應參照下列哪一項統計數值？","o":["中數","眾數","標準差","平均數"],"a":"C","al":"C","c":"離散程度","e":"異質性是學生之間差異的大小，標準差用來描述分數的離散程度，故選 C。在相同可比較量尺下，SD 越大代表分布越分散；中數、眾數與平均數主要描述中心位置。","p":"31-33、56","u":"stats","k":"這題考集中量數與變異量數的分工。集中量數（平均數、中數、眾數）回答「大家大約在哪裡」，變異量數（全距、標準差）回答「大家彼此差多少」。異質性就是學生之間程度差異的大小。標準差是每個分數離平均數平均有多遠，標準差大，代表班上有人很高、有人很低，程度參差；標準差小，代表大家差不多。兩個班平均都 70 分，一班人人 68～72，另一班 30～100 都有，平均數看不出差別，標準差就看得出來。","s":["抓關鍵字「異質性」＝學生間差異大小＝分散程度。","描述分散程度要用變異量數，選項中只有標準差屬於變異量數。","中數、眾數、平均數都是集中量數，只能描述中心位置，選 C。"],"w":{"A":"✗ 中數是排在正中間的分數，描述中心位置，看不出分數散得多開。","B":"✗ 眾數是出現最多次的分數，描述中心位置，不是差異大小。","C":"✓ 標準差描述分數離平均數的分散程度，越大代表學生間的異質性越高。","D":"✗ 平均數只說明整體水準，兩班平均相同也可能差異程度完全不同。"},"m":"平均看位置，標準差看參差。"},{"n":59,"q":"劉老師在批改一份自然科高層次推理能力之實作型試題(分數介於 0~6)時，對學生   錯別字、文法、標點等錯誤斟酌小扣 1 分，以提醒學生注意表達與溝通。劉老師的作法對測驗結果的何項特質影響最大？","o":["信度","效度","常模","客觀性"],"a":"B","al":"B","c":"構念無關因素","e":"本題目標是自然科推理，卻因錯字、文法與標點扣分，使分數混入其他能力，最直接威脅效度。即使老師每次都一致扣分，也只是可能維持一致性，不能確保測到所要的自然推理能力。","p":"35-38、54","u":"validity","k":"這題考效度與「和測驗目標無關的因素」。效度是測驗有沒有測到它想測的東西，講義用射箭比喻：效度是有沒有射中紅心。這份試題要測的是自然科高層次推理能力，老師卻因錯別字、文法、標點扣分，於是分數裡混進了語文表達能力。結果一個推理很強、但字寫錯的學生被扣分，分數就不能純粹代表推理能力。講義在評分偏誤中也提到「文字操作效應」：評分受錯字、標點、文法影響。這是測錯目標的問題，所以影響最大的是效度。","s":["先確認測驗目標：自然科高層次推理能力。","再看扣分原因：錯別字、文法、標點，屬於語文表達，和推理目標無關。","分數混入非目標能力＝沒測到想測的東西＝效度受損，選 B。"],"w":{"A":"✗ 信度是結果的一致性；老師若每次都固定扣錯字分，結果仍可能很一致，問題不在穩定與否。","B":"✓ 把語文錯誤混進自然推理的分數，分數不再只代表推理能力，最直接威脅效度。","C":"✗ 常模是解釋分數用的團體參照資料，和這個扣分規則沒有直接關係。","D":"✗ 客觀性是不同人評分是否一致，有明確扣分規則仍可客觀，主要問題是測錯對象。"},"m":"考推理卻扣錯字，射偏了靶心傷效度。"},{"n":60,"q":"方老師在課程結束後，依據事先訂定的學習目標與表現標準，檢視學生是否已習得特定知識與技能，而非進行學生間的比較。方老師的評量方式屬於下列何者？","o":["安置性評量","形成性評量","常模參照評量","標準參照評量"],"a":"D","al":"D","c":"標準參照","e":"重點是依事先訂定的目標与表現標準判斷是否學會，故 D 正確。課程結束也可具有總結性用途，但選項未列總結性；不能因有「課程結束」就選形成性，更不能選強調人際比較的常模參照。","p":"12-14、30","u":"reference","k":"這題考常模參照與標準參照的差別。常模參照是拿學生和團體裡其他人比，看你排在哪個位置，例如學測級分、PR 值。標準參照（也叫效標參照）是拿學生和事先訂好的標準比，看你有沒有過關，例如全民英檢、駕照考試，只要達到標準就通過，不管別人考幾分。題幹明說「依事先訂定的學習目標與表現標準」、「檢視是否已習得」、「而非進行學生間的比較」，三個線索都指向標準參照。","s":["抓關鍵字：「事先訂定的目標與標準」、「是否習得」、「非學生間比較」。","這些是依「分數怎麼解釋」分類的線索，對應常模參照 vs. 標準參照。","不和別人比、只和標準比，就是標準參照評量，選 D。"],"w":{"A":"✗ 安置性評量在教學前了解學生的預備程度，本題是課程結束後檢視是否學會。","B":"✗ 形成性評量是在教學過程中回饋調整，本題是課程結束後判斷是否達標。","C":"✗ 常模參照是拿學生和團體比較相對位置，題幹明說「而非進行學生間的比較」。","D":"✓ 依事先訂定的目標與表現標準判斷是否學會，正是標準參照評量的定義。"},"m":"跟別人比是常模，跟標準比是標準參照。"},{"n":61,"q":"體育課進行跳繩教學時，李老師在學生練習過程中持續給予正向鼓勵，讓學生相信自己一定能達到標準，因此學生的練習動機明顯提升，學習表現也隨之進步。此現象較符合下列何者？","o":["月暈效應(halo effect)","霍桑效應(Hawthorn effect)","比馬龍效應(Pygmalion effect)","強亨利效應(John Henry effect)"],"a":"C","al":"C","c":"比馬龍效應","e":"教師的正向期待與鼓勵改變學生信念、動機及表現，最符合比馬龍／自我應驗效應。月暈是既有印象影響評分；霍桑是因受注意或被研究而改變行為；強亨利是比較組因競爭意識而加倍努力。","p":"24、54、57","u":"observe","k":"這題考幾個常被混淆的「效應」。比馬龍效應又叫自我應驗預言：老師對學生有正向期待，透過鼓勵、關注把期待傳給學生，學生真的變得更好，期待就「應驗」了。名字來自希臘神話，雕刻家比馬龍深愛自己雕的少女像，雕像最後真的活了過來。講義在「測驗的副作用」也提到自我應驗效果。本題李老師一直鼓勵學生相信自己做得到，學生動機和表現都提升，正是期待帶來改變。","s":["抓關鍵：老師的正向期待與鼓勵 → 學生相信自己 → 表現真的進步。","期待讓結果成真，對應自我應驗預言，也就是比馬龍效應。","再用各效應的定義排除其他選項，選 C。"],"w":{"A":"✗ 月暈效應是評分者被學生某一方面的好印象影響，連帶給其他方面高分，是評分偏誤，不是學生真的進步。","B":"✗ 霍桑效應是受試者知道自己被研究、被注意而改變行為，關鍵是「被觀察」而不是老師的期待。","C":"✓ 老師的正向期待傳給學生，提升動機與表現，期待自我應驗，就是比馬龍效應。","D":"✗ 強亨利效應是控制組知道自己被比較而不服輸、加倍努力，本題沒有實驗組與控制組。"},"m":"老師相信你，你就變成那樣：比馬龍。"},{"n":62,"q":"下列何者是教師需要具備的評量觀念？甲、使用評量結果時必須謹慎，可對全班家長公開乙、設計良好的評量應該是任何人都可以執行，且一次就可下定論丙、須尊重家長對學生表現所提供的證據，並用以檢視自己的觀察結果丁、家長若覺得評量結果不符合子女的平常表現，教師可考慮重新評量","o":["甲乙","甲丙","乙丙","丙丁"],"a":"D","al":"D","c":"審慎使用結果","e":"丙尊重家長提供的日常證據，丁願意檢視不一致結果，均能讓評量更完整，故選 D。甲全面公開有隱私問題；乙忽略施測專業、誤差與多次觀察，不能一次就對孩子下定論。","p":"24、89、91","u":"alt","k":"這題考教師應有的評量態度。評量結果牽涉學生隱私，而且任何一次評量都有誤差，所以要謹慎使用、多方蒐證。講義「解釋測驗分數的守則」提到：謹記會有誤差，並應把受測者的其他相關資料納入考慮。家長天天看孩子在家的表現，是很寶貴的另一份證據。就像醫生看診，不會只憑一次量血壓就下診斷，會參考病人平常的紀錄，必要時再量一次。","s":["逐句判斷：甲「可對全班家長公開」侵犯隱私，錯。","乙「任何人都能執行、一次就下定論」忽略施測專業和測量誤差，錯。","丙、丁都是納入其他證據、檢視結果是否一致，符合多元評量精神，選丙丁。"],"w":{"A":"✗ 甲把結果公開給全班家長，違反隱私；乙一次就下定論，忽略誤差，兩句都錯。","B":"✗ 甲錯在公開成績侵犯隱私，丙雖正確，組合仍錯。","C":"✗ 乙錯在以為一次評量就能定論，任何測驗都有誤差，需要多次、多元證據。","D":"✓ 丙尊重家長提供的日常證據來檢視自己的觀察，丁在結果不符時考慮重新評量，都是審慎評量的態度。"},"m":"結果要保密，證據要多方，一次不定論。"},{"n":63,"q":"教師想要了解學生程度，以便決定教學起點時，應該選擇下列何種評量？","o":["預備性評量","形成性評量","診斷性評量","總結性評量"],"a":"A","al":"A","c":"預備性評量","e":"了解學生已有的知識能力，以决定教學起點，屬预備性／安置性評量。形成性重在過程回饋；診斷性找特定學習困難的原因；總結性用於階段成果。看到「起點」可優先想到安置或預備。","p":"29","u":"purpose","k":"這題考依教學歷程分的評量種類。教學前做的叫安置性評量，也常稱預備性評量，目的是了解學生已經會什麼、準備好了沒有，好決定從哪裡開始教或怎麼分組。就像教練上第一堂游泳課，先看每個人會不會換氣，再決定從哪裡教起。教學中做形成性評量，看進度並回饋；教學後做總結性評量，給成績；診斷性評量則是當學生持續學不會時，深入找出困難的原因。看到「決定教學起點」，就想到預備（安置）性評量。","s":["抓關鍵字：「了解學生程度」、「決定教學起點」。","時間點在教學前，目的在了解預備情形。","對應預備性（安置性）評量，選 A。"],"w":{"A":"✓ 教學前了解學生既有能力，以決定教學起點，就是預備性（安置性）評量。","B":"✗ 形成性評量在教學中進行，用來掌握進度、即時回饋，不是決定起點。","C":"✗ 診斷性評量是找出學生持續性學習困難的原因，重點是「為什麼學不會」。","D":"✗ 總結性評量在教學結束後評定成果、給成績等第，時間點不對。"},"m":"教前安置看起點，教中形成看進度，教後總結給成績。"},{"n":64,"q":"「情意測驗」乃是有關個人態度、價值觀、興趣、鑑賞、動機、情緒、人格等特質的測驗。據此，下列何者屬於情意測驗？甲、中文年級認字量表                乙、國小兒童自我概念量表丙、國民中小學學習行為特徵檢核表    丁、國小學生生活適應量表","o":["甲乙","甲丙","乙丁","丙丁"],"a":"C","al":"C","c":"情意測驗","e":"自我概念與生活適應涉及個人感受、自我看法及適應狀態，因此乙、丁最明確，選 C。認字量表屬認知能力；學習行為特徵檢核表須依內容判斷，不能僅因是檢核表就視為情意測驗。","p":"7、15、89-90","u":"perform","k":"這題考情意測驗。測驗依功能可分為認知測驗和情意測驗：認知測驗測「會不會、能不能」，例如智力、性向、成就測驗；情意測驗測「感覺、態度、興趣、人格」，例如自我概念、動機、適應。簡單判斷法：如果題目有標準答案、答對越多越好，偏認知；如果是問你怎麼看自己、喜不喜歡、過得好不好，沒有對錯，偏情意。自我概念量表問「我覺得自己是個怎樣的人」，生活適應量表問「我在學校和家裡過得好嗎」，都屬情意。","s":["先用題幹定義：情意測驗涉及態度、價值觀、興趣、動機、情緒、人格。","逐項判斷：甲認字量是認知能力；乙自我概念、丁生活適應涉及個人感受與適應，屬情意。","丙學習行為特徵檢核表內容不明，不如乙丁明確，選乙丁。"],"w":{"A":"✗ 甲認字量表測識字能力，有對錯之分，屬認知測驗。","B":"✗ 甲屬認知；丙學習行為特徵檢核表要看內容才能判斷，不能只因是檢核表就算情意。","C":"✓ 乙自我概念是對自己的看法，丁生活適應是個人的適應狀態，都屬情意特質。","D":"✗ 丁正確，但丙不是明確的情意測驗，組合不如乙丁貼切。"},"m":"有對錯測認知，問感受測情意。"},{"n":65,"q":"下列有關測驗與評量的敘述，何者正確？","o":["實作評量強調結構完整的問題","選擇題測驗易於測得分析與評鑑的能力","實作評量的結果可以預測實際情境的表現","標準化測驗在特定教育情境中能提供有效的解釋"],"a":"C","al":"C","c":"實作評量的用途","e":"實作任務與實際用途相近，可提供推論實際情境表現的證據，故 C 最適切。它不要求一律為結構完整的問題；高層次選擇題不易編製；標準化測驗也不保證能精確對應每個特定課堂情境。","p":"75-84","u":"performance","k":"這題考實作評量的特性。實作評量是讓學生實際動手操作、表演或完成作品，再評量過程與成果，例如做實驗、演講、做作品。因為任務和真實生活很接近，例如考駕照要實際上路開車，所以它的結果比較能推論學生在真實情境中會怎麼表現。講義也提到實作評量的題目常是「弱結構」，問題內容不一定完整明確，讓學生有彈性解題；並說實作評量的結果相較於標準化測驗，較能提供有效的解釋。","s":["先回想實作評量的特色：真實、直接、弱結構、重過程與成果。","逐項檢查：A 說強調結構完整，和弱結構相反；C 與真實情境接近，可預測實際表現。","B、D 分別誤判選擇題與標準化測驗的特性，選 C。"],"w":{"A":"✗ 講義說實作評量常是弱結構，題目可以模糊、有彈性，不強調結構完整。","B":"✗ 選擇題要測分析與評鑑等高層次能力很難編製，說「易於測得」不正確。","C":"✓ 實作任務接近真實用途，結果最能推論學生在實際情境的表現。","D":"✗ 標準化測驗是為大範圍比較設計的，講義指出在解釋上反而是實作評量較能提供有效解釋。"},"m":"真槍實彈考實作，結果最像真實表現。"},{"n":66,"q":"某班學生進行語文能力測驗後，得知甲同學的 Z 分數為 2，乙同學的 T 分數為 60，丙同學的 Z分數為-2。請問下列敘述，何者正確？","o":["乙同學的語文能力測驗分數最高","甲同學的語文能力測驗分數最高","甲同學和乙同學的語文能力測驗分數一樣","甲同學和丙同學的語文能力測驗分數一樣"],"a":"B","al":"B","c":"z 與 T 比較","e":"甲 z＝2；乙 T60 換為 z＝(60－50)÷10＝1；丙 z＝-2。故甲＞乙＞丙，選 B。z 的正負號表示在平均數之上或之下，+2 與 -2 雖距中心一樣遠，表現並不相同。","p":"32-33","u":"normal","k":"這題考 z 分數和 T 分數的換算與比較。z 分數表示「離平均數幾個標準差」：z＝0 剛好在平均，z＝2 在平均之上 2 個標準差，z＝-2 在平均之下 2 個標準差。T 分數是把 z 放大、平移，避免負數和小數：T＝50＋10z，所以平均是 50，每 10 分代表 1 個標準差。三個人單位不同，就像一人報公分、一人報公尺，要先換成同一種單位才能比。把乙的 T 換回 z，三人就能直接比大小。","s":["甲：z＝2。","乙：T＝60，換成 z＝(60－50)÷10＝10÷10＝1。","丙：z＝-2。","比大小：2＞1＞-2，所以甲最高、乙次之、丙最低，選 B。"],"w":{"A":"✗ 乙的 T60 換算後 z＝1，比甲的 z＝2 低，不是最高。","B":"✓ 甲 z＝2，是三人中離平均數往上最遠的，分數最高。","C":"✗ 甲 z＝2、乙 z＝1，相差 1 個標準差，分數不一樣。","D":"✗ 甲 z＝+2 在平均之上，丙 z＝-2 在平均之下，雖然距離一樣遠，方向相反，分數差很多。"},"m":"T 減 50 再除 10 就是 z，換成同單位再比。"},{"n":67,"q":"一個測驗能測出所欲量度的行為特性之程度，應屬下列何者？","o":["信度","效度","常模","效標"],"a":"B","al":"B","c":"效度","e":"「能否測到所欲量度的行為特性」就是效度。信度是結果一致性；常模是解釋分數的參照資料；效標是用來比較或預測的外部表現指標。答題時抓住「測得對不對」與「測得穩不穩」的差別。","p":"17、35-37","u":"validity","k":"這題考效度的定義。講義說，效度是測驗的正確性，也就是測驗能夠測量到它所想測量之特質的程度。用射箭比喻：效度是有沒有射中紅心；信度是每一箭是不是都落在差不多的地方。一把體重計量你的身高，就算每次數字都很穩定，也沒有效度，因為它測的根本不是身高。題幹「能測出所欲量度的行為特性之程度」幾乎就是效度定義的原文。","s":["抓題幹關鍵：「測出所欲量度」＝測得對不對。","對應良好測驗的四個特徵：效度、信度、常模、實用性。","「測得對」是效度，「測得穩」是信度，選 B。"],"w":{"A":"✗ 信度是測驗結果的一致性、穩定性，是「測得穩不穩」，不是「測得對不對」。","B":"✓ 能測到想測的特質的程度，就是效度的定義（測驗的正確性）。","C":"✗ 常模是某團體在測驗上的得分資料，用來解釋個人分數，不是測驗準不準的指標。","D":"✗ 效標是用來驗證效度的外部表現指標（例如日後學業成績），本身不是定義中的特性。"},"m":"效度射中靶心，信度箭箭集中。"},{"n":68,"q":"依常態分配而言，如果一項考試的平均分數是 80 分，標準差是 10 分，則該考試分數介於 70 分到 90 分的人數，約占多少百分比？","o":["60%","70%","80%","90%"],"a":"B","al":"B","c":"常態區間換算","e":"70～90 相對於平均 80、SD10，是平均數上下各 1 SD，比例約 68.26%。選項中 70% 最接近，故選 B。若問 ±2 SD，則會是約 95.44%；不可混用兩種範圍。","p":"32-33","u":"normal","k":"這題考常態分配各區間的比例。常態分配是左右對稱的鐘形曲線，平均數、中位數、眾數重合在正中間。要背的三個數字：平均數上下各 1 個標準差，約占 68.26%；上下各 2 個標準差約 95.44%；上下各 3 個標準差約 99.72%。講義的常態曲線圖也標出 1 到 2 個標準差之間單側約 13.59%，以及 -1 SD 以下約 16%、+1 SD 以下約 84%。本題 70 到 90 正好是 80 上下各 1 個標準差。","s":["算距離：平均 80，SD10。70＝80－10＝平均減 1 個 SD；90＝80＋10＝平均加 1 個 SD。","所以範圍是 ±1 SD，比例約 34.13%＋34.13%＝68.26%。","選項中最接近 68% 的是 70%，選 B。"],"w":{"A":"✗ 60% 和 68.26% 差了 8 個百分點以上，不是最接近的選項。","B":"✓ 70～90 是平均數 ±1 個標準差，約 68.26%，最接近 70%。","C":"✗ 80% 偏高，±1 SD 只有約 68%。","D":"✗ 90% 更偏高；±2 SD（60～100 分）才約 95.44%。"},"m":"一個標準差六八，兩個九五，三個九九七。"},{"n":69,"q":"某國小負責九十八學年度一般智能資優班招生鑑定工作。該次鑑定採用魏氏兒童智力量表，依規定應試者的智力至少應在多少以上，才符合標準？","o":["125","130","135","140"],"a":"B","al":"B","c":"一般智能資優界值","e":"依本題採平均數正 2 個標準差的智力門檻，魏氏量尺為 100＋2×15＝130，所以選 B。125、135、140 均不是 +2 SD 的位置。","p":"18、32-33；補充 S3","x":"本題是舊年度考題的門檻計算；符合分數門檻不等於單憑此分數即可完成鑑定或安置。","u":"iq","k":"這題考離差智商與資優門檻。魏氏智力量表的離差智商平均是 100、標準差是 15，所以每多一個標準差就加 15 分。依題目所採用的規定，一般智能資優的智力門檻是平均數加 2 個標準差，大約是全體前 2.28% 的人。補充提醒：這是舊年度考題的門檻算法，而且符合分數門檻不代表只靠這一個分數就能完成資優鑑定或安置，實務上還會綜合其他資料。","s":["魏氏量表：平均 100，SD＝15。","門檻是平均數加 2 個標準差：100＋2×15＝100＋30＝130。","選 B。"],"w":{"A":"✗ 125 不是 +2 SD 的位置（100＋2×15＝130），也不是 15 的整數倍。","B":"✓ 100＋2×15＝130，正是魏氏量表平均數加 2 個標準差的門檻。","C":"✗ 135 超過 +2 SD，大約是 +2.33 SD，不是規定的界值。","D":"✗ 140 約為 +2.67 SD，比題目採用的門檻高。"},"m":"魏氏一個標準差 15 分，資優門檻 100 加 30。"},{"n":70,"q":"下列那一種變項不適合計算平均數與標準差？","o":["連續變項","名義變項","等距變項","比率變項"],"a":"B","al":"B","c":"名義資料","e":"名義變項的數字只是類別代碼，例如班別編為 1、2、3，其平均數沒有實質數量意義，也不宜用 SD 描述能力差異。等距與比率量尺可計算平均及標準差；「連續」不是本題要排除的量尺類型。","p":"19-23","u":"scales","k":"這題考四種量尺能做哪些計算。名義量尺只是幫類別貼標籤，例如男生編 1、女生編 2，數字可以任意對調，沒有大小意義。這時候算平均數就像把球衣號碼加起來平均，得到「1.4」完全沒意思，標準差也一樣。等距量尺有相等單位，可以加減，所以能算平均數與標準差；比率量尺再多一個絕對零點，能算倍數，當然也可以算。連續變項是指數值可以無限細分（如身高），通常屬等距或比率，可以計算。","s":["先想每種量尺的特性：名義只能分類、次序能排序、等距能加減、比率能乘除。","平均數和標準差需要能做加減，至少要等距量尺。","名義變項的數字只是代碼，不適合，選 B。"],"w":{"A":"✗ 連續變項（如身高、時間）通常是等距或比率資料，可以計算平均數與標準差。","B":"✓ 名義變項的數字只是類別代碼，可任意調換，算平均數或標準差沒有意義。","C":"✗ 等距變項有相等單位，可以加減，適合算平均數與標準差。","D":"✗ 比率變項有等距單位又有絕對零點，平均數與標準差都能算。"},"m":"名義只是貼標籤，號碼不能拿來平均。"},{"n":71,"q":"根據雙向細目表命題，主要在確認試題的何種效度？","o":["表面效度","關聯效度","預測效度","內容效度"],"a":"D","al":"D","c":"雙向細目表","e":"依教材內容與學習目標安排試題，能檢查取樣是否完整、具代表性，主要支持內容效度。表面效度只看外觀是否合理；關聯效度需外部效標；預測效度要有未來表現作比較。","p":"38、68","u":"bloom","k":"這題考雙向細目表和內容效度的關係。雙向細目表是一張雙向表格，一邊列教學內容（單元、主題），一邊列 Bloom 認知層次（記憶、理解、應用……），格子裡填題數或配分。它就像出考題的藍圖，確保每個重要單元、每個層次都有照比例考到，不會只考第一課或只考背誦。內容效度是試題能不能代表要考的教材範圍，講義說檢驗內容效度的方法之一就是雙向細目表，而成就測驗最需要內容效度。","s":["抓關鍵詞「雙向細目表」→ 規劃教材內容與認知層次的分布。","題目取樣是否完整、具代表性，就是內容效度。","其他效度都需要外部效標或只看外觀，選 D。"],"w":{"A":"✗ 表面效度只看測驗表面上「看起來」是否合理，雙向細目表檢查的是內容取樣的代表性。","B":"✗ 效標關聯效度要拿測驗分數和外部效標求相關，不是靠雙向細目表。","C":"✗ 預測效度要比對未來的表現（如日後成績），雙向細目表不涉及未來效標。","D":"✓ 依雙向細目表命題，確保試題能代表教材內容與目標，主要確認內容效度。"},"m":"雙向細目表是藍圖，保住內容效度。"},{"n":72,"q":"下列何者是「標準參照測驗」(criterion-referenced test)的特性之一？","o":["與其他學生的測驗表現進行比較","與教師設定的精熟標準進行比較","原始資料的測量分數之變異性較大","以百分等級和標準分數解釋測量分數"],"a":"B","al":"B","c":"精熟標準","e":"標準參照以預先設定的精熟要求判斷學生是否學會，所以 B 正確。A 是與他人比較；C 的較大變異及 D 的百分等級、標準分數較常用於常模參照。判斷依據是分數怎麼解釋，而非測驗名稱。","p":"12-14、30","u":"reference","k":"這題考標準參照測驗的特性。標準參照測驗是依教學前訂好的標準（精熟標準）解釋分數，看學生「過關了沒有」，像游泳檢定只要能游 25 公尺就通過，不管別人游得多快。常模參照測驗則是看你在團體中的相對位置，所以會用百分等級、標準分數來解釋，並希望分數拉得開（變異大）以便區分高下。講義也提到，標準參照較適用同質性高的團體，此時重點是有沒有測到目標，而不是拉開差距。","s":["先確定標準參照的核心：與預設的精熟標準比較。","檢查選項：B 正是精熟標準。","A、C、D 都是常模參照的特徵（和他人比、要變異大、用 PR 與標準分數），選 B。"],"w":{"A":"✗ 和其他學生比較表現是常模參照測驗的特性。","B":"✓ 把學生表現和教師設定的精熟標準比較，判斷是否達標，正是標準參照的核心。","C":"✗ 分數變異大才能分出高下，這是常模參照追求的；標準參照若大家都學會，變異可能很小。","D":"✗ 百分等級與標準分數都是表示在團體中的相對位置，屬常模參照的解釋方式。"},"m":"標準參照看過關，常模參照看排行。"},{"n":73,"q":"下表是某道選擇題高分組和低分組學生在各選項的選答比例，哪一個選項較具有誘答性？A* B C D高分組 70% 5% 25% 0%低分組 30% 20% 40% 10%*為正確答案","o":["A","B","C","D"],"a":"","al":"待釐清（B、C 均有依據）","c":"誘答選項分析","e":"A 是正答，不是誘答項。B 的低－高選答率＝20%－5%＝15%；C＝40%－25%＝15%；D＝10%－0%＝10%。若以兩組差值判斷，B、C 並列；若以吸引低分組的比例判斷，C 較高。","p":"71-74；補充 S2","x":"題目未定義「較具有誘答性」的比較指標，無法嚴謹地指定唯一答案。可練習計算，但本題宜暫不計分。","u":"item","k":"這題考誘答力，但題意有疑義、不計分。誘答選項是選擇題的錯誤選項，好的誘答選項要能吸引「還沒學會的人」，所以應該低分組選的比高分組多，就像陷阱要專抓沒準備的人，而不是連高手都中招。常見的判斷方式有兩種：一是看低分組減高分組的選答比例差，差越大越好；二是看它吸引低分組的比例有多高。用第一種，B 和 C 都是 15%，並列最高；用第二種，C 吸引了 40% 的低分組，最高。題目沒說用哪個指標，所以無法指定唯一答案，暫不計分，但計算本身值得練習。","s":["A 有星號，是正確答案，不是誘答選項，先排除。","算低分組－高分組：B＝20%－5%＝15%；C＝40%－25%＝15%；D＝10%－0%＝10%。","若以差值判斷，B、C 並列；若看吸引低分組的比例，C 的 40% 最高。","兩種指標結論不同，題目又沒指定，所以此題不計分。"],"w":{"A":"△ A 是正確答案（高分組 70%、低分組 30%），不是誘答選項，不論用哪種指標都不會選它。","B":"△ B 低分組比高分組多 15%，以差值來看誘答力最佳之一；但吸引的低分組只有 20%。","C":"△ C 差值同為 15%，且吸引 40% 的低分組，比例最高；但也有 25% 的高分組被誤導，誘答方向不夠乾淨。","D":"△ D 差值 10%，方向正確（高分組沒人選），但吸引人數最少，三個誘答選項中最弱。"},"m":"誘答看低分組多選：先算低減高，再看指標。"},{"n":74,"q":"把新編測驗與效標測驗一併施測所得的相關，是屬於何種效度？","o":["內容效度","同時效度","表面效度","預測效度"],"a":"B","al":"B","c":"同時效度","e":"新測驗與效標約在同一時期施測，再求相關，屬同時／併行效度。若效標在較晚的未來取得才是預測效度。內容效度看內容代表性，表面效度看表面適切性，均不是本題的相關研究設計。","p":"40-41","u":"validity","k":"這題考效標關聯效度的兩種。效標關聯效度是拿新測驗的分數和一個外部標準（效標）求相關，看兩者是否一致。依效標取得的時間分成兩種：同時（併行）效度是新測驗和效標「同一時期」施測；預測效度是效標要等「未來」才取得，例如用入學測驗預測一年後的學業成績。生活例子：新出一款快速驗血儀，同一天也做醫院的標準檢驗，比對兩者結果，就是同時效度。題幹說「一併施測」，關鍵字是同時。","s":["抓題幹：新測驗與效標測驗「一併施測」再求相關。","有效標、求相關 → 效標關聯效度；同時施測 → 同時效度。","若效標在未來才取得才是預測效度，選 B。"],"w":{"A":"✗ 內容效度看試題是否代表教材內容，通常靠專家判斷或雙向細目表，不需要求相關。","B":"✓ 新測驗和效標在同一時期施測並求相關，屬於同時（併行）效度。","C":"✗ 表面效度只看測驗外觀是否合理，沒有和效標求相關。","D":"✗ 預測效度的效標要在未來才取得，題幹是一併施測，不是預測未來。"},"m":"效標同時拿是同時效度，等以後拿是預測效度。"},{"n":75,"q":"李老師想了解期末考數學考題是否適切，於是他做了試題分析，請判斷下列哪一個試題分析結果最為理想？","o":["P = 0.10，D = 0.15","P = 0.46，D = -0.15","P = 0.51，D = 0.75","P = 0.85，D = 0.30"],"a":"C","al":"C","c":"理想試題指標","e":"C 的 P＝.51，難度適中；D＝.75，表示高分組答對率比低分組高 75 個百分點，區辨力佳。A 太難且鑑別低；B 鑑別為負；D 雖有一定鑑別力但偏易。在一般區辨目的下 C 最佳。","p":"70-74","u":"item","k":"這題考如何判斷一道試題好不好。難度 P 是答對比例，P 越大越容易，講義說命題時難度以適中為宜，約 .40～.60（P＝.50 左右），分數最能拉開。鑑別度 D＝高分組答對率－低分組答對率，D 越大越好，負值表示低分組反而答得比高分組好，題目可能有問題。好題目就像好的篩網：孔不能太大或太小（難度適中），又要真的能分出大小（鑑別度高）。","s":["先看 D：B 是負的，直接淘汰；A 只有 .15，鑑別力很弱。","剩 C（D＝.75）和 D 選項（D＝.30），C 的鑑別度明顯較高。","再看 P：C 的 .51 落在 .40～.60 的適中區間，D 選項的 .85 偏易，所以 C 最理想。"],"w":{"A":"✗ P＝.10 表示只有一成人答對，太難；D＝.15 鑑別力也弱。","B":"✗ D＝-.15 是負鑑別，低分組答對率反而比高分組高，題目可能有錯或誤導。","C":"✓ P＝.51 難度適中，D＝.75 表示高分組答對率比低分組高 75 個百分點，鑑別力極佳。","D":"✗ D＝.30 尚可，但 P＝.85 偏容易，分數不易拉開，不如 C 理想。"},"m":"難度五成剛剛好，鑑別越大越會分。"},{"n":76,"q":"有關測驗效度的說法，下列哪一項是對的？","o":["效度高，信度一定不低","效度是可靠性，信度是正確性","信度低的測驗，效度可能高也可能低","效度是信度的必要條件，但非充分條件"],"a":"A","al":"A","c":"信效度關係","e":"信度是效度的必要而非充分條件；結果若很不穩定，難支持有效推論，因此 A 正確。B 把定義對調；C 忽略信度不足對效度的限制；D 則把必要條件的方向說反。","p":"17、35-37、45-46","u":"relval","k":"這題考信度與效度的關係。講義說信度是效度的必要條件：測驗要有效，結果先要夠穩定。射箭比喻：效度高是箭箭射中紅心，既然都射中紅心，箭一定集中，所以效度高時信度一定不低。反過來，箭很集中（信度高）卻可能集中在靶外（效度低），所以信度高不保證效度高。記住方向：「信度是效度的必要但非充分條件」，而不是倒過來。信度低時，箭到處亂飛，就不可能穩定射中紅心，所以效度一定受限。","s":["先記住講義：信度是效度的必要條件（但非充分條件）。","推論：有效度 → 一定有一定程度的信度，所以 A 對。","檢查 B、C、D 是否把定義或方向弄反。"],"w":{"A":"✓ 效度高代表穩定測到目標，結果必然一致，所以信度一定不低。","B":"✗ 把定義對調了：信度是可靠性（一致），效度才是正確性（測得對）。","C":"✗ 信度低表示結果很不穩定，效度一定會受限，不可能「可能高」。","D":"✗ 方向說反了，應該是「信度是效度的必要條件」，不是效度是信度的必要條件。"},"m":"箭箭中紅心必定集中，集中卻不一定中紅心。"},{"n":77,"q":"下列何者最具有結合教學、診斷和評量的功能？","o":["動態評量","標準化測驗","常模參照評量","標準參照評量"],"a":"A","al":"A","c":"動態評量","e":"以「前測→教學介入→後測」了解學習反應與潛能，能把教學、診斷與評量結合，故選 A。標準化、常模參照、標準參照本身均不表示施測者會在過程中提供個別化教學。","p":"87、100-101","u":"alt","k":"這題考動態評量。動態評量由 Feuerstein 提出，採「前測 → 教學介入 → 後測」的模式：先看學生自己能做到哪裡，再給提示、教學，最後看學生進步多少。它不只看現在的程度，還看學生在協助下能學多快、能學到哪裡，和維果斯基的近側發展區（ZPD）、鷹架概念一致。就像教練不只量你現在跑幾秒，還會教你調整姿勢，再看你能進步多少。講義直接寫它是結合教學、診斷與評量的評量模式。","s":["抓題幹關鍵：「結合教學、診斷和評量」。","對照講義：動態評量是「前測－教學介入－後測」，結合教學與診斷。","其他選項都只是測驗的編製或解釋方式，不含教學介入，選 A。"],"w":{"A":"✓ 動態評量在評量過程中介入教學並提供提示，同時診斷學習潛能，最能結合教學、診斷與評量。","B":"✗ 標準化測驗強調統一程序、統一計分，施測中不能給個別教學或提示。","C":"✗ 常模參照是依團體相對位置解釋分數的方法，本身不含教學介入。","D":"✗ 標準參照是依預定標準解釋分數的方法，也不表示評量中會進行教學。"},"m":"動態評量：先測、再教、再測，教評一體。"},{"n":78,"q":"教師在教學前對班上進行學科成就評量，以確定學生的起點行為。此作法屬於下列何種評量？","o":["安置性評量","形成性評量","診斷性評量","總結性評量"],"a":"A","al":"A","c":"起點行為","e":"教學前了解學生的預備程度，以規劃起點或分組，是安置性評量。形成性重在教學中的回饋；診斷性重在找出困難原因；總結性重在階段成果。單看「成就測驗」無法決定用途，應看施測目的。","p":"29","u":"purpose","k":"這題考依教學歷程分的評量。起點行為是學生在新的學習開始前，已經具備的知識和能力。教學前施測、確定起點行為，就是安置性評量，講義定義為「了解學生的預備情形」。要注意：題目雖然用的是學科成就評量，但判斷評量種類要看施測時間點和目的，不是看用了哪種測驗。同一份數學成就測驗，開學前用是安置性，學期末用是總結性。","s":["抓時間點：教學前。","抓目的：確定學生的起點行為（預備情形）。","教學前＋了解預備情形＝安置性評量，選 A。"],"w":{"A":"✓ 教學前了解學生預備程度、確定起點行為，正是安置性評量的目的。","B":"✗ 形成性評量在教學中進行，用來掌握進度與回饋，不是教學前。","C":"✗ 診斷性評量是學生持續學不好時找出困難的原因，不是單純確定起點。","D":"✗ 總結性評量在教學後進行，用來評定成果、給成績，時間點不對。"},"m":"看時間看目的，教學前看起點就是安置。"},{"n":79,"q":"萱萱接受數學標準化成就測驗後獲得的分數為 82 分，已知此份測驗的測量標準誤為 5，萱萱的真實分數為 77~87 分的可能性有多少？","o":["68%","75%","95%","99.7%"],"a":"A","al":"A","c":"測量標準誤","e":"區間 77～87＝82±5，恰為實得分數上下 1 個測量標準誤（SEM）。在誤差近似常態的傳統題設下，約對應 68% 的信賴水準。95% 通常約為 ±1.96 SEM，99.7% 約為 ±3 SEM。","p":"32-33、45-46；統計補充","x":"本題是近似信賴區間的考試用語；不是把固定的真實分數當作每次隨機改變，也不要將 SEM 誤當成全班分數的 SD。","u":"reliability","k":"這題考測量標準誤（SEM）。任何測量都有誤差，講義寫成 X＝T＋E：實得分數＝真實分數＋誤差。測量標準誤就是誤差的標準差，告訴你一個人的分數大概會晃動多少。像體重計可能有 ±0.5 公斤誤差，你量到 50 公斤，真實體重大概在 49.5～50.5 之間。以實得分數為中心加減 SEM，就能估計真實分數所在的範圍：±1 SEM 約 68%，±1.96 SEM 約 95%，±3 SEM 約 99.7%。補充提醒：這是考試中近似信賴區間的說法，並不是真實分數每次在變；也別把 SEM 和全班分數的標準差搞混，SEM 講的是一個人分數的誤差。","s":["實得分數 82，SEM＝5。","82－5＝77，82＋5＝87，所以 77～87 是 82±1 個 SEM。","±1 SEM 對應常態分配 ±1 SD 的比例，約 68%，選 A。"],"w":{"A":"✓ 77～87 恰為 82±1 SEM，依常態分配約有 68% 的可能性涵蓋真實分數。","B":"✗ 75% 不是常態分配 ±1 SEM 的標準比例。","C":"✗ 95% 約對應 ±1.96 SEM（約 72.2～91.8 分），範圍要更寬。","D":"✗ 99.7% 對應 ±3 SEM（67～97 分），本題只加減 1 個 SEM。"},"m":"實得分數加減一個 SEM，真實分數約六八機率。"},{"n":80,"q":"選用心理測驗時，效度與信度是必須要考慮的標準之一。以下對於效度與信度的關係何者有誤？","o":["信度是效度的必要條件，但非充分條件","測驗要具有效度之前，必須先具有信度","信度高的測驗，其效度一定高","效度可以保證某種程度的信度"],"a":"C","al":"C","c":"高信度不保證高效度","e":"工具可能每次都一致地測錯方向，例如固定多報重量，故信度高不代表效度高，C 有誤。A、B、D 均在表達有效推論需要一定程度的一致性。記法：穩定是必要基礎，但還要確認測量目標正確。","p":"17、35-37、46","u":"relval","k":"這題考信度與效度的關係，問的是哪一句「有誤」。信度是一致性，效度是正確性。關鍵觀念：信度高不保證效度高。生活例子：一台體重計每次都多報 3 公斤，量十次都一樣（信度很高），但每次都不準（效度低）。反過來，若一個工具能準確測到目標（效度高），結果必定穩定，所以效度可以保證某種程度的信度。講義說信度是效度的必要條件：要有效度，必須先有信度，但光有信度還不夠。","s":["先記：信度是效度的必要條件，但非充分條件。","A、B、D 都在說「有效度需要信度」，與講義一致。","C 說信度高效度一定高，把必要條件當成充分條件，是錯的，選 C。"],"w":{"A":"✗ 這句正確：信度是效度的必要條件但非充分條件，正是講義的說法。","B":"✗ 這句正確：測驗結果先要穩定，才談得上準確，所以要有效度必須先具信度。","C":"✓ 這句錯誤：工具可能每次都一致地測錯，例如固定多報 3 公斤，信度高但效度低。","D":"✗ 這句正確：效度高代表穩定測到目標，結果必然有一定的一致性。"},"m":"穩定不一定準，準一定穩定。"},{"n":81,"q":"某次期中考試項目分析結果發現，測驗的平均難度為.37；假設該測驗的滿分為 100，及格分數為 60。下列有關該測驗特徵和結果推論的描述，哪一項最適切？","o":["測驗的信度頗佳","很多同學會不及格","同學的成績變異很大","大部分同學得分都很高"],"a":"B","al":"B","c":"平均難度","e":"若題目等權且 P 以全體答對率計，平均難度 .37 約對應平均 37 分，低於及格 60，故很多人不及格最合理。單憑平均難度不能推論信度或成績變異很大；更不能說多數高分。高低分組算法與全體均分並非完全相同。","p":"71-73","u":"item","k":"這題考平均難度和平均分數的關係。難度 P 是一道題的答對比例，P＝.37 表示 37% 的人答對。如果每題配分相同，而且 P 用全體的答對率計算，那把所有題的 P 平均，就等於全班平均拿到滿分的幾成。就像 100 題每題 1 分，平均每題有 37% 的人答對，全班平均就約 37 分。平均 37 分遠低於及格線 60 分，所以很多人會不及格。要注意：若 P 是用高低分組 (PH＋PL)÷2 算的，與全體平均會略有出入，但結論方向不變。","s":["平均難度 .37 → 平均每題約 37% 的人答對。","題目等權時，平均分數約＝.37×100＝37 分。","37 分遠低於及格分數 60，推論很多同學不及格，選 B。"],"w":{"A":"✗ 平均難度只說明題目難易，不能直接推論信度；信度要另外用重測、折半等方法估計。","B":"✓ 平均難度 .37 約相當於平均 37 分，低於及格分數 60，很多人會不及格。","C":"✗ 平均難度只反映整體平均，看不出分數分散程度，變異大小要看標準差。","D":"✗ 平均約 37 分，表示題目偏難，多數人得分偏低，不是很高。"},"m":"平均難度乘滿分，約等於平均分數。"},{"n":82,"q":"想要瞭解學生的學習潛能，評估其接受特定教育或訓練之適合程度，以及預測未來相關之學習成就，應採用何種測驗工具？","o":["性向測驗","智力測驗","興趣測驗","成就測驗"],"a":"A","al":"A","c":"性向測驗","e":"「學習潛能、接受某種訓練的適合程度、預測未來成就」是性向測驗的核心功能。智力偏一般認知能力，興趣反映喜好，成就反映目前學習結果；本題著重特定未來學習的潛能，故 A 最貼切。","p":"7、15、18","u":"perform","k":"這題考性向測驗和其他認知測驗的差別。性向測驗測的是學習潛能，也就是「你將來學某種東西會不會學得好」，可用來預測未來表現、判斷適不適合接受某種訓練，例如職業性向、分班性向測驗。成就測驗測的是「你現在已經學會多少」，像月考、段考。智力測驗測一般的認知能力，範圍比較廣。興趣測驗測你喜歡什麼，屬於典型表現。簡單記：成就看過去學了什麼，性向看未來能學什麼。","s":["抓題幹關鍵：「學習潛能」、「接受特定教育或訓練之適合程度」、「預測未來成就」。","三個關鍵都指向未來特定學習的潛能，正是性向測驗的功能。","對照其他測驗的用途排除，選 A。"],"w":{"A":"✓ 性向測驗測學習潛能，用於評估是否適合某種訓練並預測未來成就，完全符合題幹。","B":"✗ 智力測驗測一般認知能力，範圍廣，不專門針對特定教育或訓練的適合程度。","C":"✗ 興趣測驗測個人喜好，屬典型表現，喜歡不代表有潛能。","D":"✗ 成就測驗測目前已學會的程度，看的是過去學習成果，不是未來潛能。"},"m":"成就看已學會，性向看能學會。"},{"n":83,"q":"如果我們要研究蒙氏教育與方案教學兩種方法對孩子語文能力發展的影響有何不同時，此處的語文發展是？","o":["自變項","依變項","多變項","常數"],"a":"B","al":"B","c":"自變項與依變項","e":"研究比較的是兩種教學法，教學法是自變項；被觀察、用來判斷教學效果的語文能力發展是依變項。常數是研究中維持不變的條件；「多變項」不是題幹中語文發展的角色。","p":"42","u":"corr","k":"這題考自變項與依變項。講義定義：自變項是研究者操控、主動改變的變項，依變項是隨著自變項變化而改變、被觀察測量的結果。可以想成「原因」與「結果」：煮飯時你調整火候大小（自變項），觀察飯有沒有煮熟（依變項）。本題研究者比較的是蒙氏教育和方案教學兩種方法，教學法是被操控的自變項；拿來判斷效果的語文能力發展，就是依變項。這和講義的例子一模一樣：教學法是自變項，學習成效是依變項。","s":["找研究者操控、比較的條件：兩種教學法 → 自變項。","找被測量、用來看效果的結果：語文能力發展 → 依變項。","所以語文發展是依變項，選 B。"],"w":{"A":"✗ 自變項是研究者操控的條件，本題是教學法（蒙氏或方案），不是語文發展。","B":"✓ 語文能力發展是隨教學法不同而改變、被測量的結果，屬依變項。","C":"✗ 多變項不是用來描述單一變項角色的名稱，題幹中的語文發展角色很明確。","D":"✗ 常數是研究中保持不變的條件，語文發展是要被觀察的變化，不是常數。"},"m":"我改的是自變項，我看的是依變項。"},{"n":84,"q":"某班月考數學的平均數是 50，標準差是 10，如果老師為每位學生各加 25 分，則新的標準差為？","o":["10","15","35","30"],"a":"A","al":"A","c":"加常數不改變 SD","e":"每人都加 25 分，平均數由 50 變成 75，但各分數與新平均數的距離不變，所以 SD 仍為 10。一般而言 Y＝aX＋b 時，平均數變為 aM＋b，標準差變為絕對值 a 乘原 SD；加數 b 不影響 SD。","p":"31-33；統計補充","u":"stats","k":"這題考線性轉換對平均數和標準差的影響。標準差是每個分數離平均數有多遠的平均程度。每個人都加 25 分，就像全班一起搭電梯往上 25 層樓，大家所在的樓層都變高了，但彼此之間的距離完全沒變。所以平均數跟著加 25，標準差不變。一般公式：Y＝aX＋b 時，新平均數＝a×原平均＋b，新標準差＝|a|×原標準差；加減常數 b 不會影響標準差，只有乘以 a 才會。","s":["原平均 50，SD＝10；每人加 25 分，轉換式 Y＝X＋25（a＝1，b＝25）。","新平均＝50＋25＝75。","新 SD＝|1|×10＝10，加上去的 25 不影響分散程度，選 A。"],"w":{"A":"✓ 每人加同樣的分數，彼此距離不變，標準差仍為 10。","B":"✗ 15 可能誤把 25 分拆進標準差計算，加常數並不會改變分散程度。","C":"✗ 35 是把 SD 10 和加分 25 相加，但加常數不影響標準差。","D":"✗ 30 沒有對應的計算依據；只有乘以常數才會改變標準差。"},"m":"大家一起加分，平均上升，距離不變。"},{"n":85,"q":"如果有一組資料，突然加入一個分數，而這個分數正好是原有的平均數，那麼新資料的標準差會有什麼變化？","o":["變大","變小","不變","無法判斷"],"a":"B","al":"B（原有差異時）","c":"加入平均分數","e":"新增分數剛好等於原平均，新平均不變，離均差平方和也不變；計算變異數的分母增加，故原 SD＞0 時，新 SD 會變小。不是新增資料就一定增加分散程度。","p":"31-33；統計補充","x":"若原先所有分數都相同，SD 原為 0，加入同一分數後仍為 0；本題的 B 以原資料有變異為前提。","u":"stats","k":"這題考新增一個分數對標準差的影響。變異數是「每個分數和平均數距離的平方」加總後，除以人數；標準差是變異數開根號。新加入的分數剛好等於原平均數，所以：一、新的平均數不變；二、這個新分數和平均數的距離是 0，平方和沒有增加；三、但人數多了一個，分母變大。分子不變、分母變大，變異數就變小，標準差也跟著變小。想像一群人站在操場上，又來了一個人站在正中心，整群人的平均分散程度就被稀釋了。補充提醒：如果原本所有分數都一樣，標準差原來就是 0，加入後仍是 0；本題答案 B 是以原資料有變異為前提。","s":["設原有 n 個分數，平均 M，離均差平方和 SS，變異數＝SS÷n。","加入一個等於 M 的分數：新平均仍為 M，新增的 (M－M)²＝0，SS 不變。","新變異數＝SS÷(n＋1)，比 SS÷n 小，所以標準差變小（原 SD＞0 時），選 B。"],"w":{"A":"✗ 新分數就在平均數上，沒有增加任何離散，標準差不會變大。","B":"✓ 平方和不變、人數增加，變異數與標準差都變小（前提是原資料有變異）。","C":"✗ 只有在原本所有分數都相同、SD＝0 的特殊情況下才會不變，一般情況下會變小。","D":"✗ 可以判斷：分子不變、分母變大，結果一定變小。"},"m":"站中心的人加進來，大家的分散被稀釋。"},{"n":86,"q":"下列那一個分配可能會呈現負偏態？","o":["難度很低的測驗之得分","家庭年收入","台灣地區的人口年齡組成","大一學生的年齡"],"a":"A","al":"A","c":"容易測驗與負偏態","e":"若「難度很低」指一般語意的「題目容易」，多數人高分、少數低分形成左尾，會呈負偏態，所以 A 最合適。家庭收入常有少數極高收入拉出右尾；其他選項也不如容易測驗明確。","p":"31-33、73；統計補充","x":"若把「難度很低」誤讀成難度指標 P 很低，意義會反過來。本題區分日常用語的難與 P 值。","u":"skew","k":"這題考哪種資料會呈負偏態。負偏態是多數人在高分、少數人在低分，尾巴拖向左邊（低分端）。一份很容易的測驗，大部分人都考高分，只有少數人沒讀書而低分，就形成負偏態。補充提醒：這裡的「難度很低」是日常說法，意思是「題目很容易」；如果誤讀成難度指標 P 很低，P 低表示答對的人少、題目很難，意思會完全相反，那會形成正偏態。家庭年收入是典型的正偏態，因為少數極高收入者把尾巴拉向右邊。","s":["先記負偏態的樣子：高峰在右（高分）、尾巴在左（低分）。","題目容易 → 多數高分、少數低分 → 負偏態，A 符合。","家庭年收入是少數高收入拉出右尾，屬正偏態；年齡組成的選項不如 A 明確，選 A。"],"w":{"A":"✓ 題目容易，多數人高分、少數低分拖出左尾，會呈負偏態；注意這裡的難度很低是指題目簡單，不是 P 值低。","B":"✗ 家庭年收入多數人中低收入、少數極高收入，尾巴拉向右，是正偏態的典型例子。","C":"✗ 人口年齡組成受出生率與高齡化影響，形狀不固定，不能確定是負偏態。","D":"✗ 大一學生多數 18、19 歲，少數重考或年長生拖出右尾，較接近正偏態。"},"m":"題目簡單大家高分，尾巴在左是負偏。"},{"n":87,"q":"P80=72，代表團體中","o":["有 80%的人分數低於 72 分","有 80%的人分數高於 72 分","有 72%的人分數低於 80 分","有 72%的人分數高於 80 分"],"a":"A","al":"A","c":"百分位數","e":"P80＝72 表示第 80 百分位數的分數為 72，約有 80% 的分數低於此位置，故選 A。P80 是分數位置對應的「分數」，PR 則是某分數對應的「百分等級」；遇同分時依常模規則處理。","p":"32-34","u":"normal","k":"這題考百分位數 P 的寫法。百分位數 P80 是「第 80 百分位那個位置的分數」，P80＝72 的意思是：分數 72 剛好在第 80% 的位置，團體中約有 80% 的人分數低於 72。它和百分等級（PR）是一體兩面：百分位數是給百分比、求分數；百分等級是給分數、求百分比。所以 P80＝72 也可以說成「考 72 分的人 PR 約 80」。記法：P 右下角的數字是百分比，等號右邊是分數。","s":["拆開符號：P80 的 80 是百分比位置，72 是分數。","百分位數的意思：在這個分數以下的人占該百分比。","所以約有 80% 的人分數低於 72 分，選 A。"],"w":{"A":"✓ P80＝72 表示 72 分位於第 80 百分位，約有 80% 的人分數低於 72。","B":"✗ 方向反了：高於 72 分的人約是 20%，不是 80%。","C":"✗ 把百分比和分數對調了：72 是分數，80 才是百分比。","D":"✗ 百分比和分數對調、方向也反了，兩處都錯。"},"m":"P 下標是百分比，等號後面是分數。"},{"n":88,"q":"已知一常態分配的中位數為 100，變異數為 64，若某生的 Z 分數為 0.5，則其原分數為？","o":["96","104","132","無法計算"],"a":"B","al":"B","c":"變異數轉 SD","e":"常態分配平均數＝中位數＝100；變異數 64，故 SD＝√64＝8。X＝M＋z×SD＝100＋0.5×8＝104。C 的 132 是把變異數 64 當成標準差代入所造成的錯誤。","p":"32-33","u":"normal","k":"這題考從 z 分數反推原始分數，並且要注意變異數和標準差的差別。z 分數表示離平均數幾個標準差，公式 z＝(X－平均數)÷標準差，反過來就是 X＝平均數＋z×標準差。常態分配左右對稱，平均數、中位數、眾數重合，所以中位數 100 就等於平均數 100。陷阱在於題目給的是變異數 64，變異數是標準差的平方，要先開根號才是標準差：√64＝8。如果直接把 64 當標準差代入，就會算出 132 的錯誤答案。","s":["常態分配平均數＝中位數＝100。","變異數 64 → 標準差＝√64＝8。","X＝平均數＋z×SD＝100＋0.5×8＝100＋4＝104，選 B。"],"w":{"A":"✗ 96＝100－0.5×8，是把 z＝0.5 當成負值計算，方向錯了。","B":"✓ 平均數 100、SD＝√64＝8，X＝100＋0.5×8＝104。","C":"✗ 132＝100＋0.5×64，是把變異數 64 誤當成標準差代入。","D":"✗ 常態分配中位數等於平均數，再由變異數開根號得 SD，資訊足夠計算。"},"m":"給變異數先開根號，才是標準差。"},{"n":89,"q":"期中考後學生建議老師將成績進行線性轉換以減少不及格的人數，轉換後下列那一項是不變的？","o":["平均數","標準差","名次","眾數"],"a":"C","al":"C（正向轉換）","c":"線性轉換","e":"一般為調分所做的正向線性轉換 Y＝aX＋b（a＞0），分數高低順序不變，所以名次不變。平均數、眾數通常會移動；SD 在 a≠1 時也會改變。若只加固定分數，SD 也不變，但題幹並未限定只加分。","p":"31-33、91；統計補充","u":"stats","k":"這題考線性轉換會改變什麼、不會改變什麼。線性轉換就是 Y＝aX＋b：每個分數先乘以 a，再加上 b，例如「原分數×0.8＋20」。老師為了減少不及格而調分，一定是讓分數變高、順序不亂，也就是 a 大於 0 的正向轉換。這樣每個人的分數都照同一規則變動，原本高分的人還是比較高，名次完全不變。但平均數、眾數會跟著移動；標準差則會乘以 a，只要 a 不是 1 就會改變。只加固定分數（a＝1）時標準差才不變，但題目沒限定只加分。","s":["寫出轉換式 Y＝aX＋b，調分一般 a＞0。","平均數→aM＋b、眾數也跟著移動、標準差→a×SD（a≠1 時改變）。","每個人用同一條規則變動，高低順序不變，所以名次不變，選 C。"],"w":{"A":"✗ 平均數會變成 a×原平均＋b，調分後通常會提高。","B":"✗ 標準差會變成 a 倍；只有 a＝1（只加分）時才不變，題目沒有這個限定。","C":"✓ 正向線性轉換不改變分數的高低順序，所以名次不變。","D":"✗ 眾數也照同一條規則被轉換，數值會移動。"},"m":"線性調分，數字全變，名次不變。"},{"n":90,"q":"下列各相關係數值何者表示最強烈的相關程度？","o":[".01","-.10",".78","-.90"],"a":"D","al":"D","c":"相關強度","e":"相關強弱看絕對值，不看正負號。四個絕對值依序為 .01、.10、.78、.90，因此 -.90 最強。負號只表示一個變項越高，另一個越低的反向關係；不表示相關比較弱。","p":"40","u":"corr","k":"這題考相關係數的強弱怎麼看。相關係數 r 介於 -1 到 +1 之間，表示兩個變項一起變化的程度。看強弱只看絕對值，也就是去掉正負號後的大小，越接近 1 越強，越接近 0 越弱。正負號只代表方向：正相關是一個變高、另一個也變高（例如讀書時間和成績）；負相關是一個變高、另一個變低（例如看電視時間和成績）。所以 -.90 的負號不代表比較弱，它其實是很強的反向關係。","s":["把四個值取絕對值：|.01|＝.01、|-.10|＝.10、|.78|＝.78、|-.90|＝.90。","比大小：.90 最大。","所以 -.90 相關程度最強，選 D。"],"w":{"A":"✗ .01 幾乎接近 0，表示兩個變項幾乎沒有關係，最弱。","B":"✗ 絕對值只有 .10，屬於很弱的相關，負號只表示方向相反。","C":"✗ .78 已經是高相關，但絕對值仍小於 .90。","D":"✓ 絕對值 .90 最大，是很強的負相關，負號只表示反向，不代表弱。"},"m":"強弱看絕對值，正負只看方向。"},{"n":91,"q":"相關係數 r=.60，表示被預測變項之變異量不可由預測變項解釋的比例為？","o":["64%","60%","40%","36%"],"a":"A","al":"A","c":"未解釋變異量","e":"簡單線性相關下，解釋變異比例為 r²＝.60²＝.36＝36%；未解釋比例為 1－.36＝.64＝64%，故選 A。直接算 1－r 得 40% 是常見錯法。相关與解釋量也不能單獨證明因果關係。","p":"40","u":"corr","k":"這題考決定係數。相關係數 r 本身不能直接說「解釋了幾成」，要先平方。r²叫決定係數，表示被預測變項的變異中，可以被預測變項解釋的比例；1－r²就是不能被解釋的部分（講義寫成：可解釋 R square，不可解釋 1－R square）。比喻：成績的高低差異好比一個圓餅，讀書時間能解釋其中 r² 那一塊，剩下的 1－r² 由其他因素造成，例如睡眠、天分。最常見的錯誤是直接用 1－r。另外，相關再高也不能單獨證明因果。","s":["先算決定係數：r²＝.60×.60＝.36，即 36% 可被解釋。","不可解釋的比例＝1－r²＝1－.36＝.64＝64%。","選 A。"],"w":{"A":"✓ 1－r²＝1－.36＝.64，即 64% 的變異無法由預測變項解釋。","B":"✗ 60% 是直接把 r 當成比例，相關係數要平方才是解釋量。","C":"✗ 40% 是 1－r 的錯誤算法，應該用 1－r²。","D":"✗ 36% 是 r²，代表「可以」被解釋的比例，題目問的是「不可」解釋的比例。"},"m":"先平方是能解釋的，一減平方是解釋不了的。"},{"n":92,"q":"快樂國小設立美術實驗班，招收三年級具有美術天份的兒童。下列哪一種美術測驗最適合用來甄選該類型的學生？","o":["興趣測驗","性向測驗","成就測驗","人格測驗"],"a":"B","al":"B","c":"性向測驗","e":"甄選具美術發展潛能的兒童，最適合性向測驗。興趣測驗測喜歡什麼；成就測驗測目前已學會多少；人格測驗測平常的特質。關鍵是「未來學習潛能」，不是僅看喜好或既有作品成績。","p":"7、15、18","u":"perform","k":"這題考如何甄選有天分的學生。甄選美術實驗班要找的是「有美術天份」、將來學美術會學得好的孩子，也就是看潛能，這正是性向測驗的功能。性向測驗測學習潛能，可預測未來在特定領域的學習表現。興趣測驗只能看出孩子喜不喜歡畫畫，喜歡不等於有天分；成就測驗看的是已經學會多少，學過才藝的孩子會占優勢，看不出真正潛能；人格測驗測個性特質，和美術潛能關係不直接。","s":["抓關鍵字：「具有美術天份」、「甄選」→ 要找的是未來學習潛能。","測潛能、預測未來表現的是性向測驗。","對照其他測驗的用途排除，選 B。"],"w":{"A":"✗ 興趣測驗測喜好，喜歡美術不一定有美術天分，屬典型表現。","B":"✓ 性向測驗測特定領域的學習潛能，最適合甄選具美術天分的兒童。","C":"✗ 成就測驗測目前已學會多少，容易受是否學過才藝影響，看不出潛能。","D":"✗ 人格測驗測個人平常的性格特質，與美術潛能沒有直接關係。"},"m":"選天分看性向，喜歡看興趣，學過看成就。"},{"n":94,"q":"名次是何種量尺？","o":["等比","等距","次序","名義"],"a":"C","al":"C","c":"名次量尺","e":"名次只有高低順序，不保證相鄰名次的實際分數或能力差相等，因此為次序量尺。名義量尺只有分類；等距要求相等單位；比率還須絕對零點。不能說第二名能力是第四名的兩倍。","p":"19-23","u":"scales","k":"這題考名次屬於哪種量尺。四種量尺由低到高：名義（只能分類）、次序（能排順序）、等距（單位相等，能加減）、比率（再加上絕對零點，能算倍數）。名次只能告訴你誰在前、誰在後，但不保證相鄰名次的差距相等：第一名 98 分、第二名 97 分、第三名 80 分，第一到第二差 1 分，第二到第三差 17 分。講義正是用考試名次當次序量尺的例子。所以不能說第二名的能力是第四名的兩倍。","s":["先問：名次能不能排順序？能，所以至少是次序量尺。","再問：相鄰名次的差距相等嗎？不一定，所以不是等距。","名次是次序量尺，選 C。"],"w":{"A":"✗ 等比（比率）量尺要有相等單位和絕對零點，名次兩者都沒有，不能算倍數。","B":"✗ 等距量尺要求相鄰單位差距相等，但第一、二名和第二、三名的實際差距可能差很多。","C":"✓ 名次能排出高低順序，但差距不相等，屬於次序量尺。","D":"✗ 名義量尺只能分類，數字沒有大小意義，但名次有前後順序之分。"},"m":"名次只排先後，不保證距離，是次序。"},{"n":95,"q":"身高是何種量尺？","o":["等比","等距","次序","名義"],"a":"A","al":"A","c":"比率量尺","e":"身高有等距單位，且零高度具有「沒有該長度」的意義，可以作倍數比較，因此屬等比／比率量尺。次序量尺只能排序；等距量尺則未必具可作比率解釋的絕對零點。","p":"19-23","u":"scales","k":"這題考身高屬於哪種量尺。比率量尺（等比量尺）具有等距量尺的相等單位，還有絕對零點，絕對零點就是「0 代表完全沒有」。身高 0 公分代表沒有長度，所以 180 公分的人是 90 公分的兩倍高，這句話有意義。講義用重量當例子：90 公斤是 45 公斤的 2 倍重。對比等距量尺：攝氏溫度 0 度不代表沒有溫度，所以不能說 20 度是 10 度的兩倍熱；智力測驗考 0 分也不代表沒有智力。","s":["身高有相等單位：每 1 公分的差距都一樣 → 至少是等距。","身高 0 代表沒有長度，有絕對零點。","有絕對零點、可做倍數比較，就是等比量尺，選 A。"],"w":{"A":"✓ 身高單位相等，而且 0 公分代表沒有長度，有絕對零點，可算倍數，屬等比量尺。","B":"✗ 等距量尺沒有絕對零點（如攝氏溫度），身高有絕對零點，層級更高。","C":"✗ 次序量尺只能排先後，身高有精確且相等的單位，不只是排序。","D":"✗ 名義量尺只用來分類，身高有大小、單位與零點，不是類別。"},"m":"零代表沒有、能說幾倍，就是比率量尺。"},{"n":96,"q":"下列有關動態評量的敘述，何者錯誤？","o":["強調認知能力的可塑性","著重評量者與幼兒的雙向溝通和互動關係","採取「在教學中評量，在評量中教學」的觀點","認為測驗結果相同的兩位幼兒，其近側發展區亦相同"],"a":"D","al":"D","c":"近側發展區","e":"兩名幼兒目前獨立作答相同，接受協助後可能進步不同，所以近側發展區不一定相同，D 錯。動態評量正是透過互動、提示與教學，了解能力的可塑性及學習潛能；A、B、C 均符合此觀點。","p":"87、100-101","u":"alt","k":"這題考動態評量和近側發展區。近側發展區（ZPD）是維果斯基提出的概念：孩子自己能做到的程度，和在大人協助下能做到的程度，兩者之間的差距。動態評量就是透過「前測→教學介入→後測」，在互動中給提示，看孩子在協助下能進步多少，所以強調能力是可塑的、評量與教學是結合的。兩個孩子獨立做題都只答對 5 題，但給一點提示後，一個能答對 9 題、另一個只能答對 6 題，他們的近側發展區就不同。所以「測驗結果相同，近側發展區也相同」是錯的。","s":["題目問「何者錯誤」，先回想動態評量的核心：可塑性、雙向互動、教學與評量結合、重視 ZPD。","A、B、C 都符合這些核心觀點。","D 把獨立表現相同等同於潛能相同，違反 ZPD 的概念，選 D。"],"w":{"A":"✗ 這句正確：動態評量認為認知能力可透過協助而改變，強調可塑性。","B":"✗ 這句正確：動態評量重視評量者與受試者的互動，在互動中給提示、觀察反應。","C":"✗ 這句正確：動態評量採前測－教學－後測，就是在教學中評量、在評量中教學。","D":"✓ 這句錯誤：獨立表現相同的兩個孩子，在協助下的進步幅度可能不同，近側發展區不一定相同。"},"m":"現在一樣不代表潛力一樣，ZPD 要教了才知道。"},{"n":97,"q":"下列何者不屬於擴散性的提問？","o":["你怎麼摺出這架紙飛機的？","有什麼方法可以讓紙飛機飛得更遠？","有哪些東西可以用來裝飾你的紙飛機？","想想看我們可以用紙飛機玩什麼遊戲呢？"],"a":"A","al":"A","c":"聚斂與擴散提問","e":"A 要幼兒回述自己已完成的摺法，答案受既有歷程限制，較接近聚斂式提問。B 邀請多種改良方式，C 開放裝飾材料，D 發想不同遊戲，都較鼓勵多種可能答案。開放問句不一定就是擴散思考。","p":"62-67、69；提問補充","u":"bloom","k":"這題考聚斂性提問和擴散性提問。聚斂性提問的答案比較集中、範圍有限，常是回想或描述已知的事實；擴散性提問鼓勵學生想出多種不同答案，沒有唯一標準答案，能培養創造思考。比喻：聚斂像漏斗，把答案收到一個點；擴散像煙火，往四面八方開。要注意：用「怎麼」開頭的開放式問句，不一定是擴散性，還要看答案是不是受已發生的事實限制。A 問孩子「怎麼摺出這架紙飛機」，答案就是他剛剛的摺法，可能答案有限。","s":["先抓定義：擴散性＝鼓勵多種可能答案；聚斂性＝答案集中、受既有事實限制。","逐項檢查：B 方法、C 裝飾材料、D 遊戲玩法都可以有很多種答案，屬擴散性。","A 要回述已完成的摺法，答案受既有歷程限制，較接近聚斂性，選 A。"],"w":{"A":"✓ 回述自己已經完成的摺法，答案受既有過程限制，較接近聚斂性提問，不屬於擴散性。","B":"✗ 讓紙飛機飛更遠的方法有很多種，邀請孩子想出不同改良方式，屬擴散性提問。","C":"✗ 可以用來裝飾的東西沒有固定答案，鼓勵多元聯想，屬擴散性提問。","D":"✗ 發想紙飛機的不同遊戲玩法，答案開放多元，屬擴散性提問。"},"m":"答案收成一點是聚斂，開成煙火是擴散。"},{"n":98,"q":"快樂國小設立美術實驗班，招收三年級具有美術天份的兒童。下列哪一種美術測驗  最適合用來甄選該類型的學生？","o":["興趣測驗","性向測驗","成就測驗","人格測驗"],"a":"B","al":"B","c":"性向測驗","e":"甄選具美術發展潛能的兒童，最適合性向測驗。興趣測驗測喜歡什麼；成就測驗測目前已學會多少；人格測驗測平常的特質。關鍵是「未來學習潛能」，不是僅看喜好或既有作品成績。","p":"7、15、18","u":"perform","k":"這題和第 92 題相同，考甄選有天分學生要用哪種測驗。關鍵在「具有美術天份」，也就是要找將來學美術會學得好的孩子，看的是潛能。性向測驗測學習潛能，能預測在特定領域未來的學習表現，最適合甄選。興趣測驗只能看出孩子喜不喜歡，喜歡不等於有天分；成就測驗看已經學會多少，學過才藝的孩子會占優勢；人格測驗測性格特質，和美術潛能關係不直接。","s":["抓關鍵字：「美術天份」、「甄選」→ 找未來學習潛能。","測學習潛能、預測未來表現的是性向測驗。","排除其他測驗，選 B。"],"w":{"A":"✗ 興趣測驗測喜好，屬典型表現，喜歡美術不代表有美術潛能。","B":"✓ 性向測驗測特定領域的學習潛能，最適合甄選具美術天分的兒童。","C":"✗ 成就測驗測已學會的程度，受學習經驗影響，看不出真正潛能。","D":"✗ 人格測驗測平常的性格特質，與美術潛能沒有直接關係。"},"m":"選天分看性向，喜歡看興趣，學過看成就。"},{"n":99,"q":"有關選擇題的描述，下列何者最適切？","o":["編製高品質的選擇題較為困難","選擇題的內容取樣缺乏代表性","選擇題不受閱讀理解能力的影響","選擇題較適合用來測量分析與評鑑的能力"],"a":"A","al":"A","c":"選擇題特性","e":"好的選擇題須兼顧清楚題幹、唯一最佳答案及有效誘答項，編製不容易。選擇題可在有限時間取樣較廣內容，B 不妥；仍可能受閱讀能力影響，C 錯；雖可測高層次能力，但不能因此說「較適合」或容易編製，D 過度概括。","p":"69-70、76","u":"itemtype","k":"這題考選擇題的優缺點。選擇題的優點是一次可以出很多題，內容取樣廣、有代表性，而且計分客觀快速。缺點是要編出好題目並不容易：題幹要清楚、只能有一個最佳答案，錯誤選項（誘答選項）還要看起來合理、能吸引沒學會的人。就像設計一個好陷阱，太明顯沒人會中，太刁鑽又會誤傷高手。講義也提醒，測驗可能對語文能力較差的人不公平，選擇題要讀題，一樣會受閱讀理解影響。","s":["逐項用選擇題的特性檢查。","A：好選擇題需要清楚題幹與有效誘答，編製確實困難，正確。","B 說取樣缺乏代表性、C 說不受閱讀影響、D 說較適合測分析評鑑，都與選擇題特性不符，選 A。"],"w":{"A":"✓ 高品質選擇題要有清楚題幹、唯一最佳答案和有效的誘答選項，編製起來確實困難。","B":"✗ 選擇題能在有限時間內出很多題，內容取樣廣，反而較具代表性。","C":"✗ 學生必須讀懂題幹和選項，閱讀理解能力仍會影響作答。","D":"✗ 選擇題雖可測高層次能力，但很難編，分析、評鑑通常較適合用建構反應或實作評量。"},"m":"選擇題取樣廣、計分快，但好題難出。"},{"n":100,"q":"下列有關於平均數/眾數/中位數三者的排列何者正確？","o":["負偏態：平均數值最低","正偏態：眾數數值最高","左偏態：中位數最高","以上皆非"],"a":"A","al":"A","c":"偏態與集中量數","e":"典型單峰負偏態中，少數低分把平均數拉向左側，常見順序是平均數＜中位數＜眾數，故 A 正確。典型正偏態則常見眾數＜中位數＜平均數。這是常用形態判讀規則，不是所有不規則分布的必然定理。","p":"31-33；統計補充","u":"skew","k":"這題考偏態時平均數、中位數、眾數的位置。眾數是出現最多次的分數，會在高峰；平均數最容易被極端值拉走，所以會被拉向尾巴那一邊；中位數在兩者之間。負偏態（左偏）的尾巴在左邊（低分端），平均數被少數低分拉向左邊，所以順序是平均數＜中位數＜眾數，平均數最低。正偏態（右偏）剛好相反：眾數＜中位數＜平均數，眾數最低。這是典型單峰分配的判讀規則，不是所有奇怪形狀的分配都一定成立。","s":["先記規則：平均數被拉向尾巴、眾數在高峰、中位數在中間。","負偏（左偏）尾巴在左 → 平均數＜中位數＜眾數，平均數最低，A 正確。","正偏時眾數最低、左偏時眾數最高，B、C 錯，所以不是「以上皆非」，選 A。"],"w":{"A":"✓ 負偏態少數低分把平均數拉向左邊，順序是平均數＜中位數＜眾數，平均數最低。","B":"✗ 正偏態尾巴在右，平均數被拉向右最高，眾數在高峰反而最低。","C":"✗ 左偏態就是負偏態，最高的是眾數，中位數只排在中間。","D":"✗ A 已經正確，所以「以上皆非」不成立。"},"m":"平均數追著尾巴跑，眾數守著高峰。"},{"n":101,"q":"下表為高、低分組各 40 位學生在一題選擇題四個選項的人數分布，其中 D 為正確答案。下列有關此試題的敘述，何者適切？（各選項人數，A／B／C／D：高分組 10／9／11／10；低分組 11／8／12／9）","o":["此題難度適中，適合用於常模參照測驗","此題正確選項的敘述，可能具有暗示性","此題測量的概念可能尚未教過，學生在猜題","選項誘答力低，能診斷出學生不清楚的地方"],"a":"C","al":"C","c":"猜測與低鑑別度","e":"正答 D：PH＝10／40＝.25，PL＝9／40＝.225；P＝.2375，D＝.025。各選項人數接近，正答率近四選一猜測率，C 的「可能尚未教過、在猜題」最合理。不能僅憑這張表確定原因，仍應回看教學與題意。","p":"71-74","u":"item","k":"這題考從選項人數分布判斷試題狀況。先算正答 D 的難度與鑑別度：難度 P 是答對比例，鑑別度 D 是高分組答對率減低分組答對率。四選一的題目如果大家都用猜的，每個選項大約各有 25% 的人選。本題高分組和低分組在四個選項上的人數都差不多，正答率也接近 25%，而且高分組並沒有明顯答得比較好，這就是「全班都在猜」的訊號，可能是概念還沒教過。不過單憑這張表無法確定原因，仍應回頭檢查教學進度和題意是否清楚。","s":["正答 D：PH＝10÷40＝.25，PL＝9÷40＝.225。","難度 P＝(.25＋.225)÷2＝.475÷2＝.2375；鑑別度 D＝.25－.225＝.025。","四個選項人數都接近（高分組 9～11 人、低分組 8～12 人），正答率約等於四選一猜測率 25%，鑑別度幾乎為 0，最可能是學生在猜，選 C。"],"w":{"A":"✗ P＝.2375 偏難，不是難度適中；鑑別度只有 .025，也不適合需要區分高下的常模參照測驗。","B":"✗ 正確選項若有暗示性，答對的人應該很多，但本題正答率只有約 24%。","C":"✓ 各選項人數平均、正答率接近 25% 的猜測率、鑑別度近 0，最可能是概念尚未教過、學生在猜題。","D":"✗ 各選項都有人選，但高低分組選法差不多，誘答選項無法區分出誰不清楚，不能用來診斷。"},"m":"四個選項人數一樣多，八成是全班在猜。"},{"n":102,"q":"以下是麗雪在國語、數學、自然、社會定期評量的分數，以及全校同年級學生在此四個科目的平均數和標準差。相對於學校其他同學，麗雪在哪一科的表現較好？國語 數學 自然 社會麗雪成績 84 80 74 86平均數   88 71 84 80標準差   8 6 10 12","o":["國語","數學","自然","社會"],"a":"B","al":"B","c":"跨科 z 分數","e":"國語 z＝(84－88)／8＝-0.5；數學＝(80－71)／6＝1.5；自然＝(74－84)／10＝-1；社會＝(86－80)／12＝0.5。數學 z 最高，表示相對於同科同學的表現最好。社會原始分數最高並不代表相對表現最佳。","p":"32-33、91","u":"normal","k":"這題考「跨科比較要用 z 分數」。z 分數是把原始分數換算成「離平均數幾個標準差」的數字：z＝(原始分數－平均數)÷標準差。標準差可以想成「這一科大家分數散開的程度」。各科難易不同，84 分在簡單的科目可能落後，在難的科目可能領先，所以不能直接比原始分數。就像身高 170 公分在小學生裡算很高，在籃球隊裡卻偏矮，要看你跟「同一群人」比站在哪裡。","s":["第一步：每科都算 z＝(麗雪分數－平均數)÷標準差。","國語：(84－88)÷8＝－4÷8＝－0.5，比平均低半個標準差。","數學：(80－71)÷6＝9÷6＝1.5，比平均高一個半標準差。","自然：(74－84)÷10＝－10÷10＝－1；社會：(86－80)÷12＝6÷12＝0.5。","第二步：比較四個 z，數學 1.5 最大，代表相對於同年級同學，數學表現最好。"],"w":{"A":"✗ 國語 z＝－0.5，低於平均，雖然 84 分看起來不低，但大家平均有 88 分。","B":"✓ 數學 z＝1.5 是四科中最高，代表她在同年級裡相對位置最前面。","C":"✗ 自然 z＝－1，低於平均一個標準差，是四科中相對表現最差的。","D":"✗ 社會原始分數 86 最高，但 z 只有 0.5；原始分數高不等於相對位置高。"},"m":"跨科比高低，先換 z 分數；看離平均幾個標準差，不看原始分。"},{"n":103,"q":"美美國小舉辦說故事比賽，選擇前 20%進入複賽。此「20%的入選規準」屬於下列何種參照？","o":["標準參照","結果參照","常模參照","表現參照"],"a":"C","al":"C","c":"比例錄取","e":"選前 20% 是依參賽者相互比較的位置決定入選，屬常模參照。若依固定的敘事能力規準，達標者不論人數均入選，才屬標準參照。「規準」一詞本身不等於標準參照，須看是否依團體排序。","p":"12-14、30","u":"reference","k":"這題考「常模參照」和「標準參照」怎麼分。常模參照是拿你和團體裡其他人比，看你排在第幾、在前百分之幾；標準參照是拿你和一條事先訂好的及格線比，看你有沒有達到。判斷的關鍵不是用了什麼詞，而是「入選與否取決於別人表現」還是「取決於固定標準」。像賽跑取前三名是常模參照，體適能跑進 9 分鐘就過關是標準參照。選前 20% 進複賽，名額跟著人數走，你能不能入選要看別人表現，就是常模參照。","s":["先看題幹關鍵字：「前 20%」是依排名比例錄取。","排名比例要靠參賽者互相比較才知道，對應常模參照。","不要被「規準」兩個字誤導；若是「達到某評分標準就晉級、人數不限」，才是標準參照。"],"w":{"A":"✗ 標準參照是看是否達到固定標準，達標者人數不限；本題名額固定比例，不是這種。","B":"✗ 「結果參照」不是評量分類中的正式用語，是干擾選項。","C":"✓ 前 20% 要靠和其他參賽者比較排序才能決定，屬常模參照。","D":"✗ 「表現參照」也不是常模／標準參照這組分類的用語，易和實作評量混淆。"},"m":"比別人排前面是常模，跨過固定門檻是標準。"},{"n":104,"q":"下列哪些對於多元評量的觀點較為適切？甲、每個教學單元宜設計多種評量方式來了解學生的學習表現乙、由於強調多元評量精神，故教學評量應避免使用紙筆測驗丙、多元評量是主觀的評量，無法提供對學生學習客觀的資訊丁、評量應該要能切合教學目標，並選擇適切的方式進行評量","o":["甲乙","甲丁","乙丙","丙丁"],"a":"B","al":"B","c":"多元評量","e":"甲運用多種方式取得不同面向的證據，丁使方法與教學目標對應，均適切，故選 B。多元評量仍可包含紙筆測驗；適當規準、多人評分和交叉資料也能提高客觀性，因此乙、丙的絕對說法不妥。","p":"25、69、75-88","u":"alt","k":"這題考「多元評量」的正確觀念。多元評量是指用多種方法、在不同時間、從不同面向蒐集學生學習證據，例如紙筆測驗、口頭報告、實作、檔案、觀察都可以搭配。它的重點是「多元」而不是「排除紙筆」，紙筆測驗仍是其中一種好工具。另外，評量方式要配合教學目標：要看會不會算就用計算題，要看會不會操作就用實作。像醫生看病，量體溫、聽診、驗血一起用，才看得完整，但不會因為有新儀器就不量體溫。","s":["逐句檢查：甲說每單元用多種方式了解學生，符合多元評量精神。","乙說要避免紙筆測驗、丙說多元評量主觀無法客觀，都是絕對化的錯誤說法。","丁說評量要切合教學目標並選擇適切方式，正確。所以甲丁正確，選 B。"],"w":{"A":"✗ 乙錯：多元評量是增加方法，不是排除紙筆測驗，紙筆仍是多元中的一元。","B":"✓ 甲用多種方式蒐集證據、丁讓方法對準教學目標，兩句都是多元評量的核心觀念。","C":"✗ 乙、丙都錯；有清楚規準、多人評分、交叉比對資料，多元評量也能提供客觀資訊。","D":"✗ 丙錯：說多元評量「無法」提供客觀資訊太絕對；丁雖正確，但此組合含錯誤的丙。"},"m":"多元是加法不是減法，紙筆照樣能用，方法要對準目標。"},{"n":105,"q":"以下是某班國語科四個考題其高低分組的答對率。哪一題的試題品質指標最佳？題號 1   2   3   4高分組答對率 80% 20% 65% 50%低分組答對率 20% 50% 55% 10%","o":["第 1 題","第 2 題","第 3 題","第 4 題"],"a":"A","al":"A","c":"比較 P 與 D","e":"依序計算四題：第 1 題 P＝.50、D＝.60；第 2 題 P＝.35、D＝-.30；第 3 題 P＝.60、D＝.10；第 4 題 P＝.30、D＝.40。第 1 題難度適中且鑑別度最高，故選 A。","p":"71-74","u":"item","k":"這題考試題分析的兩個指標。難度 P 是「答對的比例」，P＝(高分組答對率＋低分組答對率)÷2，P 越大題目越簡單，講義建議約 .40～.60 最適中。鑑別度 D 是「這題能不能分出程度好壞」，D＝高分組答對率－低分組答對率，D 越大越好，負數代表程度好的反而答錯，題目有問題。可以想成篩子：好的篩子要能把大顆和小顆分開，D 就是篩得多乾淨。品質最好的題目是難度適中、鑑別度又高。","s":["第 1 題：P＝(.80＋.20)÷2＝.50；D＝.80－.20＝.60。","第 2 題：P＝(.20＋.50)÷2＝.35；D＝.20－.50＝－.30（負鑑別，低分組反而答得比較好）。","第 3 題：P＝(.65＋.55)÷2＝.60；D＝.65－.55＝.10（鑑別度太低）。","第 4 題：P＝(.50＋.10)÷2＝.30；D＝.50－.10＝.40。","比較：第 1 題 P＝.50 最適中，D＝.60 也最高，所以選 A。"],"w":{"A":"✓ 第 1 題 P＝.50 正好適中，D＝.60 是四題最高，品質最佳。","B":"✗ 第 2 題 D＝－.30 為負，高分組答對率反而較低，題目或答案可能有錯。","C":"✗ 第 3 題 P＝.60 尚可，但 D 只有 .10，幾乎分不出高低分組。","D":"✗ 第 4 題 D＝.40 不錯，但 P＝.30 偏難，整體仍不如第 1 題。"},"m":"P 看平均答對率，D 看高減低；P 近 .5、D 越大越好。"},{"n":106,"q":"有關評量之運用與詮釋，下列何者較屬於「常模參照」取向？","o":["白雲國小篩選出五年級需要接受數學科學習扶助的學生","青山國小針對閱讀書籍量破百的學生頒發閱讀小博士證書","清溪國小選出校內學習檔案比賽前三名代表學校參加全市的比賽","大樹國小根據評分規準將學生的閱讀檔案區分為 ABCDE 五個等級"],"a":"C","al":"C","c":"常模參照","e":"選出校內前三名是相互排序，最符合常模參照。閱讀破百本與依規準給等級，都可用固定標準判定；學習扶助的篩選也可能依基本能力標準，不一定是取末幾名，因此 C 最明確。","p":"12-14、30","u":"reference","k":"這題考如何辨認「常模參照」。常模參照是把個人分數放回團體裡比較，看相對位置，例如名次、前幾名、PR 值；標準參照則看是否達到事先設定的標準，例如讀滿一百本、達到 A 級規準。小技巧：如果結果「會因為別人表現好壞而改變」，就是常模參照。像校內選前三名，就算你做得很棒，別人更棒你也進不了；但讀破百本，只要你讀到就拿證書，別人多少人達到都不影響你。","s":["先看每個選項的判定依據是「和別人比」還是「和固定標準比」。","選出前三名必須把全校作品互相排序，最明確是常模參照。","破百本、依規準分 ABCDE 等級都是固定標準；學習扶助篩選常依基本能力標準，也不夠明確。"],"w":{"A":"✗ 學習扶助篩選多半依是否達到基本學力標準，不一定是取最後幾名，屬性不夠明確。","B":"✗ 閱讀量破百本就頒證書，是固定門檻，屬標準參照。","C":"✓ 前三名要靠校內互相排序才產生，結果取決於別人表現，是典型常模參照。","D":"✗ 依評分規準分成 ABCDE 五等級，是拿作品和規準描述比，屬標準參照。"},"m":"「前幾名」看別人，「達幾級」看標準。"},{"n":107,"q":"孫老師對全校學生實施音樂性向測驗，擬以音樂成績作為效標，所得出效標關聯效度係數為.40。若以音樂資優班學生為施測對象時，所得到的效標關聯效度係數最可能是下列何者？","o":["小於.40","大於.40","等於.40","無從判斷"],"a":"A","al":"A","c":"範圍限制","e":"音樂資優班的音樂能力通常比較接近，全校範圍被限縮後，兩變項的相關係數往往降低，所以最可能小於 .40。這是「其他條件相近」下的通常趨勢，不是資優生分數高就會有較高的相關。","p":"40、58-59","u":"validity","k":"這題考「範圍限制」對效度係數的影響。效標關聯效度係數就是測驗分數和效標（外在參照表現，這裡是音樂成績）之間的相關係數。相關係數要算得出來，需要兩邊分數有足夠的高低差異。全校學生音樂能力有好有壞，分數散得開；音樂資優班的學生能力都很接近，分數擠在一起，差異範圍被壓縮，相關係數通常就會變小。就像只拿職業籃球員來看身高和得分的關係，大家都很高，身高的影響就看不太出來。","s":["先抓題幹關鍵：施測對象從「全校」變成「資優班」，團體變得同質。","同質團體分數變異小，這叫範圍限制，會讓相關係數下降。","效度係數就是相關係數，所以最可能小於 .40，選 A。"],"w":{"A":"✓ 資優班能力接近、分數變異變小，相關係數通常降低，所以最可能小於 .40。","B":"✗ 資優生分數高不代表相關高；相關看的是變異與一致趨勢，不看分數高低。","C":"✗ 換了一個變異較小的團體，係數通常會改變，不會剛好維持 .40。","D":"✗ 雖無實際資料，但依範圍限制原理仍可判斷「最可能」的方向，並非無從判斷。"},"m":"團體越同質，分數擠一起，相關係數就變小。"},{"n":108,"q":"老師教導學生應試技巧，在時間不夠且沒有倒扣的情況下，作答選擇題時，要對所有未寫完的題目猜同一個答案「C」 。如果學生皆採此種作法將對測驗結果的信效度有何影響？","o":["提高信度、提高效度","提高信度、降低效度","降低信度、提高效度","降低信度、降低效度"],"a":"B","al":"B（原考題取向）","c":"固定猜答與信效度","e":"本題將一律猜同一選項視為增加反應模式的一致性，因而取 B；但分數混入與真正學習無關的猜答，效度下降。請與「隨機乱猜增加偶然誤差」區分。","p":"46-47、69；補充 S4","x":"固定反應的一致，不等於實證上必然提高測驗信度；實際信度仍須由分數資料與估計方法判斷。此題依原考題的簡化取向解釋。","u":"relval","k":"這題考猜答對信度與效度的影響。信度是測驗結果的一致性，也就是「重考一次會不會差不多」；效度是測驗有沒有測到想測的東西。原考題的思路是：大家都固定猜 C，反應模式變得一致、不像亂猜那樣忽高忽低，所以視為信度提高；但猜對的分數跟真正學會無關，混進了無關因素，所以效度降低。像量體重時每次都穿同一件厚外套，數字很穩定，卻不是真正的體重。補充提醒：固定反應的「一致」不等於實證上信度一定提高，實際信度仍要用分數資料與估計方法判斷，這題只是依原考題的簡化取向作答；也要和「隨機亂猜會增加偶然誤差、降低信度」分開記。","s":["先拆成兩半：猜同一個答案，對「一致性」有何影響？原考題視為反應更一致，信度提高。","再看效度：猜中的分數不代表學會，分數混入與學習無關的成分，效度降低。","組合起來是提高信度、降低效度，選 B。"],"w":{"A":"✗ 猜對的分數不能反映真實學習，效度不可能因此提高。","B":"✓ 依原考題取向：固定猜同一選項使反應一致，視為信度提高；但分數混入猜答成分，效度降低。","C":"✗ 方向相反；隨機亂猜才會被視為增加偶然誤差而降低信度，而效度也不會提高。","D":"✗ 這是「隨機亂猜」較接近的結果；本題是固定猜同一選項，原考題取信度提高。"},"m":"一律猜 C：穩定像穿同件外套量體重，準度卻跑掉。"},{"n":109,"q":"某標準化測驗包含 30 道試題，若再加入 10 題與原測驗性質相似的新編題目，則對該測驗之信度最可能產生何種影響？","o":["信度值將會減少","信度值將會增加","信度值保持不變","信度值無法確定"],"a":"B","al":"B","c":"增加同質題","e":"在品質、施測等條件相近時，增加測量相同特質的題目，可擴大取樣並降低偶然誤差的相對影響，因此信度最可能增加。題數多並非無條件保證；若新題品質差或測到其他能力，效果可能不同。","p":"56、58-59","u":"reliability","k":"這題考「增加題數對信度的影響」。信度是測驗結果的穩定一致程度。每一題都難免有偶然誤差，例如剛好看錯字、剛好猜中。題目越多，這些偶然的好運壞運會互相抵銷，總分就越能反映真正的能力。就像投籃測驗，只投 3 球可能運氣好全進，投 30 球才看得出真實命中率。講義也列出「題數越多，信度越高」，並可用斯皮爾曼—布朗公式估計加長後的信度。但前提是新題目性質相似、品質相當；若加的題目品質差或測到別的能力，就不一定會提高。","s":["看題幹：加入 10 題「與原測驗性質相似」的題目，測驗變長。","對應講義「影響信度的因素：試題題數越多，信度越高」。","同質題擴大取樣、偶然誤差相對變小，所以信度最可能增加，選 B。"],"w":{"A":"✗ 加入同質題通常讓偶然誤差互相抵銷，信度不會減少；除非新題品質很差。","B":"✓ 性質相似的題目增加，取樣更完整、誤差影響變小，信度最可能提高。","C":"✗ 題數是影響信度的重要因素之一，加長測驗後信度通常會改變，不會維持不變。","D":"✗ 題幹已說明新題性質相似，可依原理判斷「最可能」增加，不是無法確定。"},"m":"同質題越多，運氣越被抵銷，信度越高。"},{"n":110,"q":"學校的學習評量應該優先重視下列哪一個評量概念？","o":["內容效度","預測效度","同時效度","內在效度"],"a":"A","al":"A","c":"學校學習評量","e":"學校評量首先要確認是否測到原定的教學內容與目標，內容效度最直接。預測效度偏向未來表現；同時效度比較目前效標；內在效度通常指研究中因果推論的可信度，與本題課堂命題的核心不同。","p":"17、38、68","u":"validity","k":"這題考學校評量最該重視哪種效度。效度是測驗有沒有測到它想測的東西。內容效度是指「題目能不能代表教過的內容和教學目標」，講義說成就測驗最需要內容效度，常用雙向細目表來檢查。預測效度是看測驗能不能預測未來表現，同時效度是看和現有的另一個效標是否一致，內在效度則是研究設計中因果推論可不可信。學校段考就像一桌菜的試吃，如果只試吃了甜點，就不能代表整桌菜，所以要先確認題目抽樣有沒有涵蓋教學內容。","s":["先看題幹：情境是「學校的學習評量」，也就是成就測驗。","成就測驗要確認題目是否代表教學內容與目標，對應內容效度。","其他選項分別偏向預測未來、比對效標或研究因果，不是課堂評量的首要概念，選 A。"],"w":{"A":"✓ 學校評量要先確保題目代表教學內容與目標，講義指出成就測驗最需要內容效度。","B":"✗ 預測效度看測驗能否預測未來表現，例如入學測驗，不是課堂評量的首要重點。","C":"✗ 同時效度是和現存效標比較是否一致，屬效標關聯效度，並非學校評量優先考量。","D":"✗ 內在效度是實驗研究中因果推論的可信度，屬研究設計概念，不是測驗效度種類。"},"m":"段考先問：題目有沒有代表我教的？這就是內容效度。"},{"n":111,"q":"下列有關動態評量的敘述，何者錯誤？","o":["強調認知能力的可塑性","著重評量者與幼兒的雙向溝通和互動關係","採取「在教學中評量，在評量中教學」的觀點","認為測驗結果相同的兩位幼兒，其近側發展區亦相同"],"a":"D","al":"D","c":"近側發展區","e":"兩名幼兒目前獨立作答相同，接受協助後可能進步不同，所以近側發展區不一定相同，D 錯。動態評量正是透過互動、提示與教學，了解能力的可塑性及學習潛能；A、B、C 均符合此觀點。","p":"87、100-101","u":"alt","k":"這題考「動態評量」的核心觀念。動態評量是用「前測—教學介入—後測」的方式，在評量過程中給提示和協助，看孩子在幫忙下能進步多少。它的理論基礎是維果斯基的近側發展區，也就是「自己做得到」和「有人幫忙才做得到」之間的那段距離。兩個孩子獨自考試都考 60 分，但一個稍微提示就跳到 90，另一個教了很多次只到 65，他們的潛能不同。所以動態評量相信能力可以改變，並且重視評量者和孩子的雙向互動。","s":["題目問「何者錯誤」，先回想動態評量的特性：可塑性、互動、教學與評量結合。","A、B、C 都直接符合講義對動態評量的描述。","D 說測驗結果相同就有相同近側發展區，違反動態評量的基本假設，所以 D 錯。"],"w":{"A":"✗ 敘述正確：動態評量認為認知能力可以透過協助而改變，強調可塑性。","B":"✗ 敘述正確：講義指出動態評量著重評量者與受試者的互動關係。","C":"✗ 敘述正確：前測、教學介入、後測交錯，正是在教學中評量、在評量中教學。","D":"✓ 敘述錯誤：獨立表現相同的兩人，接受協助後的進步幅度可能不同，近側發展區不一定相同。"},"m":"考一樣分，潛能不一定一樣；動態評量看的是幫一下能走多遠。"},{"n":112,"q":"有關評量(assessment)與測驗(test)的敘述，下列何者正確？","o":["測驗是評量過程中的一種工具","評量只能使用一種方法，但測驗通常使用多種方法","評量通常是將欲測量的屬性量化，但不涉及比較和判斷","測驗就是評量，目的在提升學生的能力以達到一致的標準"],"a":"A","al":"A","c":"測驗是工具","e":"評量可透過測驗、觀察、訪談、作品等蒐集資料，再加以解釋與判斷；因此測驗是其中一種工具。B 把方法範圍說反；C 把評量縮減為單純量化；D 把兩者完全等同，且誤認所有人的表現都須一致。","p":"2-3、25","u":"terms","k":"這題考「評量」和「測驗」的關係。講義一句話就說清楚：評量是一種目的，測驗是工具。測驗是用一套題目把特質化成數字，例如考卷分數；評量則是蒐集各種資料（測驗、觀察、訪談、作品），再依標準做價值判斷，例如判斷 80 分代表優秀還是不足。可以把評量想成「醫生診斷病情」，測驗只是其中一項「量血壓」，醫生還會問診、看檢查報告，最後才下判斷。","s":["先回憶講義定義：評量是目的與判斷歷程，測驗是工具。","逐一檢查選項，找出把兩者範圍說反或混為一談的錯誤。","只有 A 正確描述「測驗是評量中的一種工具」。"],"w":{"A":"✓ 評量可以用測驗、觀察、作品等多種方式，測驗只是評量過程中的一種工具。","B":"✗ 說反了：評量才是使用多種方法，測驗通常是單一種形式的工具。","C":"✗ 評量不只是量化，核心正是依標準對結果做比較和價值判斷。","D":"✗ 測驗不等於評量；而且評量目的不是要求所有學生達到一致標準。"},"m":"評量是看病下診斷，測驗只是量血壓的那台機器。"},{"n":113,"q":"有關對學習者進行評量的目的，下列敘述何者錯誤？","o":["透過評量結果，讓教師省思課程與教學，做適當的調整","透過評量結果，了解課程實施狀況，比較教師間的教學成效","透過評量蒐集多元資料，以作為教師針對個別學生需求提出轉介之佐證","透過評量結果，讓家長了解學生學習和發展狀況，建立合理的教育期望"],"a":"B","al":"B","c":"評量目的與推論限制","e":"學生評量可協助教師調整教學、提供轉介證據及與家長溝通，但不同班級的學生背景與起點未必相同，不能直接用學生成績比較教師成效，故 B 較不適切。評量結果應依原定目的和證據範圍解釋。","p":"24、28-29、91","u":"purpose","k":"這題考「評量的目的與解釋的界線」。學生評量的結果主要用來了解學生學習，幫助教師調整教學、提供轉介特殊需求的證據、讓家長了解孩子狀況。但評量結果只能在它的目的和證據範圍內解釋。學生成績會受到起點能力、家庭背景、班級組成等很多因素影響，拿兩班學生成績直接比較老師誰教得好，就像拿兩家醫院的死亡率比醫生醫術，卻不管一家專收重症病患，結論會不公平。講義也提醒，解釋分數要根據目的，並把其他相關資料納入考慮。","s":["題目問「錯誤」的目的，先想學生評量本來是為誰、為什麼服務。","A、C、D 都是用學生資料幫助學生的學習與發展，屬合理用途。","B 用學生成績比較教師間教學成效，超出證據能支持的範圍，選 B。"],"w":{"A":"✗ 敘述合理：依評量結果反省並調整課程與教學，是評量的重要功能。","B":"✓ 敘述錯誤：各班學生背景、起點不同，不能直接用學生成績比較老師的教學成效。","C":"✗ 敘述合理：多元資料可作為轉介特教或輔導的佐證，屬診斷用途。","D":"✗ 敘述合理：讓家長了解孩子的學習並建立合理期望，是評量溝通的功能。"},"m":"學生的分數拿來幫學生，不拿來替老師排名次。"},{"n":114,"q":"莊老師指著紙上的圓形、正方形和三角形一一問小華： 「這是什麼形狀？」小華皆搖頭說： 「不知道。」莊老師接著問小華： 「這三個形狀是一樣的嗎？」小華答稱：「不一樣。」於是，莊老師指著圓形告訴小華： 「這是圓形。圓圓的就像你的臉。教室裡還有哪些東西是圓形的？請你找找看。」等小華認識圓形後，莊老師再以相同的方式教導小華認識其他二種圖形。經過數次的教學後，莊老師再指著紙上的三種圖形問小華相同的問題，小華這次都答對了。此種作法較接近下列何種評量方式？","o":["動態評量","檔案評量","追蹤評量","總結性評量"],"a":"A","al":"A","c":"測驗—教學—再測驗","e":"先問形狀名稱，發現困難後提供具體教學與情境連結，再用相同問題檢查進步，符合動態評量的介入模式。檔案評量需要累積資料；追蹤僅表示時間上的後續觀察；總結性也未必包含教學介入。","p":"87、100-101","u":"alt","k":"這題考如何從情境辨認「動態評量」。動態評量的招牌流程是「前測—教學介入—後測」：先測出孩子不會什麼，接著當場給提示和教學，再用同樣的問題看他進步多少，以了解學習潛能。題目中莊老師先問形狀名稱，小華不會；老師用「圓圓的像你的臉」並請他在教室找圓形來教學；最後再問同樣問題，小華答對了。這正是一邊評量一邊教學。就像教游泳時先看孩子能游多遠，再扶一下、教換氣，最後看他能多游幾公尺。","s":["找情境中的步驟：先問（前測）→ 小華不會 → 老師教學並連結生活（介入）→ 再問同題（後測）。","「前測—教學介入—後測」是講義對動態評量的定義。","其他選項都沒有「評量中穿插教學」的特徵，選 A。"],"w":{"A":"✓ 先測、再教、再測，評量和教學結合，完全符合動態評量的介入模式。","B":"✗ 檔案評量是長期有目的地蒐集作品與反思，本題沒有累積資料的過程。","C":"✗ 追蹤評量只是事後再觀察，重點在時間上的後續，不包含當下的教學介入。","D":"✗ 總結性評量在教學結束後評定成果，不會在評量中間穿插教學。"},"m":"測一測、教一教、再測一測，就是動態評量。"},{"n":115,"q":"小梅老師想要知道幼兒選擇各學習區的頻率，下列哪一種觀察方式最為適切？","o":["計次表","訪談法","軼事紀錄","評定量表"],"a":"A","al":"A","c":"頻率紀錄","e":"目的是知道各學習區被選擇幾次，計次表能直接累計事件頻率，最適切。訪談是受訪者回述；軼事記錄偏質性事件脈絡；評定量表偏程度或品質。先看要記錄的是次數、持續時間，還是行為品質。","p":"81、87、92-98；觀察補充","u":"observe","k":"這題考觀察工具要依「想記錄什麼」來選。計次表（又稱頻率紀錄）是在表格上每發生一次就畫一記，最後統計次數；軼事紀錄是把一件有意義的事件連同情境用文字描述下來，偏質性；評定量表是把行為品質分成幾個等級打分；訪談則是請對方口頭說明。小梅老師要知道「各學習區被選了幾次」，關鍵字是頻率，所以用計次表最直接。就像統計班上午餐誰選麵、誰選飯，畫正字最快。","s":["先看目的關鍵字：「選擇各學習區的頻率」，要的是次數。","記錄次數的工具是計次表（頻率紀錄）。","再排除：軼事紀錄記脈絡、評定量表記程度、訪談靠回述，都不是直接記次數，選 A。"],"w":{"A":"✓ 每次幼兒選某學習區就畫一記，最後累計次數，最能直接回答頻率問題。","B":"✗ 訪談是請人口頭說明，幼兒不一定記得自己選過幾次，資料不精確。","C":"✗ 軼事紀錄詳細描述單一事件與脈絡，屬質性資料，不適合統計次數。","D":"✗ 評定量表評的是行為的程度或品質等級，不是發生次數。"},"m":"要次數用計次表，要故事用軼事紀錄，要程度用評定量表。"},{"n":116,"q":"下列何者是較合適的檔案評量資料？甲、班級通知單                      乙、幼兒表現的觀察記錄丙、幼兒作品及教師的註解            丁、每週課程計畫和課程目標","o":["甲乙","乙丙","甲丁","丙丁"],"a":"B","al":"B","c":"學習檔案的證據","e":"幼兒表現的觀察記錄，以及作品與教師註解，能直接呈現幼兒學習，因此選乙、丙。通知單和課程計畫主要是行政或教學安排，雖可作背景資料，卻不能單憑它們判斷幼兒實際學到什麼。","p":"76、87-88","u":"portfolio","k":"這題考學習檔案裡應該放什麼。檔案評量是有目的地長期蒐集學習者的作品、紀錄與反思，用來呈現他的努力、進步和成就。所以放進檔案的資料要能「證明孩子學到了什麼」。觀察記錄記下幼兒實際的表現，作品加上教師註解能看出孩子做了什麼、老師如何解讀，都是直接的學習證據。班級通知單、課程計畫則是老師或學校的行政與教學安排，講義也特別打問號提醒：家長通知單不是學習證據。就像相簿要放孩子的照片，不是放餐廳菜單。","s":["先回想檔案評量的目的：蒐集能呈現學習者學習與成長的證據。","檢查四項：乙觀察記錄、丙作品與註解都直接反映幼兒表現。","甲通知單、丁課程計畫是行政與教學安排，不是幼兒的學習證據，選乙丙。"],"w":{"A":"✗ 甲班級通知單是行政資料，看不出幼兒學到什麼；乙雖正確，此組合仍錯。","B":"✓ 乙觀察記錄與丙作品加教師註解，都能直接呈現幼兒的學習表現與成長。","C":"✗ 甲通知單和丁課程計畫都屬行政或教學安排，不是幼兒的學習證據。","D":"✗ 丙正確，但丁課程計畫是教師的規劃，不能用來判斷幼兒實際學到什麼。"},"m":"檔案放孩子的學習證據，不放學校的公文和計畫。"},{"n":117,"q":"沈老師編了一份數學成就測驗，發現班上學生在此測驗的得分，與其在該縣市的學習能力檢測之數學表現，在班級排名大致相當。代表此測驗具有下列何種效度？","o":["表面效度","內容效度","聚斂效度","效標關聯效度"],"a":"D","al":"D","c":"外部效標比較","e":"自編數學測驗的排序與縣市檢測大致相當，表示與外部數學表現效標有關聯，故 D 最直接。若聚焦同一構念跨工具的一致，也可能提供聚斂證據；本題明示外部檢測作比較，故取效標關聯效度。","p":"37、40-41","u":"validity","k":"這題考「效標關聯效度」。效標是測驗之外、大家公認能代表該能力的參照表現；效標關聯效度就是看測驗分數和這個效標有多一致。若效標和測驗同時取得，叫同時效度；若效標是未來才得到，叫預測效度。沈老師拿自編數學測驗和縣市學力檢測比，發現班上排名大致相當，代表自編測驗和外部效標一致，就是效標關聯效度。就像新買的體重計和醫院的標準體重計量出來差不多，你就相信新體重計準。","s":["抓題幹關鍵：自編測驗和「縣市學習能力檢測」這個外部標準比較。","拿測驗與外在效標比一致程度，屬效標關聯效度（此例是同時取得，屬同時效度）。","排除其他：表面效度看外觀、內容效度看題目代表性、聚斂效度屬建構效度，選 D。"],"w":{"A":"✗ 表面效度是題目「看起來」像不像在測該能力，不需要和外部測驗比較。","B":"✗ 內容效度是檢查題目是否代表教學內容，通常用雙向細目表或專家判斷。","C":"✗ 聚斂效度屬建構效度，看測同一構念的不同工具是否一致；本題明示外部效標，較不直接。","D":"✓ 與外部數學檢測這個效標的排名相當，代表兩者相關高，是效標關聯效度的證據。"},"m":"跟外面的標準尺比一比，一致就是效標關聯效度。"},{"n":118,"q":"下列哪一項評量結果屬於標準參照的概念？","o":["期末考全班第三名","通過全民英檢中高級測驗","學校模擬考成績 PR 值 90","大學學科能力測驗社會科四級分"],"a":"B","al":"B","c":"通過能力標準","e":"全民英檢的通過與否，依該級能力標準判定，故 B 最符合標準參照。第三名、PR90 明確是團體相對位置；本題學測級分按其考古題脈絡屬常模分數解釋，不能看到「級」就一律當作精熟標準。","p":"12-14、30","u":"reference","k":"這題考如何辨認「標準參照」。標準參照是看你有沒有達到事先訂好的標準，達到就過，與別人表現無關；常模參照則是看你在團體中的相對位置。講義直接舉例：全民英檢（成功或失敗）是標準參照，學測（等級）是常模參照。英檢中高級只要達到該級的能力要求就通過，就算全台灣只有你一個人考、或一萬人都通過，都不影響你的結果。就像駕照路考，技術到位就發照，不是只發給前幾名。","s":["先判斷每個選項的結果是「和別人比」還是「和固定標準比」。","第三名、PR 90 明顯是團體相對位置；學測級分依講義屬常模參照。","英檢通過與否依該級能力標準判定，是標準參照，選 B。"],"w":{"A":"✗ 全班第三名是和同學互相比較的名次，屬常模參照。","B":"✓ 全民英檢依各級能力標準判定通過與否，講義明列為標準參照的例子。","C":"✗ PR 90 代表贏過約 90% 的人，是團體中的相對位置，屬常模參照。","D":"✗ 學測級分依考生整體表現劃分級距，講義列為常模參照；不要看到「級」就當成精熟標準。"},"m":"英檢過關是標準，學測級分是常模。"},{"n":119,"q":"有關學習評量，下列敘述何者正確？","o":["適性評量就是真實評量，強調評量情境的擬真","師資生在半年教育實習中進行教學演示，屬於實作評量","動態評量是以皮亞傑的認知發展理論作為基礎，重視實際操作","教師資格考試力求公正減少誤差，以測得真實能力，屬於真實評量"],"a":"B","al":"B","c":"實作與其他評量","e":"教學演示讓師資生實際展現教學行為，屬實作評量。適性評量依能力調整題目，與真實評量不同；動態評量與維果斯基的近側發展區相通；減少誤差、追求公正，也不等於使用真實生活任務。","p":"75-77、87、100","u":"performance","k":"這題考幾種評量趨勢的區別。實作評量是讓學生實際操作、表演或完成作品，評分者直接觀察其表現，例如演講、實驗、教學演示。真實評量是實作評量的一種，強調任務要接近真實生活情境。適性評量（電腦適性測驗）是依作答情形調整下一題的難度。動態評量是「前測—教學—後測」，理論基礎是維果斯基的近側發展區，不是皮亞傑。師資生上台試教，就是把會不會教「做給你看」，是典型的實作評量。","s":["逐一比對每種評量的定義：適性、實作、動態、真實。","A 把適性和真實混為一談，C 把理論來源說錯，D 把「減少誤差」誤當真實評量。","B 教學演示是實際展現教學行為，符合實作評量，選 B。"],"w":{"A":"✗ 適性評量是依作答調整題目難度，和強調真實情境的真實評量是不同概念。","B":"✓ 教學演示讓師資生實際上台展現教學能力並直接被評分，屬於實作評量。","C":"✗ 動態評量與維果斯基的近側發展區及鷹架相符，不是以皮亞傑理論為基礎。","D":"✗ 力求公正、減少誤差是標準化測驗的追求；教檢筆試不是真實生活任務，不是真實評量。"},"m":"做給你看是實作，難度跟著變是適性，教了再測是動態。"},{"n":120,"q":"東台國小期末考試數學試題的分析結果中，第五題的鑑別度(D)為.09，難度(P)為.51。有關該分析結果的解釋，下列敘述何者最適切？","o":["大部分的學生都答錯這一題","低分組的學生幾乎都答錯了","多數高分組的學生答對此題","鑑別度太低應重新檢討原因"],"a":"D","al":"D","c":"難度適中但鑑別低","e":"D＝.09 表示高低分組答對率只差 9 個百分點，區辨力不足，應檢查題目與答案。由 P＝.51、D＝.09 可得 PH＝.555、PL＝.465；並非大多數全錯或低分組幾乎全錯。最值得處理的品質問題是低鑑別度。","p":"71-74","u":"item","k":"這題考如何解讀難度 P 和鑑別度 D。難度 P 是答對的比例，P＝(PH＋PL)÷2，PH、PL 分別是高分組、低分組答對率；P 接近 .50 表示難易適中。鑑別度 D＝PH－PL，表示高低分組答對率差多少，數字越大越能分出程度好壞，一般 .40 以上算很好，.20 以下偏低。這題 P＝.51 很適中，但 D＝.09 表示高低分組幾乎一樣，好學生和弱學生答對率只差 9 個百分點，就像一把尺量大家都差不多長，看不出差異，應檢討題目。","s":["由 P＝(PH＋PL)÷2＝.51，得 PH＋PL＝1.02。","由 D＝PH－PL＝.09。兩式相加：2PH＝1.11，PH＝.555；相減：2PL＝.93，PL＝.465。","檢查選項：約一半學生答對，低分組也有 46.5% 答對；高分組只有約 55.5% 答對，算不上「多數」。","真正的問題是 D＝.09 太低，應重新檢討原因，選 D。"],"w":{"A":"✗ P＝.51 表示約一半學生答對，不是大部分答錯。","B":"✗ 低分組答對率 PL＝.465，接近一半，並非幾乎都答錯。","C":"✗ 高分組答對率 PH＝.555，只比一半多一點，談不上多數高分組答對。","D":"✓ D＝.09 代表高低分組差距只有 9 個百分點，鑑別度太低，應檢查題目或答案。"},"m":"P 適中不夠，D 太小就分不出強弱，要回頭修題。"},{"n":121,"q":"有關效標參照或標準參照測驗的敘述何者為正確？","o":["信度對測驗的重要性很低","以團體平均分數作為比較基準","題目難度為中等偏難","強調效標效度"],"a":"A","al":"A（依講義；須修正理解）","c":"標準參照的信度","e":"講義第 14 頁直接採 A 的說法，故就講義作答取 A。B 是常模比較；C 不是標準參照必然的難度；D 把「效標參照」和「效標關聯效度」混淆。","p":"14、30、38；補充 S1","x":"嚴謹觀念：標準參照仍須重視達標判定的可靠性與分類一致性，不能背成「信度不重要」。同質團體使某些相關式信度係數偏低，也不代表不必檢驗信度。","u":"reference","k":"這題考「標準參照測驗」的特性，並依講義作答。標準參照測驗（又叫效標參照測驗）是看學生是否達到事先設定的精熟標準，例如小考、隨堂測驗。講義第 14 頁寫：標準參照適合同質性高的團體，「此時，信度對於測驗的重要性很低」，要考慮的是是否有效。原因是大家都精熟時分數擠在一起，用相關係數算的傳統信度會偏低，看起來不太有意義。但要特別注意補充提醒：嚴謹來說，標準參照仍須重視「達標判定是否可靠」和「分類一致性」（同一個人重考會不會一次過、一次不過），不能背成「信度不重要」；同質團體使某些相關式信度係數偏低，也不代表不必檢驗信度。","s":["先確認題目在問標準參照（效標參照）測驗的特性。","依講義第 14 頁：用於同質團體時，信度對測驗的重要性很低，所以就講義取 A。","再排除：B 是常模參照、C 不是必然特徵、D 混淆了名詞。"],"w":{"A":"✓ 依講義取此答案；但要記得標準參照仍需重視達標判定的一致性，不是不必檢驗信度。","B":"✗ 以團體平均作比較基準，是常模參照的做法；標準參照是和固定標準比。","C":"✗ 標準參照看精熟，題目難度依教學目標而定，不必是中等偏難；中等難度是常模參照的追求。","D":"✗ 「效標參照」的效標是指精熟標準，和「效標關聯效度」是兩回事，不能因字面相同就連在一起。"},"m":"考試答 A，心裡記得：標準參照也要過關判定可靠。"},{"n":122,"q":"有關「最大表現測驗」與「典型表現測驗」的陳述，以下那一個正確？","o":["成就測驗屬典型表現測驗","興趣測驗屬典型表現測驗","人格測驗屬最大表現測驗","態度量表屬最大表現測驗。"],"a":"B","al":"B","c":"典型表現","e":"興趣測驗了解一個人平常喜歡什麼，屬典型表現。成就測驗要求盡力展現所會的內容，是最大表現；人格與態度則重平常傾向，並非最大表現。典型表現通常沒有單一「能力越高越正確」的答案。","p":"15、61","u":"perform","k":"這題考「最大表現測驗」和「典型表現測驗」的分類，這是克朗巴哈提出的。最大表現測驗是要你盡全力表現，看你最好能做到哪裡，例如智力、性向、成就測驗，答得越好分數越高。典型表現測驗是看你平常、自然狀況下的樣子，例如人格、興趣、態度、適應測驗，沒有標準答案，結果跟是否誠實作答有關。可以想成：最大表現像體育課的百米計時，要拚全力；典型表現像問你平常走路速度，照實說就好。","s":["先回想分類：最大表現＝智力、性向、成就；典型表現＝人格、興趣、態度、適應。","逐一對照：成就屬最大、興趣屬典型、人格屬典型、態度屬典型。","只有 B「興趣測驗屬典型表現」分類正確，選 B。"],"w":{"A":"✗ 成就測驗要學生盡力展現所學，屬最大表現測驗。","B":"✓ 興趣測驗了解一個人平常喜歡什麼，沒有對錯，屬典型表現測驗。","C":"✗ 人格測驗了解平常的行為傾向，屬典型表現，不是最大表現。","D":"✗ 態度量表測平常的看法與傾向，屬典型表現，不是最大表現。"},"m":"拚全力看能力是最大表現，照實說平常樣子是典型表現。"},{"n":123,"q":"下列哪一個測驗屬於最大表現測驗？","o":["柯氏性格量表","語文性向測驗","職業興趣量表","幼兒人格量表。"],"a":"B","al":"B","c":"最大表現","e":"語文性向測驗要求受試者盡可能表現能力，以推估未來學習潛能，屬最大表現。性格、職業興趣與人格量表則了解平時傾向，屬典型表現。判斷關鍵在「能做得多好」或「通常如何表現」。","p":"7、15、61","u":"perform","k":"這題考哪一種測驗屬「最大表現測驗」。最大表現測驗要求受試者盡力作答，看他「最好能做到多好」，包括智力測驗、性向測驗、成就測驗，結果受先天能力、實際能力和動機影響。典型表現測驗則看「平常通常怎麼樣」，包括人格、興趣、態度測驗，沒有對錯，結果和是否誠實作答有關。語文性向測驗是要你盡力作答，推估未來學語文的潛能，所以屬最大表現。小技巧：題目有標準答案、越會越高分的，就是最大表現。","s":["先把四個選項分類：性格、職業興趣、幼兒人格屬典型表現。","語文性向測驗要求盡力作答、推估學習潛能，屬最大表現。","選 B。"],"w":{"A":"✗ 性格量表了解平時的人格傾向，沒有對錯，屬典型表現。","B":"✓ 性向測驗要求盡力表現以推估未來學習潛能，講義列為最大表現測驗。","C":"✗ 職業興趣量表了解平常喜好，屬典型表現。","D":"✗ 人格量表了解平時行為傾向，屬典型表現。"},"m":"有標準答案、越會越高分，就是最大表現。"},{"n":124,"q":"針對測驗的試題分析，從鑑別度的觀點，下列何者較適切？","o":["幾乎所有學生都答錯的題目，通常具有較高鑑別度","幾乎所有學生都答對的題目，通常具有較高鑑別度","多數教師和學生都覺得難度適中的題目，通常具有較高鑑別度","高分組學生答對率遠高於低分組的題目，通常具有較高鑑別度"],"a":"D","al":"D","c":"鑑別度的定義","e":"高分組答對率遠高於低分組，正是 D＝PH－PL 大且為正，故選 D。幾乎全對或全錯都難區別能力；大家主觀覺得難度適中，也不等於實際高低分組答對率有大差異。","p":"71-74","u":"item","k":"這題考「鑑別度」的定義。鑑別度 D 是指一個題目能不能把程度好和程度差的學生分開，公式是 D＝PH－PL，也就是高分組答對率減去低分組答對率。差距越大，題目越能區分能力。如果幾乎所有人都答對或都答錯，高低分組答對率都差不多，D 就接近 0，分不出誰強誰弱，這也是講義說的天花板效應與地板效應。就像跳高比賽，把竿子放得太低大家都過，放得太高大家都掉，都選不出冠軍。","s":["先寫出鑑別度公式：D＝PH－PL。","要 D 高，就需要高分組答對率遠高於低分組。","D 選項直接描述這個情況；全對、全錯會讓 D 接近 0，主觀感覺也不等於實際數據，選 D。"],"w":{"A":"✗ 幾乎全錯時高低分組答對率都很低、差距小，D 接近 0，鑑別度低（地板效應）。","B":"✗ 幾乎全對時高低分組答對率都很高、差距小，D 接近 0，鑑別度低（天花板效應）。","C":"✗ 鑑別度要看實際高低分組答對率，大家「覺得」難度適中，不代表實際能分出高低。","D":"✓ 高分組答對率遠高於低分組，正是 D＝PH－PL 大且為正，鑑別度高。"},"m":"D 等於高分組減低分組，差越多越能分出強弱。"},{"n":125,"q":"「分數加減」單元的教學目標包括(1)能進行同分母分數加減，(2)能進行異分母分數加減，以及(3)能將分數加減應用於生活情境問題。郭老師針對此單元設計的總結性測驗包含 60%的「同分母分數加減」及 40%的「異分母分數加減」 。從內容效度的觀點來看，下列敘述何者較正確？","o":["內容效度良好，因為題目多集中於基礎計算題，較能提高學生作答表現","內容效度不足，因為試題未能充分涵蓋原定教學目標的主要內容及範圍","內容效度良好，因為只要題目數量夠就能反映學生在此單元的學習成果","內容效度不足，因為學生之間的學習能力不同，作答的成績可能不一致"],"a":"B","al":"B","c":"內容取樣不足","e":"教學目標含生活應用，但測驗 100% 都是同分母或異分母計算，漏掉應用目標，所以內容效度不足。答對率高、題數多都不能補救目標缺漏；學生能力不同則不是內容效度不足的直接理由。","p":"38、68","u":"validity","k":"這題考「內容效度」。內容效度是指測驗題目能不能完整代表原本的教學目標與內容範圍，常用雙向細目表檢查，也就是把教學內容和要測的能力層次列成表，確認每一塊都有題目。這個單元有三個目標：同分母加減、異分母加減、生活應用。郭老師的考卷 60% 同分母、40% 異分母，合起來 100%，完全沒有生活應用題。就像體檢只量身高體重，卻漏了視力，報告再精細也不能代表全身健康。","s":["列出教學目標：(1) 同分母 (2) 異分母 (3) 生活應用。","對照試卷比例：60%＋40%＝100%，全部是計算，生活應用 0%。","目標有缺漏，題目不能代表教學內容，內容效度不足，選 B。"],"w":{"A":"✗ 題目集中在基礎計算正是問題所在；學生容易答對不代表測到所有目標。","B":"✓ 生活應用這個目標完全沒有被考到，試題未能涵蓋原定教學目標，內容效度不足。","C":"✗ 題數多不能補救內容缺漏；內容效度看的是代表性，不是數量。","D":"✗ 學生能力不同造成成績不一致是正常現象，不是內容效度不足的理由。"},"m":"目標有三項，考卷只考兩項，內容效度就不足。"},{"n":126,"q":"效度是測驗的最重要特徵，有關效度的特性，何者有誤？","o":["效度無法直接測量，但可從其他資料推論","效度的判斷主要是依據測驗方法","效度是程度上的差別，而非全有或全無的問題","效度在使用的目的和情境方面具有特殊性。"],"a":"B","al":"B","c":"效度看分數用途","e":"效度須依證據與理論，判斷分數解釋及使用是否適合，不能主要依「用了哪一種方法」就定論，因此 B 有誤。效度可由不同資料推論，具有程度差別，也受到使用目的與情境限制。","p":"35-38、41","u":"validity","k":"這題考「效度的特性」。效度是指在特定使用情境下，證據與理論支持測驗分數解釋的程度，講義說它是發展與評估測驗時最重要的考量。效度有幾個特性：第一，它無法直接測量，要從各種證據推論；第二，它是程度高低的問題，不是有或沒有；第三，它有特定性，一份測驗用在這個目的有效，換個目的或對象就不一定。比如一把體重計拿來量體重很有效，拿來量身高就完全無效。所以效度要看分數怎麼被解釋和使用，不是看用了哪一種測驗方法。","s":["題目問「有誤」，先列出效度的特性：需推論、有程度之分、依目的與情境而定。","A、C、D 都符合這些特性。","B 說效度主要依測驗方法判斷，忽略了證據與使用目的，選 B。"],"w":{"A":"✗ 敘述正確：效度無法直接量出來，要從內容分析、效標相關等證據推論。","B":"✓ 敘述錯誤：效度要依證據判斷分數的解釋與使用是否合適，不是看採用哪種方法。","C":"✗ 敘述正確：講義明說效度並非全有或全無，而是程度上的差異。","D":"✗ 敘述正確：同一測驗換了目的、對象或情境，效度可能不同，具有特定性。"},"m":"效度看用途不看方法，有程度之分，換場合要重新檢查。"},{"n":127,"q":"以下有關信度的敘述，何者錯誤？","o":["信度係指測量結果的一致性","信度是效度的充分條件","測驗題數越多，信度愈高","再測信度高於複本信度"],"a":"B","al":"B（D 亦不宜視為通則）","c":"信度必要而非充分","e":"B 明確錯誤：信度是效度的必要條件，並非充分條件。A 是信度定義；C 需加上同質、品質相當等前提；D 的重測與複本信度孰高，取決於時間、內容與練習效應，不能保證固定排序。","p":"17、48-56","x":"單選作答可取命題意圖最明確的 B，但本題 D 也過度絕對，宜請授課者確認，複習時勿把它背成定律。","u":"reliability","k":"這題考信度的基本性質。信度是測驗結果的一致性，講義特別強調「信度是效度的必要條件」。必要條件的意思是：沒有信度就一定沒有效度，但有信度不保證有效度。就像一個每次都量出 55 公斤的體重計，很穩定（有信度），但如果你實際是 60 公斤，它就不準（沒效度）。所以 B 說「充分條件」是明確錯誤。補充提醒：D 說再測信度一定高於複本信度也過於絕對，兩者孰高要看時間間隔、題本內容與練習效應，單選作答取命題意圖最明確的 B，但複習時不要把 D 背成定律。","s":["先抓關鍵句：信度是效度的「必要條件」，不是充分條件。","B 把「必要」換成「充分」，是最明確的錯誤。","D 也過度絕對，但命題意圖以 B 最清楚，單選取 B。"],"w":{"A":"✗ 敘述正確：信度就是測驗結果的一致性與穩定性。","B":"✓ 敘述錯誤：信度是效度的必要條件，有信度不保證有效度，不是充分條件。","C":"✗ 大致正確：在題目同質、品質相當的前提下，題數越多信度越高。","D":"✗ 本題不選，但此說法過度絕對；重測與複本孰高取決於時間、內容與練習效應，非固定排序。"},"m":"有效一定可靠，可靠不一定有效：信度必要不充分。"},{"n":128,"q":"如果兒童智商與數學成就測驗分數的積差相關係數 r=.80；則智商對數學學習成就的預測力大約是","o":["40","20","80","60"],"a":"D","al":"D（約 60%；精確 64%）","c":"決定係數","e":"若「預測力」指可解釋變異比例，應算 r²＝.80²＝.64＝64%。四個選項中 60 最接近，故取 D。80 是相關係數的百分化，不是解釋變異量；相關本身也不表示智商單向造成成就。","p":"40","x":"原選項沒有 64，且未標百分比，本版保留原文，解析交代「約值」與單位。","u":"corr","k":"這題考「決定係數」。相關係數 r 表示兩個變項一起變動的程度，介於 －1 到 1。若想知道「一個變項能解釋另一個變項多少比例的變異」，要把 r 平方，叫決定係數 r²，講義寫作解釋變異量；剩下的 1－r² 是不可解釋的部分。r＝.80 時，r²＝.64，表示數學成就的高低差異中，約 64% 能由智商說明。很多人誤把 r 直接當百分比，以為是 80%，這是陷阱。補充提醒：原選項沒有 64，也沒標百分比，所以選最接近的 60，作答時要知道精確值是 64%。另外相關不代表因果。","s":["「預測力」指可解釋變異的比例，要用決定係數 r²。","計算：r²＝.80×.80＝.64，即約 64%；不可解釋部分 1－.64＝.36。","選項沒有 64，最接近的是 60，選 D。"],"w":{"A":"✗ 40 是把 .80 除以 2，沒有任何統計意義。","B":"✗ 20 接近 1－.80，既不是解釋變異量，也不是未解釋變異量（應為 36%）。","C":"✗ 80 是把相關係數直接當百分比，忘了要平方，是最常見的陷阱。","D":"✓ r²＝.64，約 64%，四個選項中以 60 最接近；精確值是 64%。"},"m":"預測力看 r 平方：.8 的平方是 .64，不是 80%。"},{"n":129,"q":"有關「建構反應題」(constructed response item)的敘述，下列何者正確？ 甲、擬定評分規準，可以提升建構反應題的評分信度 乙、建構反應題較適用於評量學習結果，不適用於教學歷程 丙、高品質的選擇題屬於建構反應題，可評量學生較高認知層次的學習","o":["只有甲","只有乙","甲丙","乙丙"],"a":"A","al":"A","c":"建構反應題","e":"建構反應須由學生自行產生答案，如短答、申論、作品。明確評分規準可提升評分一致性，甲正確；這類題也能用於教學過程，乙錯；選擇題即使品質高仍屬選答反應，丙錯，因此只有甲。","p":"76、81","u":"itemtype","k":"這題考「建構反應題」。題型可分兩大類：選答反應題是從給定選項中挑答案，例如選擇、是非、配合題；建構反應題是學生要自己寫出或做出答案，例如填充、簡答、申論、作品，講義也把它列為實作評量的一種。建構反應題答案多樣，不同老師可能給分不同，所以事先擬好評分規準，可以讓評分更一致，提高評分者信度。像作文比賽事先講好「內容、結構、文字各占幾分」，評審給分就比較接近。","s":["先釐清定義：建構反應＝學生自己產生答案；選擇題＝從選項挑，屬選答反應。","甲：評分規準讓評分一致，提高評分信度，正確。乙：建構反應也能用在教學歷程中，例如課堂簡答、學習單，錯。","丙：選擇題再好也是選答反應，不是建構反應，錯。只有甲對，選 A。"],"w":{"A":"✓ 只有甲正確：擬定評分規準能減少評分者主觀差異，提高評分信度。","B":"✗ 乙錯：建構反應題可用於教學中的形成性評量，並不只適用於學習結果。","C":"✗ 丙錯：選擇題是從選項中挑答案，屬選答反應題，不是建構反應題。","D":"✗ 乙、丙都錯，這個組合兩項皆不成立。"},"m":"自己寫答案是建構反應，挑答案是選答反應；有規準評分才一致。"},{"n":130,"q":"下列有關信度的敘述何者不正確？","o":["在其他條件相同的情況下，一份測驗的題目愈多，信度愈高","複本延宕的信度係數會比再測信度的係數來的低","團體的異質性小，即每個人的表現大致相同，信度愈低","想要有可比較的測驗應該使用折半信度。"],"a":"D","al":"D","c":"複本與折半","e":"若要兩份測驗具有可比較性，應檢查複本的等值性，折半法檢查的是同一份測驗的內部一致性，因此 D 不正確。A 須在其他條件相同下理解；C 是變異受限的常见影響；B 是延宕複本同時含時間與內容誤差的通常趨勢，非普遍必然。","p":"48-56","u":"reliability","k":"這題考各種信度方法的用途與影響信度的因素。複本信度是用兩份內容等值的題本施測，看兩份分數是否一致，檢驗「等值性」；折半信度是把同一份測驗分成兩半（例如單數題、雙數題）算相關，檢驗「內部一致性」。所以想要兩份測驗可以互相比較，應該看複本信度。其他重點：題數越多信度越高；團體越同質分數變異越小，信度越低；複本延宕同時包含時間與內容兩種誤差，通常比只含時間誤差的再測信度低。就像要確認 A 卷和 B 卷難度一樣，得兩卷都考，不能只把 A 卷切兩半。","s":["題目問「不正確」，逐一檢查四句。","A 題數多信度高、B 延宕複本誤差來源多所以較低、C 同質團體信度低，都是講義原則。","D 要可比較的兩份測驗應用複本信度，不是折半信度，選 D。"],"w":{"A":"✗ 敘述正確：其他條件相同時，題目越多，偶然誤差越被抵銷，信度越高。","B":"✗ 敘述正確：延宕複本同時含時間與內容抽樣誤差，通常低於只含時間誤差的再測信度。","C":"✗ 敘述正確：團體同質、分數變異小，相關式信度係數會偏低。","D":"✓ 敘述錯誤：要比較兩份測驗應檢查複本的等值性；折半信度只看同一份測驗的內部一致性。"},"m":"兩卷比不比得上看複本，一卷內部一不一致看折半。"},{"n":131,"q":"編製測驗需要雙向細目表作為命題的依據，請問雙向細目表的設計要依據那些資料？甲：教學目標，乙：教學進度，丙：教材內容，丁：學生反應。","o":["甲乙","甲丙","乙丁","丙丁"],"a":"B","al":"B","c":"雙向細目表兩軸","e":"兩個核心向度是「教學目標／認知層次」與「教材內容」，故選甲、丙。進度可協助界定考試範圍，學生反應可供教學調整，但都不是双向細目表的兩個主要分類軸。","p":"38、61-68","u":"bloom","k":"這題考「雙向細目表」的兩個向度。雙向細目表是命題前的藍圖，把「教材內容」放一軸、「教學目標」（例如 Bloom 認知層次：記憶、理解、應用、分析等）放另一軸，交叉成格子，再分配每格的題數或配分。這樣可以確保題目涵蓋各個內容，也涵蓋不同思考層次，是提升內容效度的重要工具。就像蓋房子的設計圖，橫的是房間（內容），直的是樓層（層次），才不會只蓋了一樓客廳就說完工了。","s":["回想雙向細目表的兩軸：一軸是教學目標（認知層次），另一軸是教材內容。","對照選項：甲教學目標、丙教材內容正是兩軸。","乙教學進度、丁學生反應不是分類軸，選甲丙，答 B。"],"w":{"A":"✗ 甲正確，但乙教學進度只幫忙界定考試範圍，不是雙向細目表的分類軸。","B":"✓ 甲教學目標與丙教材內容，正是雙向細目表交叉的兩個向度。","C":"✗ 乙進度和丁學生反應都不是雙向細目表的兩軸；學生反應是施測後才有的資料。","D":"✗ 丙正確，但丁學生反應是作答後的結果，不能作為命題前的設計依據。"},"m":"雙向細目表：一軸教什麼內容，一軸考什麼層次。"},{"n":132,"q":"下列有關教學評量的敘述，哪些是正確的？甲、評量若要強調實際生活的表現，建議採用實作評量乙、為了能看到學習歷程與省思活動，可以使用檔案評量丙、為了強化溝通與合作能力，可以透過分組進行實作評量丁、為了瞭解學生學習的個別差異，最好使用難度偏易的測驗","o":["只有甲","甲乙","甲乙丙","甲乙丙丁"],"a":"C","al":"C","c":"評量方式與目的","e":"實作可呈現生活表現、合作與溝通；檔案可呈現歷程與省思，故甲乙丙正確。若要了解個別差異，應用有適當鑑別力的題目；過易可能出現天花板效應，因此丁不當，選 C。","p":"75-88、71-74","u":"alt","k":"這題考「評量方式要配合評量目的」。實作評量是讓學生在接近真實的情境中操作或完成作品，適合評量生活中的實際表現，也能用分組方式培養溝通合作；檔案評量是長期蒐集作品與省思，能看到學習歷程。想了解個別差異，題目要有適當的鑑別度，難度要適中；如果題目太簡單，大家都考高分，就會出現天花板效應，分不出差異。就像用一公尺高的跳高架，全班都跳得過，就看不出誰最會跳。","s":["逐句判斷：甲實作評量適合生活實際表現，正確；乙檔案評量呈現歷程與省思，正確。","丙分組實作可強化溝通與合作，正確。","丁要了解個別差異應用難度適中、有鑑別力的測驗；難度偏易會有天花板效應，錯。選甲乙丙，答 C。"],"w":{"A":"✗ 只選甲不完整，乙、丙也都是正確敘述。","B":"✗ 遺漏了丙；分組實作評量確實能培養並評量溝通與合作能力。","C":"✓ 甲乙丙都把評量方式和目的配對正確；丁錯在偏易題目分不出個別差異。","D":"✗ 丁錯：難度偏易會讓分數擠在高分端，產生天花板效應，反而看不出個別差異。"},"m":"看生活用實作，看歷程用檔案，看差異要難度適中。"},{"n":133,"q":"林同學數學考 84 分，T 分數為 40；英文考 92 分，百分等級為 16，請問下列敘述何者正確？","o":["英文較數學好","英文較數學差","兩科表現一樣，都很差","兩科表現一樣，尚可"],"a":"","al":"待釐清（C／D 評價未定義）","c":"相對位置與用語","e":"數學 T40 對應 z＝-1；常態下英文 PR16 也約對應 z＝-1，因此可以確定兩科的相對位置約相同，均低於平均 1 SD。A、B 不合；C、D 都寫「兩科表現一樣」，差別只有「很差／尚可」的評語。","p":"32-33、91","x":"題幹及對照講義未界定「很差」與「尚可」的分界，無法僅憑數字嚴謹選出 C 或 D。宜暫不計分；複習重點是兩科相對位置相同，不是用原始分數 84、92 比高低。","u":"normal","k":"這題題意有疑義、不計分。先講原理：T 分數和百分等級（PR）都是表示相對位置的分數。T＝50＋10z，平均是 50、標準差 10；PR 是贏過團體中百分之幾的人。常態分配下，比平均低一個標準差（z＝－1）的人大約贏過 16%，也就是 PR 約 16（講義第 32 頁常態曲線標出 84% 與 16%）。數學 T＝40，換算 z＝(40－50)÷10＝－1；英文 PR＝16，也約是 z＝－1，兩科相對位置相同，都比平均低一個標準差。至於原始分數 84、92，不能拿來比。疑義在於：C 說「很差」、D 說「尚可」，題幹與講義都沒有定義低於平均一個標準差該叫很差還是尚可，所以無法嚴謹判斷 C 或 D，宜暫不計分，複習重點是「兩科相對位置相同」。","s":["數學：T＝40，z＝(T－50)÷10＝(40－50)÷10＝－1。","英文：PR＝16，在常態分配下對應約 z＝－1（平均以下一個標準差以下約占 16%）。","兩科 z 都約為 －1，相對位置相同，排除 A、B。","C 與 D 只差「很差／尚可」的評語，沒有定義分界，無法確定，因此不計分。"],"w":{"A":"△ 不成立：數學與英文都約 z＝－1，英文並沒有比較好；不能用原始分數 92 比 84。","B":"△ 不成立：兩科相對位置約相同，英文並沒有比較差。","C":"△ 「兩科一樣」正確；若認為低於平均一個標準差、只贏 16% 的人算「很差」，可選此項，但缺乏定義。","D":"△ 「兩科一樣」正確；若認為在平均以下一個標準差內仍屬「尚可」，可選此項，同樣缺乏定義。"},"m":"T40 等於 PR16，都在平均下一個標準差，兩科一樣。"},{"n":134,"q":"就教育測驗而言，下列那一種題型的信度較高？","o":["填充題","選擇題","是非題","申論題"],"a":"B","al":"B（一般命題條件）","c":"題型與信度","e":"在一般有限測驗時間內，選擇題常能兼顧較多題數、廣泛取樣與客觀計分，故通常取 B。是非題猜對率較高；申論題題數少且較受評分者影響；填充題可能有多種合理答案。實際信度仍由題目品質與施測資料決定。","p":"56、69、81","u":"itemtype","k":"這題考不同題型的信度。信度是測驗結果的穩定一致。影響信度的因素包括題數、評分客觀性和猜測。選擇題作答快，同樣時間能出很多題、取樣廣，而且計分客觀、機器就能改，猜對機率也比是非題低（四選一猜中約 25%，是非題 50%），所以一般條件下信度較高。申論題題數少、評分容易受評分者主觀影響；填充題可能有多種合理答案，評分也會不一致。就像問路，問十個人比問一個人可靠，而且答案用選的比較不會各說各話。不過實際信度還是要看題目品質與施測資料。","s":["先列出影響信度的因素：題數、評分客觀性、猜測機率。","比較四種題型：選擇題題數可多、計分客觀、猜對率比是非題低。","綜合來看選擇題信度通常最高，選 B。"],"w":{"A":"✗ 填充題可能有多種合理答案，評分不完全客觀，信度通常不如選擇題。","B":"✓ 選擇題在有限時間內題數多、取樣廣、計分客觀，一般條件下信度較高。","C":"✗ 是非題雖然客觀，但猜對機率高達 50%，偶然誤差大，信度較低。","D":"✗ 申論題題數少、取樣窄，評分又受評分者主觀影響，信度通常最低。"},"m":"題多、客觀、難猜中，選擇題信度最高。"},{"n":135,"q":"阿德的國語文成績很好，教師批閱他的作文時總是傾向給較高的分數。這是屬於下列何種現象？","o":["月暈效應(halo effect)","蝴蝶效應(butterfly effect)","回沖效應(washback effect)","比馬龍效應(Pygmalion effect"],"a":"A","al":"A","c":"月暈效應","e":"教師原先認為阿德國文好，這個整體印象使他在批閱此次作文時給較高分，是月暈效應。比馬龍是期待影響學生後續表現；回沖效應是考試影響教學與學習；蝴蝶效應不是本題的評分偏誤。","p":"54、57","u":"observe","k":"這題考評分偏誤中的「月暈效應」。月暈效應又叫光環效應，是指評分者被學生其他方面的整體好印象影響，連帶給這次表現較高分。講義第 54 頁寫：學生在其他方面的表現，會影響閱卷者對他寫作能力的評分判斷。就像月亮周圍的光暈，讓整個月亮看起來更亮。阿德國語好，老師因此在改作文時就傾向給高分，評的不是這篇作文本身，而是對阿德的印象。要和比馬龍效應分清楚：比馬龍是老師的期待讓學生「真的表現變好」，月暈是老師的印象讓「評分偏高」。","s":["抓題幹關鍵：老師因「國語文成績很好」這個既有印象，而給作文高分。","既有整體印象影響對特定表現的評分，對應月暈效應。","排除比馬龍（期待改變學生行為）與回沖效應（考試影響教學），選 A。"],"w":{"A":"✓ 老師對阿德的整體好印象擴散到作文評分，給分偏高，正是月暈效應。","B":"✗ 蝴蝶效應指微小變化引起巨大後果，不是評量中的評分偏誤概念。","C":"✗ 回沖效應是考試反過來影響教學與學習方式，例如考什麼就教什麼。","D":"✗ 比馬龍效應是老師的期待讓學生真的表現變好，屬自我應驗，不是評分偏高。"},"m":"月暈是印象讓分數變高，比馬龍是期待讓學生變好。"},{"n":136,"q":"下列哪種評量方式最適合應用於「情意教學」？","o":["實作評量","口頭評量","紙筆測驗","軼事記錄法"],"a":"D","al":"D（本題較佳）","c":"情意行為觀察","e":"情意包含態度、價值與動機，軼事記錄能在自然情境累積具體行為及脈絡，較能避免只看學生口頭說法或紙筆答案，因此本題選 D。情意仍可用量表、訪談或實作等多種方法，並非只有軼事記錄才適用。","p":"87、89-90、96","u":"observe","k":"這題考「情意教學」適合用什麼方式評量。情意是指態度、興趣、動機、價值觀等內在傾向，例如是否樂於助人、是否喜歡閱讀。這些特質很難用紙筆測驗測，因為學生可能只寫出「應該」的答案，說一套做一套。軼事紀錄是老師在自然情境中，把觀察到的具體事件連同時間、情境、行為客觀記下來，長期累積，就能看出學生真正的態度。像想知道孩子是否真的愛護動物，與其考他「該不該餵流浪狗」，不如記下他平常看到小狗時做了什麼。當然情意也可以搭配量表、訪談等多種方法，本題是選最適合的。","s":["先釐清情意包含態度、價值、動機，重點是「平常的真實行為」。","能在自然情境中累積具體行為與脈絡的工具，是軼事紀錄。","實作、口頭、紙筆較偏認知或技能，學生也可能說出理想答案，選 D。"],"w":{"A":"✗ 實作評量主要評技能和作品表現，雖可帶入情意，但不是最直接的情意證據。","B":"✗ 口頭評量容易讓學生說出「應該」的答案，不一定反映真實態度。","C":"✗ 紙筆測驗較適合評認知，學生可依社會期許作答，難看出真實情意。","D":"✓ 軼事紀錄在自然情境中記下具體行為與脈絡，較能反映真實的態度與價值。"},"m":"情意看平常做什麼，不看考卷寫什麼，用軼事紀錄。"},{"n":138,"q":"下列何者不是檔案評量的特色？","o":["允許學生參與","可分享學習成就","適應個別化目標","兼具信、效度"],"a":"D","al":"D","c":"檔案評量的限制","e":"學生參與、分享成果及配合個別目標，是檔案評量常見特色；但信度與效度須靠取樣、規準及評分品質建立，不能保證天然兼具，故 D 不是必然特色。不要把「有助完整理解學生」直接等同「信效度一定高」。","p":"84-88","u":"portfolio","k":"這題考檔案評量的特色與限制。檔案評量是有目的地長期蒐集學生作品、紀錄和自我反省，呈現學生的努力、進步與成就。講義列出的特色包括：學習者參與、配合個別差異與個別化目標、可以分享與不斷回顧。但講義第 84 頁也提醒，實作類評量的限制之一正是「信度和效度的考量」：資料多元、評分較主觀，信效度要靠清楚的取樣規劃、評分規準和評分者訓練來建立，不會天生就有。就像一本精心整理的相簿很能說故事，但不代表它一定公正客觀。","s":["題目問「不是」特色，先列檔案評量的特色：學生參與、分享成就、個別化目標。","A、B、C 都是講義列出的特色。","信效度是檔案評量的限制與挑戰，不是天然具備的特色，選 D。"],"w":{"A":"✗ 是特色：學生參與選材、設定目標與自我反省，是檔案評量的核心。","B":"✗ 是特色：檔案可以展示、分享學習成果，增進成就感。","C":"✗ 是特色：檔案設計已考慮個別差異，可配合每位學生的個別目標。","D":"✓ 不是特色：檔案評量的信效度須靠規準與評分品質建立，反而是它的限制之一。"},"m":"檔案評量很會說故事，但信效度要自己用規準撐起來。"},{"n":139,"q":"對於檔案評量(portfolio assessment)的敘述，下列何者為非？","o":["可呈現個別學生的學習成長過程","多採常模參照的評分方式","強調與教學密切配合","給予學生許多自我評鑑的機會。"],"a":"B","al":"B","c":"檔案評量的參照","e":"檔案評量通常著重個人進步、目標達成及反思，不以人際排名的常模參照為主要方式，所以 B 為非。呈現成長、與教學結合、學生自評都是重要特色；若確有競賽用途，也可另作排名，但不是核心理念。","p":"85-88","u":"portfolio","k":"這題考檔案評量的評分取向。常模參照是拿學生和別人比排名；標準參照或自我參照則是看學生是否達到目標、比過去進步多少。檔案評量的目的在培養學生自我評鑑、自我改進的能力，講義的比較表也寫：檔案評量的評量結果說明「學生的努力、進步與成就」，傳統測驗才「只有學生成就」。所以檔案評量重視個人成長軌跡，不以排名為主。就像比對孩子每年的身高紀錄，看他長高多少，而不是看他在班上排第幾高。","s":["題目問「何者為非」，先回想檔案評量的核心：個人成長、與教學結合、自我評鑑。","A、C、D 都符合這些核心特色。","B 說多採常模參照，與重視個人進步的理念不符，選 B。"],"w":{"A":"✗ 敘述正確：檔案長期蒐集作品，能呈現個別學生的學習成長過程。","B":"✓ 敘述錯誤：檔案評量重個人進步與目標達成，不以和別人比排名的常模參照為主。","C":"✗ 敘述正確：檔案評量在教學歷程中進行，與教學密切配合。","D":"✗ 敘述正確：學生要選擇作品、寫反思，有許多自我評鑑的機會。"},"m":"檔案比的是自己的昨天，不是別人的分數。"},{"n":140,"q":"檔案評量的特質與輔導活動的學習歷程頗為吻合，值得多加使用。但下列哪一個做法較無法提高學生製作檔案的品質？","o":["提高家長參與意願，以及激勵學生製作檔案動機","教師先行擬定檔案目標與設計重點，再讓學生依序製作","定期檢核學生檔案資料的蒐集情形","定期與家長就檔案內容溝通學生學習情形，並研擬協助策略。"],"a":"B","al":"B","c":"學生參與檔案規劃","e":"檔案評量重視學生參與目標、選材與省思；由教師先全盤決定，再讓學生依序完成，較削弱主體性，所以 B 較不利。家長參與、定期檢核與溝通，都有助持續蒐集有意義的學習證據。","p":"86-88","u":"portfolio","k":"這題考如何提升檔案的品質。檔案評量的關鍵特色是「學習者參與」：學生要參與決定目標、挑選作品、寫自我反省，才會對學習負責。講義也提醒，如果是教學者為中心、老師說了算、學生沒有表達意見，就不是好的檔案評量。另外家長被邀請參與、老師當引導者並定期檢核，都能讓檔案持續累積有意義的證據。就像一本自己的成長日記，如果每一頁寫什麼都由老師規定好，就變成作業簿，不是自己的故事。","s":["題目問哪個做法「較無法」提高品質，先抓檔案評量的核心：學生參與。","A 激發動機、C 定期檢核、D 與家長溝通，都能促進檔案品質。","B 由教師先全盤決定，學生只照做，削弱學生的主體性，選 B。"],"w":{"A":"✗ 有幫助：家長參與與學生動機提升，能讓檔案持續且用心地累積。","B":"✓ 較無幫助：老師先定好目標與重點再要學生依序製作，學生缺少參與規劃和自主選材。","C":"✗ 有幫助：定期檢核能及時發現缺漏，督促學生持續蒐集資料。","D":"✗ 有幫助：與家長定期溝通並研擬協助策略，能支持學生持續改進。"},"m":"檔案要學生一起規劃，老師全包就變成作業簿。"},{"n":141,"q":"下列何者為實作評量效度的誤差來源？","o":["擴散效應","月暈效果","霍桑效應","比馬龍效應"],"a":"B","al":"B","c":"月暈造成評分偏誤","e":"月暈效果使評分受既有整體印象影響，而不是依本次實作表現，因而引入無關因素，威脅效度。擴散、霍桑及比馬龍多用來描述處理、被觀察或期待所造成的行為變化；本題以評分偏誤的 B 最直接。","p":"54、57、84","u":"observe","k":"這題考實作評量中影響效度的評分偏誤。實作評量常由老師觀察判斷給分，評分較主觀，容易出現評分者誤差。月暈效果是評分者被學生的整體印象或其他表現影響，而不是只看這次實作本身，講義列為評分者因素之一。當分數混入「對這個學生的印象」這種無關因素，分數就不能正確代表實作能力，效度下降。其他選項多描述「學生行為真的改變」：霍桑效應是知道被觀察而改變表現，比馬龍是老師期待讓學生表現變好，擴散效應是實驗處理影響到別組。就像評歌唱比賽時，評審因為歌手長得好看而加分，分數就不只反映歌聲了。","s":["題幹關鍵：實作評量「效度」的誤差來源，也就是評分時混入的無關因素。","月暈效果讓評分受既有整體印象影響，屬評分者偏誤，直接威脅效度。","擴散、霍桑、比馬龍主要描述實驗或期待造成的行為改變，選 B。"],"w":{"A":"✗ 擴散效應是實驗處理影響擴及控制組，屬研究設計問題，不是實作評分的偏誤。","B":"✓ 月暈效果使評分受整體印象左右，分數混入無關因素，是實作評量效度的誤差來源。","C":"✗ 霍桑效應是受試者知道自己被研究而改變表現，屬實驗的外在效度問題。","D":"✗ 比馬龍效應是老師的期待使學生真的表現變好，屬自我應驗，不是評分偏誤。"},"m":"實作看誰評分：印象帶著走就是月暈，效度跟著掉。"},{"n":142,"q":"下列有關實作評量的描述何者正確？","o":["學生必須獨立完成","題目結構性佳","直接判斷表現的評量","要求一致性的結果"],"a":"C","al":"C","c":"直接判斷表現","e":"實作評量讓學生操作、展演或製作作品，評分者直接觀察其表現，故選 C。它可以個人或合作完成；題目可有不同結構程度；也容許多種合理解法或作品，不要求全部結果一致。","p":"76-80、87","u":"performance","k":"這題考實作評量的本質。實作評量是讓學生實際操作、表演或完成作品，評分者直接觀察學生的表現與過程，講義稱它為「直接判斷表現的評量」，又叫表現本位評量。它的特色包括：題目常是弱結構、開放有彈性；可以個人做也可以分組合作，以增加社會互動；容許多種合理的作法和作品。就像評量學生會不會煮一道菜，最直接的方式就是讓他下廚，看過程也嚐成品，而不是只考食譜填空。","s":["回想講義對實作評量的描述：直接判斷表現、弱結構、可社會互動、多向度評分。","逐一檢查選項是否和這些特質相反。","只有 C 符合，選 C。"],"w":{"A":"✗ 實作評量可分組合作完成，講義提到它能加強社會互動，不必獨立完成。","B":"✗ 實作題目常是弱結構、內容較開放，讓學生解題有彈性，不強調結構性佳。","C":"✓ 讓學生實際做、評分者直接觀察判斷表現，講義明確寫是直接判斷表現的評量。","D":"✗ 實作評量容許多元的做法與作品，不要求每個人結果都一致。"},"m":"實作評量就是做給你看，直接看表現打分數。"},{"n":143,"q":"下列有關動態評量(dynamic evaluation)的敘述，何者正確？","o":["重視學生的學習結果","各次評量都是彼此獨立的","強調問題解決的過程","能做為學生編班的依據"],"a":"C","al":"C","c":"動態評量的過程","e":"動態評量透過提示、互動與教學，觀察學生如何解決問題及產生改變，因此 C 正確。它不只重最後結果，也不把各次評量視為完全獨立；單純編班不是此題最能代表動態評量的核心功能。","p":"87、100-101","u":"alt","k":"這題考動態評量的重點。動態評量以「前測—教學介入—後測」的方式，在評量中給予提示和協助，觀察學生如何思考、如何解題、在幫助下能進步多少。講義第 100 頁寫：強調問題解決的過程，以評估學生學習潛能為主要目的。所以它重視的是「過程」與「改變」，不是只看最後結果；各次評量環環相扣、前後連續，不是各自獨立。就像教練不只看比賽輸贏，還會看球員每次調整動作後進步了多少。","s":["先回想動態評量的核心：過程、互動、學習潛能、前後連續。","C「強調問題解決的過程」是講義原文，正確。","A 只重結果、B 各次獨立、D 編班依據，都不是動態評量的特性，選 C。"],"w":{"A":"✗ 只重學習結果是靜態評量的特色；動態評量重視學習歷程與認知改變。","B":"✗ 動態評量強調時間與成長的連續性，前測、教學、後測環環相扣，不是彼此獨立。","C":"✓ 講義明寫動態評量強調問題解決的過程，以評估學習潛能為目的。","D":"✗ 動態評量個別化、程序可變，主要用於診斷與教學，不是用來編班的工具。"},"m":"動態評量看怎麼解、教了會怎麼變，不只看答對沒。"},{"n":144,"q":"動態評量中之運用，下列說明何者為非","o":["動態評量過程中，包括「測驗—教學—測驗」的連續運用","動態評量過程中，受試者和施測者會有大量的互動過程","動態評量過程中，理想的實施方式以團體施測為主","動態評量之互動的過程，是歷程、診斷也是協助。"],"a":"C","al":"C","c":"個別化互動","e":"動態評量依學生需求調整提示與協助，常需深入的個別互動，因此不能把「以團體施測為主」當理想通則，C 為非。A、B、D 描述測驗—教學—再測驗、互動及協助的連續歷程，均切合其精神。","p":"100-101","u":"alt","k":"這題考動態評量的實施方式。動態評量是「前測—教學介入—後測」的連續過程，評量者會依每個學生的反應給不同程度的提示，所以需要大量一對一的互動，評量本身就是診斷也是協助。講義列出它的待克服問題正包括「個別評量成本甚高」、「評量不易執行」，可見理想上是個別實施。團體施測時，老師沒辦法針對每個孩子卡住的地方即時調整提示。就像家教可以看你哪一步卡住就提示哪一步，大班講課就做不到。","s":["題目問「何者為非」，先回想動態評量的特徵：測驗—教學—測驗、大量互動、個別化提示。","A、B、D 都符合這些特徵。","C 說理想上以團體施測為主，與個別化互動相反，選 C。"],"w":{"A":"✗ 敘述正確：動態評量就是「測驗—教學—測驗」的連續運用。","B":"✗ 敘述正確：評量者依學生反應給提示，雙方有大量互動。","C":"✓ 敘述錯誤：動態評量要依個別需求調整協助，理想上以個別施測為主，講義也提到個別評量成本高。","D":"✗ 敘述正確：互動過程同時是學習歷程、診斷，也是協助，結合教學與診斷。"},"m":"動態評量像家教，一對一看卡在哪就提示哪。"},{"n":145,"q":"下列針對「生態評量」(ecological assessment)，何者是不正確的敘述？","o":["是一種非正式的評量","是一種正式的評量","在於評量個體與環境需要之間的關係","主要目的為找出學生在各種場所生活需要的功能或活動"],"a":"B","al":"B","c":"生態評量","e":"生態評量從家庭、學校、社區等自然情境，分析環境要求與個人技能之間的差距，通常屬非正式、個別化評量，因此 B 不正確。它可很有系統，但「有系統」不等於「標準化正式測驗」。","p":"99","u":"alt","k":"這題考「生態評量」。生態評量是到學生實際生活的環境，例如家庭、學校、社區，去分析這些環境要求他做哪些活動、需要哪些技能，再對照學生現在會什麼，找出差距來設計教學。講義說它特別適用於重度與多重障礙兒童，步驟由大到小：領域、主要環境、次要環境、活動、技能。它依個案需求進行，透過觀察、訪談家長等多種管道蒐集資料，屬非正式、個別化的評量，而不是用一套標準化測驗統一施測。就像幫孩子準備去超商買東西，先實地看買東西要經過哪些步驟，再看他還缺哪一步。","s":["題目問「不正確」，先回想生態評量的性質：自然情境、個別化、非正式。","A 非正式、C 個體與環境需要的關係、D 找出生活所需的功能活動，都符合。","B 說是正式評量，與其非正式、個別化的性質相反，選 B。"],"w":{"A":"✗ 敘述正確：生態評量依個案需求、在自然情境中蒐集資料，屬非正式評量。","B":"✓ 敘述錯誤：生態評量不是標準化的正式測驗；有系統不等於正式評量。","C":"✗ 敘述正確：它分析環境對個體的要求與個體現有能力之間的關係。","D":"✗ 敘述正確：主要目的就是找出學生在家庭、學校、社區等場所需要的功能性活動與技能。"},"m":"生態評量走進生活現場找差距，是非正式的個別評量。"},{"n":146,"q":"發展英語聽力測驗時，由台南市國中三年級學生隨機抽取的 1000 名學生所建立的常模，是屬於下列哪一種常模？","o":["全國性常模","地區性常模","特殊團體常模","學校常模"],"a":"B","al":"B","c":"地區性常模","e":"取樣範圍是台南市國三學生，建立的是特定地區的常模，所以 B 正確。全國常模需有全國代表性樣本；學校常模只代表單校；特殊團體常模則針對具特定身分或特徵的團體。","p":"34","u":"standard","k":"這題考「常模的種類」。常模是某個參照團體在測驗上的表現分布，用來解釋個人分數的相對位置，是標準化測驗的重要特徵。常模依取樣範圍可分：全國性常模（樣本代表全國）、地區性常模（代表某縣市或區域）、學校常模（只代表某一校）、特殊團體常模（針對特定身分，例如聽障生、資優生）。判斷關鍵是「樣本代表哪一群人」。這題樣本是台南市國三學生隨機抽 1000 人，代表的是台南市這個地區，所以是地區性常模。就像台南市的身高平均只能拿來和台南孩子比，不能代表全台灣。","s":["抓題幹關鍵：樣本來自「台南市」國三學生。","樣本範圍是單一縣市，代表某一地區，對應地區性常模。","樣本人數多不代表全國；也不是單一學校或特殊身分團體，選 B。"],"w":{"A":"✗ 全國性常模需要從全國各地抽取具代表性的樣本，只抽台南市不夠。","B":"✓ 樣本代表台南市國三學生這個特定地區，屬地區性常模。","C":"✗ 特殊團體常模是針對具特定身分或特徵的團體，例如身心障礙生，本題是一般學生。","D":"✗ 學校常模只代表單一學校，本題是從全市各校隨機抽樣。"},"m":"常模叫什麼，看樣本代表誰：全市抽樣就是地區性常模。"},{"n":147,"q":"有關效標參照或標準參照測驗的敘述何者為正確？","o":["信度對測驗的重要性很低","以團體平均分數作為比較基準","題目難度為中等偏難","強調效標效度"],"a":"A","al":"A（依講義；須修正理解）","c":"標準參照的信度","e":"講義第 14 頁直接採 A 的說法，故就講義作答取 A。B 是常模比較；C 不是標準參照必然的難度；D 把「效標參照」和「效標關聯效度」混淆。","p":"14、30、38；補充 S1","x":"嚴謹觀念：標準參照仍須重視達標判定的可靠性與分類一致性，不能背成「信度不重要」。同質團體使某些相關式信度係數偏低，也不代表不必檢驗信度。","u":"reference","k":"這題考「標準參照測驗」的特性，並依講義作答。標準參照測驗（又叫效標參照測驗）是看學生是否達到事先設定的精熟標準，例如小考、隨堂測驗。講義第 14 頁寫：標準參照適合同質性高的團體，「此時，信度對於測驗的重要性很低」，要考慮的是是否有效。原因是大家都精熟時分數擠在一起，用相關係數算的傳統信度會偏低，看起來不太有意義。但要特別注意補充提醒：嚴謹來說，標準參照仍須重視「達標判定是否可靠」和「分類一致性」（同一個人重考會不會一次過、一次不過），不能背成「信度不重要」；同質團體使某些相關式信度係數偏低，也不代表不必檢驗信度。","s":["先確認題目在問標準參照（效標參照）測驗的特性。","依講義第 14 頁：用於同質團體時，信度對測驗的重要性很低，所以就講義取 A。","再排除：B 是常模參照、C 不是必然特徵、D 混淆了名詞。"],"w":{"A":"✓ 依講義取此答案；但要記得標準參照仍需重視達標判定的一致性，不是不必檢驗信度。","B":"✗ 以團體平均作比較基準，是常模參照的做法；標準參照是和固定標準比。","C":"✗ 標準參照看精熟，題目難度依教學目標而定，不必是中等偏難；中等難度是常模參照的追求。","D":"✗ 「效標參照」的效標是指精熟標準，和「效標關聯效度」是兩回事，不能因字面相同就連在一起。"},"m":"考試答 A，心裡記得：標準參照也要過關判定可靠。"},{"n":148,"q":"下列何者是常模參照和標準參照測驗的主要區分依據？","o":["答案計分的方式","作答反應的形式","測驗實施的安排","測驗結果的解釋"],"a":"D","al":"D","c":"解釋方式的差異","e":"同一份測驗可以用團體排名，也可以用固定達標標準解釋；兩者主要差別在「分數拿來與誰／什麼比較」，故選 D。選擇題或實作題、計分方式、施測時間，都不是唯一的分類依據。","p":"12-14、30","u":"reference","k":"這題考常模參照和標準參照的「主要區分依據」。兩者的差別不在題型或計分方式，而在「分數拿來和誰比、怎麼解釋」。常模參照把分數和團體其他人比，解釋成相對位置，例如 PR 85；標準參照把分數和事先設定的標準比，解釋成是否達標，例如達到精熟。同一張 80 分的考卷，可以說「贏過全班 70% 的人」（常模參照），也可以說「達到 80 分及格標準」（標準參照）。就像同一個身高數字，可以說班上排第五，也可以說已經超過雲霄飛車限高。","s":["回想講義：「依測驗分數的解釋方法」分為常模參照與標準參照。","同一份測驗可用兩種方式解釋，所以區分依據是結果的解釋。","計分方式、作答形式、實施安排都不是分類依據，選 D。"],"w":{"A":"✗ 兩種參照都可用相同的計分方式，計分方式不是區分依據。","B":"✗ 選擇題或實作題都能做常模或標準參照，作答形式不是區分依據。","C":"✗ 施測時間、地點等實施安排，兩者可以完全相同。","D":"✓ 講義明寫兩者是依「測驗分數的解釋方法」區分：和團體比，或和標準比。"},"m":"同一個分數，和人比是常模，和標準比是標準參照。"},{"n":149,"q":"趙老師打算在閱讀與寫作課讓學生製作學習檔案，以提升其語文能力與興趣。有關學習檔案的規劃與實施，下列做法何者較不適切？","o":["檔案的內容由教師決定，以利檔案的實施與評分","事先對學生與家長等相關人士，溝通檔案的目的與目標","安排學生定期自我評量與省思，檢視成果並訂定下一步計畫","安排同儕評量活動，讓學生展示個人檔案，彼此觀摩與回饋"],"a":"A","al":"A","c":"共同規劃檔案","e":"內容完全由教師決定，會限制學生選材、自我評量與學習責任，故 A 較不適切。事先溝通目的、定期反思以及同儕觀摩回饋，都有助提升檔案品質。教師可提供結構與規準，但應保留學生參與。","p":"86-88","u":"portfolio","k":"這題考學習檔案的規劃與實施原則。檔案評量的重要精神是學生參與：學生參與選擇作品、自我評量與省思，培養自我評鑑和學習責任感；講義比喻師生關係像舊式師徒制，老師是設計者、顧問與引導者，不是什麼都決定的考核者。此外，事先和學生、家長溝通目的，安排同儕觀摩回饋，都是好做法。老師可以提供結構與評分規準，但不應把內容全部包辦。就像學做菜，師父可以定方向、示範，但要讓徒弟自己挑食材、試味道，才學得會。","s":["題目問「較不適切」，先抓檔案評量的核心：學生參與與自我反省。","B 事先溝通、C 定期自評省思、D 同儕觀摩回饋，都符合檔案評量精神。","A 內容完全由教師決定，限制學生選材與自主，選 A。"],"w":{"A":"✓ 較不適切：內容全由教師決定，學生失去選材與自我評
