          <div className=${'open' + (rp === 'open' ? ' reading' : '')} id=${key + '-open'}><span className="tag">口試開場句</span><p>${t.open}</p></div>
          <h3 className="reading-label"><span className="section-number">01</span> 圖解</h3><figure className="figure-wrap"><div className="fig">${FIGS[t.fig]()}</div><figcaption>圖解 ${String(i + 1).padStart(2, '0')}｜${t.title}</figcaption></figure><${ConceptMap} t=${t} /><h3 className="reading-label"><span className="section-number">03</span> 重點整理</h3>
          <dl className="pts">${t.pts.map(([h, d], pi) => html`<div key=${h} id=${key + '-pt-' + pi} className=${rp === 'pt-' + pi ? 'reading' : undefined}><dt><span className="point-number">${String(pi + 1).padStart(2, '0')}</span>${h}</dt><dd>${d}</dd></div>`)}</dl>
          <h3 className="reading-label"><span className="section-number">04</span> 概念配對</h3><${ConceptMatch} t=${t} />
          ${t.traps.length > 0 && html`<div className=${'traps' + (rp === 'traps' ? ' reading' : '')} id=${key + '-traps'}><b><span aria-hidden="true">！</span> 易錯提醒</b><ul>${t.traps.map(x => html`<li key=${x}>${x}</li>`)}</ul></div>`}
          <div className="topic-end"><button className="btn primary" onClick=${() => onAttack(t.id)}>開始回想練習 →</button></div>
        </article>`;
      })}
    </div>
  </div>`;
}

/* ---------- 口試練習頁 ---------- */
function Practice({ tts, game, topic, setTopic }) {
  const [qid, setQid] = useState(() => load('qid', 1));
  const [drafts, setDrafts] = useState(() => load('drafts', null) || { 1: SAMPLE });
  const [scores, setScores] = useState(() => load('scores', {}));
  const [graded, setGraded] = useState(() => {
    const d = load('drafts', null) || { 1: SAMPLE }; const id = load('qid', 1);
    return d[id] ? { [id]: d[id] } : {};
  });
  const [hints, setHints] = useState(false);
  const [sec, setSec] = useState(0);
  const [running, setRunning] = useState(false);
  const [undo, setUndo] = useState(null);
  const stt = useSTT();
  useWakeLock(stt.on);
  const list = useMemo(() => QUESTIONS.filter(q => inTopic(q, topic)), [topic]);
  const quizList = useMemo(() => list.map(questionQuiz), [list]);
  const q = list.find(x => x.id === qid) || list[0];
  const pos = list.indexOf(q);
  const text = drafts[q.id] || '';

  useEffect(() => save('drafts', drafts), [drafts]);
  useEffect(() => save('scores', scores), [scores]);
  useEffect(() => { save('qid', q.id); setSec(0); setRunning(false); setHints(false); if (stt.on) stt.stop(); }, [q.id]);
  // 語音聽考念到哪一題，畫面就切到那一題。
  useEffect(() => {
    const k = tts.currentKey;
    if (k && k.startsWith('qq-')) { const id = +k.slice(3); if (id !== q.id && list.some(x => x.id === id)) setQid(id); }
  }, [tts.currentKey]);
  useEffect(() => { if (!running) return; const t = setInterval(() => setSec(s => s + 1), 1000); return () => clearInterval(t); }, [running]);

  const result = useMemo(() => graded[q.id] != null ? grade(q, graded[q.id]) : null, [q, graded]);
  const gradedText = graded[q.id];
  const stale = gradedText != null && gradedText !== text;
  const modelLayers = useMemo(() => result ? matchKeywords(q, q.model).kws.map((k, i) => ({ spans: k.spans, status: result.kws[i].status })) : [], [q, result]);

  const go = id => { setQid(id); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const setText = v => setDrafts(d => ({ ...d, [q.id]: v }));
  const gradeNow = (id, t) => {
    const total = grade(QUESTIONS.find(x => x.id === id), t).total;
    setGraded(g => ({ ...g, [id]: t })); setScores(s => ({ ...s, [id]: total }));
  };
  const doGrade = () => { gradeNow(q.id, text); setRunning(false); };
  // 口說作答：「重新口說」先清空（保留一次復原），「接著說」接在原本的文字後面；說完自動檢查。
  const hasText = !!text.trim() && text !== SAMPLE;
  const talk = more => {
    if (tts.player) tts.stop();
    const id = q.id, prev = text === SAMPLE ? '' : text;
    const base = more && prev.trim() ? prev.replace(/\s+$/, '') + '\n' : '';
    const ok = stt.start({
      onText: t => setDrafts(d => ({ ...d, [id]: base + t })),
      onDone: t => { setRunning(false); if (t.trim()) { setDrafts(d => ({ ...d, [id]: base + t })); gradeNow(id, base + t); } },
    });
    if (!ok) return;
    if (!more) { setUndo(prev.trim() ? { id, text: prev } : null); setDrafts(d => ({ ...d, [id]: '' })); setSec(0); }
    setRunning(true);
  };
  const quizOn = !!(tts.player && tts.player.playing && tts.currentKey && tts.currentKey.startsWith('qq-'));
  const listen = (key, label, body) => { if (stt.on) stt.stop(); if (speaking(key)) tts.pause(); else tts.play([{ key, label, text: body }]); };
  const draw = () => {
    if (list.length < 2) return;
    // 優先抽需要補強的題目；舊版最佳紀錄仍計入。
    const weak = list.filter(x => x.id !== q.id && !((scores[x.id] || 0) >= 90 || (game.qstars[x.id] || 0) >= 3));
    const pool = weak.length ? weak : list.filter(x => x.id !== q.id);
    go(pool[Math.floor(Math.random() * pool.length)].id);
  };
  const mmss = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
  const charCount = text.replace(/\s/g, '').length;
  const doneN = Object.keys(scores).length, goodN = QUESTIONS.filter(x => ((scores[x.id] || 0) >= 90 || (game.qstars[x.id] || 0) >= 3)).length;
  const qKey = 'q-' + q.id, mKey = 'm-' + q.id;
  const speaking = k => tts.currentKey === k && tts.player && tts.player.playing;

  const advice = [];
  if (result) {
    const miss = result.kws.filter(k => k.status !== 'hit');
    if (miss.length) advice.push(`先補上關鍵字：${miss.map(k => k.label.replace(/\(.*?\)/g, '')).join('、')}。每一段的第一句就講出來，老師才聽得到。`);
    if (result.found && !result.frontOk) advice.push('關鍵字出現得太晚：開頭先把核心概念講一遍，再逐一解釋。');
    if (result.defScore < 1) advice.push('定義講得不夠：多用「○○是指……」「也就是……」把每個概念講清楚。');
    if (result.exScore < 1) advice.push(`補上課堂實例：${q.exampleHint}`);
    if (!advice.length) advice.push('結構完整：關鍵字 → 定義 → 實例都有了。不看範本再講一次，控制在 3 分鐘內。');
  }

  return html`<div>
    <div className="pbar">
      <div className="pfilter">
        <label htmlFor="tsel" className="meta">主題</label>
        <select id="tsel" value=${topic} onChange=${e => setTopic(e.target.value)}>
          <option value="all">全部主題（${QUESTIONS.length} 題）</option>
          ${TOPICS.map((t, i) => html`<option key=${t.id} value=${t.id}>${String(i + 1).padStart(2, '0')} ${t.title}（${QUESTIONS.filter(x => inTopic(x, t.id)).length}）</option>`)}
        </select>
        <button className="btn primary" onClick=${draw}>隨機抽題</button>
      </div>
      <div className="pfilter">
        <button className="btn" aria-label="上一題" disabled=${pos <= 0} onClick=${() => go(list[pos - 1].id)}>‹</button>
        <select id="qsel" value=${q.id} onChange=${e => go(+e.target.value)} aria-label="選擇題目">
          ${list.map(x => html`<option key=${x.id} value=${x.id}>${x.id}. ${x.category}（${x.type}）${scores[x.id] != null ? '・' + scores[x.id] + '分' : ''}</option>`)}
        </select>
        <button className="btn" aria-label="下一題" disabled=${pos >= list.length - 1} onClick=${() => go(list[pos + 1].id)}>›</button>
      </div>
      <div>
        <div className="progress" aria-label="練習進度">${list.map(x => html`<i key=${x.id} title=${x.id + '. ' + x.category} className=${(scores[x.id] != null || game.qstars[x.id] ? 'done' : '') + (x.id === q.id ? ' cur' : '')}></i>`)}</div>
        <span className="meta">全部 ${QUESTIONS.length} 題：已練 ${doneN} 題，曾達 90 分 ${goodN} 題。隨機抽題會優先抽需要補強的題目。</span>
      </div>
      ${tts.supported && html`<div className="pfilter quiz-acts">
        <button className=${'btn ' + (quizOn ? 'on' : '')} onClick=${() => { if (quizOn) { tts.pause(); return; } if (stt.on) stt.stop(); tts.play(quizList, pos); }}>${quizOn ? html`<${PauseI} />暫停聽考` : html`<${Speaker} />語音聽考：從第 ${q.id} 題開始（${list.length - pos} 題）`}</button>
        <label className="gap-field" htmlFor="gap-practice">作答時間<${GapSelect} tts=${tts} id="gap-practice" /></label>
      </div>`}
    </div>
    <div className="grid2">
      <section className="sheet sticky" aria-label="作答區">
        <div className="qhead"><span className="num">第 ${q.id} 題</span><span className="type">${q.type}</span><span>${topicName(q.topic)}</span></div>
        <p className="qtext">${q.question}</p>
        <div className="hintbar">
          <button className=${'btn ' + (speaking(qKey) ? 'on' : 'ghost')} disabled=${!tts.supported} onClick=${() => listen(qKey, `第 ${q.id} 題題目`, q.question)}>
            ${speaking(qKey) ? html`<${PauseI} />停止` : html`<${Speaker} />聽題目`}</button>
          <button className="link" onClick=${() => setHints(h => !h)}>${hints ? '收起關鍵字提示' : '偷看關鍵字提示'}</button>
        </div>
        ${hints && html`<div className="kwhint">${q.keywords.map(k => html`<span key=${k.label}>${k.label}</span>`)}</div>`}
        ${q.id === 1 && text === SAMPLE && html`<p className="samplenote">↓ 這是範例回答（故意漏了幾個關鍵字），可直接清空換成你自己的。</p>`}
        <label htmlFor="answer" className="meta">${stt.supported ? '你的口試回答（按「開始口說」直接說，也可以打字）' : '你的口試回答（對著麥克風講，用聽寫轉成文字；也可以打字）'}</label>
        ${stt.supported && html`<div className="mic-row">
          ${stt.on ? html`<button className="btn rec" onClick=${() => stt.stop()}><${StopI} />停止並檢查</button><span className="rec-dot" role="status">收音中</span>`
            : hasText ? html`<button className="btn primary" onClick=${() => talk(false)}><${MicI} />重新口說</button><button className="btn" onClick=${() => talk(true)}><${MicI} />接著說</button>`
            : html`<button className="btn primary" onClick=${() => talk(false)}><${MicI} />開始口說</button>`}
          ${!stt.on && undo && undo.id === q.id && html`<button className="link" onClick=${() => { setText(undo.text); setUndo(null); }}>復原口說前的文字</button>`}
        </div>`}
        ${stt.err && html`<p className="mic-warn" role="alert">${stt.err}</p>`}
        <textarea id="answer" className=${'answer' + (stt.on ? ' listening' : '')} value=${text} readOnly=${stt.on} onChange=${e => setText(e.target.value)}
          placeholder=${stt.on ? '正在聽你說……' : '先講關鍵字，再講定義，最後舉課堂例子……'}></textarea>
        <div className="toolbar">
          <button className="btn primary" disabled=${stt.on} onClick=${doGrade}>檢查回答</button>
          <button className="btn" disabled=${stt.on} onClick=${() => setText('')}>清空</button>
          <span className="spacer"></span>
          <span className="meta">${charCount} 字</span>
          <span className="timer">${mmss}</span>
          <button className="btn" onClick=${() => setRunning(r => !r)}>${running ? '暫停' : '計時'}</button>
          <button className="btn" onClick=${() => { setSec(0); setRunning(false); }}>歸零</button>
        </div>
        <p className="tip">${stt.supported
          ? '講完按「停止並檢查」，會自動比對關鍵字。iPhone 要先開啟聽寫（設定 → 一般 → 鍵盤 → 啟用聽寫）並連上網路；術語聽錯可以直接改字，再按「檢查回答」。草稿只存在這台裝置。'
          : '口說作答：iPhone、Android 點輸入框後按鍵盤上的麥克風；Mac 連按兩下 Fn 開啟聽寫。講完按「檢查回答」，看看有沒有漏掉重點。草稿只存在這台裝置。'}</p>
      </section>

      <section className="sheet" aria-label="批改結果" aria-live="polite">
        ${!result ? html`<div className="empty">講完按「檢查回答」，這裡會用紅筆標出漏掉的關鍵字，並對照滿分範本。</div>` : html`<div>
          ${stale && html`<div className="stale">回答已修改，按「檢查回答」更新結果。</div>`}
          <div className="score">
            <div className="big">${result.total}<small> / 100</small></div>
            <div className="bar"><span>基本分・關鍵字</span><span className="track"><i style=${{ width: (result.base / 50 * 100) + '%' }}></i></span><span className="pt">${Math.round(result.base)}/50</span></div>
            <div className="bar"><span>滿分・定義實例</span><span className="track"><i style=${{ width: (result.elab / 50 * 100) + '%' }}></i></span><span className="pt">${Math.round(result.elab)}/50</span></div>
          </div>
          <div className="chk">
            <span className=${result.frontOk ? 'ok' : 'no'}>${result.frontOk ? '✓' : '✗'} 關鍵字先講</span>
            <span className=${result.defScore >= 1 ? 'ok' : 'no'}>${result.defScore >= 1 ? '✓' : '✗'} 定義句 ${result.defCount} 處</span>
            <span className=${result.exScore >= 1 ? 'ok' : 'no'}>${result.exScore >= 1 ? '✓' : '✗'} 實例${result.exTerms.length ? '：' + result.exTerms.slice(0, 4).join('、') : (result.exMarker ? '（有「例如」但沒講課堂例子）' : '（沒有舉例）')}</span>
          </div>
          <h3 className="secttl">核心關鍵字 <small>命中 ${result.kws.filter(k => k.status === 'hit').length} ／ ${result.kws.length}</small></h3>
          <ul className="kwlist">
            ${result.kws.map(k => html`<li key=${k.label}>
              <span className=${'pill ' + k.status}>${{ hit: '✓ 命中', partial: '△ 部分', miss: '✗ 漏掉' }[k.status]}</span>
              <span>${k.label}${k.lack.length > 0 && html`<span className="lack">缺：${k.lack.join('、')}</span>`}</span>
            </li>`)}
          </ul>
          <h3 className="secttl">怎麼補分</h3>
          <ul className="advice">${advice.map((a, i) => html`<li key=${i}>${a}</li>`)}</ul>
          <h3 className="secttl">你的回答 <span className="legend"><span><i style=${{ background: 'var(--hl)' }}></i>命中</span><span><i style=${{ borderBottom: '2px solid var(--partial)' }}></i>部分命中</span></span></h3>
          ${gradedText ? html`<${Marked} text=${gradedText} hand=${true} prefix="m-" layers=${result.kws.map(k => ({ spans: k.spans, status: k.status === 'miss' ? 'hit' : k.status }))} />` : html`<p className="meta">（空白）</p>`}
          <h3 className="secttl">滿分範本
            <button className=${'btn ' + (speaking(mKey) ? 'on' : '')} disabled=${!tts.supported} onClick=${() => listen(mKey, `第 ${q.id} 題滿分範本`, q.model)}>${speaking(mKey) ? html`<${PauseI} />停止` : html`<${Speaker} />聽範本`}</button>
            <span className="legend"><span><i style=${{ background: 'var(--miss-bg)', outline: '1px solid var(--redpen)' }}></i>你漏掉的</span><span><i style=${{ background: 'var(--partial-bg)' }}></i>部分</span><span><i style=${{ background: 'var(--hit-bg)' }}></i>已命中</span></span></h3>
          <${Marked} text=${q.model} prefix="mm-" layers=${modelLayers} />
          <p className="disclaim">估計分只依字面比對關鍵字與句型，用來檢查有沒有漏講，實際給分以老師判斷為準。第 1～6 題來自課堂題庫，第 7～46 題依課堂知識庫補充，第 47～49 題依 10/28 課堂補充。</p>
        </div>`}
      </section>
    </div>
  </div>`;
}

/* ---------- 底部播放列 ---------- */
const RATES = [0.8, 0.9, 1, 1.1, 1.2, 1.3, 1.5];
function Player({ tts }) {
  const p = tts.player, ref = useRef(null);
  // 播放列高度隨字幕變動：寫進 --player-h，頁面底部留出同樣的空間。
  useEffect(() => {
    const el = ref.current, root = document.documentElement;
    if (!el) return;
    const put = () => root.style.setProperty('--player-h', el.offsetHeight + 'px');
    put();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(put) : null;
    if (ro) ro.observe(el);
    return () => { if (ro) ro.disconnect(); root.style.removeProperty('--player-h'); };
  }, [!!p]);
  if (!p) return null;
  const it = p.items[p.idx];
  const gap = p.phase === 'gap' && !p.ended;
  const status = p.error ? p.error : p.ended ? '播放完畢' : !p.playing ? (gap && p.left >= 0 ? `已暫停・作答剩 ${p.left} 秒` : '已暫停')
    : gap ? (p.left < 0 ? '換你說，說完按「揭曉」' : `換你說・剩 ${p.left} 秒`)
    : p.quiz ? (p.part === 'a' ? '答案' : '題目') : `第 ${p.unit + 1}／${p.total} 句`;
  return html`<div className="player" role="region" aria-label="朗讀播放" ref=${ref}>
    <div className="in">
      <div className="now"><b>${it.label}</b><span className=${p.error ? 'warnline' : undefined}>${p.items.length > 1 ? `${p.idx + 1}／${p.items.length}・` : ''}${status}</span></div>
      ${gap && p.playing && p.left >= 0 && p.gapTotal > 0 && html`<div className="dbar countdown" aria-hidden="true"><i style=${{ width: (p.left / p.gapTotal * 100) + '%' }}></i></div>`}
      ${p.phase === 'say' && p.line && !p.ended && html`<p className="line">${p.line}</p>`}
      ${p.items.length > 1 && html`<button className="pbtn" aria-label="上一個" onClick=${() => tts.jump(-1)}><${PrevI} /></button>`}
      <button className="pbtn main" aria-label=${p.playing ? '暫停' : '播放'} onClick=${() => p.playing ? tts.pause() : tts.resume()}>${p.playing ? html`<${PauseI} />` : html`<${PlayI} />`}</button>
      ${p.items.length > 1 && html`<button className="pbtn" aria-label="下一個" onClick=${() => tts.jump(1)}><${NextI} /></button>`}
      ${gap && html`<button className="btn primary reveal" onClick=${tts.reveal}>揭曉</button>`}
      <select className="hide-sm" aria-label="語速" value=${tts.rate} onChange=${e => tts.setRate(+e.target.value)}>
        ${RATES.map(r => html`<option key=${r} value=${r}>${r}×</option>`)}
        ${!RATES.includes(tts.rate) && html`<option value=${tts.rate}>${tts.rate}×</option>`}
      </select>
      <button className="pbtn" aria-label="關閉播放" onClick=${tts.stop}><${StopI} /></button>
    </div>
  </div>`;
}

/* ---------- 考古題：林俊瑩《學習評量》教檢題庫 198 題（原題號 1～200，缺 93、137），答案與解析為研讀版，非正式公布答案 ---------- */
// n 題號、q 題幹、o 四個選項、a 正解字母（空字串＝題意有疑義、不計分）、al 答案說明、c 概念、e 解析、p 講義頁碼、x 補充提醒
const MCQ = [{"n":1,"q":"根據試題分析，某一試題的鑑別度為-0.2。對此結果的解釋，哪一項是合理的？","o":["題目品質良好","能準確的測出學習目標","高分組的表現優於低分組","高分組可能對題目有所誤解"],"a":"D","al":"D","c":"負鑑別度","e":"鑑別度 D＝高分組答對率－低分組答對率。D＝-0.2 表示高分組答對率反而低 20 個百分點，可能有題意模糊、誤設答案或高分組過度解讀等問題，因此 D 合理。A、B 無法由負鑑別度支持；C 恰好與數值相反。","p":"71-74"},{"n":2,"q":"某市的學力檢測，將學生分成待關心、基礎及精熟三個等級。試問某市採取的是哪一種評量？","o":["形成性","安置性","標準參照","常模參照"],"a":"C","al":"C","c":"標準參照","e":"「待關心、基礎、精熟」是依達成標準解釋學習表現，屬標準參照。常模參照重點是與他人比較名次；形成性與安置性則依評量目的分類，題幹沒有提供足以判定這兩者的資訊。","p":"12-14、30"},{"n":3,"q":"下列哪一個情境最接近真實評量？","o":["讓學生寫出課文心得，以評量其情意反應","讓低年級學生到商店買東西，以評量其算數能力","課堂中讓全班學生大聲朗讀，以評量其識字程度","讓學生觀賞地震演習的影片，評量其逃生觀念與技巧"],"a":"B","al":"B","c":"真實評量","e":"到商店買東西時實際運用計算，任務與生活用途直接相連，最符合真實評量。A 的心得可作評量資料，但未直接呈現生活應用；C 全班朗讀不易判斷個別識字能力；D 看影片未必能證明實際逃生技巧。","p":"75-77、87"},{"n":4,"q":"下列有關測驗(test)、測量(measurement)、評量(assessment)、評鑑(evaluation)的敘述，何者最為正確？","o":["測驗以客觀計分為主，評量以主觀計分為主","測驗、測量、評量和評鑑都以數字來呈現其結果","教育領域所用的標準化紙筆測驗大多屬於間接測量","測驗是用在教育、心理領域，測量是用在自然科學領域"],"a":"C","al":"C","c":"測驗與測量","e":"紙筆測驗以作答反應推論知識或心理特質，無法直接觀察特質本身，故多屬間接測量。A 把客觀／主觀當成定義不妥；B 忽略質性資料；D 錯把測量限定在自然科學。","p":"2-3、35-37","x":"講義第 3 頁「測驗／測量」前兩列定義疑似對調。應記：測驗是取得反應的工具或程序；測量是依規則賦予數值。"},{"n":5,"q":"下列有關信度、效度和鑑別度的敘述，何者正確？","o":["內容效度較適合使用於人格測驗","重測信度的高低會受到間隔時間長短的影響","學生異質性比較高的班級，測驗分數的信度會因此而較低","補救教學的評量應該強調高鑑別度，以期有效區分學生程度"],"a":"B","al":"B","c":"信度與效度","e":"重測間隔太短可能受記憶影響，太長則可能出現學習或發展變化，因此 B 正確。人格測驗常重視建構效度；在其他条件相同時，異質性提高通常有利於信度；補救教學評量重點是找出困難與確認精熟，並非追求最高鑑別度。","p":"38、48-49、56"},{"n":6,"q":"一項測驗若以其編製所依據的理論考驗效度，此效度稱為下列何者？","o":["建構效度","內容效度","表面效度","效標關聯效度"],"a":"A","al":"A","c":"建構效度","e":"用編製時所依據的理論架構，檢查測驗是否反映預期心理特質，是建構（構念）效度。內容效度看題目能否代表內容範圍；表面效度是表面上看來是否適合；效標關聯效度則比較測驗分數與外部效標。","p":"37-38、59"},{"n":7,"q":"小英的自我概念量表總分之 T 分數為 40，相當於百分等級多少？","o":["84","60","50","16"],"a":"D","al":"D","c":"T 分數轉百分等級","e":"先算 z＝(T－50)÷10＝(40－50)÷10＝-1。常態分配中，z＝-1 左側約占 15.87%，所以 PR 約 16。84 是 z＝+1 的累積百分比；50 對應平均數。注意百分等級不是答對率。","p":"32-33"},{"n":8,"q":"小達在魏氏兒童智力量表(WISC-III)的總智商是 115，請問相當於 T 分數多少？","o":["60","70","84","95"],"a":"A","al":"A","c":"魏氏智商轉 T 分數","e":"魏氏離差智商採平均數 100、標準差 15。z＝(115－100)÷15＝1，再換成 T＝50＋10×1＝60。不能把 IQ 的 15 分差直接加到 T 分數上；兩種量尺的標準差不同。","p":"18、32-33"},{"n":9,"q":"小玲國語期末考成績為 85 分，在該校六年級 200 名同學中的百分等級是 15。有關小玲成績表現的敘述，下列何者正確？","o":["是該校六年級同學的前 85 名","贏過該校六年級同學 85%的人","贏過該校六年級同學 15%的人","是該校六年級同學的倒數 15 名"],"a":"C","al":"C","c":"百分等級","e":"PR15 表示相對於常模團體，約勝過 15% 的人，因此選 C。85 是原始分數，不能讀成 PR85；200 人的 15% 約 30 人，也不能直接讀成第 15 名。遇同分時，精確百分等級需按常模的計算規則解釋。","p":"21、32-34"},{"n":10,"q":"快樂國小設立美術實驗班，招收三年級具有美術天份的兒童。下列哪一種美術測驗最適合用來甄選該類型的學生？","o":["興趣測驗","性向測驗","成就測驗","人格測驗"],"a":"B","al":"B","c":"性向測驗","e":"甄選具美術發展潛能的兒童，最適合性向測驗。興趣測驗測喜歡什麼；成就測驗測目前已學會多少；人格測驗測平常的特質。關鍵是「未來學習潛能」，不是僅看喜好或既有作品成績。","p":"7、15、18"},{"n":11,"q":"有關選擇題的描述，下列何者最適切？","o":["編製高品質的選擇題較為困難","選擇題的內容取樣缺乏代表性","選擇題不受閱讀理解能力的影響","選擇題較適合用來測量分析與評鑑的能力"],"a":"A","al":"A","c":"選擇題特性","e":"好的選擇題須兼顧清楚題幹、唯一最佳答案及有效誘答項，編製不容易。選擇題可在有限時間取樣較廣內容，B 不妥；仍可能受閱讀能力影響，C 錯；雖可測高層次能力，但不能因此說「較適合」或容易編製，D 過度概括。","p":"69-70、76"},{"n":12,"q":"王老師負責五年級國語科第一次段考的命題工作。下列何者作法最可以提高該測驗的效度？","o":["事先規畫試卷的雙向細目表","移除測驗中每人皆能答對的試題","增加選擇題以提高評分的客觀性","運用複雜的句子結構來增加試題難度"],"a":"A","al":"A","c":"雙向細目表","e":"雙向細目表交叉列出教材內容與學習目標／認知層次，使試題具代表性，直接提升內容效度。刪除人人答對的題目未必符合目標；增加客觀題主要有利評分一致性；複雜句子反而可能引入無關的閱讀負擔。","p":"38、68"},{"n":13,"q":"林老師為了解學生在學習英文「fast food」的單元後，是否達到「能聽懂日常生活應對中常用語句(速食店購物的對話)，並能作適當的回應。」的目標，特別安排全班學生到英語村的速食店以英文購買食物。此種評量方式最接近下列何者？","o":["動態評量","真實評量","檔案評量","生態評量"],"a":"B","al":"B","c":"真實評量","e":"學習目標是聽懂購物對話並適切回應，評量也讓學生實際以英語購物，能直接觀察語言的情境運用。動態評量須有教學介入與再評量；檔案評量需有目的地蒐集作品；生態評量重點是個人與環境需求的關係。","p":"77、87"},{"n":14,"q":"相較於標準化成就測驗，下列何種情形最適合採用教師自編成就測驗？","o":["必須大量、快速批改與計分時","所需的測驗必須具備高信度時","測驗內容要符合課堂教學目標時","測驗範圍廣泛且測驗題數偏多時"],"a":"C","al":"C","c":"教師自編測驗","e":"教師自編測驗能針對實際教過的內容、進度與學習目標設計，故 C 最合適。大量快速計分、廣泛取樣或高信度並非教師自編測驗的固有優勢；標準化測驗通常已有較完整的施測程序與品質證據。","p":"9-11"},{"n":15,"q":"陳老師自編測驗並進行試題分析後，發現某一題的難度指標值 P = .95。下列有關此題難易度的敘述，何者正確？","o":["過於簡單","難度適中","過於困難","無法判斷"],"a":"A","al":"A","c":"難度指標 P","e":"P 是答對比例或高低分組答對率的平均，P＝.95 表示約 95% 答對，題目偏易。名稱雖叫難度指標，數值越大反而越容易。是否刪題仍須看目的；精熟檢核可以保留高通過率的必要題目。","p":"71-73"},{"n":16,"q":"演講比賽名次屬於下列何種測量量尺？","o":["名義量尺","次序量尺","等距量尺","比率量尺"],"a":"B","al":"B","c":"次序量尺","e":"比賽名次能表示高低順序，但第一與第二名的能力差，不一定等於第二與第三名的差，故屬次序量尺。名義量尺只能分類；等距量尺要求等距；比率量尺還要有代表「完全沒有」的絕對零點。","p":"19-23"},{"n":17,"q":"王老師對同學說： 「這次月考我要考比較高層次的概念，而不是記憶類型的試題；還有，上次的題型猜對的機會有一半，所以這次我會改用別的題型。」王老師上次考試的題型為下列何者？","o":["填充題","選擇題","配合題","是非題"],"a":"D","al":"D","c":"題型與猜測率","e":"是非題只有兩種反應，完全隨機猜測答對機率為 1／2，因此選 D。一般四選一題的機率為 1／4；填充題須自行產生答案；配合題的猜測率則依候選項與配對規則而定。","p":"69-70"},{"n":18,"q":"某學者認為 A 測驗具有「建構效度」 ，有關A 測驗之敘述，下列何者較正確？","o":["它是一份人格測驗","按照雙向細目表命題","題目的內容與組成符合理論架構","各題題目之語意完整流暢、結構嚴謹"],"a":"C","al":"C","c":"建構效度","e":"題目內容與組成符合預期理論架構，才能支持測驗確實反映該構念，故選 C。A 只說測驗種類；B 是內容效度的常用證據；D 是題目文字品質，單靠語句流暢不足以證明建構效度。","p":"37-38、59"},{"n":19,"q":"根據常態分配，國小兒童在魏氏智力測驗上獲得的智商，於下列何種範圍內的人數最多？","o":["70~85","100~115","116 ~130","131~145"],"a":"B","al":"B","c":"常態曲線區間","e":"魏氏 IQ 的平均數為 100、標準差為 15，100～115 是平均數到 +1 SD，约占 34.13%，是四個選項中最多的區間。70～85 約占 13.59%；116～130 遠離中心；131～145 更靠近右端尾部。","p":"18、32-33"},{"n":20,"q":"有關心理測驗的敘述，下列何者錯誤？","o":["有良好效度的心理測驗，較能做出正確的推論","憂鬱量表若有良好的信度，表示該量表能夠涵蓋重要的憂鬱症狀","若測驗常模距今超過十年，解釋測驗結果時可能會錯估受試者的表現","「我會為了交朋友而參加團體」的敘述句優於「若不是為了交朋友，我不會參加團體」"],"a":"B","al":"B","c":"信度不等於效度","e":"信度表示測量結果是否一致，不能保證涵蓋重要的憂鬱症狀；後者涉及內容效度，所以 B 錯。效度有利於合理推論；過舊常模可能影響解釋；簡明的肯定句通常比雙重否定句易懂。","p":"17、38、46、91"},{"n":21,"q":"若變數分配狀態為「常態分配」時，±2SD 之間所佔比例為何？","o":["99.74%","68.26%","95.44%","85%"],"a":"C","al":"C","c":"常態分配比例","e":"常態分配平均數上下各 2 個標準差，合計約占 95.44%（更精細約 95.45%）。±1 SD 約 68.26%，±3 SD 約 99.74%。本題問的是中央區間，不能把左側累積百分比 97.7% 當答案。","p":"32-33"},{"n":22,"q":"若變數分配狀態為「常態分配」時，±1SD 之間所佔比例為何？","o":["99.74%","68.26%","95.44%","85%"],"a":"B","al":"B","c":"常態分配比例","e":"平均數上下各 1 個標準差的範圍，每一側約占 34.13%，合計 68.26%。95.44% 對應 ±2 SD；99.74% 對應 ±3 SD。先辨認題目問中央區間還是單側累積比例。","p":"32-33"},{"n":23,"q":"某一測驗的平均數是 75，標準差是 6，則當得分為 90 時，Z 分數為多少？","o":["1.5","2","2.5","3"],"a":"C","al":"C","c":"原始分數轉 z","e":"z＝(X－平均數)÷標準差＝(90－75)÷6＝15÷6＝2.5。表示得分比平均數高 2.5 個標準差。分子應先算差距，再除以標準差，不能直接以 90 除以 6。","p":"32-33"},{"n":24,"q":"某班學生學業成績的平均數為 80，標準差為 6，其中阿美的學業成績為 92，相當於魏氏智力分數多少？","o":["85","100","115","130"],"a":"D","al":"D","c":"z 轉魏氏量尺","e":"先算 z＝(92－80)÷6＝2，再換成魏氏分數＝100＋15×2＝130。此處只是量尺換算，不表示學業考試真的測出了智商。100 為平均，115 為高 1 SD，85 為低 1 SD。","p":"18、32-33"},{"n":25,"q":"某班學生考試成績，多數人得分偏低，該班學生成績會呈什麼分配型態？","o":["常態分配","左偏","右偏","高狹峰"],"a":"C","al":"C","c":"正偏態","e":"多數人得低分、少數人得高分，長尾伸向高分端（右側），稱右偏或正偏態。偏態名稱看的是「尾巴方向」，不是人數集中方向。左偏則是多數高分、少數低分把尾巴拉向左側。","p":"31-33；統計補充"},{"n":26,"q":"有五位學生，其魏氏智力測驗分數為 135、120、100、72、68。請問共有幾位需要特殊安置？","o":["1 位","2 位","3 位","4 位"],"a":"B","al":"B（依題設簡化）","c":"智商界值與安置","e":"若依題目把正負 2 SD 作初步篩選界線，魏氏 IQ 的界值為 100±2×15＝70、130；135 與 68 共 2 位超出，故選 B。120、100、72 未超出此界線。","p":"18、32-33、91；補充 S3","x":"這是題目簡化的統計判斷。實際特殊教育鑑定與安置尚須多元資料，不能只用一次 IQ 分數決定。"},{"n":27,"q":"小英的自我概念量表總分之 T 分數為 40，相當於百分等級多少？","o":["84","60","50","16"],"a":"D","al":"D","c":"T 分數轉百分等級","e":"先算 z＝(T－50)÷10＝(40－50)÷10＝-1。常態分配中，z＝-1 左側約占 15.87%，所以 PR 約 16。84 是 z＝+1 的累積百分比；50 對應平均數。注意百分等級不是答對率。","p":"32-33"},{"n":28,"q":"小達在魏氏兒童智力量表(WISC-III)的總智商是 115，請問相當於 T 分數多少？","o":["60","70","84","95"],"a":"A","al":"A","c":"魏氏智商轉 T 分數","e":"魏氏離差智商採平均數 100、標準差 15。z＝(115－100)÷15＝1，再換成 T＝50＋10×1＝60。不能把 IQ 的 15 分差直接加到 T 分數上；兩種量尺的標準差不同。","p":"18、32-33"},{"n":29,"q":"根據常態分配，國小兒童在魏氏智力測驗上獲得的智商，於下列何種範圍內的人數最多？","o":["70~85","100~115","116 ~130","131~145"],"a":"B","al":"B","c":"常態曲線區間","e":"魏氏 IQ 的平均數為 100、標準差為 15，100～115 是平均數到 +1 SD，约占 34.13%，是四個選項中最多的區間。70～85 約占 13.59%；116～130 遠離中心；131～145 更靠近右端尾部。","p":"18、32-33"},{"n":30,"q":"小明接受魏氏兒童智力測驗的結果，其全量表的 Z 分數為 2，試問小明的離差智商(DIQ)是多少？","o":["128","130","132","134"],"a":"B","al":"B","c":"離差智商","e":"魏氏離差智商 DIQ＝100＋15z。代入 z＝2，得 100＋30＝130。離差智商以同齡常模的相對位置表示，不使用「心理年齡÷實足年齡×100」的比率智商公式。","p":"18、32-33"},{"n":31,"q":"依常態分配而言，如果一項考試的平均分數是 80 分，標準差是 10 分，則該考試分數介於 70 分到 90 分的人數，約占多少百分比？","o":["60%","70% 68.26","80%","90%"],"a":"B","al":"B","c":"常態區間換算","e":"70＝80－10，90＝80＋10，所以 70～90 為 ±1 SD，約 68.26%；選項中 70% 最接近，故選 B。C 的 80% 與 D 的 90% 都不是此區間比例。","p":"32-33","x":"原題在 B 後另印「68.26」，本版將這個提示移至解析，保留選項 B 為 70%。"},{"n":32,"q":"某生學測成績如下，國 PR84 英 T=40 物 2S 數魏氏 110  請依成績由高至低排列，何者正確？","o":["國英物數","國物英數","物國數英","數國物英"],"a":"C","al":"C（依符號推定）","c":"跨量尺比較","e":"統一轉成 z：國文 PR84 約為 +1；英文 T40 為 -1；數學魏氏 110 為 (110－100)÷15≈0.67。若「物 2S」表示高於平均 2 SD，物理 z＝2，排序即物、國、數、英，選 C。","p":"18、32-33","x":"原題「2S」未明確定義。本解析依選項推定為 +2 SD；若非此意，資料不足，應請授課者確認。"},{"n":33,"q":"小達在比西量表的總智商是 132，請問相當於 T 分數多少？","o":["60","70","84","95"],"a":"B","al":"B（採 SD＝16）","c":"比西量尺換算","e":"依本題採用的舊式比西／斯比換算慣例，平均數 100、SD＝16，z＝(132－100)÷16＝2；T＝50＋10×2＝70。A 是 z＝1 的 T 分數；84 常用於 z＝1 的百分等級。","p":"18、32-33；量尺補充","x":"智力量表的 SD 應依版本手冊確認，不能將 SD＝16 套用於所有比西／斯比版本。"},{"n":34,"q":"百分等級是何種量尺？","o":["等比","等距","次序","名義"],"a":"C","al":"C","c":"百分等級量尺","e":"百分等級表示排序位置，因此屬次序量尺。PR50 到 PR60 所需的原始分數差，不一定等於 PR80 到 PR90 的差；所以不能把百分等級當等距分數，也不能說 PR80 的能力是 PR40 的兩倍。","p":"19-23、32-34"},{"n":35,"q":"王老師想要教導學生應試的技巧，下列何者較不適當？","o":["知道利用刪除法答題","如何有效運用作答時間","留意時事及命題的取向","從選項的長短預測答案"],"a":"D","al":"D","c":"合理應試技巧","e":"選項長短和正確性沒有可靠的必然關係，從長短猜答案容易受誤導，故 D 較不適當。刪除明顯錯項、分配時間及了解命題方向，則能協助考生合理使用已有知識與考試時間。","p":"69-70、91"},{"n":36,"q":"下列有關檔案評量的敘述，何者正確？","o":["檔案評量是一種客觀式評量","在檔案評量中，教學與評量是兩個獨立的事件","從檔案評量中可以看出學生學習的歷程和成果","學生的所有作品都要放入檔案中，作為期末評量的依據"],"a":"C","al":"C","c":"檔案評量","e":"檔案評量有目的地蒐集作品、觀察與反思資料，呈現學習歷程及成果，故選 C。它不天然等於客觀式評量；與教學密切連結；資料應依目的選擇，並非把所有作品不加篩選放入。","p":"85-88"},{"n":37,"q":"某英文能力測驗分數為常態分配，在此測驗，小如得分的 z 分數為 2，小武得分的 T 分數為 65，小明得分的百分等級為 50。下列敘述何者正確？","o":["小如的表現最好","小武的表現最好","小明的表現最好","小如和小武的表現相同"],"a":"A","al":"A","c":"跨量尺比較","e":"小如 z＝2；小武 z＝(65－50)÷10＝1.5；常態下 PR50 的小明 z＝0。2＞1.5＞0，所以小如表現最好。比較前必須先轉到同一標準量尺，不能直接比較 2、65 和 50。","p":"32-33"},{"n":38,"q":"下列敘述何者最接近系統性測量誤差？","o":["阿哲因答案卡劃記錯誤導致成績不佳","阿哲因為老師成績加總錯誤而多得 5 分","阿哲因語文能力不好而導致數學表現不好","阿哲考試前因吃壞肚子而導致考試表現不好"],"a":"C","al":"C","c":"系統性誤差","e":"若數學測驗含不必要的語文負擔，語文較弱的學生會持續受到不利影響，屬與無關特質相連的系統性偏誤。答案卡誤記、偶發加總錯誤或臨時身體不適，題幹均未指出有穩定、重複的作用模式。","p":"46-47"},{"n":39,"q":"下列何者是解釋兒童心理測驗結果最適切的方式？","o":["將測驗結果向兒童講述並公告周知","應特別對兒童強調測驗結果的有效性","參照指導手冊並一併呈現其他相關的訊息","直接以原始分數告知導師該兒童的測驗結果"],"a":"C","al":"C","c":"測驗結果解釋","e":"應依手冊的適用對象、常模與限制解釋分數，並結合其他資料，故選 C。結果須保障隱私，不能公告；也不宜過度強調一次測驗的準確性，或只給原始分數而沒有常模與誤差說明。","p":"24、91"},{"n":40,"q":"小學生游泳能力檢測訂有十級鑑定標準。若有學生具備「水中行走 10 公尺、水中閉氣 5 秒及水中認物的能力」 ，即可通過「第一級海馬」認證。此種評量結果的解釋屬於下列何者？","o":["常模參照評量","標準參照評量","安置參照評量","診斷參照評量"],"a":"B","al":"B","c":"標準參照","e":"通過海馬級是因達成事先規定的技能，不受其他同學表現影響，故屬標準參照。常模參照會看名次或相對比例；安置與診斷屬用途分類，並非本題對結果的解釋方式。","p":"12-14、30"},{"n":41,"q":"以重測法估計信度時，是為了瞭解測量結果的何種性質？","o":["穩定性","等值性","有效性","正確性"],"a":"A","al":"A","c":"重測信度","e":"同一群人在不同時間做同一份測驗，兩次分數的相關反映跨時間的穩定性。等值性主要由複本信度檢驗；有效性／正確性較接近效度，並非重測信度的直接意義。","p":"48-50、55"},{"n":42,"q":"下列有關選擇題和申論題的敘述，何者最適切？","o":["申論題評分者一致性較高","選擇題易測量高層次的能力","申論題內容取樣的代表性較佳","選擇題對知識評量的客觀性較佳"],"a":"D","al":"D","c":"題型比較","e":"選擇題依預定答案計分，較少受閱卷者主觀差異影響，故評分客觀性較佳。申論題的一致性通常需靠規準與訓練提升，且題數少、內容取樣較窄；高層次選擇題可以設計，但並不容易。","p":"56、69、76、81"},{"n":43,"q":"下列何種測驗最重視內容效度？","o":["成就測驗","性向測驗","智力測驗","人格測驗"],"a":"A","al":"A","c":"成就測驗的效度","e":"成就測驗要判斷學過的內容與目標達成程度，因此特別重視題目能否代表教學範圍，也就是內容效度。性向測驗常重視預測；人格、智力測驗重視構念的理論支持，但各類測驗仍可需要多種效度證據。","p":"38、68"},{"n":44,"q":"某次段考的測驗卷中有 5 個題目超出命題範圍。為了避免爭議，老師們決定一律給分。這種作法較可能產生下列何種結果？","o":["測驗信度不變","測驗效度不變","得分平均數降低","得分標準差縮小"],"a":"D","al":"D（通常情況）","c":"一律給分與變異","e":"原先超範圍題目若有人對、有人錯，一律給分後該部分不再區分學生，通常使總分差異縮小，故 D 最符合一般命題意圖。平均數不會降低；信度與效度也不能保證不變。","p":"45-47、56；統計補充","x":"標準差是否必然縮小，仍受這 5 題與其餘題目分數的共變關係影響；題幹不足以作無條件的數學保證。"},{"n":45,"q":"下列何者不屬於實作評量？","o":["英文課老師採口試方式評量學生的口說能力","家政課老師請學生上台示範製作麵包的流程","服務學習課程要求學生參與社區服務並製作學習檔案","體育課老師設計 50 題選擇題評量學生的球類運動知識"],"a":"D","al":"D","c":"實作評量","e":"50 題選擇題主要評量學生辨認球類知識，沒有直接展現運動操作，所以 D 不屬本題的實作評量。口試、示範製作麵包、參與服務並製作學習檔案，均可直接取得表現或作品證據。","p":"75-77、80、87"},{"n":46,"q":"下列哪兩種評量的取材範圍和試題難易度分配比較接近？","o":["診斷性評量與形成性評量","安置性評量與總結性評量","安置性評量與診斷性評量","形成性評量與總結性評量"],"a":"A","al":"A","c":"診斷性與形成性","e":"診斷與形成性評量通常聚焦正在學習的具體目標、錯誤與困難，取材較細、範圍較集中，也常包含基本技能題，因此 A 最接近。安置較重先備能力；總結較重較大範圍的整體成果。題目難易仍須依實際目的調整。","p":"14、29"},{"n":47,"q":"下列有關「標準參照測驗」的敘述，何者正確？","o":["可以區分學生的成就水準","題目通常維持在中間難度","解釋結果的標準於教學前決定","測驗分數有較廣的範圍。"],"a":"C","al":"C","c":"標準預先設定","e":"標準參照的核心是依教學前設定的目標／標準解釋表現，故 C 最明確。B、D 比較接近強調個別差異的常模參照設計；A 若指精熟等級也可能成立，但不足以作為兩者的明確區辨，故本題取 C。","p":"12-14"},{"n":48,"q":"五年仁班某次段考成績的統計結果，數學 M=65，SD=5；英文 M=80，SD=7。小明的數學考 70分，英文考 75 分。下列有關段考成績的敘述，何者最為正確？甲、仁班學生的數學程度較英文程度差  乙、仁班學生的數學成績較英文成績整齊丙、小明的數學程度較英文程度差      丁、小明的數學分數高於平均數一個標準差","o":["甲乙","甲丙","乙丁","丙丁"],"a":"C","al":"C","c":"標準差與相對表現","e":"數學 SD5＜英文 SD7，表示原始分數較集中（乙）；數學 z＝(70－65)÷5＝1（丁）。英文 z＝(75－80)÷7≈-0.71，小明數學相對表現較好。不同科目試卷難度不同，不能單由平均分數斷定能力高低。","p":"32-33、56、91"},{"n":49,"q":"在一次定期評量中，甲生的分數剛好是班上的平均數。甲生的 T 分數是多少？","o":["40","50","60","70"],"a":"B","al":"B","c":"T 分數的平均","e":"剛好等於平均數時 z＝0，代入 T＝50＋10z，得 T＝50。T 分數的平均數固定設為 50、標準差 10；40 和 60 分別是低於與高於平均 1 SD。","p":"32-33"},{"n":50,"q":"教師在教學前先以學習單了解學生的先備知識，做為學生分組的依據。此做法屬於  下列何者？","o":["安置性評量","形成性評量","診斷性評量","總結性評量"],"a":"A","al":"A","c":"安置性評量","e":"在教學前檢查先備知識，並作為分組或教學起點依據，是安置性評量。形成性在學習過程中提供回饋；診斷性深入找困難原因；總結性統整階段成果。判斷時以主要用途為準。","p":"29"},{"n":51,"q":"某班期中考的數學平均分數為 85 分，其中五分之三學生的成績低於該平均數。該班學生成績的中位數為下列何者？","o":["小於 85 分","大於 85 分","等於 85 分","無法判斷"],"a":"A","al":"A","c":"中位數","e":"五分之三＝60% 的學生低於 85 分，代表排到中間的 50% 位置仍在 85 以下，故中位數小於 85。平均數可能受少數高分拉高；不能因平均數是 85，就認為中位數也一定是 85。","p":"31-33；統計補充"},{"n":52,"q":"關於平時測驗結果的運用方式，下列何者較不適切？","o":["排定學生名次","了解學生學習狀況","據以調整教學計畫","了解學生學習成果的分布"],"a":"A","al":"A","c":"平時評量用途","e":"平時測驗主要提供學習回饋、了解分布與調整教學，單純排定名次較偏常模比較，也可能加重競爭而弱化回饋，故 A 較不適切。B、C、D 均可協助教師找出哪些目標需要再教。","p":"14、27、29"},{"n":53,"q":"下列何者最足以提高評量工具的信度？","o":["降低試題難度","延長施測時間","增加同質的複本試題數量","找程度相當的受試者接受施測"],"a":"C","al":"C","c":"提高信度","e":"增加能測量相同特質、品質相當的複本試題，可降低偶然因素對總分的相對影響，通常最能提高信度。單純降低難度或延長時間未必有效；受試者程度太接近會限制分數變異，通常不利於區辨型信度係數。","p":"56、58-59"},{"n":54,"q":"某次期末考，班上 50 位學生中，除了兩位得分很低，絕大多數學生都很接近滿分。這一種成績分布型態屬於下列何者？","o":["正偏態","負偏態","常態分配","雙峰分配"],"a":"B","al":"B","c":"負偏態","e":"多數接近滿分，少數極低分把尾巴拉向左側，屬負偏態（左偏）。正偏態是多數低分、右側長尾；常態分配大致對稱；題幹沒有兩個明顯高峰，因此不是雙峰。","p":"31-33；統計補充"},{"n":55,"q":"曾老師對全班學生的期中考成績進行排序，將前 27%的學生當成高分組，後 27%當成低分組，再計算每一題高分組和低分組答對人數百分比的差異。此做法是為了獲知下列何種資訊？","o":["難度","猜測度","鑑別度","評分者信度"],"a":"C","al":"C","c":"鑑別度計算","e":"分出高低分組，再算答對率之差，就是 D＝PH－PL，目的在檢查題目能否區分高低能力。難度 P 通常用答對比例或 (PH＋PL)÷2；評分者信度則比較不同評分者的評分一致程度。","p":"71、74"},{"n":56,"q":"曾同學的國文考試分數之百分等級為 68，其意涵為何？","o":["滿分 100 中，曾同學獲得 68 分","在所有學生中排名第 68 名","考試成績贏過百分之 68 的學生","有 32 個學生的成績表現低於曾同學"],"a":"C","al":"C","c":"百分等級解釋","e":"百分等級 68 表示在所參照的團體中，約有 68% 的人表現低於該生。它不是原始分數 68，也不是第 68 名；剩餘比例是 32%，不是固定 32 個人。人數還須知道團體總數才可估算。","p":"21、32-34"},{"n":57,"q":"下列何者是編製測驗的第一個步驟？","o":["建置測驗的題庫","確定測驗的目的","設計雙向細目表","決定測驗的題型"],"a":"B","al":"B","c":"測驗編製起點","e":"先確定「為何測、要做什麼決定」，才能選內容、對象、題型與品質標準，故選 B。雙向細目表、選題型及建置題庫都是目的明確後的設計步驟，不能取代先界定測驗目的。","p":"28、68、70"},{"n":58,"q":"若要了解不同學校或不同班級間學生的異質性，應參照下列哪一項統計數值？","o":["中數","眾數","標準差","平均數"],"a":"C","al":"C","c":"離散程度","e":"異質性是學生之間差異的大小，標準差用來描述分數的離散程度，故選 C。在相同可比較量尺下，SD 越大代表分布越分散；中數、眾數與平均數主要描述中心位置。","p":"31-33、56"},{"n":59,"q":"劉老師在批改一份自然科高層次推理能力之實作型試題(分數介於 0~6)時，對學生   錯別字、文法、標點等錯誤斟酌小扣 1 分，以提醒學生注意表達與溝通。劉老師的作法對測驗結果的何項特質影響最大？","o":["信度","效度","常模","客觀性"],"a":"B","al":"B","c":"構念無關因素","e":"本題目標是自然科推理，卻因錯字、文法與標點扣分，使分數混入其他能力，最直接威脅效度。即使老師每次都一致扣分，也只是可能維持一致性，不能確保測到所要的自然推理能力。","p":"35-38、54"},{"n":60,"q":"方老師在課程結束後，依據事先訂定的學習目標與表現標準，檢視學生是否已習得特定知識與技能，而非進行學生間的比較。方老師的評量方式屬於下列何者？","o":["安置性評量","形成性評量","常模參照評量","標準參照評量"],"a":"D","al":"D","c":"標準參照","e":"重點是依事先訂定的目標与表現標準判斷是否學會，故 D 正確。課程結束也可具有總結性用途，但選項未列總結性；不能因有「課程結束」就選形成性，更不能選強調人際比較的常模參照。","p":"12-14、30"},{"n":61,"q":"體育課進行跳繩教學時，李老師在學生練習過程中持續給予正向鼓勵，讓學生相信自己一定能達到標準，因此學生的練習動機明顯提升，學習表現也隨之進步。此現象較符合下列何者？","o":["月暈效應(halo effect)","霍桑效應(Hawthorn effect)","比馬龍效應(Pygmalion effect)","強亨利效應(John Henry effect)"],"a":"C","al":"C","c":"比馬龍效應","e":"教師的正向期待與鼓勵改變學生信念、動機及表現，最符合比馬龍／自我應驗效應。月暈是既有印象影響評分；霍桑是因受注意或被研究而改變行為；強亨利是比較組因競爭意識而加倍努力。","p":"24、54、57"},{"n":62,"q":"下列何者是教師需要具備的評量觀念？甲、使用評量結果時必須謹慎，可對全班家長公開乙、設計良好的評量應該是任何人都可以執行，且一次就可下定論丙、須尊重家長對學生表現所提供的證據，並用以檢視自己的觀察結果丁、家長若覺得評量結果不符合子女的平常表現，教師可考慮重新評量","o":["甲乙","甲丙","乙丙","丙丁"],"a":"D","al":"D","c":"審慎使用結果","e":"丙尊重家長提供的日常證據，丁願意檢視不一致結果，均能讓評量更完整，故選 D。甲全面公開有隱私問題；乙忽略施測專業、誤差與多次觀察，不能一次就對孩子下定論。","p":"24、89、91"},{"n":63,"q":"教師想要了解學生程度，以便決定教學起點時，應該選擇下列何種評量？","o":["預備性評量","形成性評量","診斷性評量","總結性評量"],"a":"A","al":"A","c":"預備性評量","e":"了解學生已有的知識能力，以决定教學起點，屬预備性／安置性評量。形成性重在過程回饋；診斷性找特定學習困難的原因；總結性用於階段成果。看到「起點」可優先想到安置或預備。","p":"29"},{"n":64,"q":"「情意測驗」乃是有關個人態度、價值觀、興趣、鑑賞、動機、情緒、人格等特質的測驗。據此，下列何者屬於情意測驗？甲、中文年級認字量表                乙、國小兒童自我概念量表丙、國民中小學學習行為特徵檢核表    丁、國小學生生活適應量表","o":["甲乙","甲丙","乙丁","丙丁"],"a":"C","al":"C","c":"情意測驗","e":"自我概念與生活適應涉及個人感受、自我看法及適應狀態，因此乙、丁最明確，選 C。認字量表屬認知能力；學習行為特徵檢核表須依內容判斷，不能僅因是檢核表就視為情意測驗。","p":"7、15、89-90"},{"n":65,"q":"下列有關測驗與評量的敘述，何者正確？","o":["實作評量強調結構完整的問題","選擇題測驗易於測得分析與評鑑的能力","實作評量的結果可以預測實際情境的表現","標準化測驗在特定教育情境中能提供有效的解釋"],"a":"C","al":"C","c":"實作評量的用途","e":"實作任務與實際用途相近，可提供推論實際情境表現的證據，故 C 最適切。它不要求一律為結構完整的問題；高層次選擇題不易編製；標準化測驗也不保證能精確對應每個特定課堂情境。","p":"75-84"},{"n":66,"q":"某班學生進行語文能力測驗後，得知甲同學的 Z 分數為 2，乙同學的 T 分數為 60，丙同學的 Z分數為-2。請問下列敘述，何者正確？","o":["乙同學的語文能力測驗分數最高","甲同學的語文能力測驗分數最高","甲同學和乙同學的語文能力測驗分數一樣","甲同學和丙同學的語文能力測驗分數一樣"],"a":"B","al":"B","c":"z 與 T 比較","e":"甲 z＝2；乙 T60 換為 z＝(60－50)÷10＝1；丙 z＝-2。故甲＞乙＞丙，選 B。z 的正負號表示在平均數之上或之下，+2 與 -2 雖距中心一樣遠，表現並不相同。","p":"32-33"},{"n":67,"q":"一個測驗能測出所欲量度的行為特性之程度，應屬下列何者？","o":["信度","效度","常模","效標"],"a":"B","al":"B","c":"效度","e":"「能否測到所欲量度的行為特性」就是效度。信度是結果一致性；常模是解釋分數的參照資料；效標是用來比較或預測的外部表現指標。答題時抓住「測得對不對」與「測得穩不穩」的差別。","p":"17、35-37"},{"n":68,"q":"依常態分配而言，如果一項考試的平均分數是 80 分，標準差是 10 分，則該考試分數介於 70 分到 90 分的人數，約占多少百分比？","o":["60%","70%","80%","90%"],"a":"B","al":"B","c":"常態區間換算","e":"70～90 相對於平均 80、SD10，是平均數上下各 1 SD，比例約 68.26%。選項中 70% 最接近，故選 B。若問 ±2 SD，則會是約 95.44%；不可混用兩種範圍。","p":"32-33"},{"n":69,"q":"某國小負責九十八學年度一般智能資優班招生鑑定工作。該次鑑定採用魏氏兒童智力量表，依規定應試者的智力至少應在多少以上，才符合標準？","o":["125","130","135","140"],"a":"B","al":"B","c":"一般智能資優界值","e":"依本題採平均數正 2 個標準差的智力門檻，魏氏量尺為 100＋2×15＝130，所以選 B。125、135、140 均不是 +2 SD 的位置。","p":"18、32-33；補充 S3","x":"本題是舊年度考題的門檻計算；符合分數門檻不等於單憑此分數即可完成鑑定或安置。"},{"n":70,"q":"下列那一種變項不適合計算平均數與標準差？","o":["連續變項","名義變項","等距變項","比率變項"],"a":"B","al":"B","c":"名義資料","e":"名義變項的數字只是類別代碼，例如班別編為 1、2、3，其平均數沒有實質數量意義，也不宜用 SD 描述能力差異。等距與比率量尺可計算平均及標準差；「連續」不是本題要排除的量尺類型。","p":"19-23"},{"n":71,"q":"根據雙向細目表命題，主要在確認試題的何種效度？","o":["表面效度","關聯效度","預測效度","內容效度"],"a":"D","al":"D","c":"雙向細目表","e":"依教材內容與學習目標安排試題，能檢查取樣是否完整、具代表性，主要支持內容效度。表面效度只看外觀是否合理；關聯效度需外部效標；預測效度要有未來表現作比較。","p":"38、68"},{"n":72,"q":"下列何者是「標準參照測驗」(criterion-referenced test)的特性之一？","o":["與其他學生的測驗表現進行比較","與教師設定的精熟標準進行比較","原始資料的測量分數之變異性較大","以百分等級和標準分數解釋測量分數"],"a":"B","al":"B","c":"精熟標準","e":"標準參照以預先設定的精熟要求判斷學生是否學會，所以 B 正確。A 是與他人比較；C 的較大變異及 D 的百分等級、標準分數較常用於常模參照。判斷依據是分數怎麼解釋，而非測驗名稱。","p":"12-14、30"},{"n":73,"q":"下表是某道選擇題高分組和低分組學生在各選項的選答比例，哪一個選項較具有誘答性？A* B C D高分組 70% 5% 25% 0%低分組 30% 20% 40% 10%*為正確答案","o":["A","B","C","D"],"a":"","al":"待釐清（B、C 均有依據）","c":"誘答選項分析","e":"A 是正答，不是誘答項。B 的低－高選答率＝20%－5%＝15%；C＝40%－25%＝15%；D＝10%－0%＝10%。若以兩組差值判斷，B、C 並列；若以吸引低分組的比例判斷，C 較高。","p":"71-74；補充 S2","x":"題目未定義「較具有誘答性」的比較指標，無法嚴謹地指定唯一答案。可練習計算，但本題宜暫不計分。"},{"n":74,"q":"把新編測驗與效標測驗一併施測所得的相關，是屬於何種效度？","o":["內容效度","同時效度","表面效度","預測效度"],"a":"B","al":"B","c":"同時效度","e":"新測驗與效標約在同一時期施測，再求相關，屬同時／併行效度。若效標在較晚的未來取得才是預測效度。內容效度看內容代表性，表面效度看表面適切性，均不是本題的相關研究設計。","p":"40-41"},{"n":75,"q":"李老師想了解期末考數學考題是否適切，於是他做了試題分析，請判斷下列哪一個試題分析結果最為理想？","o":["P = 0.10，D = 0.15","P = 0.46，D = -0.15","P = 0.51，D = 0.75","P = 0.85，D = 0.30"],"a":"C","al":"C","c":"理想試題指標","e":"C 的 P＝.51，難度適中；D＝.75，表示高分組答對率比低分組高 75 個百分點，區辨力佳。A 太難且鑑別低；B 鑑別為負；D 雖有一定鑑別力但偏易。在一般區辨目的下 C 最佳。","p":"70-74"},{"n":76,"q":"有關測驗效度的說法，下列哪一項是對的？","o":["效度高，信度一定不低","效度是可靠性，信度是正確性","信度低的測驗，效度可能高也可能低","效度是信度的必要條件，但非充分條件"],"a":"A","al":"A","c":"信效度關係","e":"信度是效度的必要而非充分條件；結果若很不穩定，難支持有效推論，因此 A 正確。B 把定義對調；C 忽略信度不足對效度的限制；D 則把必要條件的方向說反。","p":"17、35-37、45-46"},{"n":77,"q":"下列何者最具有結合教學、診斷和評量的功能？","o":["動態評量","標準化測驗","常模參照評量","標準參照評量"],"a":"A","al":"A","c":"動態評量","e":"以「前測→教學介入→後測」了解學習反應與潛能，能把教學、診斷與評量結合，故選 A。標準化、常模參照、標準參照本身均不表示施測者會在過程中提供個別化教學。","p":"87、100-101"},{"n":78,"q":"教師在教學前對班上進行學科成就評量，以確定學生的起點行為。此作法屬於下列何種評量？","o":["安置性評量","形成性評量","診斷性評量","總結性評量"],"a":"A","al":"A","c":"起點行為","e":"教學前了解學生的預備程度，以規劃起點或分組，是安置性評量。形成性重在教學中的回饋；診斷性重在找出困難原因；總結性重在階段成果。單看「成就測驗」無法決定用途，應看施測目的。","p":"29"},{"n":79,"q":"萱萱接受數學標準化成就測驗後獲得的分數為 82 分，已知此份測驗的測量標準誤為 5，萱萱的真實分數為 77~87 分的可能性有多少？","o":["68%","75%","95%","99.7%"],"a":"A","al":"A","c":"測量標準誤","e":"區間 77～87＝82±5，恰為實得分數上下 1 個測量標準誤（SEM）。在誤差近似常態的傳統題設下，約對應 68% 的信賴水準。95% 通常約為 ±1.96 SEM，99.7% 約為 ±3 SEM。","p":"32-33、45-46；統計補充","x":"本題是近似信賴區間的考試用語；不是把固定的真實分數當作每次隨機改變，也不要將 SEM 誤當成全班分數的 SD。"},{"n":80,"q":"選用心理測驗時，效度與信度是必須要考慮的標準之一。以下對於效度與信度的關係何者有誤？","o":["信度是效度的必要條件，但非充分條件","測驗要具有效度之前，必須先具有信度","信度高的測驗，其效度一定高","效度可以保證某種程度的信度"],"a":"C","al":"C","c":"高信度不保證高效度","e":"工具可能每次都一致地測錯方向，例如固定多報重量，故信度高不代表效度高，C 有誤。A、B、D 均在表達有效推論需要一定程度的一致性。記法：穩定是必要基礎，但還要確認測量目標正確。","p":"17、35-37、46"},{"n":81,"q":"某次期中考試項目分析結果發現，測驗的平均難度為.37；假設該測驗的滿分為 100，及格分數為 60。下列有關該測驗特徵和結果推論的描述，哪一項最適切？","o":["測驗的信度頗佳","很多同學會不及格","同學的成績變異很大","大部分同學得分都很高"],"a":"B","al":"B","c":"平均難度","e":"若題目等權且 P 以全體答對率計，平均難度 .37 約對應平均 37 分，低於及格 60，故很多人不及格最合理。單憑平均難度不能推論信度或成績變異很大；更不能說多數高分。高低分組算法與全體均分並非完全相同。","p":"71-73"},{"n":82,"q":"想要瞭解學生的學習潛能，評估其接受特定教育或訓練之適合程度，以及預測未來相關之學習成就，應採用何種測驗工具？","o":["性向測驗","智力測驗","興趣測驗","成就測驗"],"a":"A","al":"A","c":"性向測驗","e":"「學習潛能、接受某種訓練的適合程度、預測未來成就」是性向測驗的核心功能。智力偏一般認知能力，興趣反映喜好，成就反映目前學習結果；本題著重特定未來學習的潛能，故 A 最貼切。","p":"7、15、18"},{"n":83,"q":"如果我們要研究蒙氏教育與方案教學兩種方法對孩子語文能力發展的影響有何不同時，此處的語文發展是？","o":["自變項","依變項","多變項","常數"],"a":"B","al":"B","c":"自變項與依變項","e":"研究比較的是兩種教學法，教學法是自變項；被觀察、用來判斷教學效果的語文能力發展是依變項。常數是研究中維持不變的條件；「多變項」不是題幹中語文發展的角色。","p":"42"},{"n":84,"q":"某班月考數學的平均數是 50，標準差是 10，如果老師為每位學生各加 25 分，則新的標準差為？","o":["10","15","35","30"],"a":"A","al":"A","c":"加常數不改變 SD","e":"每人都加 25 分，平均數由 50 變成 75，但各分數與新平均數的距離不變，所以 SD 仍為 10。一般而言 Y＝aX＋b 時，平均數變為 aM＋b，標準差變為絕對值 a 乘原 SD；加數 b 不影響 SD。","p":"31-33；統計補充"},{"n":85,"q":"如果有一組資料，突然加入一個分數，而這個分數正好是原有的平均數，那麼新資料的標準差會有什麼變化？","o":["變大","變小","不變","無法判斷"],"a":"B","al":"B（原有差異時）","c":"加入平均分數","e":"新增分數剛好等於原平均，新平均不變，離均差平方和也不變；計算變異數的分母增加，故原 SD＞0 時，新 SD 會變小。不是新增資料就一定增加分散程度。","p":"31-33；統計補充","x":"若原先所有分數都相同，SD 原為 0，加入同一分數後仍為 0；本題的 B 以原資料有變異為前提。"},{"n":86,"q":"下列那一個分配可能會呈現負偏態？","o":["難度很低的測驗之得分","家庭年收入","台灣地區的人口年齡組成","大一學生的年齡"],"a":"A","al":"A","c":"容易測驗與負偏態","e":"若「難度很低」指一般語意的「題目容易」，多數人高分、少數低分形成左尾，會呈負偏態，所以 A 最合適。家庭收入常有少數極高收入拉出右尾；其他選項也不如容易測驗明確。","p":"31-33、73；統計補充","x":"若把「難度很低」誤讀成難度指標 P 很低，意義會反過來。本題區分日常用語的難與 P 值。"},{"n":87,"q":"P80=72，代表團體中","o":["有 80%的人分數低於 72 分","有 80%的人分數高於 72 分","有 72%的人分數低於 80 分","有 72%的人分數高於 80 分"],"a":"A","al":"A","c":"百分位數","e":"P80＝72 表示第 80 百分位數的分數為 72，約有 80% 的分數低於此位置，故選 A。P80 是分數位置對應的「分數」，PR 則是某分數對應的「百分等級」；遇同分時依常模規則處理。","p":"32-34"},{"n":88,"q":"已知一常態分配的中位數為 100，變異數為 64，若某生的 Z 分數為 0.5，則其原分數為？","o":["96","104","132","無法計算"],"a":"B","al":"B","c":"變異數轉 SD","e":"常態分配平均數＝中位數＝100；變異數 64，故 SD＝√64＝8。X＝M＋z×SD＝100＋0.5×8＝104。C 的 132 是把變異數 64 當成標準差代入所造成的錯誤。","p":"32-33"},{"n":89,"q":"期中考後學生建議老師將成績進行線性轉換以減少不及格的人數，轉換後下列那一項是不變的？","o":["平均數","標準差","名次","眾數"],"a":"C","al":"C（正向轉換）","c":"線性轉換","e":"一般為調分所做的正向線性轉換 Y＝aX＋b（a＞0），分數高低順序不變，所以名次不變。平均數、眾數通常會移動；SD 在 a≠1 時也會改變。若只加固定分數，SD 也不變，但題幹並未限定只加分。","p":"31-33、91；統計補充"},{"n":90,"q":"下列各相關係數值何者表示最強烈的相關程度？","o":[".01","-.10",".78","-.90"],"a":"D","al":"D","c":"相關強度","e":"相關強弱看絕對值，不看正負號。四個絕對值依序為 .01、.10、.78、.90，因此 -.90 最強。負號只表示一個變項越高，另一個越低的反向關係；不表示相關比較弱。","p":"40"},{"n":91,"q":"相關係數 r=.60，表示被預測變項之變異量不可由預測變項解釋的比例為？","o":["64%","60%","40%","36%"],"a":"A","al":"A","c":"未解釋變異量","e":"簡單線性相關下，解釋變異比例為 r²＝.60²＝.36＝36%；未解釋比例為 1－.36＝.64＝64%，故選 A。直接算 1－r 得 40% 是常見錯法。相关與解釋量也不能單獨證明因果關係。","p":"40"},{"n":92,"q":"快樂國小設立美術實驗班，招收三年級具有美術天份的兒童。下列哪一種美術測驗最適合用來甄選該類型的學生？","o":["興趣測驗","性向測驗","成就測驗","人格測驗"],"a":"B","al":"B","c":"性向測驗","e":"甄選具美術發展潛能的兒童，最適合性向測驗。興趣測驗測喜歡什麼；成就測驗測目前已學會多少；人格測驗測平常的特質。關鍵是「未來學習潛能」，不是僅看喜好或既有作品成績。","p":"7、15、18"},{"n":94,"q":"名次是何種量尺？","o":["等比","等距","次序","名義"],"a":"C","al":"C","c":"名次量尺","e":"名次只有高低順序，不保證相鄰名次的實際分數或能力差相等，因此為次序量尺。名義量尺只有分類；等距要求相等單位；比率還須絕對零點。不能說第二名能力是第四名的兩倍。","p":"19-23"},{"n":95,"q":"身高是何種量尺？","o":["等比","等距","次序","名義"],"a":"A","al":"A","c":"比率量尺","e":"身高有等距單位，且零高度具有「沒有該長度」的意義，可以作倍數比較，因此屬等比／比率量尺。次序量尺只能排序；等距量尺則未必具可作比率解釋的絕對零點。","p":"19-23"},{"n":96,"q":"下列有關動態評量的敘述，何者錯誤？","o":["強調認知能力的可塑性","著重評量者與幼兒的雙向溝通和互動關係","採取「在教學中評量，在評量中教學」的觀點","認為測驗結果相同的兩位幼兒，其近側發展區亦相同"],"a":"D","al":"D","c":"近側發展區","e":"兩名幼兒目前獨立作答相同，接受協助後可能進步不同，所以近側發展區不一定相同，D 錯。動態評量正是透過互動、提示與教學，了解能力的可塑性及學習潛能；A、B、C 均符合此觀點。","p":"87、100-101"},{"n":97,"q":"下列何者不屬於擴散性的提問？","o":["你怎麼摺出這架紙飛機的？","有什麼方法可以讓紙飛機飛得更遠？","有哪些東西可以用來裝飾你的紙飛機？","想想看我們可以用紙飛機玩什麼遊戲呢？"],"a":"A","al":"A","c":"聚斂與擴散提問","e":"A 要幼兒回述自己已完成的摺法，答案受既有歷程限制，較接近聚斂式提問。B 邀請多種改良方式，C 開放裝飾材料，D 發想不同遊戲，都較鼓勵多種可能答案。開放問句不一定就是擴散思考。","p":"62-67、69；提問補充"},{"n":98,"q":"快樂國小設立美術實驗班，招收三年級具有美術天份的兒童。下列哪一種美術測驗  最適合用來甄選該類型的學生？","o":["興趣測驗","性向測驗","成就測驗","人格測驗"],"a":"B","al":"B","c":"性向測驗","e":"甄選具美術發展潛能的兒童，最適合性向測驗。興趣測驗測喜歡什麼；成就測驗測目前已學會多少；人格測驗測平常的特質。關鍵是「未來學習潛能」，不是僅看喜好或既有作品成績。","p":"7、15、18"},{"n":99,"q":"有關選擇題的描述，下列何者最適切？","o":["編製高品質的選擇題較為困難","選擇題的內容取樣缺乏代表性","選擇題不受閱讀理解能力的影響","選擇題較適合用來測量分析與評鑑的能力"],"a":"A","al":"A","c":"選擇題特性","e":"好的選擇題須兼顧清楚題幹、唯一最佳答案及有效誘答項，編製不容易。選擇題可在有限時間取樣較廣內容，B 不妥；仍可能受閱讀能力影響，C 錯；雖可測高層次能力，但不能因此說「較適合」或容易編製，D 過度概括。","p":"69-70、76"},{"n":100,"q":"下列有關於平均數/眾數/中位數三者的排列何者正確？","o":["負偏態：平均數值最低","正偏態：眾數數值最高","左偏態：中位數最高","以上皆非"],"a":"A","al":"A","c":"偏態與集中量數","e":"典型單峰負偏態中，少數低分把平均數拉向左側，常見順序是平均數＜中位數＜眾數，故 A 正確。典型正偏態則常見眾數＜中位數＜平均數。這是常用形態判讀規則，不是所有不規則分布的必然定理。","p":"31-33；統計補充"},{"n":101,"q":"下表為高、低分組各 40 位學生在一題選擇題四個選項的人數分布，其中 D 為正確答案。下列有關此試題的敘述，何者適切？（各選項人數，A／B／C／D：高分組 10／9／11／10；低分組 11／8／12／9）","o":["此題難度適中，適合用於常模參照測驗","此題正確選項的敘述，可能具有暗示性","此題測量的概念可能尚未教過，學生在猜題","選項誘答力低，能診斷出學生不清楚的地方"],"a":"C","al":"C","c":"猜測與低鑑別度","e":"正答 D：PH＝10／40＝.25，PL＝9／40＝.225；P＝.2375，D＝.025。各選項人數接近，正答率近四選一猜測率，C 的「可能尚未教過、在猜題」最合理。不能僅憑這張表確定原因，仍應回看教學與題意。","p":"71-74"},{"n":102,"q":"以下是麗雪在國語、數學、自然、社會定期評量的分數，以及全校同年級學生在此四個科目的平均數和標準差。相對於學校其他同學，麗雪在哪一科的表現較好？國語 數學 自然 社會麗雪成績 84 80 74 86平均數   88 71 84 80標準差   8 6 10 12","o":["國語","數學","自然","社會"],"a":"B","al":"B","c":"跨科 z 分數","e":"國語 z＝(84－88)／8＝-0.5；數學＝(80－71)／6＝1.5；自然＝(74－84)／10＝-1；社會＝(86－80)／12＝0.5。數學 z 最高，表示相對於同科同學的表現最好。社會原始分數最高並不代表相對表現最佳。","p":"32-33、91"},{"n":103,"q":"美美國小舉辦說故事比賽，選擇前 20%進入複賽。此「20%的入選規準」屬於下列何種參照？","o":["標準參照","結果參照","常模參照","表現參照"],"a":"C","al":"C","c":"比例錄取","e":"選前 20% 是依參賽者相互比較的位置決定入選，屬常模參照。若依固定的敘事能力規準，達標者不論人數均入選，才屬標準參照。「規準」一詞本身不等於標準參照，須看是否依團體排序。","p":"12-14、30"},{"n":104,"q":"下列哪些對於多元評量的觀點較為適切？甲、每個教學單元宜設計多種評量方式來了解學生的學習表現乙、由於強調多元評量精神，故教學評量應避免使用紙筆測驗丙、多元評量是主觀的評量，無法提供對學生學習客觀的資訊丁、評量應該要能切合教學目標，並選擇適切的方式進行評量","o":["甲乙","甲丁","乙丙","丙丁"],"a":"B","al":"B","c":"多元評量","e":"甲運用多種方式取得不同面向的證據，丁使方法與教學目標對應，均適切，故選 B。多元評量仍可包含紙筆測驗；適當規準、多人評分和交叉資料也能提高客觀性，因此乙、丙的絕對說法不妥。","p":"25、69、75-88"},{"n":105,"q":"以下是某班國語科四個考題其高低分組的答對率。哪一題的試題品質指標最佳？題號 1   2   3   4高分組答對率 80% 20% 65% 50%低分組答對率 20% 50% 55% 10%","o":["第 1 題","第 2 題","第 3 題","第 4 題"],"a":"A","al":"A","c":"比較 P 與 D","e":"依序計算四題：第 1 題 P＝.50、D＝.60；第 2 題 P＝.35、D＝-.30；第 3 題 P＝.60、D＝.10；第 4 題 P＝.30、D＝.40。第 1 題難度適中且鑑別度最高，故選 A。","p":"71-74"},{"n":106,"q":"有關評量之運用與詮釋，下列何者較屬於「常模參照」取向？","o":["白雲國小篩選出五年級需要接受數學科學習扶助的學生","青山國小針對閱讀書籍量破百的學生頒發閱讀小博士證書","清溪國小選出校內學習檔案比賽前三名代表學校參加全市的比賽","大樹國小根據評分規準將學生的閱讀檔案區分為 ABCDE 五個等級"],"a":"C","al":"C","c":"常模參照","e":"選出校內前三名是相互排序，最符合常模參照。閱讀破百本與依規準給等級，都可用固定標準判定；學習扶助的篩選也可能依基本能力標準，不一定是取末幾名，因此 C 最明確。","p":"12-14、30"},{"n":107,"q":"孫老師對全校學生實施音樂性向測驗，擬以音樂成績作為效標，所得出效標關聯效度係數為.40。若以音樂資優班學生為施測對象時，所得到的效標關聯效度係數最可能是下列何者？","o":["小於.40","大於.40","等於.40","無從判斷"],"a":"A","al":"A","c":"範圍限制","e":"音樂資優班的音樂能力通常比較接近，全校範圍被限縮後，兩變項的相關係數往往降低，所以最可能小於 .40。這是「其他條件相近」下的通常趨勢，不是資優生分數高就會有較高的相關。","p":"40、58-59"},{"n":108,"q":"老師教導學生應試技巧，在時間不夠且沒有倒扣的情況下，作答選擇題時，要對所有未寫完的題目猜同一個答案「C」 。如果學生皆採此種作法將對測驗結果的信效度有何影響？","o":["提高信度、提高效度","提高信度、降低效度","降低信度、提高效度","降低信度、降低效度"],"a":"B","al":"B（原考題取向）","c":"固定猜答與信效度","e":"本題將一律猜同一選項視為增加反應模式的一致性，因而取 B；但分數混入與真正學習無關的猜答，效度下降。請與「隨機乱猜增加偶然誤差」區分。","p":"46-47、69；補充 S4","x":"固定反應的一致，不等於實證上必然提高測驗信度；實際信度仍須由分數資料與估計方法判斷。此題依原考題的簡化取向解釋。"},{"n":109,"q":"某標準化測驗包含 30 道試題，若再加入 10 題與原測驗性質相似的新編題目，則對該測驗之信度最可能產生何種影響？","o":["信度值將會減少","信度值將會增加","信度值保持不變","信度值無法確定"],"a":"B","al":"B","c":"增加同質題","e":"在品質、施測等條件相近時，增加測量相同特質的題目，可擴大取樣並降低偶然誤差的相對影響，因此信度最可能增加。題數多並非無條件保證；若新題品質差或測到其他能力，效果可能不同。","p":"56、58-59"},{"n":110,"q":"學校的學習評量應該優先重視下列哪一個評量概念？","o":["內容效度","預測效度","同時效度","內在效度"],"a":"A","al":"A","c":"學校學習評量","e":"學校評量首先要確認是否測到原定的教學內容與目標，內容效度最直接。預測效度偏向未來表現；同時效度比較目前效標；內在效度通常指研究中因果推論的可信度，與本題課堂命題的核心不同。","p":"17、38、68"},{"n":111,"q":"下列有關動態評量的敘述，何者錯誤？","o":["強調認知能力的可塑性","著重評量者與幼兒的雙向溝通和互動關係","採取「在教學中評量，在評量中教學」的觀點","認為測驗結果相同的兩位幼兒，其近側發展區亦相同"],"a":"D","al":"D","c":"近側發展區","e":"兩名幼兒目前獨立作答相同，接受協助後可能進步不同，所以近側發展區不一定相同，D 錯。動態評量正是透過互動、提示與教學，了解能力的可塑性及學習潛能；A、B、C 均符合此觀點。","p":"87、100-101"},{"n":112,"q":"有關評量(assessment)與測驗(test)的敘述，下列何者正確？","o":["測驗是評量過程中的一種工具","評量只能使用一種方法，但測驗通常使用多種方法","評量通常是將欲測量的屬性量化，但不涉及比較和判斷","測驗就是評量，目的在提升學生的能力以達到一致的標準"],"a":"A","al":"A","c":"測驗是工具","e":"評量可透過測驗、觀察、訪談、作品等蒐集資料，再加以解釋與判斷；因此測驗是其中一種工具。B 把方法範圍說反；C 把評量縮減為單純量化；D 把兩者完全等同，且誤認所有人的表現都須一致。","p":"2-3、25"},{"n":113,"q":"有關對學習者進行評量的目的，下列敘述何者錯誤？","o":["透過評量結果，讓教師省思課程與教學，做適當的調整","透過評量結果，了解課程實施狀況，比較教師間的教學成效","透過評量蒐集多元資料，以作為教師針對個別學生需求提出轉介之佐證","透過評量結果，讓家長了解學生學習和發展狀況，建立合理的教育期望"],"a":"B","al":"B","c":"評量目的與推論限制","e":"學生評量可協助教師調整教學、提供轉介證據及與家長溝通，但不同班級的學生背景與起點未必相同，不能直接用學生成績比較教師成效，故 B 較不適切。評量結果應依原定目的和證據範圍解釋。","p":"24、28-29、91"},{"n":114,"q":"莊老師指著紙上的圓形、正方形和三角形一一問小華： 「這是什麼形狀？」小華皆搖頭說： 「不知道。」莊老師接著問小華： 「這三個形狀是一樣的嗎？」小華答稱：「不一樣。」於是，莊老師指著圓形告訴小華： 「這是圓形。圓圓的就像你的臉。教室裡還有哪些東西是圓形的？請你找找看。」等小華認識圓形後，莊老師再以相同的方式教導小華認識其他二種圖形。經過數次的教學後，莊老師再指著紙上的三種圖形問小華相同的問題，小華這次都答對了。此種作法較接近下列何種評量方式？","o":["動態評量","檔案評量","追蹤評量","總結性評量"],"a":"A","al":"A","c":"測驗—教學—再測驗","e":"先問形狀名稱，發現困難後提供具體教學與情境連結，再用相同問題檢查進步，符合動態評量的介入模式。檔案評量需要累積資料；追蹤僅表示時間上的後續觀察；總結性也未必包含教學介入。","p":"87、100-101"},{"n":115,"q":"小梅老師想要知道幼兒選擇各學習區的頻率，下列哪一種觀察方式最為適切？","o":["計次表","訪談法","軼事紀錄","評定量表"],"a":"A","al":"A","c":"頻率紀錄","e":"目的是知道各學習區被選擇幾次，計次表能直接累計事件頻率，最適切。訪談是受訪者回述；軼事記錄偏質性事件脈絡；評定量表偏程度或品質。先看要記錄的是次數、持續時間，還是行為品質。","p":"81、87、92-98；觀察補充"},{"n":116,"q":"下列何者是較合適的檔案評量資料？甲、班級通知單                      乙、幼兒表現的觀察記錄丙、幼兒作品及教師的註解            丁、每週課程計畫和課程目標","o":["甲乙","乙丙","甲丁","丙丁"],"a":"B","al":"B","c":"學習檔案的證據","e":"幼兒表現的觀察記錄，以及作品與教師註解，能直接呈現幼兒學習，因此選乙、丙。通知單和課程計畫主要是行政或教學安排，雖可作背景資料，卻不能單憑它們判斷幼兒實際學到什麼。","p":"76、87-88"},{"n":117,"q":"沈老師編了一份數學成就測驗，發現班上學生在此測驗的得分，與其在該縣市的學習能力檢測之數學表現，在班級排名大致相當。代表此測驗具有下列何種效度？","o":["表面效度","內容效度","聚斂效度","效標關聯效度"],"a":"D","al":"D","c":"外部效標比較","e":"自編數學測驗的排序與縣市檢測大致相當，表示與外部數學表現效標有關聯，故 D 最直接。若聚焦同一構念跨工具的一致，也可能提供聚斂證據；本題明示外部檢測作比較，故取效標關聯效度。","p":"37、40-41"},{"n":118,"q":"下列哪一項評量結果屬於標準參照的概念？","o":["期末考全班第三名","通過全民英檢中高級測驗","學校模擬考成績 PR 值 90","大學學科能力測驗社會科四級分"],"a":"B","al":"B","c":"通過能力標準","e":"全民英檢的通過與否，依該級能力標準判定，故 B 最符合標準參照。第三名、PR90 明確是團體相對位置；本題學測級分按其考古題脈絡屬常模分數解釋，不能看到「級」就一律當作精熟標準。","p":"12-14、30"},{"n":119,"q":"有關學習評量，下列敘述何者正確？","o":["適性評量就是真實評量，強調評量情境的擬真","師資生在半年教育實習中進行教學演示，屬於實作評量","動態評量是以皮亞傑的認知發展理論作為基礎，重視實際操作","教師資格考試力求公正減少誤差，以測得真實能力，屬於真實評量"],"a":"B","al":"B","c":"實作與其他評量","e":"教學演示讓師資生實際展現教學行為，屬實作評量。適性評量依能力調整題目，與真實評量不同；動態評量與維果斯基的近側發展區相通；減少誤差、追求公正，也不等於使用真實生活任務。","p":"75-77、87、100"},{"n":120,"q":"東台國小期末考試數學試題的分析結果中，第五題的鑑別度(D)為.09，難度(P)為.51。有關該分析結果的解釋，下列敘述何者最適切？","o":["大部分的學生都答錯這一題","低分組的學生幾乎都答錯了","多數高分組的學生答對此題","鑑別度太低應重新檢討原因"],"a":"D","al":"D","c":"難度適中但鑑別低","e":"D＝.09 表示高低分組答對率只差 9 個百分點，區辨力不足，應檢查題目與答案。由 P＝.51、D＝.09 可得 PH＝.555、PL＝.465；並非大多數全錯或低分組幾乎全錯。最值得處理的品質問題是低鑑別度。","p":"71-74"},{"n":121,"q":"有關效標參照或標準參照測驗的敘述何者為正確？","o":["信度對測驗的重要性很低","以團體平均分數作為比較基準","題目難度為中等偏難","強調效標效度"],"a":"A","al":"A（依講義；須修正理解）","c":"標準參照的信度","e":"講義第 14 頁直接採 A 的說法，故就講義作答取 A。B 是常模比較；C 不是標準參照必然的難度；D 把「效標參照」和「效標關聯效度」混淆。","p":"14、30、38；補充 S1","x":"嚴謹觀念：標準參照仍須重視達標判定的可靠性與分類一致性，不能背成「信度不重要」。同質團體使某些相關式信度係數偏低，也不代表不必檢驗信度。"},{"n":122,"q":"有關「最大表現測驗」與「典型表現測驗」的陳述，以下那一個正確？","o":["成就測驗屬典型表現測驗","興趣測驗屬典型表現測驗","人格測驗屬最大表現測驗","態度量表屬最大表現測驗。"],"a":"B","al":"B","c":"典型表現","e":"興趣測驗了解一個人平常喜歡什麼，屬典型表現。成就測驗要求盡力展現所會的內容，是最大表現；人格與態度則重平常傾向，並非最大表現。典型表現通常沒有單一「能力越高越正確」的答案。","p":"15、61"},{"n":123,"q":"下列哪一個測驗屬於最大表現測驗？","o":["柯氏性格量表","語文性向測驗","職業興趣量表","幼兒人格量表。"],"a":"B","al":"B","c":"最大表現","e":"語文性向測驗要求受試者盡可能表現能力，以推估未來學習潛能，屬最大表現。性格、職業興趣與人格量表則了解平時傾向，屬典型表現。判斷關鍵在「能做得多好」或「通常如何表現」。","p":"7、15、61"},{"n":124,"q":"針對測驗的試題分析，從鑑別度的觀點，下列何者較適切？","o":["幾乎所有學生都答錯的題目，通常具有較高鑑別度","幾乎所有學生都答對的題目，通常具有較高鑑別度","多數教師和學生都覺得難度適中的題目，通常具有較高鑑別度","高分組學生答對率遠高於低分組的題目，通常具有較高鑑別度"],"a":"D","al":"D","c":"鑑別度的定義","e":"高分組答對率遠高於低分組，正是 D＝PH－PL 大且為正，故選 D。幾乎全對或全錯都難區別能力；大家主觀覺得難度適中，也不等於實際高低分組答對率有大差異。","p":"71-74"},{"n":125,"q":"「分數加減」單元的教學目標包括(1)能進行同分母分數加減，(2)能進行異分母分數加減，以及(3)能將分數加減應用於生活情境問題。郭老師針對此單元設計的總結性測驗包含 60%的「同分母分數加減」及 40%的「異分母分數加減」 。從內容效度的觀點來看，下列敘述何者較正確？","o":["內容效度良好，因為題目多集中於基礎計算題，較能提高學生作答表現","內容效度不足，因為試題未能充分涵蓋原定教學目標的主要內容及範圍","內容效度良好，因為只要題目數量夠就能反映學生在此單元的學習成果","內容效度不足，因為學生之間的學習能力不同，作答的成績可能不一致"],"a":"B","al":"B","c":"內容取樣不足","e":"教學目標含生活應用，但測驗 100% 都是同分母或異分母計算，漏掉應用目標，所以內容效度不足。答對率高、題數多都不能補救目標缺漏；學生能力不同則不是內容效度不足的直接理由。","p":"38、68"},{"n":126,"q":"效度是測驗的最重要特徵，有關效度的特性，何者有誤？","o":["效度無法直接測量，但可從其他資料推論","效度的判斷主要是依據測驗方法","效度是程度上的差別，而非全有或全無的問題","效度在使用的目的和情境方面具有特殊性。"],"a":"B","al":"B","c":"效度看分數用途","e":"效度須依證據與理論，判斷分數解釋及使用是否適合，不能主要依「用了哪一種方法」就定論，因此 B 有誤。效度可由不同資料推論，具有程度差別，也受到使用目的與情境限制。","p":"35-38、41"},{"n":127,"q":"以下有關信度的敘述，何者錯誤？","o":["信度係指測量結果的一致性","信度是效度的充分條件","測驗題數越多，信度愈高","再測信度高於複本信度"],"a":"B","al":"B（D 亦不宜視為通則）","c":"信度必要而非充分","e":"B 明確錯誤：信度是效度的必要條件，並非充分條件。A 是信度定義；C 需加上同質、品質相當等前提；D 的重測與複本信度孰高，取決於時間、內容與練習效應，不能保證固定排序。","p":"17、48-56","x":"單選作答可取命題意圖最明確的 B，但本題 D 也過度絕對，宜請授課者確認，複習時勿把它背成定律。"},{"n":128,"q":"如果兒童智商與數學成就測驗分數的積差相關係數 r=.80；則智商對數學學習成就的預測力大約是","o":["40","20","80","60"],"a":"D","al":"D（約 60%；精確 64%）","c":"決定係數","e":"若「預測力」指可解釋變異比例，應算 r²＝.80²＝.64＝64%。四個選項中 60 最接近，故取 D。80 是相關係數的百分化，不是解釋變異量；相關本身也不表示智商單向造成成就。","p":"40","x":"原選項沒有 64，且未標百分比，本版保留原文，解析交代「約值」與單位。"},{"n":129,"q":"有關「建構反應題」(constructed response item)的敘述，下列何者正確？ 甲、擬定評分規準，可以提升建構反應題的評分信度 乙、建構反應題較適用於評量學習結果，不適用於教學歷程 丙、高品質的選擇題屬於建構反應題，可評量學生較高認知層次的學習","o":["只有甲","只有乙","甲丙","乙丙"],"a":"A","al":"A","c":"建構反應題","e":"建構反應須由學生自行產生答案，如短答、申論、作品。明確評分規準可提升評分一致性，甲正確；這類題也能用於教學過程，乙錯；選擇題即使品質高仍屬選答反應，丙錯，因此只有甲。","p":"76、81"},{"n":130,"q":"下列有關信度的敘述何者不正確？","o":["在其他條件相同的情況下，一份測驗的題目愈多，信度愈高","複本延宕的信度係數會比再測信度的係數來的低","團體的異質性小，即每個人的表現大致相同，信度愈低","想要有可比較的測驗應該使用折半信度。"],"a":"D","al":"D","c":"複本與折半","e":"若要兩份測驗具有可比較性，應檢查複本的等值性，折半法檢查的是同一份測驗的內部一致性，因此 D 不正確。A 須在其他條件相同下理解；C 是變異受限的常见影響；B 是延宕複本同時含時間與內容誤差的通常趨勢，非普遍必然。","p":"48-56"},{"n":131,"q":"編製測驗需要雙向細目表作為命題的依據，請問雙向細目表的設計要依據那些資料？甲：教學目標，乙：教學進度，丙：教材內容，丁：學生反應。","o":["甲乙","甲丙","乙丁","丙丁"],"a":"B","al":"B","c":"雙向細目表兩軸","e":"兩個核心向度是「教學目標／認知層次」與「教材內容」，故選甲、丙。進度可協助界定考試範圍，學生反應可供教學調整，但都不是双向細目表的兩個主要分類軸。","p":"38、61-68"},{"n":132,"q":"下列有關教學評量的敘述，哪些是正確的？甲、評量若要強調實際生活的表現，建議採用實作評量乙、為了能看到學習歷程與省思活動，可以使用檔案評量丙、為了強化溝通與合作能力，可以透過分組進行實作評量丁、為了瞭解學生學習的個別差異，最好使用難度偏易的測驗","o":["只有甲","甲乙","甲乙丙","甲乙丙丁"],"a":"C","al":"C","c":"評量方式與目的","e":"實作可呈現生活表現、合作與溝通；檔案可呈現歷程與省思，故甲乙丙正確。若要了解個別差異，應用有適當鑑別力的題目；過易可能出現天花板效應，因此丁不當，選 C。","p":"75-88、71-74"},{"n":133,"q":"林同學數學考 84 分，T 分數為 40；英文考 92 分，百分等級為 16，請問下列敘述何者正確？","o":["英文較數學好","英文較數學差","兩科表現一樣，都很差","兩科表現一樣，尚可"],"a":"","al":"待釐清（C／D 評價未定義）","c":"相對位置與用語","e":"數學 T40 對應 z＝-1；常態下英文 PR16 也約對應 z＝-1，因此可以確定兩科的相對位置約相同，均低於平均 1 SD。A、B 不合；C、D 都寫「兩科表現一樣」，差別只有「很差／尚可」的評語。","p":"32-33、91","x":"題幹及對照講義未界定「很差」與「尚可」的分界，無法僅憑數字嚴謹選出 C 或 D。宜暫不計分；複習重點是兩科相對位置相同，不是用原始分數 84、92 比高低。"},{"n":134,"q":"就教育測驗而言，下列那一種題型的信度較高？","o":["填充題","選擇題","是非題","申論題"],"a":"B","al":"B（一般命題條件）","c":"題型與信度","e":"在一般有限測驗時間內，選擇題常能兼顧較多題數、廣泛取樣與客觀計分，故通常取 B。是非題猜對率較高；申論題題數少且較受評分者影響；填充題可能有多種合理答案。實際信度仍由題目品質與施測資料決定。","p":"56、69、81"},{"n":135,"q":"阿德的國語文成績很好，教師批閱他的作文時總是傾向給較高的分數。這是屬於下列何種現象？","o":["月暈效應(halo effect)","蝴蝶效應(butterfly effect)","回沖效應(washback effect)","比馬龍效應(Pygmalion effect"],"a":"A","al":"A","c":"月暈效應","e":"教師原先認為阿德國文好，這個整體印象使他在批閱此次作文時給較高分，是月暈效應。比馬龍是期待影響學生後續表現；回沖效應是考試影響教學與學習；蝴蝶效應不是本題的評分偏誤。","p":"54、57"},{"n":136,"q":"下列哪種評量方式最適合應用於「情意教學」？","o":["實作評量","口頭評量","紙筆測驗","軼事記錄法"],"a":"D","al":"D（本題較佳）","c":"情意行為觀察","e":"情意包含態度、價值與動機，軼事記錄能在自然情境累積具體行為及脈絡，較能避免只看學生口頭說法或紙筆答案，因此本題選 D。情意仍可用量表、訪談或實作等多種方法，並非只有軼事記錄才適用。","p":"87、89-90、96"},{"n":138,"q":"下列何者不是檔案評量的特色？","o":["允許學生參與","可分享學習成就","適應個別化目標","兼具信、效度"],"a":"D","al":"D","c":"檔案評量的限制","e":"學生參與、分享成果及配合個別目標，是檔案評量常見特色；但信度與效度須靠取樣、規準及評分品質建立，不能保證天然兼具，故 D 不是必然特色。不要把「有助完整理解學生」直接等同「信效度一定高」。","p":"84-88"},{"n":139,"q":"對於檔案評量(portfolio assessment)的敘述，下列何者為非？","o":["可呈現個別學生的學習成長過程","多採常模參照的評分方式","強調與教學密切配合","給予學生許多自我評鑑的機會。"],"a":"B","al":"B","c":"檔案評量的參照","e":"檔案評量通常著重個人進步、目標達成及反思，不以人際排名的常模參照為主要方式，所以 B 為非。呈現成長、與教學結合、學生自評都是重要特色；若確有競賽用途，也可另作排名，但不是核心理念。","p":"85-88"},{"n":140,"q":"檔案評量的特質與輔導活動的學習歷程頗為吻合，值得多加使用。但下列哪一個做法較無法提高學生製作檔案的品質？","o":["提高家長參與意願，以及激勵學生製作檔案動機","教師先行擬定檔案目標與設計重點，再讓學生依序製作","定期檢核學生檔案資料的蒐集情形","定期與家長就檔案內容溝通學生學習情形，並研擬協助策略。"],"a":"B","al":"B","c":"學生參與檔案規劃","e":"檔案評量重視學生參與目標、選材與省思；由教師先全盤決定，再讓學生依序完成，較削弱主體性，所以 B 較不利。家長參與、定期檢核與溝通，都有助持續蒐集有意義的學習證據。","p":"86-88"},{"n":141,"q":"下列何者為實作評量效度的誤差來源？","o":["擴散效應","月暈效果","霍桑效應","比馬龍效應"],"a":"B","al":"B","c":"月暈造成評分偏誤","e":"月暈效果使評分受既有整體印象影響，而不是依本次實作表現，因而引入無關因素，威脅效度。擴散、霍桑及比馬龍多用來描述處理、被觀察或期待所造成的行為變化；本題以評分偏誤的 B 最直接。","p":"54、57、84"},{"n":142,"q":"下列有關實作評量的描述何者正確？","o":["學生必須獨立完成","題目結構性佳","直接判斷表現的評量","要求一致性的結果"],"a":"C","al":"C","c":"直接判斷表現","e":"實作評量讓學生操作、展演或製作作品，評分者直接觀察其表現，故選 C。它可以個人或合作完成；題目可有不同結構程度；也容許多種合理解法或作品，不要求全部結果一致。","p":"76-80、87"},{"n":143,"q":"下列有關動態評量(dynamic evaluation)的敘述，何者正確？","o":["重視學生的學習結果","各次評量都是彼此獨立的","強調問題解決的過程","能做為學生編班的依據"],"a":"C","al":"C","c":"動態評量的過程","e":"動態評量透過提示、互動與教學，觀察學生如何解決問題及產生改變，因此 C 正確。它不只重最後結果，也不把各次評量視為完全獨立；單純編班不是此題最能代表動態評量的核心功能。","p":"87、100-101"},{"n":144,"q":"動態評量中之運用，下列說明何者為非","o":["動態評量過程中，包括「測驗—教學—測驗」的連續運用","動態評量過程中，受試者和施測者會有大量的互動過程","動態評量過程中，理想的實施方式以團體施測為主","動態評量之互動的過程，是歷程、診斷也是協助。"],"a":"C","al":"C","c":"個別化互動","e":"動態評量依學生需求調整提示與協助，常需深入的個別互動，因此不能把「以團體施測為主」當理想通則，C 為非。A、B、D 描述測驗—教學—再測驗、互動及協助的連續歷程，均切合其精神。","p":"100-101"},{"n":145,"q":"下列針對「生態評量」(ecological assessment)，何者是不正確的敘述？","o":["是一種非正式的評量","是一種正式的評量","在於評量個體與環境需要之間的關係","主要目的為找出學生在各種場所生活需要的功能或活動"],"a":"B","al":"B","c":"生態評量","e":"生態評量從家庭、學校、社區等自然情境，分析環境要求與個人技能之間的差距，通常屬非正式、個別化評量，因此 B 不正確。它可很有系統，但「有系統」不等於「標準化正式測驗」。","p":"99"},{"n":146,"q":"發展英語聽力測驗時，由台南市國中三年級學生隨機抽取的 1000 名學生所建立的常模，是屬於下列哪一種常模？","o":["全國性常模","地區性常模","特殊團體常模","學校常模"],"a":"B","al":"B","c":"地區性常模","e":"取樣範圍是台南市國三學生，建立的是特定地區的常模，所以 B 正確。全國常模需有全國代表性樣本；學校常模只代表單校；特殊團體常模則針對具特定身分或特徵的團體。","p":"34"},{"n":147,"q":"有關效標參照或標準參照測驗的敘述何者為正確？","o":["信度對測驗的重要性很低","以團體平均分數作為比較基準","題目難度為中等偏難","強調效標效度"],"a":"A","al":"A（依講義；須修正理解）","c":"標準參照的信度","e":"講義第 14 頁直接採 A 的說法，故就講義作答取 A。B 是常模比較；C 不是標準參照必然的難度；D 把「效標參照」和「效標關聯效度」混淆。","p":"14、30、38；補充 S1","x":"嚴謹觀念：標準參照仍須重視達標判定的可靠性與分類一致性，不能背成「信度不重要」。同質團體使某些相關式信度係數偏低，也不代表不必檢驗信度。"},{"n":148,"q":"下列何者是常模參照和標準參照測驗的主要區分依據？","o":["答案計分的方式","作答反應的形式","測驗實施的安排","測驗結果的解釋"],"a":"D","al":"D","c":"解釋方式的差異","e":"同一份測驗可以用團體排名，也可以用固定達標標準解釋；兩者主要差別在「分數拿來與誰／什麼比較」，故選 D。選擇題或實作題、計分方式、施測時間，都不是唯一的分類依據。","p":"12-14、30"},{"n":149,"q":"趙老師打算在閱讀與寫作課讓學生製作學習檔案，以提升其語文能力與興趣。有關學習檔案的規劃與實施，下列做法何者較不適切？","o":["檔案的內容由教師決定，以利檔案的實施與評分","事先對學生與家長等相關人士，溝通檔案的目的與目標","安排學生定期自我評量與省思，檢視成果並訂定下一步計畫","安排同儕評量活動，讓學生展示個人檔案，彼此觀摩與回饋"],"a":"A","al":"A","c":"共同規劃檔案","e":"內容完全由教師決定，會限制學生選材、自我評量與學習責任，故 A 較不適切。事先溝通目的、定期反思以及同儕觀摩回饋，都有助提升檔案品質。教師可提供結構與規準，但應保留學生參與。","p":"86-88"},{"n":150,"q":"估計測驗信度的各種方法中，哪一種最容易受練習和記憶的影響？","o":["折半方法","庫李方法","評分者方法","複本方法"],"a":"D","al":"D（現有選項中較佳）","c":"練習與記憶影響","e":"複本法通常須做兩份相似題本，前次經驗可能影響後次表現；折半、庫李通常只施測一次，評分者法則比較評分，因此四項中取 D。","p":"48-55","x":"最典型、最容易受相同題目記憶影響的是「重測法」，卻未列入選項。請勿把本題背成「複本法一定比重測法更受記憶影響」。"},{"n":151,"q":"以折半法估計信度，是為了顯示信度測量的哪一種性質？","o":["穩定性","等值性","一致性","正確性"],"a":"C","al":"C","c":"折半信度","e":"同一份測驗分成兩半，比較兩半分數的一致程度，屬內部一致性，故選 C。穩定性主要對應重測；等值性主要對應兩份複本；正確性則較接近效度。估計整份測驗信度時通常還須作長度校正。","p":"51-52、55"},{"n":152,"q":"下列哪一種信度所計算出來的係數，又可稱為「穩定係數」？","o":["複本信度","折半信度","庫李信度","再測信度"],"a":"D","al":"D","c":"穩定係數","e":"再測信度是同一測驗跨兩個時間點的相關，所以又稱穩定係數。複本立即信度是等值係數；延宕複本涉及穩定與等值；折半、庫李均主要表示內部一致性。","p":"48-50、55"},{"n":153,"q":"某教師自編數學科測驗 20 題，信度係數.50，如果該學科測驗再增加 40 題，信度係數變成多少？","o":["0.55","0.65","0.75","0.85"],"a":"C","al":"C","c":"斯皮爾曼—布朗公式","e":"原有 20 題，再增加 40 題，總數為 60，因此倍數 k＝60／20＝3。新信度 r新＝kr舊／[1＋(k－1)r舊]＝3×.50／[1＋2×.50]＝.75，選 C。最常見錯誤是把「增加 40」讀成「總共 40」。","p":"56、59；公式補充"},{"n":154,"q":"如果一份包含 40 個題目的測驗，其信度為 0.70；若欲將其信度提高為 0.78，則新的測驗將會有幾題？","o":["20","40","60","80"],"a":"C","al":"C（約 60 題）","c":"由目標信度求題數","e":"k＝r新(1－r舊)／[r舊(1－r新)]＝.78×.30／(.70×.22)≈1.5195；新題數≈40×1.5195＝60.78。原選項以約數取 60，故 C。60 題的信度約 .7778，四捨五入為 .78。","p":"56、59；公式補充","x":"若題意要求「未四捨五入前至少達 .7800」，應向上取 61 題，原選項未提供；本題按一般約值作答。"},{"n":155,"q":"教師實施學科成就測驗，藉以確定學生目前的學科成就水準，欲達到此目的，所必須關心的效度是","o":["效標效度","構念效度","同時效度","內容效度。"],"a":"D","al":"D","c":"成就測驗與內容效度","e":"要知道學生目前的學科成就，題目須代表教過的内容與學習目標，因此內容效度最關鍵。效標／同時效度還須其他外部表現比較；構念效度則著重理論特質。題幹只提供學科目標判斷，故 D 最直接。","p":"38、68"},{"n":156,"q":"學校編製段考測驗卷時，請其他科任教師評斷試題是否合適，係為了增加下列何種效度","o":["預測效度","內容效度","建構效度","同時效度。"],"a":"B","al":"B","c":"專家審題","e":"請熟悉該學科的教師檢查題目是否合適、是否涵蓋目標與內容，是內容效度的專家判斷。它不是預測未來表現，也未和同時取得的外部效標求相關；所以不是預測或同時效度。","p":"38、68"},{"n":157,"q":"下列何者最能反映成就測驗的內容效度？","o":["測驗與學校成績的相關為 0.60","測量標準誤為 5","測驗的題目與測驗總分有高相關","測驗題目反應課程教學目標有關"],"a":"D","al":"D","c":"內容與目標相符","e":"內容效度最直接的證據是題目能否反映課程教學目標，因此選 D。A 是與外部成績的關聯；B 的 SEM 反映測量誤差；C 的題目—總分相關較關乎內部結構或鑑別，不等於內容範圍完整。","p":"38、68"},{"n":158,"q":"「為了建立工作職能量表的效度，蒐集受試者在工作滿足、生理壓力以及組織承諾的表現資料，以決定工作滿足、生理壓力及組織承諾是否能由工作職能量表上的分數來預測」 。上述情境說明的是何種效度的建立？","o":["效標關聯效度","構念效度","內容效度","專家效度"],"a":"A","al":"A","c":"效標關聯效度","e":"以工作滿足、生理壓力、組織承諾等外部表現，檢查量表分數能否預測它們，最直接是效標關聯效度。題幹沒有交代效標取得時點，故不再逕分同時或預測；也不是只請專家看內容或單看題目代表性。","p":"37、40-41"},{"n":159,"q":"人格測驗重視何種效度","o":["同時效度","內容效度","建構效度","預測效度。"],"a":"C","al":"C","c":"人格構念","e":"人格是抽象的心理構念，須由理論、題目結構及與其他變項的關係支持其意義，因此本題選建構效度。人格測驗也可有內容或效標證據，但不能只憑看起來像人格題，或某一外部相關，就完整確立效度。","p":"37、59"},{"n":160,"q":"老師欲對學生的書法、圖畫作品進行評量，以下哪一評量工具最適合？","o":["軼事紀錄","評定量表","檢核表","紙筆測驗。"],"a":"B","al":"B","c":"評定量表","e":"書法、圖畫的品質往往有程度差異，評定量表可依構圖、筆法等面向分級，最適切。檢核表偏「有／無」；軼事記錄描述事件脈絡；紙筆測驗則不能直接取代對作品品質的評定。","p":"81-82"},{"n":161,"q":"依據學生在前一個試題是否答對來選答下一道試題，這種測驗稱之為：","o":["適性測驗","標準化測驗","速度測驗","難度測驗"],"a":"A","al":"A","c":"適性測驗","e":"依前一題是否答對，調整下一題的難度或選題，使題目更貼近受試者能力，稱適性測驗。標準化強調程序一致；速度測驗重完成速度；「難度測驗」不是這種逐題調整程序的名稱。","p":"6、25；適性測驗補充"},{"n":162,"q":"王老師為自然科老師，他在命自然試卷之前先要做一份命題計畫，即設計雙向細目表，他要設計雙向細目表時，下列那一個敘述是錯誤的？","o":["試題要兼顧教學目標和課程內容","各單元在整份試題所佔的比例要大致均衡","各教學目標的認知層次所佔的比例要相等","在教學目標與課程內容交叉的部分細格中所分配的比例可以是 0"],"a":"C","al":"C","c":"細目表權重","e":"各認知層次的比例應依目標重要性、教學重點等決定，不必一律相等，因此 C 最明確錯誤。內容與目標須兼顧；不適用的交叉格可為 0。B 的「大致均衡」也應理解為合理代表各單元，而非每單元機械式平均分配。","p":"38、61-68"},{"n":163,"q":"進行試題分析時，有關難度(P)與鑑別度(D)的解釋，及二者間之關係，下列敘述何者正確？","o":["難度與鑑別度兩者並無相關","鑑別度出現負值，代表題目太過容易","難度越趨近於 0，鑑別度亦趨近於 0","難度越趨近於 1，鑑別度亦趨近於 1"],"a":"C","al":"C","c":"極端難度與鑑別","e":"P 越接近 0，表示幾乎沒人答對，高低分組答對率都接近 0，兩者差值也只能接近 0，所以 C 正確。同理 P 越接近 1，D 也受限；負 D 表示低分組反而答對較多，不能直接解讀為太容易。","p":"71-74"},{"n":164,"q":"心理測驗中「鑑別度」的概念，以下哪一選項的文字較正確？","o":["題目愈簡單，鑑別度愈低","測驗題目能夠區分出高下的程度","鑑別度愈低，鑑別指數愈高","試題答對人數與答錯人數的百分比"],"a":"B","al":"B","c":"鑑別度意義","e":"鑑別度衡量題目區分不同能力／成就受試者的程度，故選 B。越簡單不一定一路越低，須看實際答對率分布；C 的指數方向自相矛盾；D 只比較答對與答錯總數，沒有比較高低分組。","p":"74"},{"n":165,"q":"下列有關試題鑑別度的敘述何者是正確的？","o":["鑑別度指數是介於-1 到+1 之間","試題鑑別度是指該試題學生通過的比例","試題難度越高，越具有鑑別度","試題難度越低，越具有鑑別度"],"a":"A","al":"A","c":"D 的範圍","e":"PH、PL 均介於 0 和 1，因此 D＝PH－PL 的範圍為 -1 至 +1，A 正確。全體通過比例是難度 P，不是 D；題目越難或越易也不保證越能區分能力，兩端極端難度通常反而限制 D。","p":"71-74"},{"n":166,"q":"測驗偏差(test bias)會導致測驗的公平性遭到質疑，下列對於測驗偏差的敘述何者錯誤？","o":["測驗會導致偏差是能力相同但來自不同群體的個人，在某份測驗上答對試題的機率不一樣","測驗在編製的過程、實施和解釋時都有可能造成偏差","偏差可能來自於文化、種族、語言、性別和社經地位","改變社會環境就可以消弭測驗偏差"],"a":"D","al":"D","c":"測驗公平性","e":"測驗偏差可能出現在編製、施測與解釋，也可能涉及文化或語言等無關因素；只改變社會環境無法保證消弭，故 D 錯。A 在傳統題意上描述相同能力者的群體差異；嚴謹上，差異試題功能仍須进一步審查，才判定是否為不公平偏差。","p":"24、47、58-59、91"},{"n":167,"q":"王老師持續且客觀描述發生在曉華小朋友身邊具有觀察價值的事件，王老師採用的教學評鑑方法是","o":["表現技術","問卷調查","軼事記錄","檢核表。"],"a":"C","al":"C","c":"軼事記錄","e":"對具有觀察價值的具體事件，以客觀敘述記錄情境、行為與反應，屬軼事記錄。問卷靠填答取得資料；檢核表按預定項目勾選有無。記錄時應先描述可觀察事實，再另列解釋，避免把猜測當事實。","p":"87、92-96"},{"n":168,"q":"下列何者不是檔案評量的特色？","o":["允許學生參與","可分享學習成就","適應個別化目標","兼具信、效度"],"a":"D","al":"D","c":"檔案評量的限制","e":"學生參與、分享成果及配合個別目標，是檔案評量常見特色；但信度與效度須靠取樣、規準及評分品質建立，不能保證天然兼具，故 D 不是必然特色。不要把「有助完整理解學生」直接等同「信效度一定高」。","p":"84-88"},{"n":169,"q":"檔案評量、實作評量等另類評量(alternative assessment)目前頗受重視，試問下列何者不是另類評量興起的原因？","o":["認知心理學的興起","傳統評量呈現諸多缺失","標準化測驗窄化教學方向","可以提高評量的信度"],"a":"D","al":"D","c":"另類評量興起","e":"認知研究強調思考歷程，傳統測驗亦有窄化教學、忽略真實應用等限制，因此另類評量興起。信度則常是實作／檔案評量需要努力處理的問題，不能保證提高，故 D 不是主要興起理由。","p":"25-27、75、78、84"},{"n":170,"q":"下列何者不是有關「檔案評量」的主要理念？","o":["是實作評量的方式之ㄧ","強調找出學生的優點","以富創意的方式來呈現學習成長的歷程","容易配合全班教學目標實施評量。"],"a":"D","al":"D","c":"檔案評量理念","e":"檔案評量重個別成長、學生優勢與反思，需要持續選材及回饋，並不以「容易配合全班統一目標」為主要理念，故選 D。它可以是實作評量的一種形式，也可以有共同目標，但仍須保留個別化與多元證據。","p":"85-88"},{"n":171,"q":"檔案評量方式的內容及應用相當多元，其主要特徵為","o":["其主要目的為評比學生的學習表現","強調在實驗情境中進行","重視個別差異現象以調整評量過程與方式","著重時間點的取樣而非持續性的過程。"],"a":"C","al":"C","c":"個別化與持續性","e":"檔案評量會考慮學生差異，調整內容、資料型態與評量方式，因此 C 正確。它主要呈現努力、進步與成就，不只排名；不限定實驗情境；強調一段時間的累積，而非單一時間點取樣。","p":"86-88"},{"n":172,"q":"檔案評量的特質與輔導活動的學習歷程頗為吻合，值得多加使用。但下列哪一個做法較無法提高學生製作檔案的品質？","o":["提高家長參與意願，以及激勵學生製作檔案動機","教師先行擬定檔案目標與設計重點，再讓學生依序製作","定期檢核學生檔案資料的蒐集情形","定期與家長就檔案內容溝通學生學習情形，並研擬協助策略。"],"a":"B","al":"B","c":"學生參與檔案規劃","e":"檔案評量重視學生參與目標、選材與省思；由教師先全盤決定，再讓學生依序完成，較削弱主體性，所以 B 較不利。家長參與、定期檢核與溝通，都有助持續蒐集有意義的學習證據。","p":"86-88"},{"n":173,"q":"實作評量(performance assessment)能測出認知領域的能力，其中「表現事實、概念、原則和通則，與其彼此間的關連性」是較屬於下列何者？","o":["敘述性知識(declarative knowledge)","程序性知識(procedural knowledge)","認知策略(cognitive strategies)","後設認知策略(metacognitivestrategies)"],"a":"A","al":"A","c":"敘述性知識","e":"事實、概念、原則、通則及其關係，主要是「知道是什麼」，屬敘述性／陳述性知識。程序性知識是「知道怎麼做」；認知策略是處理資訊與解題方法；後設認知策略則監控、調整自己的思考過程。","p":"64-67、75-76；知識分類補充"},{"n":174,"q":"針對實作評量，以下哪一陳述較正確？","o":["可節省人力、時間與金錢","測驗情境易控制","可同時評量認知與技能方面的目標","易受語文能力的干擾"],"a":"C","al":"C","c":"實作的多向度性","e":"操作、展演或作品能同時呈現知識理解與技能運用，故 C 正確。實作常耗時、需人力及較複雜評分；情境不一定容易控制；是否受語文干擾則取決於任務設計，不能當作共同主要特徵。","p":"75-84"},{"n":175,"q":"李老師想要教導特教學校學生打電話的技巧，他要求學生打一通電話給老師，並從中評定學生的表現。李老師用的是下列哪 一種評量方法？","o":["檔案評量","動態評量","功能性評量","真實評量"],"a":"D","al":"D","c":"真實生活任務","e":"直接讓學生打一通電話，觀察能否在實際任務運用所學，最符合真實評量。題幹未呈現前測—介入—後測，所以不是動態；也未蒐集長期作品。功能性評量可關注生活技能需求，但本題最直接線索是實際打電話的表現。","p":"77、87、99"},{"n":176,"q":"下列有關動態評量(dynamic evaluation)的敘述，何者正確？","o":["重視學生的學習結果","各次評量都是彼此獨立的","強調問題解決的過程","能做為學生編班的依據"],"a":"C","al":"C","c":"動態評量的過程","e":"動態評量透過提示、互動與教學，觀察學生如何解決問題及產生改變，因此 C 正確。它不只重最後結果，也不把各次評量視為完全獨立；單純編班不是此題最能代表動態評量的核心功能。","p":"87、100-101"},{"n":177,"q":"以動態評量來評量學生的能力，請問以下敘述何者正確？","o":["必須採用標準化的提示","強調學習結果的評量","屬於效標參照評量","能將測驗的結果和教學緊密結合。"],"a":"D","al":"D","c":"評量與教學結合","e":"動態評量透過提示、示範等介入，檢查學生如何學會，故 D 正確。提示可以標準化，也可以依個別需求調整，A 的「必須」過強；它重歷程與潛能，不只結果；也不能直接把它等同效標參照分類。","p":"87、100-101"},{"n":178,"q":"陳老師開設「科學閱讀」的選修課程，該課程的學期成績評量包括閱讀反思(占 30%)、小組辯論(占 30%)、專題報告與發表(占 40%)。陳老師的評量方式較屬於下列何者？","o":["動態評量","實作評量","適性評量","診斷性評量"],"a":"B","al":"B","c":"實作評量的形式","e":"閱讀反思是建構反應，小組辯論是口語表現，專題報告與發表是作品和展演，均屬實作評量。配分多元不等於適性；題幹未呈現動態介入或針對困難原因作診斷，故 B 最合適。","p":"75-82"},{"n":179,"q":"為瞭解學生的學習成效，素養導向的評量設計應與核心素養、學習重點及學習目標具有對應性。此項做法較強調評量的何種概念？","o":["重測信度","外在效度","內容效度","內部一致性信度"],"a":"C","al":"C","c":"素養與目標對應","e":"評量設計與核心素養、學習重點、目標相互對應，重點是測驗内容是否涵蓋應評量的學習，也就是內容效度。重測和內部一致性是信度；外在效度多指研究結果能否推論至其他情境。","p":"38、68"},{"n":180,"q":"進行信度估計時，增加量表/測驗的題目數，通常可以提升此量表/測驗的信度。有關此一做法可以提高信度的原因，下列敘述何者較不適切？","o":["增加的題目與原試題具有同質性","題目數多，可增加答對的題數使分數較高","題目數多，可提升測驗範圍內容的涵蓋度","題目數多，分數較不易受猜題等機遇因素所影響"],"a":"B","al":"B","c":"增加題數的作用","e":"增加同質且品質良好的題目，可擴大取樣、減少猜測等偶然因素的相對影響；「答對題數變多、總分變高」卻不是信度提高的原因，所以 B 不適切。信度談的是測量一致性，不是分數高低。","p":"56、58-59"},{"n":181,"q":"白雲國中小在自治市長選舉前，先讓學生認識選舉權的來源、什麼是選舉權，再讓學生從領票、圈票、投票及開票的歷程，模擬自治市長選舉的流程。此過程涉及知識向度的哪些類型？","o":["事實性知識、概念性知識、程序性知識","事實性知識、概念性知識、後設認知知識","事實性知識、程序性知識、後設認知知識","概念性知識、程序性知識、後設認知知識"],"a":"A","al":"A","c":"知識向度","e":"認識選舉權的來源涉及事實知識，理解選舉權概念涉及概念知識，實際經歷領票到開票的順序涉及程序知識，因此選 A。題幹未強調學生監控自己的認知策略或反思學習，故不以後設認知知識為主。","p":"64-67"},{"n":182,"q":"此表為選擇題高、低分組作答人數的資料，下列敘述何者正確？組別選項A B* C D 未作答高分組 5 6 4 3 0低分組 5 5 4 5 1*為正確答案","o":["難度= .29、鑑別度= .03","難度= .33、鑑別度= .08","此題之鑑別度低，無法有效區分高低能力的學生","選項 A 與選項 B 的回答人數相近，顯示答案應有爭議"],"a":"C","al":"C","c":"組數不等的 P 與 D","e":"高分組總數為 18，低分組含未作答共 20；PH＝6／18≈.333，PL＝5／20＝.25。兩組平均 P≈.292，D≈.083，故 A、B 各有一個數值錯，C 的低鑑別度判斷正確。兩選項人數接近不能直接證明答案有爭議。","p":"71-74","x":"若用全體答對率，P＝11／38≈.289，仍約 .29；低分組的未作答也須算在分母。"},{"n":183,"q":"下列何者最符合標準參照評量的意涵？","o":["馬拉松比賽得冠軍","通過機車駕照考試","通過研究所入學考試","通過縣市的教師甄試"],"a":"B","al":"B","c":"達標與競爭錄取","e":"機車駕照考試按固定要求判定是否通過，屬標準參照。馬拉松冠軍、研究所入學及教師甄試在本題的競爭錄取脈絡中，重相互比較與名額限制。不要只看到「通過」兩字就選，應看通過依據。","p":"12-14、30"},{"n":184,"q":"教師可以用哪些方式來進行形成性評量？甲、隨堂小考  乙、作業   丙、課堂問答 丁、期末考","o":["甲乙丙","甲乙丁","甲丙丁","乙丙丁"],"a":"A","al":"A","c":"形成性評量方式","e":"隨堂小考、作業與課堂問答都可蒐集當下學習證據、據以調整教學，故甲乙丙較合題意。期末考通常主要統整學期成績，因此本題排除丁。實際上形成性與否取決於結果用途，不單由工具或時間名稱決定。","p":"29"},{"n":185,"q":"為瞭解學生的學習成效，素養導向的評量設計應與核心素養、學習重點及學習目標具有對應性。就評量的概念而言，此項做法較強調評量的何種概念？","o":["重測信度","外在效度","內容效度","內部一致性信度"],"a":"C","al":"C","c":"素養與目標對應","e":"評量設計與核心素養、學習重點、目標相互對應，重點是測驗内容是否涵蓋應評量的學習，也就是內容效度。重測和內部一致性是信度；外在效度多指研究結果能否推論至其他情境。","p":"38、68"},{"n":186,"q":"郭老師在進行鄉野踏查單元時，請學生帶著平板，透過拍照、訪談來記錄該研究區域；之後以小組為單位，製作該區域的導覽影片；爾後，每組將上述資料彙整為一個檔案，上傳至雲端；最後，郭老師再依據評分規準對檔案進行評量。郭老師的評量方式最符合下列何種取向？","o":["評量即學習(assessment as learning)","學習中的評量(assessment in learning)","對學習的評量(assessment of learning)","為了學習的評量(assessment for learning)"],"a":"C","al":"C","c":"對學習的評量","e":"情境最後由教師依規準評定已完成的檔案，主要判斷學習成果，最接近 assessment of learning。若以證據回饋並調整教學是 for learning；若由學生自我監控與反思則是 as learning。使用檔案或數位工具本身不決定取向。","p":"29、85-88；補充 S5"},{"n":187,"q":"在進行實驗時，某位學生使用了一把已經「零點偏移」的電子天平來多次測量同一個砝碼的質量，結果每一次的測量值都比實際質量多出相同的數值。請問，這種誤差最主要屬於哪一種類型？","o":["樣本誤差(Sampling Error)","隨機誤差(Random Error)","系統誤差(SystematicError)","操作性誤差(Operational Error)"],"a":"C","al":"C","c":"固定零點偏移","e":"同一砝碼每次都被多報相同數值，是固定、同方向的系統誤差。反覆測量可能十分一致，卻仍不準確。抽樣誤差來自樣本與母群體差異；隨機誤差不具固定規律；本題未描述偶發操作失誤。","p":"46-47"},{"n":188,"q":"某學者指出，A 測驗具備「建構效度」 。關於A 測驗的設計，下列哪一項敘述最能反映建構效度的特徵？","o":["測驗題目文字簡明、語意清楚且結構嚴謹","測驗題目全都根據課程大綱及雙向細目表編寫","測驗表面看來與欲測量的特質有關，容易被受試者接受","測驗內容依據相關理論架構設計，能有效測量所欲評估的心理特質"],"a":"D","al":"D","c":"理論架構與構念","e":"依相關理論架構設計，並能反映欲評估的心理特質，最直接是建構效度。A 偏題目文字品質；B 偏內容效度；C 偏表面效度。建構效度還須相應證據支持，不能僅宣稱依據理論就視為已充分證明。","p":"37-38、59"},{"n":189,"q":"為瞭解學生的學習成效，素養導向的評量設計應與核心素養、學習重點及學習目標具有對應性。此項做法較強調評量的何種概念？","o":["重測信度","外在效度","內容效度","內部一致性信度"],"a":"C","al":"C","c":"素養與目標對應","e":"評量設計與核心素養、學習重點、目標相互對應，重點是測驗内容是否涵蓋應評量的學習，也就是內容效度。重測和內部一致性是信度；外在效度多指研究結果能否推論至其他情境。","p":"38、68"},{"n":190,"q":"張老師編製了兩份內容相似的英文測驗，分別讓學生作答，並比較兩次測驗分數的相關性。請問這是哪一種信度評估方式？","o":["折半信度","再測信度","複本信度","評分者信度"],"a":"C","al":"C","c":"複本信度","e":"兩份內容等同／相近的題本，比較其分數相關，屬複本信度。重測用同一題本跨時間；折半把同一題本拆半；評分者信度比較評分者。實際上「相似」還須檢查內容、難度及測量特質是否足夠等值。","p":"48-55"},{"n":191,"q":"某國中打算評估學生的英語能力，以決定是否要在暑假開設額外的英語加強班。目前有兩種方式可以選擇：方式一是使用一套由教育部門統一編製、有著嚴格施測與評分標準的英語能力測驗；方式二是由該國中的英語教師自行設計一份英語考卷，在各自的班上施測，評分方式也由各教師自行決定。請問，上述哪種方式屬於標準化測驗？","o":["方式一","方式二","兩種方式都是","兩種方式都不是"],"a":"A","al":"A","c":"標準化程序","e":"方式一有統一編製及嚴格施測、評分標準，符合標準化測驗；方式二由各教師自訂題目與施評方式，屬非標準化自編測驗。判斷重點在程序規範的一致性，不是只看施測人數或主辦單位名稱。","p":"9-11"},{"n":192,"q":"有關檔案評估(portfolio assessment)的敘述，下列何者正確？","o":["較適用於發展正常的幼兒","屬於形成性評估，而非總結性評估","常用於比較個別幼兒與其他幼兒的表現","可評估個別幼兒的認知、技能發展與學習風格"],"a":"D","al":"D","c":"檔案評量的範圍","e":"長期蒐集作品、觀察及反思，可了解幼兒認知、技能與學習特徵，因此 D 正確。檔案可用於不同發展需求的幼兒，也可有形成性或總結性用途；重個人進步與目標，不以人際比較為主要特徵。","p":"85-88"},{"n":193,"q":"李老師設計了一份包含20題的數學測驗，並將同一份測驗在相隔兩週後，對同一班級的學生重複施測。李老師將兩次測驗的總分進行皮爾森積差相關分析，得到相關係數為0.85。根據上述情境，下列哪一項最正確地描述這份數學測驗信度的計算方式？","o":["這是利用內部一致性信度的計算方法","這是利用評分者間一致性信度的計算方法","這是利用重測信度的計算方法","這是利用折半信度的計算方法"],"a":"C","al":"C","c":"重測信度計算","e":"同一班、同一份 20 題測驗，隔兩週再施測，求兩次總分的相關 .85，即重測信度。不是把題目相互比較的內部一致性，也不是比較不同評分者或兩半測驗。解釋 .85 時仍須留意練習與記憶效應。","p":"48-49、55"},{"n":194,"q":"王老師為了更準確地評估學生的英文閱讀能力，設計了一份20題的英文閱讀測驗。後來，王老師考慮是否要把題目數量增加到40題，希望以此提升測驗的信度。在討論這個決定時，幾位老師提出了不同的理由，說明為什麼增加題目數量通常會讓信度提高。請問，下列哪一項對於「增加題目數可以提升信度」的理由較不適切？","o":["新增的題目和原來的題目測量的是相同的英文閱讀能力","題目數量增加，可以讓學生答對的題目變多，總分較高","題目數量增加，可以讓測驗涵蓋更多不同的閱讀內容","題目數量增加，使總分較不容易受到猜題等偶然因素的影響"],"a":"B","al":"B","c":"分數提高不是信度提高","e":"增加題數能提高信度的理由，是適當增加同質內容取樣、減少偶然因素的影響，不是讓總分變高，所以 B 不適切。若只把所有人成績加 20 分，平均提高但一致性不會因此自動改善，可用此例分辨兩者。","p":"56、58-59"},{"n":195,"q":"方老師規劃以實作成果來評定學生整學期的學習成效，並以公告的表現水準(1 到 6 級) 確認其成就等級。此規劃屬於何種性質的評量？","o":["形成性評量","診斷性評量","常模參照評量","效標參照評量"],"a":"D","al":"D","c":"效標參照","e":"依公告的 1～6 級表現水準確認成就等級，是與固定標準比較，故選 D。整學期結束評定也有總結性用途，但選項未列；它不是為過程即時回饋或找困難原因，也沒有按同儕名次決定級別。","p":"12-14、29-30"},{"n":196,"q":"呂老師依據雙向細目表進行段考命題，再請該領域科目的教師進行審題。從這兩項 作為，呂老師所關心的測驗概念為下列何者？","o":["內容效度、預測效度","內容效度、內容效度","內容效度、內部一致性信度","效標關聯效度、評分者信度"],"a":"B","al":"B","c":"兩種內容效度證據","e":"雙向細目表確保內容與目標的代表性；請同領域教師審題，以專業判斷檢查題目適切性，兩者都支持內容效度，選 B。審题不是請多人實際評分，所以不能直接當成評分者信度。","p":"38、68"},{"n":197,"q":"阿德的國語文成績很好，教師批閱他的作文時總是傾向給較高的分數。這是屬於下列何種現象？","o":["月暈效應(halo effect)","蝴蝶效應(butterfly effect)","回沖效應(washback effect)","比馬龍效應(Pygmalion effect )"],"a":"A","al":"A","c":"月暈效應","e":"教師原先認為阿德國文好，這個整體印象使他在批閱此次作文時給較高分，是月暈效應。比馬龍是期待影響學生後續表現；回沖效應是考試影響教學與學習；蝴蝶效應不是本題的評分偏誤。","p":"54、57"},{"n":198,"q":"小英為幼幼班新生，每日早上家長離開幼兒園後，都會獨自哭泣一段時間才停止，之後直到放學都沒有哭。老師想了解小英的分離焦慮情形，以找出適當的輔導方式。下列哪些蒐集資料的方法較適合？甲、檢核表(checklists) 乙、時間取樣(time sampling) 丙、事件取樣(event sampling)丁、軼事記錄(anecdotal records)","o":["甲乙","甲丁","乙丙","丙丁"],"a":"D","al":"D","c":"事件取樣與軼事記錄","e":"哭泣集中在家長離開時，事件取樣可記錄分離前後情境與反應，軼事記錄可保留具體脈絡，故選丙丁。時間取樣若在其他時段抽看，可能漏掉短暫事件；檢核表雖可記有無，較難充分解釋發生過程與輔導需求。","p":"92-98"},{"n":199,"q":"有關形成性評估(formative assessment)的敘述，下列何者較正確？ 甲、評估內容與課程教學活動相關 乙、主要用來篩選有學習困難的幼兒 丙、指教師在教學活動結束後所做的評估 丁、教師可據以調整課程內容或教學方法","o":["甲乙","甲丁","乙丁",""],"a":"B","al":"B（原 D 缺文）","c":"形成性評量目的","e":"甲把評量和課程活動連結，丁用結果調整內容或教學，兩者符合形成性評量，故現有選項取 B。乙主要偏篩檢／診斷用途；丙只以活動結束時間定義，忽略是否用來回饋學習，因此不充分。","p":"29；補充 S5","x":"原 PDF 的 D 選項只有標號，沒有內容，本版明示缺漏。B 可由現有敘述判斷，但未取得完整原題前，不宣稱已驗證所有選項的唯一性。"},{"n":200,"q":"老師在評估幼兒 1 至 10 點數能力時，發現四歲的小勳無法正確說出撲克牌花色圖案 的數量。於是帶著小勳一邊將木珠一對一的放在撲克牌的花色圖案上，一邊點數。 進行數次後，再請小勳自己抽牌並點數，此時小勳皆能點數正確。老師所進行的是 下列哪一種評估方式？","o":["動態評估(dynamic assessment)","檔案評估(portfolio assessment)","生態評估(ecological assessment)","診斷性評估(diagnostic assessment"],"a":"A","al":"A","c":"教學介入與再評量","e":"先發現點數困難，再用木珠一對一配對作鷹架，練習後讓幼兒獨立點數，形成前測—介入—後測的連續歷程，屬動態評估。檔案重資料累積；生態重環境需求；診斷雖能找困難，但本題更明確包含介入後的學習反應。","p":"87、100-101"}];
const MCQ_FILTERS = [['all', '全部'], ['todo', '還沒做'], ['wrong', '答錯過']];

function MCQPage() {
  const [rec, setRec] = useState(() => load('mcq', {}));
  const [filter, setFilter] = useState(() => load('mcqf', 'all'));
  const [cur, setCur] = useState(() => load('mcqn', 1));
  const [jump, setJump] = useState('');
  useEffect(() => save('mcq', rec), [rec]);
  useEffect(() => save('mcqf', filter), [filter]);
  useEffect(() => save('mcqn', cur), [cur]);
  const list = useMemo(() => MCQ.filter(x => filter === 'all' || (filter === 'todo' ? !rec[x.n] : rec[x.n] && rec[x.n].wrong)), [filter, rec]);
  const q = MCQ.find(x => x.n === cur) || MCQ[0];
  const inList = list.includes(q), pos = list.indexOf(q);
  const r = rec[q.n], picked = r && r.pick;
  const doneN = MCQ.filter(x => rec[x.n]).length, okN = MCQ.filter(x => rec[x.n] && rec[x.n].ok).length;
  const wrongN = MCQ.filter(x => rec[x.n] && rec[x.n].wrong).length;
  const go = n => { setCur(n); setJump(''); window.scrollTo({ top: document.querySelector('.tabbar').offsetTop, behavior: 'instant' }); };
  const step = d => { const L = inList ? list : MCQ, i = (inList ? pos : MCQ.indexOf(q)) + d; if (L[i]) go(L[i].n); };
  // 答錯過的題目保留 wrong 標記，重做答對後才移出「答錯過」
  const pick = k => setRec(o => ({ ...o, [q.n]: { pick: k, ok: q.a ? k === q.a : null, wrong: q.a ? k !== q.a : false } }));
  const redo = () => setRec(o => { const n = { ...o }; delete n[q.n]; return n; });
  const doJump = e => { e.preventDefault(); const n = +jump; if (MCQ.some(x => x.n === n)) go(n); };
  const cls = k => !picked ? '' : k === q.a ? 'right' : k === picked ? 'wrong' : 'dim';
  return html`<div>
    <section className="sheet" aria-label="考古題進度">
      <div className="mcq-sum"><span className="meta">已做 <b>${doneN}</b> / ${MCQ.length} 題</span><span className="meta">答對 <b>${okN}</b> 題</span><span className="meta">答錯過 <b>${wrongN}</b> 題</span></div>
      <div className="mcq-dots" aria-hidden="true">${MCQ.map(x => html`<i key=${x.n} className=${(rec[x.n] ? (rec[x.n].ok ? 'ok' : 'no') : '') + (x.n === q.n ? ' cur' : '')}></i>`)}</div>
      <div className="mcq-filter" style=${{ marginTop: '12px' }}>
        ${MCQ_FILTERS.map(([v, l]) => html`<button key=${v} className=${'btn ' + (filter === v ? 'on' : '')} aria-pressed=${filter === v} onClick=${() => { setFilter(v); const L = MCQ.filter(x => v === 'all' || (v === 'todo' ? !rec[x.n] : rec[x.n] && rec[x.n].wrong)); if (L.length && !L.includes(q)) go(L[0].n); }}>${l}</button>`)}
        <form onSubmit=${doJump} className="mcq-filter"><input className="mcq-jump" inputMode="numeric" placeholder="題號" aria-label="跳到第幾題" value=${jump} onInput=${e => setJump(e.target.value)} /><button className="btn" type="submit">跳題</button></form>
      </div>
      <p className="meta" style=${{ marginBottom: 0 }}>${filter === 'all' ? '依原題號作答，點選項立刻看答案與解析。' : list.length ? `這個篩選共 ${list.length} 題。` : filter === 'todo' ? '全部都做過了。' : '目前沒有答錯過的題目。'}</p>
    </section>
    <section className="sheet" aria-label="作答區" style=${{ marginTop: '16px' }}>
      <div className="qhead"><span className="num">第 ${q.n} 題</span>${picked && html`<span className="type">${q.c}</span>`}${!q.a && html`<span className="type">不計分</span>`}</div>
      <p className="qtext">${q.q}</p>
      <div className="mcq-opts" role="group" aria-label="選項">
        ${q.o.map((t, i) => { const k = 'ABCD'[i]; return html`<button key=${k} className=${'mcq-opt ' + cls(k)} disabled=${!!picked} aria-pressed=${picked === k} onClick=${() => pick(k)}><span className="k">(${k})</span><span>${t || '（原題缺文）'}</span></button>`; })}
      </div>
      ${picked && html`<div className="mcq-res" role="status">
        <h3>${!q.a ? '本題題意有疑義，不計分' : r.ok ? '答對了' : `答錯了，你選 ${picked}`}</h3>
        <p><b>答案：${q.al}</b></p>
        <p>${q.e}</p>
        ${q.x && html`<p className="note">提醒：${q.x}</p>`}
        <p className="meta">講義頁碼：${q.p}</p>
      </div>`}
      <div className="mcq-nav">
        <button className="btn" disabled=${(inList ? pos : MCQ.indexOf(q)) <= 0} onClick=${() => step(-1)}>‹ 上一題</button>
        ${picked && html`<button className="btn ghost" onClick=${redo}>重做這題</button>`}
        <button className="btn primary" disabled=${(inList ? pos : MCQ.indexOf(q)) >= (inList ? list : MCQ).length - 1} onClick=${() => step(1)}>下一題 ›</button>
      </div>
    </section>
    <p className="meta">題目來自《教檢題庫（學生版）20260630》，原稿缺第 93、137 題。答案與解析依林俊瑩《學習評量》講義整理，是研讀用參考，不是老師公布的正式答案。</p>
  </div>`;
}

function App() {
  const TABS = ['notes', 'review', 'practice', 'mcq'];
  const [tab, setTabRaw] = useState(() => { const h = (location.hash || '').slice(1); const old = load('tab', 'notes'); return TABS.includes(h) ? h : TABS.includes(old) ? old : 'notes'; });
  const [topic, setTopic] = useState(() => { const p = load('ptopic', 'all'); return p === 'all' || TOPICS.some(t => t.id === p) ? p : 'all'; });
  const [attack, setAttack] = useState(null);
  const [focus, setFocus] = useState(null);
  const [theme, setTheme] = useState(() => load('theme', 'system'));
  const tts = useTTS(), game = useStudy();
  useWakeLock(!!(tts.player && tts.player.playing));
  useEffect(() => save('tab', tab), [tab]);
  useEffect(() => save('ptopic', topic), [topic]);
  useEffect(() => { if (theme === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme; save('theme', theme); }, [theme]);
  const setTab = t => { tts.stop(); setTabRaw(t); window.scrollTo({ top: 0 }); };
  const startAttack = id => { if (tts.player) tts.stop(); setAttack(id); };
  const closeAttack = () => { if (tts.player) tts.stop(); setAttack(null); };
  const read = id => { closeAttack(); setTab('notes'); setFocus(id); };
  const practice = id => { setTopic(id); setTab('practice'); };
  return html`<div style=${{ paddingBottom: tts.player ? 'calc(var(--player-h, 170px) + 24px)' : 0 }}>
    <header className=${'mast' + (tab !== 'notes' ? ' compact' : '')}>
      <div className="mastrow"><p className="eyebrow"><span className="issue-dot"></span>口試特訓<span className="eyebrow-sub">・圖解學習誌</span></p>
        <div className="theme-switch" role="group" aria-label="外觀">${[['system', '自動', '跟隨裝置的深淺色設定'], ['light', '白天', '白天版：淺色'], ['dark', '晚上', '晚上版：深色']].map(([v, l, tip]) => html`<button key=${v} aria-pressed=${theme === v} title=${tip} onClick=${() => setTheme(v)}>${l}</button>`)}</div></div>
      <div className="cover-layout"><div className="cover-copy"><p className="issue-label">本期專題｜測驗與學習評量</p>
        <h1>評量筆記</h1>
        ${tab === 'notes' && html`<div className="cover-actions"><button className="btn primary" onClick=${() => read('process')}>開始閱讀 <span aria-hidden="true">↗</span></button><button className="cover-link" onClick=${() => setTab('review')}>回想練習 →</button></div>`}
      </div>${tab === 'notes' && html`<div className="cover-illustration"><${CoverArt} /></div>`}</div>
      <div className="mast-meta"><span><b>15</b> 個理論主題</span><span><b>${QUESTIONS.length}</b> 題口試練習</span><button onClick=${() => setTab('mcq')}><b>${MCQ.length}</b> 題考古題 <span aria-hidden="true">↗</span></button><button onClick=${() => setTab('review')}><b>${game.dueN}</b> 個主題待複習 <span aria-hidden="true">↗</span></button></div>
      <div className="topic-dots" role="group" aria-label="15 個主題的熟悉程度，點圓點到該主題">${TOPICS.map((t, i) => { const st = game.status(t.id), lab = `${String(i + 1).padStart(2, '0')} ${t.title}：${studyLabel(st)}`; return html`<button key=${t.id} className=${st.kind} title=${lab} aria-label=${lab} onClick=${() => read(t.id)}><i></i></button>`; })}</div>
      <p className="dot-legend" aria-hidden="true"><span><i className="ok"></i>已熟悉</span><span><i className="dmg"></i>待複習</span><span><i></i>尚未完成回想</span></p>
    </header>
    <div className="tabbar"><nav className="tabs" aria-label="學習分頁">
      ${[['notes','主題閱讀'],['review','回想練習'],['practice','口試練習'],['mcq','考古題']].map(([v,l]) => html`<button className="tab" aria-current=${tab === v ? 'page' : undefined} aria-selected=${tab === v} key=${v} onClick=${() => setTab(v)}>${l}</button>`)}
    </nav></div>
    ${tab === 'notes' && html`<${Notes} tts=${tts} game=${game} onPractice=${practice} onAttack=${startAttack} focus=${focus} clearFocus=${() => setFocus(null)} />`}
    ${tab === 'review' && html`<${Review} game=${game} tts=${tts} onAttack=${startAttack} onRead=${read} />`}
    ${tab === 'practice' && html`<${Practice} tts=${tts} game=${game} topic=${topic} setTopic=${setTopic} />`}
    ${tab === 'mcq' && html`<${MCQPage} />`}
    <footer>內容依課堂知識庫與題庫整理。朗讀使用裝置內建語音。熟悉程度、複習日期、答題紀錄與草稿只存在這個瀏覽器；舊版進度已接續保留。</footer>
    ${attack && html`<${RecallSession} key=${attack} id=${attack} game=${game} tts=${tts} onClose=${closeAttack} onRead=${read} />`}
    <${Player} tts=${tts} />
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
