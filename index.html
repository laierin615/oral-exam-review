    examples: ['豬', '斑馬', '化學符號', '哺乳', '釣魚', '四則', '量筒', '顯微鏡', '考古題', '塞車', '存在主義', '日本', '墾丁', '畢業旅行'],
    exampleHint: '事實＝動物園裡的豬狗羊；概念＝哺乳類；程序＝釣魚方法、四則運算；後設認知＝考前看考古題抓方向；評鑑＝比較畢旅去日本或墾丁。',
    model: '1. 認知歷程六層次（由低至高）：記憶 ➔ 了解 ➔ 應用 ➔ 分析 ➔ 評鑑（判斷好壞對錯） ➔ 創造。\n2. 四大知識向度（由具體至抽象）：\n   - 事實知識是指單一具體名詞（如化學符號、豬狗羊）。\n   - 概念知識是指抽象分類與原理（如「哺乳類動物」）。\n   - 程序知識：有嚴格操作步驟的技能與方法（如四則運算、釣魚方法、使用量筒）。\n   - 後設認知知識：策略、情境脈絡與自我知識（如看考古題抓方向、避開塞車路線、對應存在主義的自我定位）。\n3. 雙向細目表：成就測驗的命題藍圖，結合「教材內容單元」與「認知歷程目標」以確保「內容效度」。原則上各單元配分須均衡，但各認知層次題數比例不強求相等。' },
  { id: 7, topic: 'process', type: '比較', category: '依教學歷程分類的四種評量',
    question: '依教學歷程，評量可分為哪四種？請說明各自的實施時機與目的；若全班形成性評量都考不好，責任在誰？',
    keywords: [
      { label: '安置性評量(教學前/起點行為)', groups: [['安置'], { name: '教學前／起點行為', t: ['教學前', '起點', '先備', '舊經驗'] }] },
      { label: '形成性評量(教學中/調整教學)', groups: [['形成性'], { name: '教學中', t: ['教學中', '教學過程', '隨堂', '學習單', '課堂問答'] }, { name: '調整教學', t: ['調整', '修正', '改進'] }] },

    ],
    examples: ['隨堂', '小考', '學習單', '段考', '期末考', '家長', '引起動機', '開學', '錯題'],
    exampleHint: '開學前了解舊經驗（安置）；隨堂小考、學習單（形成）；錯題分析找迷思再補救（診斷）；段考、期末考（總結）；假日學習單需家長共同參與。',
    model: '1. 安置性評量：教學前（開學前、單元開始前）實施，了解學生的起點行為、先備知識與舊經驗，對應教案準備活動的引起動機與銜接舊經驗。\n2. 形成性評量：教學過程中實施（隨堂小考、學習單、課堂問答），掌握教學進度、確認學生是否學會，作為教師立即調整教學策略的依據。若全班考不好，責任在老師，代表教學策略需要調整，因此平時小考即使計分，比重也應極低；假日學習單則需家長共同參與、共同承擔學習責任。\n3. 診斷性評量：教學中或教學後，針對反覆出現學習困難的學生進行錯題分析，找出迷思概念與學習盲點，以進行補救教學或提出轉介證明。\n4. 總結性評量：教學結束後（段考、期末考）實施，評定整體學習成就並提供成績等第，責任在學生。' },

    exampleHint: '最大表現：段考（成就）、智力或性向測驗；典型表現：學習動機量表、人格問卷（內外向）、興趣量表、工作滿意度調查。',
    model: '1. 由 Cronbach 依作答表現提出。\n2. 最大表現測驗：要求受試者盡力考到最好，有標準答案、有對錯之分，測量能力極限或學習成果。\n   - 成就測驗：測量教學後的學習成果（如段考），最重視內容效度。\n   - 性向測驗／智力測驗：測量未來發展潛能，最重視預測效度。\n3. 典型表現測驗：要求受試者正常表現、誠實作答即可，沒有對錯之分，例如情意測驗、人格問卷（內外向）、興趣量表、生活適應量表、工作滿意度調查、學習動機量表。最重視建構（構念）效度。' },

      { label: '團體異質性高信度高', groups: [['異質'], { name: '同質班信度降低', t: ['同質', '資優班', '音樂班', '體育班', '標準差'] }] },
    ],
    examples: ['影分身', '雙胞胎', '月暈', '申論', '資優班', '音樂班', '體育班', '兩週', '兩周'],
    exampleHint: '再測像「影分身」隔兩週再考一次；複本像雙胞胎 A、B 卷；評分者受月暈效應影響；資優班、音樂班同質性高，信度會下降。',
    model: '1. 信度種類：\n   - 再測信度（重測信度、穩定係數）是指同一份測驗隔一段時間（如兩週）對同一批人施測兩次，通常是所有信度中最高的。\n   - 複本信度：難度與結構相似的 A、B 兩卷。\n   - 內部一致性信度：折半信度、Cronbach α。\n   - 評分者間信度是指多位評分者對同一份作業、申論題或實作評分的一致程度，受月暈效應等主觀因素影響，是所有信度中最低的。\n2. 影響信度的三大因素：\n   - 試題題數：適度增加同質性題目，可提高信度。\n   - 試題難易度：難度適中（P≈0.50）時信度與鑑別度最高，太難或太簡單都會降低信度。\n   - 團體異質性：團體程度差異越大、標準差越大，信度越高；資優班、音樂班、體育班等同質性高的班級，信度會降低。' },
  { id: 10, topic: 'validity', type: '定義', category: '三大效度',
    question: '請說明效度的三大類型（含效標關聯效度的兩種），並各舉一個適用的測驗情境。',
    keywords: [
      { label: '內容效度(雙向細目表/所教即所考)', groups: [['內容效度'], ['雙向細目表'], { name: '所教即所考', t: ['所教即所考', '涵蓋', '教學目標', '教材範圍'] }] },
      { label: '效標關聯效度', groups: [['效標關聯', '效標']] },
      { label: '同時效度(與現有效標同時施測)', groups: [['同時效度', '並行效度'], { name: '與現有效標同時施測', t: ['同時施測', '取代', '魏氏', '現有'] }] },
      { label: '預測效度(預測未來表現)', groups: [['預測效度'], { name: '預測未來表現', t: ['未來', '時間差', '模擬考'] }] },
      { label: '建構效度(抽象心理特質)', groups: [CONSTRUCT, { name: '抽象心理特質', t: ['抽象', '心理', '特質', '理論', '動機', '焦慮', '自我概念'] }] },
    ],
    examples: ['雙向細目表', '魏氏', '模擬考', '會考', '學習動機', '焦慮', '自我概念', '性向測驗', '段考', '學力測驗'],
    exampleHint: '段考用雙向細目表（內容）；新智力測驗與魏氏同時施測（同時）；模擬考預測會考（預測）；學習動機、焦慮量表（建構）。',
    model: '1. 內容效度：試題是否涵蓋教學目標與教材範圍（所教即所考），成就測驗最重視，編製時以雙向細目表確保。\n2. 效標關聯效度：與外在公認有效的效標求關聯。\n   - 同時效度（並行效度）：新編測驗與現有公認效標（如魏氏智力量表、全國學力測驗）同時施測比較，看能否取代原測驗。\n   - 預測效度：以現在的分數預測未來表現，有時間差，如性向測驗、模擬考預測會考。\n3. 建構效度（構念效度）：測量理論上的抽象心理特質，凡學習動機量表、焦慮量表、自我概念量表、人格問卷等典型表現測驗，都看建構效度。' },
  { id: 11, topic: 'item', type: '定義', category: '試題分析：難度與鑑別度',
    question: '請說明試題分析中高低分組的分組方式，以及難度（P）與鑑別度（D）的計算、理想數值；若鑑別度為負值代表什麼？',
    keywords: [
      { label: '前後27%分高低分組', groups: [['27'], { name: '高分組／低分組', t: ['高分組', '低分組'] }] },
      { label: '難度P＝(PH＋PL)/2', groups: [['難度'], { name: 'P＝(PH＋PL)÷2', t: ['ph\\+pl', '通過率', '除以2', '除以二', '/2', '相加'] }] },
      { label: '難度0.50最佳(0.40～0.60)', groups: [{ name: 'P＝0.50 最佳', t: ['0\\.5', '50%', '百分之50', '百分之五十'] }, { name: '理想範圍 0.40～0.60', t: ['0\\.4', '0\\.6', '適中'] }] },
      { label: '鑑別度D＝PH－PL', groups: [['鑑別度'], { name: 'D＝PH－PL', t: ['ph-pl', 'ph−pl', '相減', '減去', '減掉'] }] },
      { label: '負鑑別度＝高分組答錯/題目有誤', groups: [['負'], { name: '高分組答錯、題目或答案有誤', t: ['高分組.{0,6}錯', '低分組.{0,6}對', '答案.{0,4}錯', '題目.{0,4}(錯|誤)', '誤解', '有問題'] }] },
    ],
    examples: ['掐頭去尾', '誤解', '標準答案', '給錯', '例如某題', '計算'],
    exampleHint: '「掐頭去尾法」取前後 27%；舉一題算給老師聽，例如 PH＝0.8、PL＝0.4，P＝0.6、D＝0.4；鑑別度 −0.2 代表高分組可能誤解題意或答案給錯。',
    model: '1. 分組方式：採「掐頭去尾法」，取全體考生成績前 27% 為高分組（PH），後 27% 為低分組（PL）。\n2. 難度（P）：P＝(PH＋PL)÷2，即通過率，最佳值為 0.50，理想範圍 0.40～0.60。\n3. 鑑別度（D）：D＝PH－PL，正值越大代表越能區分高分組與低分組。\n4. 負鑑別度：代表高分組答錯、低分組反而答對，通常是題目出錯、高分組誤解題意或標準答案給錯，需要修題。' },
  { id: 12, topic: 'trend', type: '綜合', category: '現代評量新趨勢',
    question: '請說明現代評量的四大新趨勢；多元評量可以使用紙筆測驗嗎？另類評量興起的原因為何，它能提高信度嗎？',
    keywords: [
      { label: '靜態→動態評量', groups: [['動態評量', '動態']] },
      { label: '虛假→真實性評量(生活脈絡)', groups: [['真實'], { name: '真實生活脈絡', t: ['生活', '脈絡', '情境'] }] },
      { label: '單一→多元評量(可含紙筆)', groups: [['多元評量', '多元'], { name: '可以使用紙筆', t: ['紙筆'] }] },
      { label: '適性評量/電腦適性測驗(CAT)', groups: [['適性', 'cat', '電腦適性'], { name: '動態調整題目難度', t: ['難度', '調整', '能力'] }] },
      { label: '另類評量興起：Ausubel有意義學習、傳統評量缺失', groups: [{ name: 'Ausubel 有意義的學習', t: ['奧蘇貝爾', 'ausubel', '有意義'] }, { name: '傳統評量缺失、窄化教學', t: ['窄化', '缺失'] }] },
      { label: '另類評量無法提高信度', groups: [['信度'], { name: '無法提高', t: ['無法', '不能', '不會', '降低', '偏低'] }] },
    ],
    examples: ['托福', 'toefl', '英檢', '科學閱讀', '辯論', '專題', '買東西', '商店', '前測'],
    exampleHint: '陳老師「科學閱讀」：省思 30%＋辯論 30%＋專題 40%（多元）；讓低年級到商店買東西評算數（真實）；托福、英檢（CAT）。',
    model: '1. 四大新趨勢：\n   - 靜態評量 ➔ 動態評量：前測、教學介入、後測，評估學習潛能。\n   - 虛假評量 ➔ 真實性評量：也就是在真實生活脈絡中解決問題。\n   - 單一評量 ➔ 多元評量：例如科學閱讀課以省思 30%、辯論 30%、專題報告 40% 評分。\n   - 適性評量／電腦適性測驗（CAT）：如托福、英檢，電腦依作答動態調整題目難度，估算真實能力。\n2. 多元評量可以使用紙筆測驗，紙筆只是其中一種工具、不是唯一工具即可，因此同時包含主觀與客觀資訊。\n3. 另類評量興起原因：受奧蘇貝爾（Ausubel）「有意義的學習」影響、傳統評量有諸多缺失、標準化測驗會窄化教學。但另類評量主觀性較強，無法提高評量的信度。' },
  { id: 13, topic: 'observe', type: '比較', category: '觀察紀錄與評定方法',
    question: '請說明軼事紀錄法適用的評量，以及事件取樣、時間取樣、實距紀錄三種觀察取樣法的差異；並比較等第法與心象法。',
    keywords: [
      { label: '軼事紀錄法(最適合情意評量)', groups: [['軼事'], { name: '適合情意評量', t: ['情意', '態度'] }] },
      { label: '事件取樣(特定事件發生才記)', groups: [['事件取樣'], { name: '特定事件發生才記錄', t: ['特定', '發生', '爭吵', '哭'] }] },
      { label: '時間取樣(固定時間間隔)', groups: [['時間取樣'], { name: '固定時間間隔', t: ['固定', '間隔'] }] },
      { label: '實距紀錄(持續時間長度)', groups: [['實距'], { name: '行為持續多久', t: ['持續', '多久', '長度'] }] },
      { label: '等第法(先分堆再評名次) vs. 心象法(與心中標準比/可從缺)', groups: [['等第法'], { name: '先分堆再給名次', t: ['分堆', '金牌', '銀牌', '名次'] }, ['心象法'], { name: '與心中標準比、可從缺', t: ['從缺', '心中', '過往', '以前'] }] },
    ],
    examples: ['爭吵', '分離', '哭', '美術', '蘭花', '茶葉', '從缺', '小傳記', '個案'],
    exampleHint: '軼事紀錄像寫個案小傳記；事件取樣＝爭吵或分離哭泣發生時才記錄；等第法＝美術、茶葉、蘭花比賽先分五堆；心象法＝本屆未達標就「優等從缺」。',
    model: '1. 軼事紀錄法是指像寫個案小傳記一樣，客觀記錄學生在自然情境中發生的特殊重要行為或事件，最適合運用於情意教學的評量（態度、願不願意積極配合）。\n2. 三大觀察取樣法：\n   - 事件取樣法是指特定事件（如爭吵、分離哭泣）出現時才開始觀察，記錄始末。\n   - 時間取樣法：在固定時間間隔觀察特定行為是否發生。\n   - 實距紀錄法：記錄某行為持續發生的時間長度。\n3. 等第法 vs. 心象法：等第法是先把美術作品、茶葉、蘭花等分堆（如五堆），再分出金牌、銀牌、銅牌、優等、入選；心象法是評審心中已有過往的高標準，若本屆作品都未達標，就會出現「優等從缺」。' },
  { id: 14, topic: 'process', type: '情境', category: '安置性與形成性評量',
    question: '王老師在新學期第一週先讓學生做一份單元前測，了解學生學過哪些分數概念；上課期間每節課都用學習單確認學生是否學會。請說明王老師使用了哪兩種評量及其目的。',
    keywords: [
      { label: '安置性評量(了解起點行為)', groups: [['安置'], { name: '了解起點行為', t: ['起點', '先備', '舊經驗', '學過'] }] },
      { label: '形成性評量(確認學會、調整教學)', groups: [['形成性'], { name: '確認學會並調整教學', t: ['調整', '修正', '學會', '進度'] }] },
      { label: '實施時機：教學前 vs. 教學中', groups: [{ name: '教學前', t: ['教學前', '開學', '第一週', '前測'] }, { name: '教學中', t: ['教學中', '教學過程', '每節', '上課期間'] }] },
    ],
    examples: ['前測', '學習單', '分數', '第一週', '小考'],
    exampleHint: '開學第一週的單元前測（安置）、每節課的學習單（形成）。',
    model: '1. 單元前測屬於「安置性評量」：在教學前實施，目的是了解學生的起點行為、先備知識與舊經驗（例如學過哪些分數概念），作為安排教學起點的依據。\n2. 每節課的學習單屬於「形成性評量」：在教學過程中實施，目的是確認學生是否學會、掌握教學進度，作為老師立即調整下一節教學策略的依據。若全班都沒學會，責任在老師，需調整教學。' },
  { id: 15, topic: 'process', type: '比較', category: '診斷性 vs. 形成性評量',
    question: '什麼是診斷性評量？它和形成性評量有何不同？',
    keywords: [
      { label: '診斷性評量針對反覆困難的學生', groups: [['診斷'], { name: '針對反覆困難的學生', t: ['反覆', '困難', '特定學生', '個別'] }] },
      { label: '錯題分析找迷思概念', groups: [{ name: '錯題分析', t: ['錯題', '錯誤類型', '分析'] }, { name: '迷思概念', t: ['迷思', '盲點'] }] },

      { label: '形成性針對全班、調整教學', groups: [['形成性'], { name: '全班、調整教學', t: ['全班', '調整', '進度'] }] },

    examples: ['錯題', '迷思', '補救', '轉介', '分數', '分母'],
    exampleHint: '分數加法總是把分母也相加的學生，用錯題分析找出迷思再補救。',
    model: '1. 診斷性評量是指在教學中或教學後，針對反覆出現學習困難的學生，進行錯題分析，找出迷思概念、學習盲點與困難所在，以進行補救教學或提出轉介證明。例如分數加法總是把分母相加的學生，透過錯題分析找出迷思再補救。\n2. 與形成性評量的差異：形成性評量針對全班，目的是確認學習進度並調整教學；診斷性評量則是指針對特定有困難的學生，深入找出困難原因。' },
  { id: 16, topic: 'reference', type: '比較', category: '常模參照 vs. 標準參照',
    question: '請比較常模參照與標準（效標）參照評量的意義、特徵與適用情境，並各舉兩個實例。',
    keywords: [
      { label: '常模參照＝相對位置', groups: [['常模參照'], { name: '相對位置', t: ['相對', '排名', '比高低', 'pr', '百分等級'] }] },
      { label: '標準參照＝事先決定的絕對標準', groups: [STD_REF, { name: '事先決定的絕對門檻', t: ['事先', '絕對', '門檻', '通過', '及格', '過關'] }] },

      { label: '標準適用精熟學習、形成與診斷', groups: [['精熟'], { name: '形成或診斷性評量', t: ['形成', '診斷'] }] },
    ],
    examples: ['學測', '會考', '教甄', '教檢', '駕照', '英檢', '游泳', '60分'],
    exampleHint: '常模：學測、會考、教甄前 20% 進複試；標準：教檢 60 分及格、駕照、游泳 1～10 級。',
    model: '1. 常模參照是指將個人分數與常模團體比較，了解個人在團體中的相對位置（比高低、看 PR 值）。重視鑑別度與高信度，適用於總結性評量、範圍廣、異質性大的團體。例如學測、國中會考、教甄排名前 20% 進複試。\n2. 標準（效標）參照是指依教學前事先決定的學習目標與表現標準（絕對門檻），判斷學生是否通過，不與他人比較。最適合精熟學習，適用於形成性與診斷性評量。例如教師資格檢定 60 分及格、駕照考試、游泳 1～10 級。\n3. 口訣：常模比高低，標準看過關。' },
  { id: 17, topic: 'reference', type: '情境', category: '實作成績 1～6 級',

    keywords: [
      { label: '標準/效標參照', groups: [STD_REF] },

      { label: '信度較低（一刀切）、重效度', groups: [['信度'], { name: '較低／一刀切', t: ['較低', '偏低', '一刀切'] }] },
    ],
    examples: ['游泳', '1~6級', '1到6級', '駕照', '教檢', '60分', '59分'],
    exampleHint: '和游泳分級、駕照一樣；60 分過、59 分不過的一刀切。',
    model: '1. 屬於標準（效標）參照評量。\n2. 理由：方老師依事先訂定的表現標準把學生分成 1～6 級，看的是學生是否達到各級標準（絕對門檻），不與他人排名比較，就像游泳分級檢測、駕照考試。\n3. 信度特性：標準參照在及格邊緣屬於「一刀切」（如 60 分過、59 分不過），因此信度通常較低，重要的是效度。' },
  { id: 18, topic: 'reference', type: '情境', category: '教甄與教檢的參照',

    model: '1. 教甄初試取前 20% 屬於常模參照：看考生在團體中的相對位置，名次決定能否進複試，分數本身高低不是重點。\n2. 教檢 60 分及格屬於標準（效標）參照：依事先決定的絕對門檻判斷是否過關，不論其他人考幾分，達到 60 分就通過。\n3. 差別：常模參照比高低（相對），標準參照看過關（絕對）。例如學測、會考也是常模參照；駕照考試、游泳分級也是標準參照。' },

    model: '1. 標準化測驗是指由專業部門統一編製，施測程序、計分標準與常模都一致，全台灣花蓮、台南、台北考同一份。優點是公平、客觀、可跨區比較，連分數也可標準化；缺點是容易窄化教學。\n2. 非標準化（教師自編）測驗是指老師依班級特定需求與教學目標自行設計，只在自己班上施測，例如自編英語隨堂考、羅東夜市踏查學習單。優點是彈性高、能反映個別差異；缺點是缺乏常模，難以跨班比較。' },

  { id: 21, topic: 'perform', type: '比較', category: '成就測驗 vs. 性向測驗',

/* ---------- 比對引擎 ---------- */
function normWithMap(text) {
  let n = ''; const map = []; let i = 0;
  for (const ch of text) {
    if (!/\s/.test(ch)) {
      for (const c of ch.normalize('NFKC').toLowerCase()) { n += c; map.push(i); }
    }
    i += ch.length;
  }
  return { n, map };
}
const reCache = new Map();
function rx(t) {
  if (!reCache.has(t)) { let r = null; try { r = new RegExp(t.normalize('NFKC').toLowerCase(), 'g'); } catch (e) {} reCache.set(t, r); }
  return reCache.get(t);
}
function findSpans(term, N) {
  const r = rx(term); const out = []; if (!r) return out;
  r.lastIndex = 0; let m;
  while ((m = r.exec(N.n))) {
    if (!m[0].length) { r.lastIndex++; continue; }
    out.push({ s: N.map[m.index], e: N.map[m.index + m[0].length - 1] + 1 });
  }
  return out;
}
const asGroup = g => Array.isArray(g) ? { name: g[0], t: g, min: 1 } : { min: 1, ...g };

function matchKeywords(q, text) {
  const N = normWithMap(text);
  return {
    N,
    kws: q.keywords.map(kw => {
      const spans = []; const lack = []; let pass = 0;
      kw.groups.map(asGroup).forEach(g => {
        let hits = 0;
        g.t.forEach(term => { const s = findSpans(term, N); if (s.length) { hits++; spans.push(...s); } });
        if (hits >= g.min) pass++; else lack.push(g.min > 1 ? `${g.name}（目前 ${hits}／${g.min}）` : g.name);
      });
      const ratio = pass / kw.groups.length;
      const status = ratio === 1 ? 'hit' : ratio > 0 ? 'partial' : 'miss';
      const first = spans.length ? Math.min(...spans.map(s => s.s)) : Infinity;
      return { label: kw.label, ratio, status, lack, spans, first };
    }),
  };
}
const DEF_RE = /是指|指的是|意指|意思是|定義|也就是|亦即|即是|代表|稱為|係指|就是|意即|屬於|指|即/g;
const EX_RE = /例如|比如|譬如|像是|舉例|好比|實例|例子|如同|\(如|如:|像/;

function grade(q, text) {
  const { N, kws } = matchKeywords(q, text);
  const coverage = kws.reduce((a, k) => a + k.ratio, 0) / kws.length;
  const base = 50 * coverage;
  const defCount = (N.n.match(DEF_RE) || []).length;
  const exMarker = EX_RE.test(N.n);
  const exTerms = q.examples.filter(t => findSpans(t, N).length);
  const defScore = Math.min(1, defCount / 2);
  const exScore = Math.min(1, (exMarker ? 0.4 : 0) + 0.3 * Math.min(exTerms.length, 2));
  const lenF = Math.min(1, N.n.length / 90);
  const elab = 50 * (0.5 * defScore + 0.5 * exScore) * lenF * Math.min(1, coverage * 1.25);
  const found = kws.filter(k => k.status !== 'miss');
  const cut = text.length * 0.3;
  const early = found.filter(k => k.first < cut).length;
  const frontOk = found.length > 0 && early >= Math.max(1, Math.ceil(found.length / 2));
  return { kws, base, elab, total: Math.round(base + elab), defCount, defScore, exMarker, exTerms, exScore, len: N.n.length, frontOk, early, found: found.length };
}

const RANK = { miss: 3, partial: 2, hit: 1 };
function Marked({ text, layers, prefix, hand }) {
  // 同一字元若被多個關鍵字覆蓋，取最需要注意的狀態
  const cls = new Array(text.length).fill(null);
  layers.forEach(({ spans, status }) => spans.forEach(({ s, e }) => {
    for (let i = s; i < e; i++) if (!cls[i] || RANK[status] > RANK[cls[i]]) cls[i] = status;
  }));
  const segs = []; let i = 0;
  while (i < text.length) { let j = i; while (j < text.length && cls[j] === cls[i]) j++; segs.push([text.slice(i, j), cls[i]]); i = j; }

function skewStats(s) {
  const alpha = s * 7, xi = 50 - s * 32, om = 22;
  const xs = [], fs = [];
  for (let x = 0; x <= 100; x += 0.5) { const u = (x - xi) / om; xs.push(x); fs.push(phi(u) * Phi(alpha * u)); }
  const tot = fs.reduce((a, b) => a + b, 0);
  let mean = 0; fs.forEach((f, i) => mean += xs[i] * f); mean /= tot;
  let acc = 0, median = 50; for (let i = 0; i < fs.length; i++) { acc += fs[i]; if (acc >= tot / 2) { median = xs[i]; break; } }
  let mi = 0; fs.forEach((f, i) => { if (f > fs[mi]) mi = i; });
  return { xs, fs, fmax: fs[mi], mean, median, mode: xs[mi] };
}

/* ---------- 互動：常態分配 Z / T / IQ / PR ---------- */
function NumField({ id, label, value, digits, onCommit, sub }) {
  const [txt, setTxt] = useState(value.toFixed(digits));
  const [focus, setFocus] = useState(false);
  useEffect(() => { if (!focus) setTxt(value.toFixed(digits)); }, [value, focus, digits]);
  return html`<div className="field">
    <label htmlFor=${id}>${label}</label>
    <input id=${id} inputMode="decimal" value=${txt} onFocus=${() => setFocus(true)} onBlur=${() => setFocus(false)}
      onChange=${e => { setTxt(e.target.value); const v = parseFloat(e.target.value.replace('−', '-')); if (!isNaN(v)) onCommit(v); }} />
    <small>${sub}</small>
  </div>`;
}
const NORM_PRESETS = [
  ['小英 T＝40', -1, '40＝50＋10Z → Z＝−1，低於平均 1 個標準差，PR 約 16。'],
  ['教甄 T＝70', 2, 'Z＝+2，PR 97.72，排名前 2.28%：宜蘭縣錄取率 2% 落榜，花蓮縣錄取率 3% 錄取。'],
  ['IQ 130', 2, '高於平均 2 個標準差：資優班安置切點。'],
  ['IQ 70', -2, '低於平均 2 個標準差：資源班安置切點。'],
];
function NormalFig() {
  const [z, setZRaw] = useState(-1);
  const [note, setNote] = useState(NORM_PRESETS[0][2]);
  const setZ = v => setZRaw(clamp(v, -3.5, 3.5));
  const svgRef = useRef(null);
  const drag = useRef(false);
  const W = 420, L = 34, R = 12, T = 34, B = 184;
  const X = v => L + (v + 3.5) / 7 * (W - L - R);
  const Y = f => B - f / phi(0) * (B - T - 12);
  const pts = []; for (let v = -3.5; v <= 3.5001; v += 0.05) pts.push([v, phi(v)]);
  const curve = pts.map(([v, f], i) => `${i ? 'L' : 'M'}${X(v).toFixed(1)},${Y(f).toFixed(1)}`).join('');
  const shadePts = pts.filter(([v]) => v <= z);
  const shade = shadePts.length ? shadePts.map(([v, f], i) => `${i ? 'L' : 'M'}${X(v).toFixed(1)},${Y(f).toFixed(1)}`).join('') + `L${X(z)},${Y(phi(z))}L${X(z)},${B}L${X(-3.5)},${B}Z` : '';
  const pr = Phi(z) * 100;
  const prInt = clamp(Math.round(pr), 1, 99);
  const T_ = 50 + 10 * z, IQ = 100 + 15 * z;
  const fromEvent = e => {
    const r = svgRef.current.getBoundingClientRect();
    const vx = (e.clientX - r.left) / r.width * W;
    setZ(Math.round(((vx - L) / (W - L - R) * 7 - 3.5) * 100) / 100); setNote('');
  };
  const rows = [
    ['Z', [-3, -2, -1, 0, 1, 2, 3].map(v => [v, v > 0 ? '+' + v : String(v).replace('-', '−')])],
    ['T', [-3, -2, -1, 0, 1, 2, 3].map(v => [v, String(50 + 10 * v)])],
    ['IQ', [-3, -2, -1, 0, 1, 2, 3].map(v => [v, String(100 + 15 * v)])],
    ['PR', [[-3, '0.13'], [-2, '2.28'], [-1, '15.87'], [0, '50'], [1, '84.13'], [2, '97.72'], [3, '99.87']]],
  ];
  const bands = [[0, 1, '34.13%'], [-1, 0, '34.13%'], [1, 2, '13.59%'], [-2, -1, '13.59%'], [2, 3, '2.14%'], [-3, -2, '2.14%']];
  const dirTxt = Math.abs(z) < 0.005 ? '正好在平均數上' : `${z > 0 ? '高於' : '低於'}平均數 ${Math.abs(z).toFixed(2)} 個標準差`;
  return html`<div>
    <div className="presets" role="group" aria-label="課堂考題">
      ${NORM_PRESETS.map(([lab, v, n]) => html`<button key=${lab} aria-pressed=${note === n} onClick=${() => { setZ(v); setNote(n); }}>${lab}</button>`)}
    </div>
    <div className="chartrow">
      <div>
        <p className="chart-hint">圖表可左右滑動；下方欄位可直接換算分數。</p><div className="chart-scroll"><svg ref=${svgRef} className="chart" viewBox=${`0 0 ${W} 284`} role="img" aria-label="常態分配曲線與分數對照"
          onPointerDown=${e => { drag.current = true; e.currentTarget.setPointerCapture(e.pointerId); fromEvent(e); }}
          onPointerMove=${e => { if (drag.current) fromEvent(e); }}
          onPointerUp=${() => { drag.current = false; }} onPointerCancel=${() => { drag.current = false; }}>
          <path d=${curve + `L${X(3.5)},${B}L${X(-3.5)},${B}Z`} fill="var(--curve-fill)"></path>
          ${shade && html`<path d=${shade} fill="var(--shade)"></path>`}
          ${[-3, -1, 0, 1, 3].map(v => html`<line key=${v} x1=${X(v)} x2=${X(v)} y1=${Y(phi(v))} y2=${B} stroke="var(--rule)" strokeWidth=${v === 0 ? 1.5 : 1}></line>`)}
          ${[-2, 2].map(v => html`<line key=${'c' + v} x1=${X(v)} x2=${X(v)} y1=${T - 8} y2=${B} stroke="var(--redpen)" strokeDasharray="4 3" strokeWidth="1"></line>`)}
          <text x=${X(-2) + 4} y=${T - 14} style=${{ fill: 'var(--redpen)', fontSize: '15px' }}>IQ≤70 資源班</text>
          <text x=${X(2) - 4} y=${T + 6} textAnchor="end" style=${{ fill: 'var(--redpen)', fontSize: '15px' }}>IQ≥130 資優班</text>
          ${bands.map(([a, b, lab]) => { const mid = (a + b) / 2; const inside = Math.abs(mid) < 2; return html`<text key=${a} x=${X(mid)} y=${inside ? B - 10 : Y(phi(mid)) - 8} textAnchor="middle" className="mono" style=${{ fontSize: '14px', fill: 'var(--ink)' }}>${lab}</text>`; })}
          <path d=${curve} fill="none" stroke="var(--curve)" strokeWidth="2.5"></path>
          <line x1=${X(-3.5)} x2=${X(3.5)} y1=${B} y2=${B} stroke="var(--ink-soft)"></line>
          ${rows.map(([name, ticks], ri) => html`<g key=${name}>
            <text x=${4} y=${B + 22 + ri * 22} style=${{ fill: 'var(--ink)', fontWeight: 700, fontSize: '15px' }}>${name}</text>
            ${ticks.map(([v, lab]) => html`<text key=${v} x=${X(v)} y=${B + 22 + ri * 22} textAnchor="middle" className="mono" style=${{ fontSize: '14px' }}>${lab}</text>`)}
          </g>`)}
          <line x1=${X(z)} x2=${X(z)} y1=${Y(phi(z))} y2=${B + 92} stroke="var(--redpen)" strokeWidth="2"></line>
          <circle cx=${X(z)} cy=${Y(phi(z))} r="9" fill="var(--sheet)" stroke="var(--redpen)" strokeWidth="2.5" style=${{ cursor: 'ew-resize' }}></circle>
        </svg></div>
        <label htmlFor="zrange" className="meta">拖動曲線上的紅點，或用這條滑桿</label>
        <input id="zrange" type="range" min="-3.5" max="3.5" step="0.01" value=${z} onInput=${e => { setZ(+e.target.value); setNote(''); }} onChange=${e => { setZ(+e.target.value); setNote(''); }} />
      </div>
      <div>
        <div className="fields">
          <${NumField} id="fz" label="Z 分數" value=${z} digits=${2} sub="Z＝(X−M)÷S" onCommit=${v => { setZ(v); setNote(''); }} />
          <${NumField} id="ft" label="T 分數" value=${T_} digits=${1} sub="T＝50＋10Z" onCommit=${v => { setZ((v - 50) / 10); setNote(''); }} />
          <${NumField} id="fiq" label="魏氏 IQ" value=${IQ} digits=${1} sub="IQ＝100＋15Z" onCommit=${v => { setZ((v - 100) / 15); setNote(''); }} />
          <${NumField} id="fpr" label="百分等級 PR" value=${pr} digits=${2} sub="PR 沒有 0 和 100" onCommit=${v => { setZ(invPhi(clamp(v, 0.02, 99.98) / 100)); setNote(''); }} />
        </div>
        <div className="readout">
          Z＝<b className="mono">${fmt(z)}</b>，${dirTxt}，贏過約 <b className="mono">${pr.toFixed(2)}%</b> 的人，記作 <b>PR ${prInt}</b>。
          ${z >= 2 && html`<span className="alert">IQ ≥ 130（Z ≥ +2）：需特殊教育安置，資優班。</span>`}
          ${z <= -2 && html`<span className="alert">IQ ≤ 70（Z ≤ −2）：需特殊教育安置，資源班。</span>`}
          ${note && html`<div className="note">課堂考題：${note}</div>`}
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- 村莊：建築名稱與間隔複習 ---------- */
const SHORT = {
  process: '評量四類', reference: '兩種參照', standard: '測驗編製', perform: '表現測驗', relval: '信度與效度',
  validity: '效度分類', reliability: '信度分類', skew: '偏態分布', normal: '常態換算', item: '試題分析',
  bloom: '教育目標', trend: '評量趨勢', performance: '實作評量', portfolio: '檔案評量', observe: '觀察工具',
};
TOPICS.forEach(t => { t.short = SHORT[t.id]; });
// 舊 stage 保留為間隔複習階段；不刪除舊版資源與作答資料。
const INTERVALS = [0, 1, 3, 7, 14];
const MAX_LV = 4;
const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => fmtDate(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return fmtDate(new Date(y, m - 1, d + n)); };
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const mdText = s => s ? `${+s.slice(5, 7)}/${+s.slice(8, 10)}` : '';
const studyLabel = st => st.kind === 'new' ? '尚未完成回想' : st.kind === 'dmg' ? '待複習' : '已熟悉';
function initialProgress() {
  const saved = load('village', null);
  if (saved) return saved;
  const known = load('known', {}), out = {};
  Object.keys(known).forEach(id => { if (known[id]) out[id] = { stage: 1, due: addDays(today(), 1), best: 3 }; });
  return out;
}
function useStudy() {
  const [village, setVillage] = useState(initialProgress);
  // 只在原本有舊版 known 或有 village 時保留等值資料；不清空任何其他鍵。
  useEffect(() => { if (Object.keys(village).length) save('village', village); }, [village]);
  const qstars = load('qstars', {});
  const status = id => {
    const v = village[id];
    if (!v) return { stage: 0, kind: 'new' };
    if (v.needsReview || (v.due && today() >= v.due)) return { ...v, kind: 'dmg' };
    return { ...v, kind: v.stage ? 'ok' : 'new' };
  };
  function recordRecall(id, complete) {
    const prev = village[id] || { stage: 0, best: 0 }, st = status(id);
    const stage = complete ? (st.kind === 'ok' ? prev.stage : Math.min(MAX_LV, (prev.stage || 0) + 1)) : (prev.stage || 0);
    const due = complete ? (st.kind === 'ok' ? prev.due : addDays(today(), INTERVALS[stage])) : today();
    setVillage(v => ({ ...v, [id]: { ...prev, stage, due, best: Math.max(prev.best || 0, complete ? 3 : 0), needsReview: !complete, lastReview: today() } }));
    return { due, complete };
  }
  return { status, qstars, recordRecall, okN: TOPICS.filter(t => status(t.id).kind === 'ok').length,
    dueN: TOPICS.filter(t => status(t.id).kind === 'dmg').length };
}

/* ---------- 主動回想：答案先遮住，再逐步自評 ---------- */
function RecallSession({ id, game, tts, onClose, onRead }) {
  const t = TOPICS.find(x => x.id === id);
  const steps = useMemo(() => recallSteps(t), [id]);
  const [i, setI] = useState(0);
  const [shown, setShown] = useState(false);
  const [marks, setMarks] = useState([]);
  const [result, setResult] = useState(null);
  const btnRef = useRef(null);
  const pctOf = m => Math.round(m.length / steps.length * 100);
  useEffect(() => {
    const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
    const origin = document.activeElement;
    const f = e => {
      if (e.key === 'Escape') onClose();
      if (e.key === 'Tab') {
        const nodes = [...document.querySelectorAll('.battle button:not(:disabled), .battle a[href]')];
        const first = nodes[0], last = nodes[nodes.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last?.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first?.focus(); }
      }
    };
    addEventListener('keydown', f);
    return () => { document.body.style.overflow = prev; removeEventListener('keydown', f); if (origin?.isConnected) origin.focus(); };
  }, []);
  useEffect(() => { if (btnRef.current) btnRef.current.focus(); }, [i, shown, result]);
  const step = steps[i];
  const speaking = tts.currentKey === 'atk' && tts.player && tts.player.playing;
  const judge = ok => {
    if (tts.player) tts.stop();
    const m = [...marks]; m[i] = ok; setMarks(m);
    if (i + 1 < steps.length) { setI(i + 1); setShown(false); return; }
    const complete = m.length === steps.length && m.every(Boolean);
    setResult({ wrong: steps.filter((s, k) => !m[k]), ...game.recordRecall(id, complete) });
  };
  const restart = () => { setI(0); setShown(false); setMarks([]); setResult(null); };
  const msg = !result ? '' : result.complete
    ? `這次全部講對了。下次複習：${mdText(result.due)}。`
    : '先看需要補強的內容，再遮住答案說一次。這個主題已加入待複習。';
  const head = result ? '回想結果' : '回想練習';
  return html`<div className="battle" role="dialog" aria-modal="true" aria-label=${`${head}：${t.short}`}>
    <div className="bcard">
      <div className="bhead">
        <h2 className="gtitle">${head}：${t.short}</h2>

        <button className="pbtn" aria-label="關閉回想練習" onClick=${onClose}><${StopI} /></button>
      </div>
      ${!result ? html`<div className="bbody">
        <div>
          <div className="dbar"><i style=${{ width: pctOf(marks) + '%' }}></i></div>
          <div className="bstep">第 ${i + 1}／${steps.length} 項・開場句 → 重點 → 易錯提醒</div>
        </div>
        <div className="bq">${step.title}</div>
        <div className="bprompt">${step.prompt}</div>
        ${!shown ? html`<button ref=${btnRef} className="btn primary" style=${{ minHeight: '54px', justifyContent: 'center', fontSize: '17px' }} onClick=${() => setShown(true)}>我講完了，揭曉答案</button>`
          : html`<div className="bans">${Array.isArray(step.ans) ? html`<ul>${step.ans.map(x => html`<li key=${x}>${x}</li>`)}</ul>` : step.ans}</div>
            <div className="bacts">
              <button ref=${btnRef} className="btn primary" onClick=${() => judge(true)}>講對了</button>
              <button className="btn red" onClick=${() => judge(false)}>沒講對</button>
            </div>
            <div><button className="link" disabled=${!tts.supported} onClick=${() => speaking ? tts.pause() : tts.play([{ key: 'atk', label: `${t.short}：${step.title}`, text: ansText(step.ans) }])}>${speaking ? '停止朗讀' : '聽答案'}</button></div>`}
        <p className="note" style=${{ margin: 0 }}>判定要誠實：關鍵字和意思都講到才算「講對了」。</p>
      </div>` : html`<div className="bbody bres">

        <div className="big">${result.complete ? '這次都記住了' : '再複習一下'}</div>
        <div>能獨立說出的項目：${marks.filter(Boolean).length}／${steps.length}</div>
        <p className="msg">${msg}</p>

        const n = QUESTIONS.filter(q => inTopic(q, t.id)).length;
        const st = game.status(t.id);
        if ((selected !== 'all' && selected !== t.id) || (onlyDue && st.kind !== 'dmg') || (query.trim() && ![t.title, t.open, ...t.pts.flat(), ...t.traps].join(' ').toLowerCase().includes(query.trim().toLowerCase()))) return null;
        return html`<article className=${'sheet topic' + (cur === key && tts.player ? ' playing' : '') + (st.kind === 'ok' ? ' isknown' : '')} id=${key} key=${t.id} data-module=${moduleOf(t.id)}>
          <header className="thead"><div className="topic-heading"><div className="tmod"><span className="topic-chapter">${t.mod}</span><span className=${'study-status ' + st.kind}>${studyLabel(st)}</span></div><div className="topic-title"><span className="tno">${String(i + 1).padStart(2, '0')}</span><h2>${t.title}</h2></div></div><${ChapterArt} kind=${moduleOf(t.id)} /></header>
          <div className="tacts">
            <button className=${'btn ' + (playing ? 'on' : 'ghost')} disabled=${!tts.supported} onClick=${() => playing ? tts.pause() : tts.play([lists.all[i]])}>${playing ? html`<${PauseI} />暫停` : html`<${Speaker} />朗讀`}</button>
            <button className="btn primary" onClick=${() => onAttack(t.id)}>回想練習</button>
            <button className="btn" onClick=${() => onPractice(t.id)}>口試題（${n}）→</button>
          </div>
          <div className=${'open' + (rp === 'open' ? ' reading' : '')} id=${key + '-open'}><span className="tag">口試開場句</span><p>${t.open}</p></div>
          <h3 className="reading-label"><span className="section-number">01</span> 圖解</h3><figure className="figure-wrap"><div className="fig">${FIGS[t.fig]()}</div><figcaption>圖解 ${String(i + 1).padStart(2, '0')}｜${t.title}</figcaption></figure><${ConceptMap} t=${t} /><h3 className="reading-label"><span className="section-number">03</span> 重點整理</h3>
          <dl className="pts">${t.pts.map(([h, d], pi) => html`<div key=${h} id=${key + '-pt-' + pi} className=${rp === 'pt-' + pi ? 'reading' : undefined}><dt><span className="point-number">${String(pi + 1).padStart(2, '0')}</span>${h}</dt><dd>${d}</dd></div>`)}</dl>
          <h3 className="reading-label"><span className="section-number">04</span> 概念配對</h3><${ConceptMatch} t=${t} />
          ${t.traps.length > 0 && html`<div className=${'traps' + (rp === 'traps' ? ' reading' : '')} id=${key + '-traps'}><b><span aria-hidden="true">！</span> 易錯提醒</b><ul>${t.traps.map(x => html`<li key=${x}>${x}</li>`)}</ul></div>`}
          <div className="topic-end"><button className="btn primary" onClick=${() => onAttack(t.id)}>開始回想練習 →</button></div>
        </article>`;
      })}
    </div>
  </div>`;
}

/* ---------- 口試練習頁 ---------- */
function Practice({ tts, game, topic, setTopic }) {
  const [qid, setQid] = useState(() => load('qid', 1));
  const [drafts, setDrafts] = useState(() => load('drafts', null) || { 1: SAMPLE });
  const [scores, setScores] = useState(() => load('scores', {}));
  const [graded, setGraded] = useState(() => {
    const d = load('drafts', null) || { 1: SAMPLE }; const id = load('qid', 1);
    return d[id] ? { [id]: d[id] } : {};
  });
  const [hints, setHints] = useState(false);
  const [sec, setSec] = useState(0);
  const [running, setRunning] = useState(false);
  const [undo, setUndo] = useState(null);
  const stt = useSTT();
  useWakeLock(stt.on);
  const list = useMemo(() => QUESTIONS.filter(q => inTopic(q, topic)), [topic]);
  const quizList = useMemo(() => list.map(questionQuiz), [list]);
  const q = list.find(x => x.id === qid) || list[0];
  const pos = list.indexOf(q);
  const text = drafts[q.id] || '';

  useEffect(() => save('drafts', drafts), [drafts]);
  useEffect(() => save('scores', scores), [scores]);
  useEffect(() => { save('qid', q.id); setSec(0); setRunning(false); setHints(false); if (stt.on) stt.stop(); }, [q.id]);
  // 語音聽考念到哪一題，畫面就切到那一題。
  useEffect(() => {
    const k = tts.currentKey;
    if (k && k.startsWith('qq-')) { const id = +k.slice(3); if (id !== q.id && list.some(x => x.id === id)) setQid(id); }
  }, [tts.currentKey]);
  useEffect(() => { if (!running) return; const t = setInterval(() => setSec(s => s + 1), 1000); return () => clearInterval(t); }, [running]);

  const result = useMemo(() => graded[q.id] != null ? grade(q, graded[q.id]) : null, [q, graded]);
  const gradedText = graded[q.id];
  const stale = gradedText != null && gradedText !== text;
  const modelLayers = useMemo(() => result ? matchKeywords(q, q.model).kws.map((k, i) => ({ spans: k.spans, status: result.kws[i].status })) : [], [q, result]);

  const go = id => { setQid(id); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const setText = v => setDrafts(d => ({ ...d, [q.id]: v }));
  const gradeNow = (id, t) => {
    const total = grade(QUESTIONS.find(x => x.id === id), t).total;
    setGraded(g => ({ ...g, [id]: t })); setScores(s => ({ ...s, [id]: total }));
  };
  const doGrade = () => { gradeNow(q.id, text); setRunning(false); };
  // 口說作答：「重新口說」先清空（保留一次復原），「接著說」接在原本的文字後面；說完自動檢查。
  const hasText = !!text.trim() && text !== SAMPLE;
  const talk = more => {
    if (tts.player) tts.stop();
    const id = q.id, prev = text === SAMPLE ? '' : text;
    const base = more && prev.trim() ? prev.replace(/\s+$/, '') + '\n' : '';
    const ok = stt.start({
      onText: t => setDrafts(d => ({ ...d, [id]: base + t })),
      onDone: t => { setRunning(false); if (t.trim()) { setDrafts(d => ({ ...d, [id]: base + t })); gradeNow(id, base + t); } },
    });
    if (!ok) return;
    if (!more) { setUndo(prev.trim() ? { id, text: prev } : null); setDrafts(d => ({ ...d, [id]: '' })); setSec(0); }
    setRunning(true);
  };
  const quizOn = !!(tts.player && tts.player.playing && tts.currentKey && tts.currentKey.startsWith('qq-'));
  const listen = (key, label, body) => { if (stt.on) stt.stop(); if (speaking(key)) tts.pause(); else tts.play([{ key, label, text: body }]); };
  const draw = () => {
    if (list.length < 2) return;
    // 優先抽需要補強的題目；舊版最佳紀錄仍計入。
    const weak = list.filter(x => x.id !== q.id && !((scores[x.id] || 0) >= 90 || (game.qstars[x.id] || 0) >= 3));
    const pool = weak.length ? weak : list.filter(x => x.id !== q.id);
    go(pool[Math.floor(Math.random() * pool.length)].id);
  };
  const mmss = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
  const charCount = text.replace(/\s/g, '').length;
  const doneN = Object.keys(scores).length, goodN = QUESTIONS.filter(x => ((scores[x.id] || 0) >= 90 || (game.qstars[x.id] || 0) >= 3)).length;
  const qKey = 'q-' + q.id, mKey = 'm-' + q.id;
  const speaking = k => tts.currentKey === k && tts.player && tts.player.playing;

  const advice = [];
  if (result) {
    const miss = result.kws.filter(k => k.status !== 'hit');
    if (miss.length) advice.push(`先補上關鍵字：${miss.map(k => k.label.replace(/\(.*?\)/g, '')).join('、')}。每一段的第一句就講出來，老師才聽得到。`);
    if (result.found && !result.frontOk) advice.push('關鍵字出現得太晚：開頭先把核心概念講一遍，再逐一解釋。');
    if (result.defScore < 1) advice.push('定義講得不夠：多用「○○是指……」「也就是……」把每個概念講清楚。');
    if (result.exScore < 1) advice.push(`補上課堂實例：${q.exampleHint}`);
    if (!advice.length) advice.push('結構完整：關鍵字 → 定義 → 實例都有了。不看範本再講一次，控制在 3 分鐘內。');
  }

  return html`<div>
    <div className="pbar">
      <div className="pfilter">
        <label htmlFor="tsel" className="meta">主題</label>
        <select id="tsel" value=${topic} onChange=${e => setTopic(e.target.value)}>
          <option value="all">全部主題（${QUESTIONS.length} 題）</option>
          ${TOPICS.map((t, i) => html`<option key=${t.id} value=${t.id}>${String(i + 1).padStart(2, '0')} ${t.title}（${QUESTIONS.filter(x => inTopic(x, t.id)).length}）</option>`)}
        </select>
        <button className="btn primary" onClick=${draw}>隨機抽題</button>
      </div>
      <div className="pfilter">
        <button className="btn" aria-label="上一題" disabled=${pos <= 0} onClick=${() => go(list[pos - 1].id)}>‹</button>
        <select id="qsel" value=${q.id} onChange=${e => go(+e.target.value)} aria-label="選擇題目">
          ${list.map(x => html`<option key=${x.id} value=${x.id}>${x.id}. ${x.category}（${x.type}）${scores[x.id] != null ? '・' + scores[x.id] + '分' : ''}</option>`)}
        </select>
        <button className="btn" aria-label="下一題" disabled=${pos >= list.length - 1} onClick=${() => go(list[pos + 1].id)}>›</button>
      </div>
      <div>
        <div className="progress" aria-label="練習進度">${list.map(x => html`<i key=${x.id} title=${x.id + '. ' + x.category} className=${(scores[x.id] != null || game.qstars[x.id] ? 'done' : '') + (x.id === q.id ? ' cur' : '')}></i>`)}</div>
        <span className="meta">全部 ${QUESTIONS.length} 題：已練 ${doneN} 題，曾達 90 分 ${goodN} 題。隨機抽題會優先抽需要補強的題目。</span>
      </div>
      ${tts.supported && html`<div className="pfilter quiz-acts">
        <button className=${'btn ' + (quizOn ? 'on' : '')} onClick=${() => { if (quizOn) { tts.pause(); return; } if (stt.on) stt.stop(); tts.play(quizList, pos); }}>${quizOn ? html`<${PauseI} />暫停聽考` : html`<${Speaker} />語音聽考：從第 ${q.id} 題開始（${list.length - pos} 題）`}</button>
        <label className="gap-field" htmlFor="gap-practice">作答時間<${GapSelect} tts=${tts} id="gap-practice" /></label>
      </div>`}
    </div>
    <div className="grid2">
      <section className="sheet sticky" aria-label="作答區">
        <div className="qhead"><span className="num">第 ${q.id} 題</span><span className="type">${q.type}</span><span>${topicName(q.topic)}</span></div>
        <p className="qtext">${q.question}</p>
        <div className="hintbar">
          <button className=${'btn ' + (speaking(qKey) ? 'on' : 'ghost')} disabled=${!tts.supported} onClick=${() => listen(qKey, `第 ${q.id} 題題目`, q.question)}>
            ${speaking(qKey) ? html`<${PauseI} />停止` : html`<${Speaker} />聽題目`}</button>
          <button className="link" onClick=${() => setHints(h => !h)}>${hints ? '收起關鍵字提示' : '偷看關鍵字提示'}</button>
        </div>
        ${hints && html`<div className="kwhint">${q.keywords.map(k => html`<span key=${k.label}>${k.label}</span>`)}</div>`}
        ${q.id === 1 && text === SAMPLE && html`<p className="samplenote">↓ 這是範例回答（故意漏了幾個關鍵字），可直接清空換成你自己的。</p>`}
        <label htmlFor="answer" className="meta">${stt.supported ? '你的口試回答（按「開始口說」直接說，也可以打字）' : '你的口試回答（對著麥克風講，用聽寫轉成文字；也可以打字）'}</label>
        ${stt.supported && html`<div className="mic-row">
          ${stt.on ? html`<button className="btn rec" onClick=${() => stt.stop()}><${StopI} />停止並檢查</button><span className="rec-dot" role="status">收音中</span>`
            : hasText ? html`<button className="btn primary" onClick=${() => talk(false)}><${MicI} />重新口說</button><button className="btn" onClick=${() => talk(true)}><${MicI} />接著說</button>`
            : html`<button className="btn primary" onClick=${() => talk(false)}><${MicI} />開始口說</button>`}
          ${!stt.on && undo && undo.id === q.id && html`<button className="link" onClick=${() => { setText(undo.text); setUndo(null); }}>復原口說前的文字</button>`}
        </div>`}
        ${stt.err && html`<p className="mic-warn" role="alert">${stt.err}</p>`}
        <textarea id="answer" className=${'answer' + (stt.on ? ' listening' : '')} value=${text} readOnly=${stt.on} onChange=${e => setText(e.target.value)}
          placeholder=${stt.on ? '正在聽你說……' : '先講關鍵字，再講定義，最後舉課堂例子……'}></textarea>
        <div className="toolbar">
          <button className="btn primary" disabled=${stt.on} onClick=${doGrade}>檢查回答</button>
          <button className="btn" disabled=${stt.on} onClick=${() => setText('')}>清空</button>
          <span className="spacer"></span>
          <span className="meta">${charCount} 字</span>
          <span className="timer">${mmss}</span>
          <button className="btn" onClick=${() => setRunning(r => !r)}>${running ? '暫停' : '計時'}</button>
          <button className="btn" onClick=${() => { setSec(0); setRunning(false); }}>歸零</button>
        </div>
        <p className="tip">${stt.supported
          ? '講完按「停止並檢查」，會自動比對關鍵字。iPhone 要先開啟聽寫（設定 → 一般 → 鍵盤 → 啟用聽寫）並連上網路；術語聽錯可以直接改字，再按「檢查回答」。草稿只存在這台裝置。'
          : '口說作答：iPhone、Android 點輸入框後按鍵盤上的麥克風；Mac 連按兩下 Fn 開啟聽寫。講完按「檢查回答」，看看有沒有漏掉重點。草稿只存在這台裝置。'}</p>
      </section>

      <section className="sheet" aria-label="批改結果" aria-live="polite">
        ${!result ? html`<div className="empty">講完按「檢查回答」，這裡會用紅筆標出漏掉的關鍵字，並對照滿分範本。</div>` : html`<div>
          ${stale && html`<div className="stale">回答已修改，按「檢查回答」更新結果。</div>`}
          <div className="score">
            <div className="big">${result.total}<small> / 100</small></div>
            <div className="bar"><span>基本分・關鍵字</span><span className="track"><i style=${{ width: (result.base / 50 * 100) + '%' }}></i></span><span className="pt">${Math.round(result.base)}/50</span></div>
            <div className="bar"><span>滿分・定義實例</span><span className="track"><i style=${{ width: (result.elab / 50 * 100) + '%' }}></i></span><span className="pt">${Math.round(result.elab)}/50</span></div>
          </div>
          <div className="chk">
            <span className=${result.frontOk ? 'ok' : 'no'}>${result.frontOk ? '✓' : '✗'} 關鍵字先講</span>
            <span className=${result.defScore >= 1 ? 'ok' : 'no'}>${result.defScore >= 1 ? '✓' : '✗'} 定義句 ${result.defCount} 處</span>
            <span className=${result.exScore >= 1 ? 'ok' : 'no'}>${result.exScore >= 1 ? '✓' : '✗'} 實例${result.exTerms.length ? '：' + result.exTerms.slice(0, 4).join('、') : (result.exMarker ? '（有「例如」但沒講課堂例子）' : '（沒有舉例）')}</span>
          </div>
          <h3 className="secttl">核心關鍵字 <small>命中 ${result.kws.filter(k => k.status === 'hit').length} ／ ${result.kws.length}</small></h3>
          <ul className="kwlist">
            ${result.kws.map(k => html`<li key=${k.label}>
              <span className=${'pill ' + k.status}>${{ hit: '✓ 命中', partial: '△ 部分', miss: '✗ 漏掉' }[k.status]}</span>
              <span>${k.label}${k.lack.length > 0 && html`<span className="lack">缺：${k.lack.join('、')}</span>`}</span>
            </li>`)}
          </ul>
          <h3 className="secttl">怎麼補分</h3>
          <ul className="advice">${advice.map((a, i) => html`<li key=${i}>${a}</li>`)}</ul>
          <h3 className="secttl">你的回答 <span className="legend"><span><i style=${{ background: 'var(--hl)' }}></i>命中</span><span><i style=${{ borderBottom: '2px solid var(--partial)' }}></i>部分命中</span></span></h3>
          ${gradedText ? html`<${Marked} text=${gradedText} hand=${true} prefix="m-" layers=${result.kws.map(k => ({ spans: k.spans, status: k.status === 'miss' ? 'hit' : k.status }))} />` : html`<p className="meta">（空白）</p>`}
          <h3 className="secttl">滿分範本
            <button className=${'btn ' + (speaking(mKey) ? 'on' : '')} disabled=${!tts.supported} onClick=${() => listen(mKey, `第 ${q.id} 題滿分範本`, q.model)}>${speaking(mKey) ? html`<${PauseI} />停止` : html`<${Speaker} />聽範本`}</button>
            <span className="legend"><span><i style=${{ background: 'var(--miss-bg)', outline: '1px solid var(--redpen)' }}></i>你漏掉的</span><span><i style=${{ background: 'var(--partial-bg)' }}></i>部分</span><span><i style=${{ background: 'var(--hit-bg)' }}></i>已命中</span></span></h3>
          <${Marked} text=${q.model} prefix="mm-" layers=${modelLayers} />
          <p className="disclaim">估計分只依字面比對關鍵字與句型，用來檢查有沒有漏講，實際給分以老師判斷為準。第 1～6 題來自課堂題庫，第 7～46 題依課堂知識庫補充，第 47～49 題依 10/28 課堂補充。</p>
        </div>`}
      </section>
    </div>
  </div>`;
}

/* ---------- 底部播放列 ---------- */
const RATES = [0.8, 0.9, 1, 1.1, 1.2, 1.3, 1.5];
function Player({ tts }) {
  const p = tts.player, ref = useRef(null);
  // 播放列高度隨字幕變動：寫進 --player-h，頁面底部留出同樣的空間。
  useEffect(() => {
    const el = ref.current, root = document.documentElement;
    if (!el) return;
    const put = () => root.style.setProperty('--player-h', el.offsetHeight + 'px');
    put();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(put) : null;
    if (ro) ro.observe(el);
    return () => { if (ro) ro.disconnect(); root.style.removeProperty('--player-h'); };
  }, [!!p]);
  if (!p) return null;
  const it = p.items[p.idx];
  const gap = p.phase === 'gap' && !p.ended;
  const status = p.error ? p.error : p.ended ? '播放完畢' : !p.playing ? (gap && p.left >= 0 ? `已暫停・作答剩 ${p.left} 秒` : '已暫停')
    : gap ? (p.left < 0 ? '換你說，說完按「揭曉」' : `換你說・剩 ${p.left} 秒`)
    : p.quiz ? (p.part === 'a' ? '答案' : '題目') : `第 ${p.unit + 1}／${p.total} 句`;
  return html`<div className="player" role="region" aria-label="朗讀播放" ref=${ref}>
    <div className="in">
      <div className="now"><b>${it.label}</b><span className=${p.error ? 'warnline' : undefined}>${p.items.length > 1 ? `${p.idx + 1}／${p.items.length}・` : ''}${status}</span></div>
      ${gap && p.playing && p.left >= 0 && p.gapTotal > 0 && html`<div className="dbar countdown" aria-hidden="true"><i style=${{ width: (p.left / p.gapTotal * 100) + '%' }}></i></div>`}
      ${p.phase === 'say' && p.line && !p.ended && html`<p className="line">${p.line}</p>`}
      ${p.items.length > 1 && html`<button className="pbtn" aria-label="上一個" onClick=${() => tts.jump(-1)}><${PrevI} /></button>`}
      <button className="pbtn main" aria-label=${p.playing ? '暫停' : '播放'} onClick=${() => p.playing ? tts.pause() : tts.resume()}>${p.playing ? html`<${PauseI} />` : html`<${PlayI} />`}</button>
      ${p.items.length > 1 && html`<button className="pbtn" aria-label="下一個" onClick=${() => tts.jump(1)}><${NextI} /></button>`}
      ${gap && html`<button className="btn primary reveal" onClick=${tts.reveal}>揭曉</button>`}
      <select className="hide-sm" aria-label="語速" value=${tts.rate} onChange=${e => tts.setRate(+e.target.value)}>
        ${RATES.map(r => html`<option key=${r} value=${r}>${r}×</option>`)}
        ${!RATES.includes(tts.rate) && html`<option value=${tts.rate}>${tts.rate}×</option>`}
      </select>
      <button className="pbtn" aria-label="關閉播放" onClick=${tts.stop}><${StopI} /></button>
    </div>
  </div>`;
}

/* ---------- 考古題：林俊瑩《學習評量》教檢題庫 198 題（原題號 1～200，缺 93、137），答案與解析為研讀版，非正式公布答案 ---------- */
// n 題號、q 題幹、o 四個選項、a 正解字母（空字串＝題意有疑義、不計分）、al 答案說明、c 概念、e 解析、p 講義頁碼、x 補充提醒
const MCQ = [{"n":1,"q":"根據試題分析，某一試題的鑑別度為-0.2。對此結果的解釋，哪一項是合理的？","o":["題目品質良好","能準確的測出學習目標","高分組的表現優於低分組","高分組可能對題目有所誤解"],"a":"D","al":"D","c":"負鑑別度","e":"鑑別度 D＝高分組答對率－低分組答對率。D＝-0.2 表示高分組答對率反而低 20 個百分點，可能有題意模糊、誤設答案或高分組過度解讀等問題，因此 D 合理。A、B 無法由負鑑別度支持；C 恰好與數值相反。","p":"71-74","u":"item","k":"鑑別度（D）是看一道題能不能把「學會的人」和「沒學會的人」分開。做法是把全班依總分排序，取前 27% 當高分組、後 27% 當低分組，D＝高分組答對率 PH－低分組答對率 PL。一道好題目應該是程度好的人比較常答對，D 為正值且越大越好。如果 D 是負的，代表程度好的人反而比較常答錯，這是警訊。比喻：像一把篩子本來要留下大顆的石頭，結果大顆的都漏掉、小顆的反而留下，篩子一定有破洞。常見原因是題意模糊、答案設錯，或高分組想得太深、讀出另一種解法。","s":["先寫公式：D＝PH－PL。","代入 D＝-0.2：高分組答對率比低分組低 20 個百分點，例如 PH＝.30、PL＝.50。","高分組反而輸給低分組，最合理的解釋是題目本身有瑕疵，讓會的人產生誤解，所以選 D。"],"w":{"A":"✗ 負鑑別度表示這題把學生反向區分，是品質不良的題目，應檢討或修改。","B":"✗ 連會與不會都分不開、甚至顛倒，無法支持它準確測到學習目標，效度也有疑問。","C":"✗ 剛好相反；D 為負表示低分組答對率高於高分組。","D":"✓ 高分組答錯較多，常見原因是高分組對題意有不同解讀、過度推想，或答案本身設錯。"},"m":"D 為正：強者答對多；D 為負：題目先檢討。"},{"n":2,"q":"某市的學力檢測，將學生分成待關心、基礎及精熟三個等級。試問某市採取的是哪一種評量？","o":["形成性","安置性","標準參照","常模參照"],"a":"C","al":"C","c":"標準參照","e":"「待關心、基礎、精熟」是依達成標準解釋學習表現，屬標準參照。常模參照重點是與他人比較名次；形成性與安置性則依評量目的分類，題幹沒有提供足以判定這兩者的資訊。","p":"12-14、30","u":"reference","k":"解釋分數有兩把尺。常模參照是「跟別人比」，看你在團體中的相對位置，例如名次、百分等級；講義舉的例子是學測的等級。標準參照（又稱效標參照）是「跟標準比」，教學前先訂好門檻，看你有沒有達到，例如全民英檢通過或不通過。比喻：駕照考試只要達到規定就發照，不管同場其他人考得多好。題目把學生分成待關心、基礎、精熟三級，是依事先訂好的表現標準分級，不是看名次，所以是標準參照。","s":["抓題幹關鍵字「待關心、基礎、精熟」：這是依達成程度分等，不是排名次。","對照定義：依預先設定的標準解釋表現，就是標準參照。","形成性、安置性是依評量時機與目的分類，題幹沒有提供這方面資訊，排除。"],"w":{"A":"✗ 形成性評量是依「教學中掌握進度」的目的分類，題幹沒有說明評量時機與用途。","B":"✗ 安置性評量是教學前了解預備情形以便分組或安排起點，題幹沒有這個用途。","C":"✓ 等級是依事先訂好的精熟標準判定，看的是有沒有達到標準，屬標準參照。","D":"✗ 常模參照重在和他人比較的相對位置，例如 PR 或名次，題幹的等級不是這樣來的。"},"m":"跟別人比是常模，跟門檻比是標準。"},{"n":3,"q":"下列哪一個情境最接近真實評量？","o":["讓學生寫出課文心得，以評量其情意反應","讓低年級學生到商店買東西，以評量其算數能力","課堂中讓全班學生大聲朗讀，以評量其識字程度","讓學生觀賞地震演習的影片，評量其逃生觀念與技巧"],"a":"B","al":"B","c":"真實評量","e":"到商店買東西時實際運用計算，任務與生活用途直接相連，最符合真實評量。A 的心得可作評量資料，但未直接呈現生活應用；C 全班朗讀不易判斷個別識字能力；D 看影片未必能證明實際逃生技巧。","p":"75-77、87","u":"alt","k":"真實評量是讓學生在真實生活情境中展現能力，重視的是「學了能不能用」的實質內容，而不是形式上的紙筆作答。講義的例子是：學外語，要看將來能不能真的和外國人交談。它和實作評量很接近，講義說實作評量就是一種真實性評量，但真實評量更強調情境要貼近真實生活。比喻：評量游泳能力，真實評量是讓你下水游一段，而不是寫一張游泳知識考卷。題目中讓低年級學生到商店買東西，就是把算數放進真正的生活任務裡。","s":["抓關鍵字「最接近真實評量」：找任務最貼近真實生活、而且直接看到能力的選項。","逐項檢查：心得、朗讀、看影片都不是在真實情境中使用該能力。","到商店付錢找零，直接在生活中使用算數，選 B。"],"w":{"A":"✗ 寫心得是書面作品，可評量情意反應，但不是在真實生活情境中展現能力。","B":"✓ 買東西時要算價錢、找零，算數能力在真實生活任務中直接被看見。","C":"✗ 全班一起大聲朗讀，聽不清個別學生的識字程度，也不是生活情境。","D":"✗ 看影片只是接收資訊，看不到學生實際的逃生動作，要真的參與演習才算真實。"},"m":"真實評量：到生活現場真的做，不是紙上談兵。"},{"n":4,"q":"下列有關測驗(test)、測量(measurement)、評量(assessment)、評鑑(evaluation)的敘述，何者最為正確？","o":["測驗以客觀計分為主，評量以主觀計分為主","測驗、測量、評量和評鑑都以數字來呈現其結果","教育領域所用的標準化紙筆測驗大多屬於間接測量","測驗是用在教育、心理領域，測量是用在自然科學領域"],"a":"C","al":"C","c":"測驗與測量","e":"紙筆測驗以作答反應推論知識或心理特質，無法直接觀察特質本身，故多屬間接測量。A 把客觀／主觀當成定義不妥；B 忽略質性資料；D 錯把測量限定在自然科學。","p":"2-3、35-37","x":"講義第 3 頁「測驗／測量」前兩列定義疑似對調。應記：測驗是取得反應的工具或程序；測量是依規則賦予數值。","u":"terms","k":"這四個詞層次不同。測驗（test）是取得反應的工具或程序，像一份考卷；測量（measurement）是依規則把表現轉成數值，像拿尺量身高；評量（assessment）是蒐集、統整各種資料（數字或文字描述都可以），幫助老師做教學決定，講義寫作「評定」；評鑑（evaluation）是依標準做價值判斷，講義寫作「評量」，例如 80 分本身沒意義，依標準判定為優秀才有意義。重要提醒：講義第 3 頁「測驗」「測量」前兩列的定義疑似對調，應記成測驗是取得反應的工具或程序，測量是依規則賦予數值。另外，知識和能力看不見，只能從作答反應去推論，所以紙筆測驗多屬間接測量。比喻：從體溫計讀數推論是否發燒，而不是直接看到病毒。","s":["先釐清四個詞：測驗是工具、測量是賦值、評量是蒐集統整、評鑑是價值判斷。","逐項檢查：A、D 用錯誤的標準區分；B 忽略文字、質性資料。","能力本身看不見，要從作答推論，C 正確。"],"w":{"A":"✗ 測驗也可以主觀計分（如申論題），評量也可用客觀資料；客觀或主觀不是兩者的區分標準。","B":"✗ 評量、評鑑也可以用文字描述或質性資料呈現，不一定都是數字。","C":"✓ 心理特質無法直接觀察，紙筆測驗是從作答反應推論能力，屬間接測量。","D":"✗ 測量也廣泛用在教育與心理領域（如智力、成就），不限於自然科學。"},"m":"測驗是工具，測量給數字，評量蒐資料，評鑑下判斷。"},{"n":5,"q":"下列有關信度、效度和鑑別度的敘述，何者正確？","o":["內容效度較適合使用於人格測驗","重測信度的高低會受到間隔時間長短的影響","學生異質性比較高的班級，測驗分數的信度會因此而較低","補救教學的評量應該強調高鑑別度，以期有效區分學生程度"],"a":"B","al":"B","c":"信度與效度","e":"重測間隔太短可能受記憶影響，太長則可能出現學習或發展變化，因此 B 正確。人格測驗常重視建構效度；在其他条件相同時，異質性提高通常有利於信度；補救教學評量重點是找出困難與確認精熟，並非追求最高鑑別度。","p":"38、48-49、56","u":"reliability","k":"三個名詞先分清：信度是測驗結果的一致性（穩不穩），效度是有沒有測到想測的東西（準不準），鑑別度是一道題能不能分開高分者和低分者。重測信度是同一份測驗隔一段時間再測一次，算兩次分數的相關。講義提醒：間隔太短，學生還記得答案、有練習效果，信度會偏高；間隔太長，學生已經長大、學了新東西，信度會降低。比喻：量體重，早上量完立刻再量一定很一致；隔半年再量，就會因為真的變胖或變瘦而不同。所以重測信度一定受間隔時間影響。","s":["逐項對照講義：內容效度最適合哪種測驗？影響信度的因素有哪些？","重測信度講義明寫「間隔越短信度越高、越長越低」，B 正確。","再確認 C 與講義「異質性越高、信度越高」相反，D 搞錯補救教學的目的。"],"w":{"A":"✗ 內容效度看題目是否代表教學內容，講義說成就測驗最需要；人格測驗較重視建構效度。","B":"✓ 間隔太短受記憶、練習影響而偏高，間隔太長受成長、學習影響而偏低。","C":"✗ 講義說團體異質性越高，分數越分散，信度越高；說成較低剛好相反。","D":"✗ 補救教學重在找出困難、確認是否達到基本標準，是標準參照的想法，不追求高鑑別度。"},"m":"重測看間隔：太近靠記憶偏高，太遠因成長偏低。"},{"n":6,"q":"一項測驗若以其編製所依據的理論考驗效度，此效度稱為下列何者？","o":["建構效度","內容效度","表面效度","效標關聯效度"],"a":"A","al":"A","c":"建構效度","e":"用編製時所依據的理論架構，檢查測驗是否反映預期心理特質，是建構（構念）效度。內容效度看題目能否代表內容範圍；表面效度是表面上看來是否適合；效標關聯效度則比較測驗分數與外部效標。","p":"37-38、59","u":"validity","k":"效度是測驗有沒有測到它想測的東西。講義把效度分三大類：內容效度看題目能不能代表要教的內容範圍；效標關聯效度看測驗分數和外在標準（效標）的相關，又分同時效度與預測效度；建構效度（又稱構念效度）看測驗是否真的反映理論中的抽象特質。構念是看不見的抽象概念，例如創造力、焦慮，必須依理論明確定義才能測量。比喻：照著設計圖蓋房子，蓋好後拿設計圖逐一比對，看結構是否吻合。題幹說「以其編製所依據的理論考驗效度」，就是建構效度。","s":["抓關鍵字「編製所依據的理論」。","對照三類效度：看理論架構是建構效度，看內容範圍是內容效度，看外在效標是效標關聯效度。","所以選 A。"],"w":{"A":"✓ 用編製時依據的理論架構，檢驗測驗是否反映該構念，就是建構效度。","B":"✗ 內容效度檢查題目能否代表教學內容範圍，常用專家判斷與雙向細目表，不是用理論考驗。","C":"✗ 表面效度只是外表看起來像在測該特質，是非正式的印象，不是理論檢驗。","D":"✗ 效標關聯效度是拿測驗分數和外在效標（如未來成績）求相關，不是依理論。"},"m":"看到理論想建構，看到效標想相關，看到內容範圍想細目表。"},{"n":7,"q":"小英的自我概念量表總分之 T 分數為 40，相當於百分等級多少？","o":["84","60","50","16"],"a":"D","al":"D","c":"T 分數轉百分等級","e":"先算 z＝(T－50)÷10＝(40－50)÷10＝-1。常態分配中，z＝-1 左側約占 15.87%，所以 PR 約 16。84 是 z＝+1 的累積百分比；50 對應平均數。注意百分等級不是答對率。","p":"32-33","u":"normal","k":"T 分數是把 z 分數換成平均 50、標準差 10 的量尺：T＝50＋10z。z 分數是「離平均幾個標準差」，正數高於平均、負數低於平均。百分等級（PR）是「贏過團體中百分之幾的人」。常態分配下，平均數上下 1 個標準差各占 34.13%，所以 z＝-1 以下約剩 15.87%，講義常態曲線上標的 16% 和 84% 就是這兩個位置。比喻：T40 就像身高比班上平均矮了一個「標準身高差」，大約只高過 16% 的同學。","s":["由 T＝50＋10z 反推 z：z＝(T－50)÷10＝(40－50)÷10＝-1。","常態分配中 z＝-1 以下的面積：50%－34.13%＝15.87%。","四捨五入，PR≈16，選 D。"],"w":{"A":"✗ 84 是 z＝+1（T＝60）時的百分等級，方向剛好弄反了。","B":"✗ 60 是高於平均 1 個標準差的 T 分數數字，不是百分等級，而且方向也相反。","C":"✗ PR50 對應平均數（T＝50），T40 低於平均，PR 一定小於 50。","D":"✓ T40 就是 z＝-1，下方約占 15.87%，所以 PR 約 16。"},"m":"T40、T50、T60 對應 PR16、PR50、PR84。"},{"n":8,"q":"小達在魏氏兒童智力量表(WISC-III)的總智商是 115，請問相當於 T 分數多少？","o":["60","70","84","95"],"a":"A","al":"A","c":"魏氏智商轉 T 分數","e":"魏氏離差智商採平均數 100、標準差 15。z＝(115－100)÷15＝1，再換成 T＝50＋10×1＝60。不能把 IQ 的 15 分差直接加到 T 分數上；兩種量尺的標準差不同。","p":"18、32-33","u":"iq","k":"魏氏智力測驗用離差智商：把同年齡兒童的分數轉成平均 100、標準差 15 的量尺。T 分數則是平均 50、標準差 10。不同量尺不能直接加減比較，要先換回共同語言 z 分數（離平均幾個標準差），再換到目標量尺。比喻：像換外幣，台幣不能直接換算成日幣的面額，要先換成同一個基準（z），再換成你要的幣別（T）。","s":["先把 IQ 換成 z：z＝(115－100)÷15＝15÷15＝1。","再把 z 換成 T：T＝50＋10×1＝60。","所以 IQ115、z＝1、T60 都是同一個位置：高於平均 1 個標準差，選 A。"],"w":{"A":"✓ IQ115 高於平均 1 個標準差（z＝1），換成 T 分數就是 50＋10＝60。","B":"✗ 70 是 z＝2 時的 T 分數，對應的是魏氏 IQ130，不是 115。","C":"✗ 84 是 z＝1 對應的百分等級（約 84），把 PR 和 T 分數搞混了。","D":"✗ T95 相當於 z＝4.5，極端罕見；可能是把 IQ 的數字誤搬過來。"},"m":"換量尺先回 z：IQ115＝z1＝T60＝PR84。"},{"n":9,"q":"小玲國語期末考成績為 85 分，在該校六年級 200 名同學中的百分等級是 15。有關小玲成績表現的敘述，下列何者正確？","o":["是該校六年級同學的前 85 名","贏過該校六年級同學 85%的人","贏過該校六年級同學 15%的人","是該校六年級同學的倒數 15 名"],"a":"C","al":"C","c":"百分等級","e":"PR15 表示相對於常模團體，約勝過 15% 的人，因此選 C。85 是原始分數，不能讀成 PR85；200 人的 15% 約 30 人，也不能直接讀成第 15 名。遇同分時，精確百分等級需按常模的計算規則解釋。","p":"21、32-34","u":"normal","k":"百分等級（PR）表示在常模團體中，你的分數贏過百分之幾的人。PR15 表示大約 15% 的人分數比你低，也就是約 85% 的人比你高。要分清三種數字：原始分數（考卷上的 85 分）、百分等級（PR15）、名次（第幾名）。比喻：跑步比賽中，PR 像是「你跑贏了全場多少比例的人」，不是你的秒數，也不是直接的名次。200 人的 15% 是 30 人，小玲大約贏過 30 人，排名大約在第 170 名左右。","s":["分清題目中的數字：85 分是原始分數，15 是百分等級。","PR15 的意思：贏過約 15% 的人。","換成人數：200×15%＝30，約贏過 30 人，選 C。"],"w":{"A":"✗ 把原始分數 85 當成名次；PR15 表示約 85% 的人比她高，她大約排在第 170 名附近。","B":"✗ 把原始分數 85 誤讀成 PR85；實際上她是 PR15。","C":"✓ PR15 就是在常模團體中約勝過 15% 的人。","D":"✗ 把 PR 當人數；200 人的 15% 是 30 人，她約贏過 30 人，不是倒數第 15 名。"},"m":"PR 是贏過百分之幾的人，不是分數也不是名次。"},{"n":10,"q":"快樂國小設立美術實驗班，招收三年級具有美術天份的兒童。下列哪一種美術測驗最適合用來甄選該類型的學生？","o":["興趣測驗","性向測驗","成就測驗","人格測驗"],"a":"B","al":"B","c":"性向測驗","e":"甄選具美術發展潛能的兒童，最適合性向測驗。興趣測驗測喜歡什麼；成就測驗測目前已學會多少；人格測驗測平常的特質。關鍵是「未來學習潛能」，不是僅看喜好或既有作品成績。","p":"7、15、18","u":"perform","k":"幾種測驗要分清：性向測驗測「將來學得好的潛能」，成就測驗測「目前已經學會多少」，興趣測驗測「喜歡什麼」，人格測驗測「平常的個性特質」。依克朗巴哈的分法，性向、成就、智力屬最大表現測驗（盡全力表現最好）；興趣、人格屬典型表現測驗（平常會怎麼表現）。講義也提到性向測驗用在分班、職業選擇、師培甄選。比喻：選拔籃球隊苗子，看的是彈跳力和協調性這些潛力（性向），而不是他已經會幾招投籃（成就）。美術實驗班要找有天份、能發展的孩子，所以用性向測驗。","s":["抓關鍵字「具有美術天份」「甄選」：要找的是未來發展潛能。","對照：潛能是性向，已學會是成就，喜好是興趣，個性是人格。","選 B。"],"w":{"A":"✗ 興趣測驗只看喜不喜歡美術，喜歡不等於有天份，屬典型表現測驗。","B":"✓ 性向測驗測學習潛能，最適合甄選有美術發展潛力的兒童。","C":"✗ 成就測驗看已經學會多少，三年級兒童的既有成果受過去學習機會影響，不等於天份。","D":"✗ 人格測驗測平常的個性特質，和美術潛能沒有直接關係。"},"m":"找潛能用性向，看學會用成就，問喜好用興趣。"},{"n":11,"q":"有關選擇題的描述，下列何者最適切？","o":["編製高品質的選擇題較為困難","選擇題的內容取樣缺乏代表性","選擇題不受閱讀理解能力的影響","選擇題較適合用來測量分析與評鑑的能力"],"a":"A","al":"A","c":"選擇題特性","e":"好的選擇題須兼顧清楚題幹、唯一最佳答案及有效誘答項，編製不容易。選擇題可在有限時間取樣較廣內容，B 不妥；仍可能受閱讀能力影響，C 錯；雖可測高層次能力，但不能因此說「較適合」或容易編製，D 過度概括。","p":"69-70、76","u":"itemtype","k":"選擇題由題幹和選項組成，學生從中挑出答案，屬於選出式反應。優點：計分客觀、閱卷快，短時間可出很多題，內容取樣廣、代表性好。缺點：要寫出清楚的題幹、唯一最佳答案，以及看起來合理卻是錯的誘答選項，很花功夫；也有猜測機會，而且學生要讀得懂題目。比喻：出選擇題像設計迷宮，每一條岔路都要看起來像出口，才騙得過沒學會的人，所以出好題很難。","s":["題目問「最適切」：逐項對照選擇題的優缺點。","B 說取樣缺乏代表性、C 說不受閱讀影響，都和選擇題特性相反。","D 過度概括；A 是公認的缺點，選 A。"],"w":{"A":"✓ 要兼顧清楚題幹、唯一正確答案與有效誘答選項，高品質的選擇題確實不好編。","B":"✗ 選擇題題數多、可涵蓋較廣的內容，取樣代表性反而是它的優點。","C":"✗ 學生必須讀懂題幹與選項，閱讀理解能力仍會影響作答。","D":"✗ 選擇題可以測分析、評鑑，但不容易設計；高層次能力通常用申論題或實作評量較適合。"},"m":"選擇題：好改難出，取樣廣但要讀得懂。"},{"n":12,"q":"王老師負責五年級國語科第一次段考的命題工作。下列何者作法最可以提高該測驗的效度？","o":["事先規畫試卷的雙向細目表","移除測驗中每人皆能答對的試題","增加選擇題以提高評分的客觀性","運用複雜的句子結構來增加試題難度"],"a":"A","al":"A","c":"雙向細目表","e":"雙向細目表交叉列出教材內容與學習目標／認知層次，使試題具代表性，直接提升內容效度。刪除人人答對的題目未必符合目標；增加客觀題主要有利評分一致性；複雜句子反而可能引入無關的閱讀負擔。","p":"38、68","u":"bloom","k":"雙向細目表是一張二維表格：一邊列教材內容（單元或主題），一邊列學習目標或 Bloom 認知層次（記憶、理解、應用、分析…），格子裡填題數或配分。講義說建立細目表要界定教學內容範圍、標明學習成果、依重要性分配占分比重。它像蓋房子前的設計圖，先規劃好各單元、各層次要出幾題，才不會偏重某一課或只考背誦，題目就更能代表教學範圍。這正是內容效度，講義也說成就測驗最需要內容效度，而雙向細目表是檢驗它的工具。","s":["抓關鍵字「提高效度」，段考是成就測驗，最需要內容效度。","想：哪個做法能讓題目代表教學內容與目標？那就是雙向細目表。","再檢查其他選項影響的是鑑別度、評分客觀性或增加無關負擔，選 A。"],"w":{"A":"✓ 事先規劃內容與認知層次的配題，讓試題具代表性，直接提升內容效度。","B":"✗ 人人答對的題目鑑別度為 0，但若測的是重要目標，刪掉反而減少內容代表性。","C":"✗ 客觀計分主要提升評分一致性，屬於信度的改善，不保證測到教學目標。","D":"✗ 複雜句子增加和國語目標無關的閱讀負擔，造成系統誤差，反而降低效度。"},"m":"先畫雙向細目表再出題，內容效度就有保障。"},{"n":13,"q":"林老師為了解學生在學習英文「fast food」的單元後，是否達到「能聽懂日常生活應對中常用語句(速食店購物的對話)，並能作適當的回應。」的目標，特別安排全班學生到英語村的速食店以英文購買食物。此種評量方式最接近下列何者？","o":["動態評量","真實評量","檔案評量","生態評量"],"a":"B","al":"B","c":"真實評量","e":"學習目標是聽懂購物對話並適切回應，評量也讓學生實際以英語購物，能直接觀察語言的情境運用。動態評量須有教學介入與再評量；檔案評量需有目的地蒐集作品；生態評量重點是個人與環境需求的關係。","p":"77、87","u":"alt","k":"幾種新式評量要分清。真實評量：在真實生活情境中展現能力，講義的例子正是學外語能否在未來與外國人交談。動態評量：用「前測－教學介入－後測」，在過程中給提示，看學生的學習潛能。檔案評量：有目的地長期蒐集作品與反省，看學習歷程。生態評量：針對個案需求，分析家庭、學校、社區等環境中要用到的技能，多用於重度障礙學生。比喻：學點餐英文，真實評量就是讓你真的走進速食店用英文點一份套餐。","s":["抓關鍵字：學習目標是在速食店聽懂並回應，評量方式是到英語村速食店實際用英文購買。","評量情境與真實生活任務一致，對應真實評量。","題幹沒有前測與教學介入、沒有長期蒐集作品、也沒有分析個案環境，選 B。"],"w":{"A":"✗ 動態評量要有「前測－教學介入－後測」並給予提示，題幹沒有這個歷程。","B":"✓ 讓學生在模擬真實的速食店情境中用英語購物，直接看能力能否在生活中運用。","C":"✗ 檔案評量要有目的地長期蒐集作品與反思，題幹只是一次實地任務。","D":"✗ 生態評量依個案需求分析其生活環境所需技能，多用於特殊教育，不是本題情境。"},"m":"真實評量看用不用得出來，動態評量看教了會不會進步。"},{"n":14,"q":"相較於標準化成就測驗，下列何種情形最適合採用教師自編成就測驗？","o":["必須大量、快速批改與計分時","所需的測驗必須具備高信度時","測驗內容要符合課堂教學目標時","測驗範圍廣泛且測驗題數偏多時"],"a":"C","al":"C","c":"教師自編測驗","e":"教師自編測驗能針對實際教過的內容、進度與學習目標設計，故 C 最合適。大量快速計分、廣泛取樣或高信度並非教師自編測驗的固有優勢；標準化測驗通常已有較完整的施測程序與品質證據。","p":"9-11","u":"standard","k":"標準化測驗由專家編製，有統一的施測程序、計分方式、分數解釋與常模，例如會考、基測，目的是公平、客觀、可比較。教師自編測驗屬於非標準化測驗，是老師針對自己班級的教學目標與進度編的，例如段考、小考。講義指出非標準化測驗的價值在考查教學目標的達到程度與班級個別差異，通常不建立常模。比喻：標準化測驗像全國統一的健康檢查，人人做同一套；教師自編測驗像家庭醫師針對你的狀況量身安排的檢查。","s":["抓關鍵字「最適合採用教師自編測驗」：找教師自編測驗的獨特優勢。","教師自編測驗的強項是貼近實際教學目標與內容。","其他選項是標準化測驗的強項，選 C。"],"w":{"A":"✗ 大量、快速批改計分是標準化測驗（電腦閱卷、統一程序）的強項。","B":"✗ 標準化測驗經過預試與試題分析，信度通常較高，這不是自編測驗的優勢。","C":"✓ 老師最清楚自己教了什麼，自編測驗能緊扣課堂教學目標與進度。","D":"✗ 範圍廣、題數多比較適合標準化測驗；教師自編測驗通常針對單元，範圍較小。"},"m":"要貼自己的課用自編，要和全國比用標準化。"},{"n":15,"q":"陳老師自編測驗並進行試題分析後，發現某一題的難度指標值 P = .95。下列有關此題難易度的敘述，何者正確？","o":["過於簡單","難度適中","過於困難","無法判斷"],"a":"A","al":"A","c":"難度指標 P","e":"P 是答對比例或高低分組答對率的平均，P＝.95 表示約 95% 答對，題目偏易。名稱雖叫難度指標，數值越大反而越容易。是否刪題仍須看目的；精熟檢核可以保留高通過率的必要題目。","p":"71-73","u":"item","k":"難度指標 P 的算法有兩種：P＝答對人數÷總人數，或 P＝(高分組答對率 PH＋低分組答對率 PL)÷2。它名稱叫「難度」，但數字越大代表越多人答對、越容易，可以把它想成「通過率」。講義的難易等級：P≥.80 很容易，.60～.80 偏易，.40～.60 適中，.20～.40 偏難，P＜.20 很難；命題原則建議 P≈.50±.10。比喻：一扇門 95 個人能推開，代表這扇門很好推。P＝.95 幾乎人人答對，題目過於簡單，還可能出現天花板效應。","s":["先想 P 的意思：答對的比例。","P＝.95 表示約 95% 的人答對。","對照講義等級表，P≥.80 屬很容易，選 A。"],"w":{"A":"✓ P＝.95 表示約 95% 的人答對，遠高於 .80，屬於非常容易的題目。","B":"✗ 難度適中約在 P＝.40～.60，.95 遠超過這個範圍。","C":"✗ 過於困難是 P 很小（低於 .20），方向弄反了；P 越大越簡單。","D":"✗ 有 P 值就能判斷難易；只有「要不要保留這題」才需要再看評量目的。"},"m":"P 是通過率：越大越簡單，.50 最適中。"},{"n":16,"q":"演講比賽名次屬於下列何種測量量尺？","o":["名義量尺","次序量尺","等距量尺","比率量尺"],"a":"B","al":"B","c":"次序量尺","e":"比賽名次能表示高低順序，但第一與第二名的能力差，不一定等於第二與第三名的差，故屬次序量尺。名義量尺只能分類；等距量尺要求等距；比率量尺還要有代表「完全沒有」的絕對零點。","p":"19-23","u":"scales","k":"四種量尺由低到高：名義量尺只分類，數字只是代號，例如男生 1、女生 2；次序量尺能排出高低順序，但各等級之間的差距不一定相等，例如名次；等距量尺間距相等，可以相加減，但沒有絕對零點，例如考試分數、溫度；比率量尺除了等距還有絕對零點，可以說「幾倍」，例如體重。比喻：賽跑名次知道誰快，但第一名和第二名可能只差 0.1 秒，第二名和第三名卻差 5 秒。演講比賽名次就是這樣的次序量尺。","s":["先看資料型態：名次只表示先後順序。","檢查有沒有等距：第一、二名的差距不一定等於第二、三名。","有順序、無等距，屬次序量尺，選 B。"],"w":{"A":"✗ 名義量尺只能分類、沒有大小之分，但名次有明確的高低順序。","B":"✓ 名次能排先後，但各名次間的能力差距不一定相等，是次序量尺。","C":"✗ 等距量尺要求單位差距相等，名次之間的實際差距不等。","D":"✗ 比率量尺要有等距加上絕對零點，名次兩者都沒有。"},"m":"名義分類、次序排名、等距等差、比率有零。"},{"n":17,"q":"王老師對同學說： 「這次月考我要考比較高層次的概念，而不是記憶類型的試題；還有，上次的題型猜對的機會有一半，所以這次我會改用別的題型。」王老師上次考試的題型為下列何者？","o":["填充題","選擇題","配合題","是非題"],"a":"D","al":"D","c":"題型與猜測率","e":"是非題只有兩種反應，完全隨機猜測答對機率為 1／2，因此選 D。一般四選一題的機率為 1／4；填充題須自行產生答案；配合題的猜測率則依候選項與配對規則而定。","p":"69-70","u":"itemtype","k":"猜測率是學生完全不會、純靠亂猜答對的機率。是非題只有「對」和「錯」兩種，亂猜也有 1/2 的機會答對；四選一的選擇題猜對機率是 1/4；填充題要自己寫出答案，幾乎猜不到；配合題的猜測率則依選項數量和配對規則而定。比喻：擲一枚硬幣猜正反面，就有一半機會猜中，這就是是非題。此外，王老師說想考較高層次的概念，是非題也較容易流於記憶片段知識，所以他要換題型。","s":["抓關鍵字「猜對的機會有一半」，即猜測率 1/2。","逐一算各題型的猜測率：是非 1/2、四選一 1/4、填充近乎 0。","只有兩個選項的是非題符合，選 D。"],"w":{"A":"✗ 填充題要自己寫出答案，沒有選項可猜，猜對機率極低。","B":"✗ 一般四選一選擇題亂猜答對機率是 1/4，不是一半。","C":"✗ 配合題的猜測率視選項數量而定，通常低於一半。","D":"✓ 是非題只有對、錯兩種反應，純猜也有 1/2 機會答對。"},"m":"是非題猜中一半，四選一猜中四分之一。"},{"n":18,"q":"某學者認為 A 測驗具有「建構效度」 ，有關A 測驗之敘述，下列何者較正確？","o":["它是一份人格測驗","按照雙向細目表命題","題目的內容與組成符合理論架構","各題題目之語意完整流暢、結構嚴謹"],"a":"C","al":"C","c":"建構效度","e":"題目內容與組成符合預期理論架構，才能支持測驗確實反映該構念，故選 C。A 只說測驗種類；B 是內容效度的常用證據；D 是題目文字品質，單靠語句流暢不足以證明建構效度。","p":"37-38、59","u":"validity","k":"建構效度（構念效度）是指測驗能不能真的測到理論中定義的抽象特質。構念是看不見的抽象概念，例如智力、焦慮、自我概念，必須先依理論明確定義，再看題目的內容與組成是否符合這個理論架構。講義列出確認構念效度的方法有相關研究、團體差異分析、實驗研究、因素分析等。比喻：理論說「焦慮」包含身體緊張、擔心、逃避三部分，量表的題目就應該能分成這三群，才算有建構效度。","s":["抓關鍵字「建構效度」：核心是測驗與理論架構相符。","逐項檢查哪個敘述直接說到「符合理論架構」。","A 是測驗種類、B 是內容效度、D 是文字品質，選 C。"],"w":{"A":"✗ 各種測驗都可能需要建構效度，有建構效度不代表它就是人格測驗。","B":"✗ 依雙向細目表命題是建立內容效度的方法，不是建構效度。","C":"✓ 題目內容與組成符合理論架構，才能說它反映了該構念。","D":"✗ 語意通順、結構嚴謹只是題目的文字品質，不足以證明測到理論中的特質。"},"m":"建構效度＝題目長得像理論的設計圖。"},{"n":19,"q":"根據常態分配，國小兒童在魏氏智力測驗上獲得的智商，於下列何種範圍內的人數最多？","o":["70~85","100~115","116 ~130","131~145"],"a":"B","al":"B","c":"常態曲線區間","e":"魏氏 IQ 的平均數為 100、標準差為 15，100～115 是平均數到 +1 SD，约占 34.13%，是四個選項中最多的區間。70～85 約占 13.59%；116～130 遠離中心；131～145 更靠近右端尾部。","p":"18、32-33","u":"normal","k":"常態分配是左右對稱的鐘形曲線，平均數、中位數、眾數重合在正中間，越靠近中間人數越多。各區間比例要背熟：平均數到 ±1 個標準差（SD）各占 34.13%，1 到 2 個 SD 之間各占 13.59%，2 到 3 個 SD 之間各占 2.14%。魏氏智商平均 100、SD 15，所以 85～100 和 100～115 各約 34.13%，是人最多的兩段。比喻：像操場上排隊看表演，中間最擠，越往兩邊人越稀疏。","s":["把各選項換成 z（IQ－100）÷15。","A：70～85 是 z＝-2～-1，約 13.59%。B：100～115 是 z＝0～1，約 34.13%。","C：116～130 約 z＝1.07～2，約 12%；D：131～145 約 z＝2.07～3，不到 2%。","比較後 B 最多，選 B。"],"w":{"A":"✗ 70～85 位在 -2～-1 SD，只占約 13.59%，離中心較遠。","B":"✓ 100～115 是平均數到 +1 SD，約占 34.13%，是選項中最靠中心的一段。","C":"✗ 116～130 位在約 +1～+2 SD，約占 12%，人數比中心少很多。","D":"✗ 131～145 已在 +2 SD 以外的右尾，不到 2%，人數最少。"},"m":"鐘形曲線中間最胖：離平均越近，人越多。"},{"n":20,"q":"有關心理測驗的敘述，下列何者錯誤？","o":["有良好效度的心理測驗，較能做出正確的推論","憂鬱量表若有良好的信度，表示該量表能夠涵蓋重要的憂鬱症狀","若測驗常模距今超過十年，解釋測驗結果時可能會錯估受試者的表現","「我會為了交朋友而參加團體」的敘述句優於「若不是為了交朋友，我不會參加團體」"],"a":"B","al":"B","c":"信度不等於效度","e":"信度表示測量結果是否一致，不能保證涵蓋重要的憂鬱症狀；後者涉及內容效度，所以 B 錯。效度有利於合理推論；過舊常模可能影響解釋；簡明的肯定句通常比雙重否定句易懂。","p":"17、38、46、91","u":"relval","k":"信度是測驗結果的一致性（穩不穩），效度是測驗的正確性，也就是有沒有測到想測的東西（準不準）。講義說信度是效度的必要條件，但不是充分條件：效度高的測驗一定要有信度，信度高卻不保證有效度。比喻：一台體重計每次都多顯示 3 公斤，結果非常穩定（信度高），但永遠不準（效度低）。憂鬱量表「能涵蓋重要症狀」是內容效度的問題，不是信度能說明的。其他選項：常模太舊會錯估受試者，因為十年前的兒童表現水準和現在不同；命題要避免雙重否定，讓題意清楚。","s":["注意題目問「錯誤」的敘述。","逐項判斷：效度與推論、常模新舊、題目句型都是正確觀念。","B 把信度當成效度，是錯誤敘述，選 B。"],"w":{"A":"✗ 這句是正確敘述：效度表示分數解釋的適切性，效度好才能做出正確推論，所以不是本題答案。","B":"✓ 錯誤：信度只代表結果穩定，能否涵蓋重要症狀屬內容效度，信度高不代表效度高。","C":"✗ 這句是正確敘述：常模過舊可能已不代表現在的團體，解釋時容易錯估，所以不是本題答案。","D":"✗ 這句是正確敘述：肯定句比雙重否定句清楚易懂，比較好，所以不是本題答案。"},"m":"信度高只代表穩，不代表準；準要看效度。"},{"n":21,"q":"若變數分配狀態為「常態分配」時，±2SD 之間所佔比例為何？","o":["99.74%","68.26%","95.44%","85%"],"a":"C","al":"C","c":"常態分配比例","e":"常態分配平均數上下各 2 個標準差，合計約占 95.44%（更精細約 95.45%）。±1 SD 約 68.26%，±3 SD 約 99.74%。本題問的是中央區間，不能把左側累積百分比 97.7% 當答案。","p":"32-33","u":"normal","k":"常態分配是左右對稱的鐘形曲線，有一組一定要背的比例：平均數上下 1 個標準差（±1SD）約占 68.26%，±2SD 約占 95.44%，±3SD 約占 99.74%。這三個數字可以從單側比例加起來：0 到 1SD 是 34.13%，1 到 2SD 是 13.59%，2 到 3SD 是 2.14%。比喻：像一個靶，±1SD 是紅心區、±2SD 是大半個靶面、±3SD 幾乎是整個靶。本題問的是平均數上下各 2 個標準差的中央區間。","s":["先確認問的是「±2SD 之間」的中央區間，不是單側累積。","單側：34.13%＋13.59%＝47.72%。","兩側相加：47.72%×2＝95.44%，選 C。"],"w":{"A":"✗ 99.74% 是 ±3SD 之間的比例，多算了一個標準差。","B":"✗ 68.26% 是 ±1SD 之間的比例，少算了一個標準差。","C":"✓ ±2SD 之間：(34.13%＋13.59%)×2＝95.44%。","D":"✗ 85% 不是常態分配的標準區間比例，可能和 PR84（z＝+1 左側累積）混淆。"},"m":"68、95、99.7：一、二、三個標準差。"},{"n":22,"q":"若變數分配狀態為「常態分配」時，±1SD 之間所佔比例為何？","o":["99.74%","68.26%","95.44%","85%"],"a":"B","al":"B","c":"常態分配比例","e":"平均數上下各 1 個標準差的範圍，每一側約占 34.13%，合計 68.26%。95.44% 對應 ±2 SD；99.74% 對應 ±3 SD。先辨認題目問中央區間還是單側累積比例。","p":"32-33","u":"normal","k":"常態分配中，平均數到 +1 個標準差的區域約占 34.13%，左右對稱，所以 -1SD 到 +1SD 合計約 68.26%。這是常態分配最核心的數字：大約三分之二的人落在平均數上下一個標準差之內。再往外：±2SD 約 95.44%，±3SD 約 99.74%。比喻：全班身高若呈常態分配，大約三分之二的同學身高都在「平均身高加減一個標準差」這個範圍裡，太高或太矮的人比較少。","s":["確認問的是「±1SD 之間」的中央區間。","單側 0 到 1SD 是 34.13%。","兩側相加：34.13%×2＝68.26%，選 B。"],"w":{"A":"✗ 99.74% 是 ±3SD 之間的比例。","B":"✓ ±1SD 之間：34.13%×2＝68.26%，約三分之二的人。","C":"✗ 95.44% 是 ±2SD 之間的比例。","D":"✗ 85% 不是常態分配的標準區間比例，可能和 z＝+1 左側累積的 84% 混淆。"},"m":"一個標準差圈住三分之二：68.26%。"},{"n":23,"q":"某一測驗的平均數是 75，標準差是 6，則當得分為 90 時，Z 分數為多少？","o":["1.5","2","2.5","3"],"a":"C","al":"C","c":"原始分數轉 z","e":"z＝(X－平均數)÷標準差＝(90－75)÷6＝15÷6＝2.5。表示得分比平均數高 2.5 個標準差。分子應先算差距，再除以標準差，不能直接以 90 除以 6。","p":"32-33","u":"normal","k":"z 分數表示一個分數離平均數有幾個標準差。公式：z＝(原始分數 X－平均數 M)÷標準差 SD。z 為正表示高於平均，為負表示低於平均，0 剛好等於平均。標準差可以想成這次考試的「一步有多大」。比喻：平均在 75 分的位置，一步是 6 分，你考 90 分，就是從平均往前走了幾步。一定要先算「差距」再除以標準差，不能直接拿 90 除以 6。","s":["寫公式：z＝(X－M)÷SD。","代入：z＝(90－75)÷6＝15÷6。","計算：15÷6＝2.5，表示高於平均 2.5 個標準差，選 C。"],"w":{"A":"✗ 1.5 相當於只高出 9 分（6×1.5），和實際差距 15 分不符。","B":"✗ 2 相當於高出 12 分（6×2），差距算少了。","C":"✓ (90－75)÷6＝2.5，高於平均 2.5 個標準差。","D":"✗ 3 相當於高出 18 分（6×3），即 93 分才是 z＝3。"},"m":"z＝差距除以一步：(X－M)÷SD。"},{"n":24,"q":"某班學生學業成績的平均數為 80，標準差為 6，其中阿美的學業成績為 92，相當於魏氏智力分數多少？","o":["85","100","115","130"],"a":"D","al":"D","c":"z 轉魏氏量尺","e":"先算 z＝(92－80)÷6＝2，再換成魏氏分數＝100＋15×2＝130。此處只是量尺換算，不表示學業考試真的測出了智商。100 為平均，115 為高 1 SD，85 為低 1 SD。","p":"18、32-33","u":"iq","k":"不同量尺的分數可以互相換算，關鍵是先算出 z 分數（離平均幾個標準差），再套進目標量尺的公式。魏氏智力量尺的平均是 100、標準差是 15，所以魏氏分數＝100＋15z。比喻：像把公分換成英寸，先找到共同基準，再換到新單位。要提醒：這只是「位置」的換算，阿美在班上高於平均 2 個標準差，換到魏氏量尺就是 130 的位置，並不代表學業考試真的測出了她的智商。","s":["先算 z：z＝(92－80)÷6＝12÷6＝2。","代入魏氏量尺：100＋15×2＝100＋30＝130。","選 D。"],"w":{"A":"✗ 85 是 z＝-1 的魏氏分數，表示低於平均，但阿美高於平均。","B":"✗ 100 是魏氏平均數（z＝0），阿美的成績高於班平均。","C":"✗ 115 是 z＝+1，阿美實際高出 2 個標準差，算少了一步。","D":"✓ z＝2，換成魏氏量尺 100＋15×2＝130。"},"m":"先求 z，再乘 15 加 100，就是魏氏分數。"},{"n":25,"q":"某班學生考試成績，多數人得分偏低，該班學生成績會呈什麼分配型態？","o":["常態分配","左偏","右偏","高狹峰"],"a":"C","al":"C","c":"正偏態","e":"多數人得低分、少數人得高分，長尾伸向高分端（右側），稱右偏或正偏態。偏態名稱看的是「尾巴方向」，不是人數集中方向。左偏則是多數高分、少數低分把尾巴拉向左側。","p":"31-33；統計補充","u":"skew","k":"偏態是指分數分配不對稱的情形，名稱看的是「長尾巴指向哪一邊」，而不是人多的那一邊。多數人得低分時，高峰擠在左邊，少數高分者把尾巴拉長到右邊（高分端），叫右偏或正偏態，通常是題目太難；此時平均數＞中位數＞眾數，因為平均數被少數高分拉高。相反地，多數人高分、尾巴拖向左邊叫左偏或負偏態，通常是題目太簡單。比喻：尾巴像風箏的線，線往哪邊飄，就叫哪邊偏。","s":["抓關鍵字「多數人得分偏低」：高峰在左側低分處。","少數高分者形成長尾，尾巴伸向右側高分端。","尾巴在右，叫右偏（正偏態），選 C。"],"w":{"A":"✗ 常態分配左右對稱，高峰在中間，不是多數人偏低分。","B":"✗ 左偏（負偏）是多數人高分、尾巴拖向低分端，和題意相反。","C":"✓ 多數人低分、尾巴伸向高分端，是右偏（正偏態），常見於題目太難。","D":"✗ 高狹峰描述的是峰度（曲線高尖或平坦），不是左右偏斜。"},"m":"尾巴往右正偏（題太難），尾巴往左負偏（題太易）。"},{"n":26,"q":"有五位學生，其魏氏智力測驗分數為 135、120、100、72、68。請問共有幾位需要特殊安置？","o":["1 位","2 位","3 位","4 位"],"a":"B","al":"B（依題設簡化）","c":"智商界值與安置","e":"若依題目把正負 2 SD 作初步篩選界線，魏氏 IQ 的界值為 100±2×15＝70、130；135 與 68 共 2 位超出，故選 B。120、100、72 未超出此界線。","p":"18、32-33、91；補充 S3","x":"這是題目簡化的統計判斷。實際特殊教育鑑定與安置尚須多元資料，不能只用一次 IQ 分數決定。","u":"iq","k":"魏氏智力測驗的離差智商平均 100、標準差 15。本題依題設採簡化的統計判斷：把偏離平均 2 個標準差以上的分數視為需要特殊安置的初步篩選線，也就是 100＋2×15＝130 以上（可能資優）和 100－2×15＝70 以下（可能需要特殊協助）。依常態分配，兩端各約只有 2.28% 的人。比喻：像身高檢查，把特別高和特別矮的孩子先挑出來進一步了解。重要提醒：這只是題目簡化的統計判斷，實際的特殊教育鑑定與安置還需要多元資料（觀察、晤談、其他測驗、適應行為等），不能只用一次 IQ 分數決定。","s":["算界值：100±2×15，得 70 與 130。","逐一檢查：135＞130 超出；120、100 在界線內；72 雖低但仍高於 70；68＜70 超出。","共 135、68 兩位，選 B。"],"w":{"A":"✗ 只算到一位，可能漏掉低分端的 68，兩端都要檢查。","B":"✓ 135 高於 130、68 低於 70，共 2 位超出 ±2SD 的界線。","C":"✗ 可能把 72 也算進去，但 72 仍高於界值 70。","D":"✗ 可能把 120 或 72 也算進去，但兩者都在 70～130 之內。"},"m":"魏氏界線 70 和 130：超出才進一步篩選。"},{"n":27,"q":"小英的自我概念量表總分之 T 分數為 40，相當於百分等級多少？","o":["84","60","50","16"],"a":"D","al":"D","c":"T 分數轉百分等級","e":"先算 z＝(T－50)÷10＝(40－50)÷10＝-1。常態分配中，z＝-1 左側約占 15.87%，所以 PR 約 16。84 是 z＝+1 的累積百分比；50 對應平均數。注意百分等級不是答對率。","p":"32-33","u":"normal","k":"這題和第 7 題相同。T 分數是把 z 分數換成平均 50、標準差 10 的量尺：T＝50＋10z。z 分數是「離平均幾個標準差」，正數高於平均、負數低於平均。百分等級（PR）是「贏過團體中百分之幾的人」。常態分配下，平均數上下 1 個標準差各占 34.13%，所以 z＝-1 以下約剩 15.87%，講義常態曲線上標的 16% 和 84% 就是這兩個位置。比喻：T40 就像身高比班上平均矮了一個「標準身高差」，大約只高過 16% 的同學。","s":["由 T＝50＋10z 反推 z：z＝(T－50)÷10＝(40－50)÷10＝-1。","常態分配中 z＝-1 以下的面積：50%－34.13%＝15.87%。","四捨五入，PR≈16，選 D。"],"w":{"A":"✗ 84 是 z＝+1（T＝60）時的百分等級，方向剛好弄反了。","B":"✗ 60 是高於平均 1 個標準差的 T 分數數字，不是百分等級，而且方向也相反。","C":"✗ PR50 對應平均數（T＝50），T40 低於平均，PR 一定小於 50。","D":"✓ T40 就是 z＝-1，下方約占 15.87%，所以 PR 約 16。"},"m":"T40、T50、T60 對應 PR16、PR50、PR84。"},{"n":28,"q":"小達在魏氏兒童智力量表(WISC-III)的總智商是 115，請問相當於 T 分數多少？","o":["60","70","84","95"],"a":"A","al":"A","c":"魏氏智商轉 T 分數","e":"魏氏離差智商採平均數 100、標準差 15。z＝(115－100)÷15＝1，再換成 T＝50＋10×1＝60。不能把 IQ 的 15 分差直接加到 T 分數上；兩種量尺的標準差不同。","p":"18、32-33","u":"iq","k":"這題和第 8 題相同。魏氏智力測驗用離差智商：把同年齡兒童的分數轉成平均 100、標準差 15 的量尺。T 分數則是平均 50、標準差 10。不同量尺不能直接加減比較，要先換回共同語言 z 分數（離平均幾個標準差），再換到目標量尺。比喻：像換外幣，台幣不能直接換算成日幣的面額，要先換成同一個基準（z），再換成你要的幣別（T）。","s":["先把 IQ 換成 z：z＝(115－100)÷15＝15÷15＝1。","再把 z 換成 T：T＝50＋10×1＝60。","所以 IQ115、z＝1、T60 都是同一個位置：高於平均 1 個標準差，選 A。"],"w":{"A":"✓ IQ115 高於平均 1 個標準差（z＝1），換成 T 分數就是 50＋10＝60。","B":"✗ 70 是 z＝2 時的 T 分數，對應的是魏氏 IQ130，不是 115。","C":"✗ 84 是 z＝1 對應的百分等級（約 84），把 PR 和 T 分數搞混了。","D":"✗ T95 相當於 z＝4.5，極端罕見；可能是把 IQ 的數字誤搬過來。"},"m":"換量尺先回 z：IQ115＝z1＝T60＝PR84。"},{"n":29,"q":"根據常態分配，國小兒童在魏氏智力測驗上獲得的智商，於下列何種範圍內的人數最多？","o":["70~85","100~115","116 ~130","131~145"],"a":"B","al":"B","c":"常態曲線區間","e":"魏氏 IQ 的平均數為 100、標準差為 15，100～115 是平均數到 +1 SD，约占 34.13%，是四個選項中最多的區間。70～85 約占 13.59%；116～130 遠離中心；131～145 更靠近右端尾部。","p":"18、32-33","u":"normal","k":"這題和第 19 題相同。常態分配是左右對稱的鐘形曲線，平均數、中位數、眾數重合在正中間，越靠近中間人數越多。各區間比例要背熟：平均數到 ±1 個標準差（SD）各占 34.13%，1 到 2 個 SD 之間各占 13.59%，2 到 3 個 SD 之間各占 2.14%。魏氏智商平均 100、SD 15，所以 85～100 和 100～115 各約 34.13%，是人最多的兩段。比喻：像操場上排隊看表演，中間最擠，越往兩邊人越稀疏。","s":["把各選項換成 z（IQ－100）÷15。","A：70～85 是 z＝-2～-1，約 13.59%。B：100～115 是 z＝0～1，約 34.13%。","C：116～130 約 z＝1.07～2，約 12%；D：131～145 約 z＝2.07～3，不到 2%。","比較後 B 最多，選 B。"],"w":{"A":"✗ 70～85 位在 -2～-1 SD，只占約 13.59%，離中心較遠。","B":"✓ 100～115 是平均數到 +1 SD，約占 34.13%，是選項中最靠中心的一段。","C":"✗ 116～130 位在約 +1～+2 SD，約占 12%，人數比中心少很多。","D":"✗ 131～145 已在 +2 SD 以外的右尾，不到 2%，人數最少。"},"m":"鐘形曲線中間最胖：離平均越近，人越多。"},{"n":30,"q":"小明接受魏氏兒童智力測驗的結果，其全量表的 Z 分數為 2，試問小明的離差智商(DIQ)是多少？","o":["128","130","132","134"],"a":"B","al":"B","c":"離差智商","e":"魏氏離差智商 DIQ＝100＋15z。代入 z＝2，得 100＋30＝130。離差智商以同齡常模的相對位置表示，不使用「心理年齡÷實足年齡×100」的比率智商公式。","p":"18、32-33","u":"iq","k":"離差智商（DIQ）是把一個人的分數和同年齡常模比較，用 z 分數換成平均 100、標準差 15 的量尺（魏氏系統）：DIQ＝100＋15z。它取代了早期的比率智商（心理年齡÷實足年齡×100），因為比率智商在年齡增長後就不適用。比喻：DIQ 就像在同年齡的隊伍裡看你站在第幾步的位置，z＝2 就是比平均多走兩大步。","s":["寫公式：魏氏 DIQ＝100＋15z。","代入 z＝2：100＋15×2＝100＋30＝130。","選 B。"],"w":{"A":"✗ 128 不對應任何標準換算，可能是計算錯誤。","B":"✓ 魏氏系統 SD＝15，100＋15×2＝130。","C":"✗ 132 是用 SD＝16（舊式比西量表）算出來的結果，題目指定魏氏量表，SD 應用 15。","D":"✗ 134 是用 SD＝17 才會得到的數字，不符合魏氏量表。"},"m":"魏氏 DIQ＝100＋15z，z＝2 就是 130。"},{"n":31,"q":"依常態分配而言，如果一項考試的平均分數是 80 分，標準差是 10 分，則該考試分數介於 70 分到 90 分的人數，約占多少百分比？","o":["60%","70% 68.26","80%","90%"],"a":"B","al":"B","c":"常態區間換算","e":"70＝80－10，90＝80＋10，所以 70～90 為 ±1 SD，約 68.26%；選項中 70% 最接近，故選 B。C 的 80% 與 D 的 90% 都不是此區間比例。","p":"32-33","x":"原題在 B 後另印「68.26」，本版將這個提示移至解析，保留選項 B 為 70%。","u":"normal","k":"常態分配中，平均數上下 1 個標準差之間約占 68.26%。解題關鍵是先把原始分數換成「離平均幾個標準差」：平均 80、標準差 10，那麼 70 就是 -1SD，90 就是 +1SD，70 到 90 正好是 ±1SD。比喻：班上考試平均 80 分，一步是 10 分，往前一步、往後一步之間大約圈住了三分之二的同學。補充提醒：原題在 B 選項後另印了「68.26」，這是提示；本版把它移到解析，B 選項仍是 70%，因為四個選項中 70% 最接近 68.26%。","s":["把邊界換成 z：(70－80)÷10＝-1；(90－80)÷10＝+1。","±1SD 之間約占 34.13%×2＝68.26%。","選項中最接近的是 70%，選 B。"],"w":{"A":"✗ 60% 比 68.26% 少太多，不是最接近的選項。","B":"✓ 70～90 是 ±1SD，實際約 68.26%，選項中 70% 最接近。","C":"✗ 80% 高估了，±1SD 只占約三分之二。","D":"✗ 90% 更接近 ±2SD 的 95.44%，不是 ±1SD。"},"m":"平均加減一步，圈住約 68%。"},{"n":32,"q":"某生學測成績如下，國 PR84 英 T=40 物 2S 數魏氏 110  請依成績由高至低排列，何者正確？","o":["國英物數","國物英數","物國數英","數國物英"],"a":"C","al":"C（依符號推定）","c":"跨量尺比較","e":"統一轉成 z：國文 PR84 約為 +1；英文 T40 為 -1；數學魏氏 110 為 (110－100)÷15≈0.67。若「物 2S」表示高於平均 2 SD，物理 z＝2，排序即物、國、數、英，選 C。","p":"18、32-33","x":"原題「2S」未明確定義。本解析依選項推定為 +2 SD；若非此意，資料不足，應請授課者確認。","u":"normal","k":"不同量尺的分數不能直接比數字大小，要先全部換成 z 分數（離平均幾個標準差）再比。換算方法：PR84 在常態下約等於 z＝+1；T 分數 z＝(T－50)÷10；魏氏 z＝(IQ－100)÷15；「2S」照字面看作高於平均 2 個標準差，z＝+2。比喻：國語用台幣、英文用美金、數學用日幣標價，要先換成同一種貨幣才知道誰最貴。補充提醒：原題「2S」沒有明確定義，本解析依選項推定為 +2SD；如果不是這個意思，資料就不足以判斷，應請授課老師確認。","s":["國文 PR84：常態下約 z＝+1。","英文 T40：z＝(40－50)÷10＝-1。","物理 2S：推定為 z＝+2。數學魏氏 110：z＝(110－100)÷15≈0.67。","由高到低：物（2）＞國（1）＞數（0.67）＞英（-1），選 C。"],"w":{"A":"✗ 國英物數把英文排第二，但英文 z＝-1 是最低的。","B":"✗ 國物英數把國文排在物理前面，物理 z＝2 才最高，英文也不該在數學前。","C":"✓ 物 z＝2＞國 z≈1＞數 z≈0.67＞英 z＝-1。","D":"✗ 數國物英把數學排第一，但數學 z 只有約 0.67。"},"m":"跨量尺比較：先換 z 再排，不比表面數字。"},{"n":33,"q":"小達在比西量表的總智商是 132，請問相當於 T 分數多少？","o":["60","70","84","95"],"a":"B","al":"B（採 SD＝16）","c":"比西量尺換算","e":"依本題採用的舊式比西／斯比換算慣例，平均數 100、SD＝16，z＝(132－100)÷16＝2；T＝50＋10×2＝70。A 是 z＝1 的 T 分數；84 常用於 z＝1 的百分等級。","p":"18、32-33；量尺補充","x":"智力量表的 SD 應依版本手冊確認，不能將 SD＝16 套用於所有比西／斯比版本。","u":"iq","k":"智力量表的標準差會依版本不同。魏氏系統用 SD＝15；本題依舊式比西（斯比）量表的換算慣例，平均 100、SD＝16。換算步驟一樣：先求 z，再換到 T 分數（平均 50、SD 10）。比喻：同樣叫「一步」，魏氏一步是 15 分，舊式比西一步是 16 分，步伐大小不同，算距離時要用對的尺。重要提醒：智力量表的 SD 要依各版本手冊確認，不能把 SD＝16 套用到所有比西或斯比版本。","s":["依題設 SD＝16 求 z：z＝(132－100)÷16＝32÷16＝2。","換成 T：T＝50＋10×2＝70。","選 B。"],"w":{"A":"✗ 60 是 z＝1 的 T 分數；132 高於平均 2 個標準差，不是 1 個。","B":"✓ 依 SD＝16，z＝2，T＝50＋20＝70。","C":"✗ 84 常見於 z＝1 對應的百分等級，不是 T 分數。","D":"✗ T95 相當於 z＝4.5，遠超出 IQ132 的位置。"},"m":"比西舊制一步 16，魏氏一步 15，先問 SD 再換算。"},{"n":34,"q":"百分等級是何種量尺？","o":["等比","等距","次序","名義"],"a":"C","al":"C","c":"百分等級量尺","e":"百分等級表示排序位置，因此屬次序量尺。PR50 到 PR60 所需的原始分數差，不一定等於 PR80 到 PR90 的差；所以不能把百分等級當等距分數，也不能說 PR80 的能力是 PR40 的兩倍。","p":"19-23、32-34","u":"scales","k":"百分等級（PR）表示你在團體中贏過百分之幾的人，本質上是排序位置，所以屬於次序量尺。它的單位不等距：常態分配中間人很多，PR50 到 PR60 只需要多幾分；兩端人很少，PR90 到 PR99 卻要多很多分。比喻：在擁擠的中間車道上超車很容易一次超過好幾台；跑到前面空曠處，要多開很遠才能再超一台。所以不能把 PR 當等距分數相加減，也不能說 PR80 的能力是 PR40 的兩倍。","s":["先想 PR 表示什麼：相對排序位置。","檢查是否等距：PR 間隔對應的原始分數差不相等。","有順序、無等距，屬次序量尺，選 C。"],"w":{"A":"✗ 等比（比率）量尺要有絕對零點和等距，PR0 不代表沒有能力，PR80 也不是 PR40 的兩倍。","B":"✗ 等距量尺各單位差距相等，但 PR 在中間密、兩端疏，間距不等。","C":"✓ PR 只表示排序位置，有大小順序但間距不等，是次序量尺。","D":"✗ 名義量尺只分類沒有大小，但 PR 有明確的高低順序。"},"m":"PR 只排位置不等距，所以是次序量尺。"},{"n":35,"q":"王老師想要教導學生應試的技巧，下列何者較不適當？","o":["知道利用刪除法答題","如何有效運用作答時間","留意時事及命題的取向","從選項的長短預測答案"],"a":"D","al":"D","c":"合理應試技巧","e":"選項長短和正確性沒有可靠的必然關係，從長短猜答案容易受誤導，故 D 較不適當。刪除明顯錯項、分配時間及了解命題方向，則能協助考生合理使用已有知識與考試時間。","p":"69-70、91","u":"itemtype","k":"應試技巧是在考試情境中有效運用自己能力的方法。合理的技巧能幫學生把會的東西充分表現出來，例如用刪除法排除明顯錯誤的選項、分配作答時間、了解命題方向。不合理的技巧是靠題目本身的線索猜答案，例如「最長的選項通常是答案」，這和學會與否無關，選項長短也沒有可靠的必然關係；好的命題本來就會避免正確選項特別長。比喻：教孩子考駕照，要教他看懂路況和交通規則，而不是教他猜考官的習慣。","s":["注意題目問「較不適當」。","判斷標準：這個技巧是幫學生運用已有的知識，還是靠與學習無關的線索猜題？","從選項長短預測答案屬後者，選 D。"],"w":{"A":"✗ 這是適當的技巧：刪除法是運用已有知識排除錯誤選項，所以不是本題答案。","B":"✗ 這是適當的技巧：有效分配時間能避免會寫的題目來不及寫，所以不是本題答案。","C":"✗ 這是適當的技巧：了解命題取向有助於掌握重點，所以不是本題答案。","D":"✓ 不適當：選項長短和正確與否沒有可靠關係，靠它猜題會被誤導，也與學習無關。"},"m":"教學生用知識答題，不教學生看長短猜題。"},{"n":36,"q":"下列有關檔案評量的敘述，何者正確？","o":["檔案評量是一種客觀式評量","在檔案評量中，教學與評量是兩個獨立的事件","從檔案評量中可以看出學生學習的歷程和成果","學生的所有作品都要放入檔案中，作為期末評量的依據"],"a":"C","al":"C","c":"檔案評量","e":"檔案評量有目的地蒐集作品、觀察與反思資料，呈現學習歷程及成果，故選 C。它不天然等於客觀式評量；與教學密切連結；資料應依目的選擇，並非把所有作品不加篩選放入。","p":"85-88","u":"portfolio","k":"檔案評量是有目的、長時間地蒐集學生的作品、紀錄和自我反省，用來呈現學生的努力、進步與成就。講義列出它的特點：有目的地蒐集作品、學習者參與、放入自我反省、需要較長時間、可以不斷回顧修正；和傳統測驗相比，它重視學習歷程，教學與評量緊密結合，老師是引導者、學生是自我評量者。比喻：檔案像一本成長相簿，不是把每一張照片都塞進去，而是挑出最能說出成長故事的照片，再寫下當時的感想。","s":["抓題目關鍵字「檔案評量」。","對照講義特點：有目的蒐集、看歷程與成果、教學評量結合、要篩選。","C 符合「看得出歷程與成果」，選 C。"],"w":{"A":"✗ 檔案評量多需要評分規準與專業判斷，屬於主觀成分較高的評量，不是客觀式評量。","B":"✗ 檔案評量強調教學與評量結合，是在學習過程中持續進行的，不是兩個獨立事件。","C":"✓ 檔案保存不同時期的作品與反思，能看出學生的學習歷程和成果。","D":"✗ 檔案評量要有目的地挑選作品，不是全部放入；只當期末依據也忽略了歷程。"},"m":"檔案評量＝有目的挑選＋自我反思＋看見歷程。"},{"n":37,"q":"某英文能力測驗分數為常態分配，在此測驗，小如得分的 z 分數為 2，小武得分的 T 分數為 65，小明得分的百分等級為 50。下列敘述何者正確？","o":["小如的表現最好","小武的表現最好","小明的表現最好","小如和小武的表現相同"],"a":"A","al":"A","c":"跨量尺比較","e":"小如 z＝2；小武 z＝(65－50)÷10＝1.5；常態下 PR50 的小明 z＝0。2＞1.5＞0，所以小如表現最好。比較前必須先轉到同一標準量尺，不能直接比較 2、65 和 50。","p":"32-33","u":"normal","k":"z、T、PR 三種分數的比較，要先換成同一把尺，通常換成 z 分數。T 分數公式 T＝50＋10z，所以 z＝(T－50)÷10；常態分配下 PR50 剛好在平均數，z＝0。比喻：三個人分別用公尺、公分、英寸報身高，不能直接比數字，65 公分不見得比 2 公尺高。換成同單位後，誰高一目了然。","s":["小如：z＝2。","小武：z＝(65－50)÷10＝15÷10＝1.5。","小明：PR50 在平均數，z＝0。","比較：2＞1.5＞0，小如最好，選 A。"],"w":{"A":"✓ 小如 z＝2，高於小武的 1.5 和小明的 0，表現最好。","B":"✗ 小武 T65 換成 z 只有 1.5，數字 65 大不代表表現最好。","C":"✗ 小明 PR50 剛好在平均數，z＝0，是三人中最低。","D":"✗ 小如 z＝2、小武 z＝1.5，兩人並不相同。"},"m":"z、T、PR 先統一成 z，再比高低。"},{"n":38,"q":"下列敘述何者最接近系統性測量誤差？","o":["阿哲因答案卡劃記錯誤導致成績不佳","阿哲因為老師成績加總錯誤而多得 5 分","阿哲因語文能力不好而導致數學表現不好","阿哲考試前因吃壞肚子而導致考試表現不好"],"a":"C","al":"C","c":"系統性誤差","e":"若數學測驗含不必要的語文負擔，語文較弱的學生會持續受到不利影響，屬與無關特質相連的系統性偏誤。答案卡誤記、偶發加總錯誤或臨時身體不適，題幹均未指出有穩定、重複的作用模式。","p":"46-47","u":"reliability","k":"任何測量都有誤差，講義寫成 X＝T＋E：實得分數＝真實分數＋誤差。誤差分兩種：隨機誤差沒有規則、無法預測，可能這次偏高、下次偏低，例如臨時身體不舒服、一時劃錯答案；系統誤差則每次測量都會以同一方向出現，講義提到其中的偏誤是「因受試者特性不同而產生不一樣的誤差」。數學題文字太多，語文較弱的學生每次都會被低估，這種穩定、重複的偏差就是系統誤差。講義也說：系統誤差小，效度高；隨機誤差小，信度高。比喻：體重計歸零沒調好，每次都多 2 公斤是系統誤差；站姿晃動讓數字時高時低是隨機誤差。","s":["先分辨兩種誤差：是否每次都朝同一方向、穩定重複出現。","逐項檢查：劃錯、加總錯、吃壞肚子都是偶發一次的意外。","語文能力差每次都會拖累數學成績，屬系統誤差，選 C。"],"w":{"A":"✗ 答案卡偶然劃錯是一次性的意外，沒有固定方向，屬隨機誤差。","B":"✗ 老師一時加總錯誤是偶發的計分失誤，題幹沒有說每次都會發生，屬隨機誤差。","C":"✓ 語文能力不好會穩定地壓低數學表現，是與受試者特性相連的系統偏誤。","D":"✗ 考前吃壞肚子是臨時的身心狀況，屬隨機誤差。"},"m":"每次都偏同一邊是系統誤差，偶爾出包是隨機誤差。"},{"n":39,"q":"下列何者是解釋兒童心理測驗結果最適切的方式？","o":["將測驗結果向兒童講述並公告周知","應特別對兒童強調測驗結果的有效性","參照指導手冊並一併呈現其他相關的訊息","直接以原始分數告知導師該兒童的測驗結果"],"a":"C","al":"C","c":"測驗結果解釋","e":"應依手冊的適用對象、常模與限制解釋分數，並結合其他資料，故選 C。結果須保障隱私，不能公告；也不宜過度強調一次測驗的準確性，或只給原始分數而沒有常模與誤差說明。","p":"24、91","u":"standard","k":"解釋測驗分數有一套守則，講義列出：依測驗內容與形式解說表現、根據目的適當解釋、謹記分數有誤差、注意分數的可比較性、把受測者的其他相關資料一起考慮。標準化測驗的指導手冊會寫清楚適用對象、常模和限制，解釋時要照著手冊來。講義也提醒測驗可能侵犯隱私、影響自尊。比喻：醫生看健康檢查報告，會對照參考值、問你的生活習慣和病史，不會只念一個數字，更不會把報告貼在公布欄。","s":["題目問「最適切」的解釋方式。","對照講義守則：照手冊、記誤差、納入其他資料、保護隱私。","C 同時符合手冊與其他資料兩點，選 C。"],"w":{"A":"✗ 公告周知侵犯學生隱私，也可能造成標籤、傷害自尊。","B":"✗ 任何測驗都有誤差，過度強調一次結果的有效性，違反「謹記誤差」的守則。","C":"✓ 依指導手冊的常模與限制解釋，並納入其他相關資料，最完整適切。","D":"✗ 原始分數沒有常模對照就看不出意義，也沒有說明誤差，容易被誤解。"},"m":"解釋分數：照手冊、記誤差、看其他資料、不公開。"},{"n":40,"q":"小學生游泳能力檢測訂有十級鑑定標準。若有學生具備「水中行走 10 公尺、水中閉氣 5 秒及水中認物的能力」 ，即可通過「第一級海馬」認證。此種評量結果的解釋屬於下列何者？","o":["常模參照評量","標準參照評量","安置參照評量","診斷參照評量"],"a":"B","al":"B","c":"標準參照","e":"通過海馬級是因達成事先規定的技能，不受其他同學表現影響，故屬標準參照。常模參照會看名次或相對比例；安置與診斷屬用途分類，並非本題對結果的解釋方式。","p":"12-14、30","u":"reference","k":"標準參照評量是依教學前就訂好的標準，判斷學生有沒有達到，重點是「會不會、過不過」，不是和別人比。講義舉的例子是全民英檢的通過或不通過。常模參照則是看你在團體中的相對位置，例如名次或百分等級。比喻：游泳認證就像遊戲闖關，只要完成水中行走 10 公尺、閉氣 5 秒、水中認物這些關卡就能過，哪怕全班都過也沒關係。至於安置、診斷，是依評量的目的分類，不是解釋結果的方式。","s":["抓關鍵字：具備規定的三項能力「即可通過」第一級。","能不能通過只看是否達標，不看別人的表現。","依預設標準解釋，屬標準參照，選 B。"],"w":{"A":"✗ 常模參照要和別人比較名次或比例，但通過海馬級只看自己有沒有達標。","B":"✓ 依事先訂好的技能標準判定是否通過，是標準參照評量。","C":"✗ 安置性是依評量目的分類（教學前了解預備情形），不是結果解釋方式，也沒有「安置參照」這種分類。","D":"✗ 診斷性同樣是依目的分類（找出學習困難），不是結果解釋方式。"},"m":"闖關過了就過，看標準不看別人：標準參照。"},{"n":41,"q":"以重測法估計信度時，是為了瞭解測量結果的何種性質？","o":["穩定性","等值性","有效性","正確性"],"a":"A","al":"A","c":"重測信度","e":"同一群人在不同時間做同一份測驗，兩次分數的相關反映跨時間的穩定性。等值性主要由複本信度檢驗；有效性／正確性較接近效度，並非重測信度的直接意義。","p":"48-50、55","u":"reliability","k":"信度是測驗結果的一致性，有好幾種估計方法，各自回答不同的問題。重測信度：同一份測驗、同一群人、不同時間各測一次，兩次分數的相關叫「穩定係數」，看結果跨時間穩不穩定。複本信度：兩份內容等同的題本，看「等值性」。內部一致性信度（折半、庫李、α 係數）：看題目之間是否一致。評分者信度：看不同評分者給分是否一致。比喻：同一支溫度計今天量和下週量，在條件不變下讀數一樣，就是穩定。","s":["抓關鍵字「重測法」。","對照講義：重測信度係數又稱穩定係數，誤差來源是時間抽樣。","選 A。"],"w":{"A":"✓ 重測法比較不同時間的兩次分數，反映測量結果的穩定性（穩定係數）。","B":"✗ 等值性是複本信度在檢驗的，看兩份題本是否等同。","C":"✗ 有效性是效度的概念，測驗是否測到想測的特質，不是信度。","D":"✗ 正確性同樣接近效度的意思，重測只能說明穩定，不能證明正確。"},"m":"重測看穩定，複本看等值，折半看內部一致。"},{"n":42,"q":"下列有關選擇題和申論題的敘述，何者最適切？","o":["申論題評分者一致性較高","選擇題易測量高層次的能力","申論題內容取樣的代表性較佳","選擇題對知識評量的客觀性較佳"],"a":"D","al":"D","c":"題型比較","e":"選擇題依預定答案計分，較少受閱卷者主觀差異影響，故評分客觀性較佳。申論題的一致性通常需靠規準與訓練提升，且題數少、內容取樣較窄；高層次選擇題可以設計，但並不容易。","p":"56、69、76、81","u":"itemtype","k":"選擇題是選出式反應：答案事先定好，誰來改都一樣，計分客觀；題數多，內容取樣廣。申論題是建構反應題：學生自己組織文字作答，能看出思考與表達，但題數少、取樣窄，評分容易受閱卷者主觀影響，例如講義提到的月暈效應、文字操作效應，需要靠評分規準和評分者訓練來提高一致性。比喻：選擇題像用電子秤量重量，誰來量數字都一樣；申論題像請評審品嚐料理打分，每位評審口味不同。","s":["比較兩種題型的優缺點：客觀性、取樣、能否測高層次。","A、C 把申論題的缺點說成優點；B 說選擇題容易測高層次，不正確。","選擇題計分客觀，選 D。"],"w":{"A":"✗ 申論題由閱卷者判斷給分，主觀成分高，評分者一致性通常較低。","B":"✗ 選擇題可以測高層次能力，但設計不容易；這反而是申論題的強項。","C":"✗ 申論題題數少，只能涵蓋少數內容，取樣代表性較差。","D":"✓ 選擇題依預定答案計分，不受閱卷者主觀影響，客觀性較佳。"},"m":"選擇題客觀取樣廣，申論題深入但主觀。"},{"n":43,"q":"下列何種測驗最重視內容效度？","o":["成就測驗","性向測驗","智力測驗","人格測驗"],"a":"A","al":"A","c":"成就測驗的效度","e":"成就測驗要判斷學過的內容與目標達成程度，因此特別重視題目能否代表教學範圍，也就是內容效度。性向測驗常重視預測；人格、智力測驗重視構念的理論支持，但各類測驗仍可需要多種效度證據。","p":"38、68","u":"validity","k":"內容效度是看評量題目能不能代表要測的內容範圍與學習目標。講義明寫「成就測驗最需要內容效度」，檢驗方法是專家判斷和雙向細目表。成就測驗是測學生學過的東西學會多少，像段考、月考，如果題目沒有涵蓋教過的重點，分數就不能代表學習成果。性向測驗重在預測未來表現，常看預測效度；智力、人格測驗重在反映理論中的抽象特質，常看建構效度。比喻：期末考只考第一課，就算學生考 100 分，也不代表整學期都學會。","s":["抓關鍵字「最重視內容效度」。","內容效度問的是題目能否代表「教過的內容」，最對應測學習成果的測驗。","講義：成就測驗最需要內容效度，選 A。"],"w":{"A":"✓ 成就測驗要判斷教過的內容學會多少，題目必須代表教學範圍，最重視內容效度。","B":"✗ 性向測驗的目的是預測未來學習潛能，較重視預測效度。","C":"✗ 智力是抽象構念，智力測驗較重視建構效度。","D":"✗ 人格是抽象構念，人格測驗較重視建構效度，沒有明確的教學內容範圍。"},"m":"成就看內容，性向看預測，智力人格看建構。"},{"n":44,"q":"某次段考的測驗卷中有 5 個題目超出命題範圍。為了避免爭議，老師們決定一律給分。這種作法較可能產生下列何種結果？","o":["測驗信度不變","測驗效度不變","得分平均數降低","得分標準差縮小"],"a":"D","al":"D（通常情況）","c":"一律給分與變異","e":"原先超範圍題目若有人對、有人錯，一律給分後該部分不再區分學生，通常使總分差異縮小，故 D 最符合一般命題意圖。平均數不會降低；信度與效度也不能保證不變。","p":"45-47、56；統計補充","x":"標準差是否必然縮小，仍受這 5 題與其餘題目分數的共變關係影響；題幹不足以作無條件的數學保證。","u":"stats","k":"標準差（SD）是分數分散程度的指標：大家分數差很多，SD 就大；大家差不多，SD 就小。每個人的總分＝其他題得分＋這 5 題得分。原本這 5 題有人答對、有人答錯，會讓學生之間的總分差距拉大；一律給分後，這 5 題每個人都拿一樣的分，等於大家加上同一個常數，它不再造成差異，總分的分散只剩其他題貢獻的部分，所以通常會縮小。比喻：五顆骰子比總點數，把其中一顆固定成 6 點，大家總分的高低差距通常就變小了。平均數則會上升或不變，因為原本答錯的人被加了分。補充提醒：標準差是否必然縮小，還受這 5 題和其他題的相關影響，例如兩者負相關時，拿掉這 5 題反而可能讓差距變大，所以題目說「較可能」，不是無條件的數學保證。","s":["拆解總分：總分＝其他題得分＋5 題得分。","一律給分後，5 題得分人人相同，是常數；加常數不改變標準差。","差異只剩其他題，通常比原本小，SD 縮小；原本答錯者加分，平均數上升或不變。","選 D。"],"w":{"A":"✗ 這 5 題原本對區分學生有貢獻，一律給分後總分的組成改變，信度不能保證不變。","B":"✗ 這 5 題原本就超出範圍會影響效度，一律給分後分數組成改變，效度也不能保證不變。","C":"✗ 原本答錯的人被加分，平均數只會上升或不變，不會降低。","D":"✓ 5 題變成人人相同的常數，不再拉開差距，標準差通常縮小。"},"m":"人人送一樣的分，差距不會拉大，標準差通常變小。"},{"n":45,"q":"下列何者不屬於實作評量？","o":["英文課老師採口試方式評量學生的口說能力","家政課老師請學生上台示範製作麵包的流程","服務學習課程要求學生參與社區服務並製作學習檔案","體育課老師設計 50 題選擇題評量學生的球類運動知識"],"a":"D","al":"D","c":"實作評量","e":"50 題選擇題主要評量學生辨認球類知識，沒有直接展現運動操作，所以 D 不屬本題的實作評量。口試、示範製作麵包、參與服務並製作學習檔案，均可直接取得表現或作品證據。","p":"75-77、80、87","u":"performance","k":"實作評量是讓學生實際操作、表演或完成作品，直接評量真正的表現，同時看過程與成果。講義把
