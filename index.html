量的機會，違反學生參與精神。","B":"✗ 適切：事先溝通檔案目的與目標，讓學生和家長知道方向，有助順利實施。","C":"✗ 適切：定期自評與省思並訂下一步計畫，正是檔案評量培養自我改進能力的做法。","D":"✗ 適切：同儕展示與回饋能互相學習，也讓學生分享學習成就。"},"m":"老師給方向，學生挑內容；全包辦就不是檔案評量。"},{"n":150,"q":"估計測驗信度的各種方法中，哪一種最容易受練習和記憶的影響？","o":["折半方法","庫李方法","評分者方法","複本方法"],"a":"D","al":"D（現有選項中較佳）","c":"練習與記憶影響","e":"複本法通常須做兩份相似題本，前次經驗可能影響後次表現；折半、庫李通常只施測一次，評分者法則比較評分，因此四項中取 D。","p":"48-55","x":"最典型、最容易受相同題目記憶影響的是「重測法」，卻未列入選項。請勿把本題背成「複本法一定比重測法更受記憶影響」。","u":"reliability","k":"這題考各種信度方法的誤差來源。重測法是同一份測驗隔一段時間再考一次；複本法是用兩份內容等值的題本施測；折半法和庫李法都只考一次，從同一份測驗內部算一致性；評分者法是比較不同評分者的給分。要受到「練習和記憶」影響，必須讓受試者「考過一次之後再考」，前一次的經驗才會帶到下一次。四個選項中，只有複本法需要考兩次，雖然題目不同，但題型、內容類似，第一次的練習經驗仍會影響第二次。補充提醒：最典型、最容易受同題記憶影響的其實是重測法，只是本題沒列出；不要背成「複本法比重測法更受記憶影響」。","s":["先想：練習與記憶效果要發生，前提是「施測兩次以上」。","折半、庫李只施測一次；評分者法比較的是評分者，不是受試者重考。","四項中只有複本法要做兩份相似題本，選 D；但真正最典型的是未列出的重測法。"],"w":{"A":"✗ 折半法只施測一次，再把題目分兩半算相關，沒有前次經驗可帶入。","B":"✗ 庫李法也只施測一次，看題目之間的一致性，不受練習與記憶影響。","C":"✗ 評分者法比較不同評分者的給分一致性，誤差來源是評分者，不是學生的記憶。","D":"✓ 複本法須施測兩份相似題本，前一次的練習經驗會影響後一次，是四項中最受影響的。"},"m":"考兩次才會有記憶效應：重測最典型，本題選複本。"},{"n":151,"q":"以折半法估計信度，是為了顯示信度測量的哪一種性質？","o":["穩定性","等值性","一致性","正確性"],"a":"C","al":"C","c":"折半信度","e":"同一份測驗分成兩半，比較兩半分數的一致程度，屬內部一致性，故選 C。穩定性主要對應重測；等值性主要對應兩份複本；正確性則較接近效度。估計整份測驗信度時通常還須作長度校正。","p":"51-52、55","u":"reliability","k":"這題考折半信度代表的性質。折半法是把同一份測驗分成兩半，例如單數題一半、雙數題一半，計算兩半分數的相關，看題目之間是否一致地測量同一種能力，屬內部一致性信度。因為每一半只有原測驗一半長，算出的係數會偏低，通常要再用斯皮爾曼—布朗公式校正回全長。不同信度方法各有代表性質：重測代表穩定性（跨時間），複本代表等值性（跨題本），折半與庫李代表內部一致性。至於「正確性」是在講效度。就像檢查一把尺，把它對折看兩段刻度是否對得上。","s":["先回想折半法做法：同一份測驗分兩半，求兩半的相關。","這是看測驗內部題目是否一致，屬內部一致性。","對照：穩定性是重測、等值性是複本、正確性是效度，選 C。"],"w":{"A":"✗ 穩定性指跨時間的一致，是重測信度代表的性質。","B":"✗ 等值性指兩份複本內容是否相當，是複本信度代表的性質。","C":"✓ 折半法比較同一份測驗兩半是否一致，代表內部一致性。","D":"✗ 正確性是指有沒有測到想測的東西，屬效度，不是信度。"},"m":"重測看穩定，複本看等值，折半看內部一致。"},{"n":152,"q":"下列哪一種信度所計算出來的係數，又可稱為「穩定係數」？","o":["複本信度","折半信度","庫李信度","再測信度"],"a":"D","al":"D","c":"穩定係數","e":"再測信度是同一測驗跨兩個時間點的相關，所以又稱穩定係數。複本立即信度是等值係數；延宕複本涉及穩定與等值；折半、庫李均主要表示內部一致性。","p":"48-50、55","u":"reliability","k":"這題考各種信度係數的別名。再測信度（重測信度）是同一份測驗在不同時間施測兩次，求兩次分數的相關，看分數是否跨時間保持穩定，所以又叫「穩定係數」。複本立即信度是同時施測兩份等值題本，叫「等值係數」；複本延宕信度隔一段時間施測兩份題本，叫「穩定且等值係數」。折半和庫李信度則看同一份測驗內部的一致性。就像今天量和下週量體重都差不多，代表體重計很穩定。","s":["抓關鍵字「穩定」：代表跨時間的一致。","同一測驗跨兩個時間點的相關，是再測信度。","對照講義：再測＝穩定係數，複本立即＝等值係數，選 D。"],"w":{"A":"✗ 複本立即信度稱等值係數；延宕複本才稱穩定且等值係數，不單稱穩定係數。","B":"✗ 折半信度是把一份測驗分兩半，代表內部一致性，不是穩定係數。","C":"✗ 庫李信度看題目間的同質性，屬內部一致性係數。","D":"✓ 再測信度是同一測驗前後兩次分數的相關，講義明寫又稱穩定係數。"},"m":"再測穩定、複本等值、折半庫李看內部。"},{"n":153,"q":"某教師自編數學科測驗 20 題，信度係數.50，如果該學科測驗再增加 40 題，信度係數變成多少？","o":["0.55","0.65","0.75","0.85"],"a":"C","al":"C","c":"斯皮爾曼—布朗公式","e":"原有 20 題，再增加 40 題，總數為 60，因此倍數 k＝60／20＝3。新信度 r新＝kr舊／[1＋(k－1)r舊]＝3×.50／[1＋2×.50]＝.75，選 C。最常見錯誤是把「增加 40」讀成「總共 40」。","p":"56、59；公式補充","u":"reliability","k":"信度是測驗分數的穩定程度，就像體重計量三次都差不多，才算可靠。題目越多，偶然因素（猜對、恍神）互相抵銷，信度就會上升。斯皮爾曼—布朗公式就是用來預估「題數變成原來 k 倍後，信度變多少」的公式：r新＝k×r舊／[1＋(k－1)×r舊]。這題的陷阱在「再增加 40 題」，不是「變成 40 題」。","s":["算倍數：原有 20 題，再加 40 題，總共 20＋40＝60 題，k＝60÷20＝3。","代分子：k×r舊＝3×.50＝1.50。","代分母：1＋(k－1)×r舊＝1＋2×.50＝2.00。","相除：1.50÷2.00＝.75，選 C。"],"w":{"A":"✗ .55 太小，題數變三倍，信度不會只多一點點。","B":"✗ .65 不對；就算誤讀成總共 40 題（k＝2），也是 1.0÷1.5≈.67，何況本題 k＝3。","C":"✓ 題數變 3 倍，代入公式得 3×.5／(1＋2×.5)＝.75。","D":"✗ .85 高估了，信度增加有邊際遞減，不會跳這麼多。"},"m":"再加 40 是總共 60，k＝3；信度上升但越加越慢。"},{"n":154,"q":"如果一份包含 40 個題目的測驗，其信度為 0.70；若欲將其信度提高為 0.78，則新的測驗將會有幾題？","o":["20","40","60","80"],"a":"C","al":"C（約 60 題）","c":"由目標信度求題數","e":"k＝r新(1－r舊)／[r舊(1－r新)]＝.78×.30／(.70×.22)≈1.5195；新題數≈40×1.5195＝60.78。原選項以約數取 60，故 C。60 題的信度約 .7778，四捨五入為 .78。","p":"56、59；公式補充","x":"若題意要求「未四捨五入前至少達 .7800」，應向上取 61 題，原選項未提供；本題按一般約值作答。","u":"reliability","k":"這題把斯皮爾曼—布朗公式倒過來用：已知舊信度和想要的新信度，求題數要變成幾倍。倒推式是 k＝r新(1－r舊)／[r舊(1－r新)]。就像想把湯煮得更濃，先算要加幾倍的料。要注意算出來不是整數時，選項用的是約數；若嚴格要求「至少達到 .7800」，就得無條件進位到 61 題，但選項沒有，所以本題按一般約值選 60。","s":["分子：r新×(1－r舊)＝.78×.30＝.234。","分母：r舊×(1－r新)＝.70×.22＝.154。","倍數 k＝.234÷.154≈1.5195。","新題數＝40×1.5195≈60.78，最接近 60，選 C。","回頭驗算：60 題 k＝1.5，1.5×.70／(1＋.5×.70)＝1.05／1.35≈.7778，四捨五入為 .78。"],"w":{"A":"✗ 20 題是題數減半，信度會下降，不可能從 .70 升到 .78。","B":"✗ 40 題就是原測驗，信度仍是 .70。","C":"✓ 倍數約 1.52，40×1.52≈60.8，取約數 60；60 題信度約 .778。","D":"✗ 80 題 k＝2，信度約 .82，超過目標太多。"},"m":"倒推求倍數 k，再乘原題數；嚴格至少達標要向上進位。"},{"n":155,"q":"教師實施學科成就測驗，藉以確定學生目前的學科成就水準，欲達到此目的，所必須關心的效度是","o":["效標效度","構念效度","同時效度","內容效度。"],"a":"D","al":"D","c":"成就測驗與內容效度","e":"要知道學生目前的學科成就，題目須代表教過的内容與學習目標，因此內容效度最關鍵。效標／同時效度還須其他外部表現比較；構念效度則著重理論特質。題幹只提供學科目標判斷，故 D 最直接。","p":"38、68","u":"validity","k":"效度是測驗有沒有量到「想量的東西」。內容效度問的是：題目是不是教過內容與教學目標的好樣本，就像試吃一鍋湯，要舀到各種料才算代表整鍋。成就測驗的目的是看學生學會了多少已教內容，所以最要關心的就是內容效度。效標效度要拿外部表現來比，構念效度看抽象心理特質是否符合理論。","s":["抓關鍵字：「學科成就測驗」「目前的學科成就水準」。","成就測驗要回答「教過的東西學會沒」，對應題目與教材、目標的代表性。","代表性就是內容效度，選 D。"],"w":{"A":"✗ 效標效度要另找外部標準（如其他考試、日後表現）求相關，題幹沒有提。","B":"✗ 構念效度用在智力、人格等抽象特質，不是學科成就的首要關心。","C":"✗ 同時效度是效標效度的一種，要同時取得外部效標，題幹沒有。","D":"✓ 成就測驗最關心題目能否代表教學內容與目標，即內容效度。"},"m":"成就測驗看內容，抽象特質看建構，外部比對看效標。"},{"n":156,"q":"學校編製段考測驗卷時，請其他科任教師評斷試題是否合適，係為了增加下列何種效度","o":["預測效度","內容效度","建構效度","同時效度。"],"a":"B","al":"B","c":"專家審題","e":"請熟悉該學科的教師檢查題目是否合適、是否涵蓋目標與內容，是內容效度的專家判斷。它不是預測未來表現，也未和同時取得的外部效標求相關；所以不是預測或同時效度。","p":"38、68","u":"validity","k":"內容效度常靠「專家判斷」來建立：請懂這門學科的人看看題目是否合適、有沒有涵蓋該考的內容與目標。就像菜色上桌前請資深廚師試味道。它不需要算相關係數。預測效度和同時效度都屬效標關聯效度，要把測驗分數和外部標準（未來或現在的表現）求相關。","s":["關鍵字：「請其他科任教師評斷試題是否合適」＝專家審題。","專家審題是內容效度最典型的證據。","其他選項都要外部數據或理論驗證，題幹沒有，選 B。"],"w":{"A":"✗ 預測效度要拿測驗分數和日後表現求相關，題幹沒有追蹤未來。","B":"✓ 請熟悉學科的教師審題，是內容效度的專家判斷。","C":"✗ 建構效度要驗證抽象特質的理論，如因素分析，題幹沒有。","D":"✗ 同時效度要和同一時間的外部效標求相關，題幹沒有。"},"m":"請老師審題＝內容效度；要算相關才是效標效度。"},{"n":157,"q":"下列何者最能反映成就測驗的內容效度？","o":["測驗與學校成績的相關為 0.60","測量標準誤為 5","測驗的題目與測驗總分有高相關","測驗題目反應課程教學目標有關"],"a":"D","al":"D","c":"內容與目標相符","e":"內容效度最直接的證據是題目能否反映課程教學目標，因此選 D。A 是與外部成績的關聯；B 的 SEM 反映測量誤差；C 的題目—總分相關較關乎內部結構或鑑別，不等於內容範圍完整。","p":"38、68","u":"validity","k":"內容效度的核心證據是「題目是否反映課程與教學目標」。做法上常用雙向細目表和專家審查。要小心把各種數字混在一起：和外部成績的相關是效標效度；測量標準誤是信度的指標，表示分數會晃多少；單題和總分的相關是內部一致性或鑑別度的概念。","s":["題目問「內容效度」，先想它的定義：題目代表教學內容與目標。","逐項判斷每個選項屬於哪個概念。","只有 D 直接談題目與課程目標的對應，選 D。"],"w":{"A":"✗ 和學校成績相關 .60 是效標關聯效度（同時效度）的證據。","B":"✗ 測量標準誤反映測量誤差大小，是信度的概念。","C":"✗ 題目與總分高相關屬內部一致性或試題鑑別，不等於內容涵蓋完整。","D":"✓ 題目反映課程教學目標，正是內容效度的定義。"},"m":"內容效度看題目對不對得上目標，不看相關係數。"},{"n":158,"q":"「為了建立工作職能量表的效度，蒐集受試者在工作滿足、生理壓力以及組織承諾的表現資料，以決定工作滿足、生理壓力及組織承諾是否能由工作職能量表上的分數來預測」 。上述情境說明的是何種效度的建立？","o":["效標關聯效度","構念效度","內容效度","專家效度"],"a":"A","al":"A","c":"效標關聯效度","e":"以工作滿足、生理壓力、組織承諾等外部表現，檢查量表分數能否預測它們，最直接是效標關聯效度。題幹沒有交代效標取得時點，故不再逕分同時或預測；也不是只請專家看內容或單看題目代表性。","p":"37、40-41","u":"validity","k":"效標關聯效度是把測驗分數拿去和一個外部標準（效標）比，看能不能預測或對應它。就像用模擬考成績去預測會考成績。題幹中的工作滿足、生理壓力、組織承諾就是外部效標，問「能否由量表分數來預測」，正是效標關聯效度。題幹沒說效標何時取得，所以用大類名稱即可，不必再細分同時或預測。","s":["關鍵字：「蒐集外部表現資料」「能否由量表分數來預測」。","拿量表分數對照外部標準，屬效標關聯效度。","選項只有 A 是這個大類，選 A。"],"w":{"A":"✓ 用量表分數去預測工作滿足等外部表現，就是效標關聯效度。","B":"✗ 構念效度要驗證量表背後的理論特質，題幹重點在預測外部表現。","C":"✗ 內容效度看題目是否涵蓋應測內容，題幹沒有檢查題目。","D":"✗ 專家效度指請專家判斷題目，是內容效度的做法，題幹沒有。"},"m":"拿外部標準來對照或預測，就是效標關聯效度。"},{"n":159,"q":"人格測驗重視何種效度","o":["同時效度","內容效度","建構效度","預測效度。"],"a":"C","al":"C","c":"人格構念","e":"人格是抽象的心理構念，須由理論、題目結構及與其他變項的關係支持其意義，因此本題選建構效度。人格測驗也可有內容或效標證據，但不能只憑看起來像人格題，或某一外部相關，就完整確立效度。","p":"37、59","u":"validity","k":"建構效度（構念效度）是看測驗能不能量到一個理論上的抽象特質，像智力、焦慮、外向性。這些特質看不見摸不著，就像「風」只能從樹葉搖動推知，需要用理論、因素分析、與其他變項的關係來支持。人格正是典型的抽象構念，所以人格測驗最重視建構效度。成就測驗才是重內容效度。","s":["關鍵字：「人格測驗」——人格是抽象心理特質。","抽象特質要靠理論架構驗證，對應建構效度。","選 C；內容效度留給成就測驗，預測效度留給性向測驗。"],"w":{"A":"✗ 同時效度是和現有外部標準比，只是一種效標證據，不足以確立人格的意義。","B":"✗ 內容效度是成就測驗的重點，人格無法用「教材範圍」來界定。","C":"✓ 人格是抽象構念，最重視建構效度。","D":"✗ 預測效度常用於性向測驗，預測未來表現。"},"m":"成就重內容，性向重預測，智力人格重建構。"},{"n":160,"q":"老師欲對學生的書法、圖畫作品進行評量，以下哪一評量工具最適合？","o":["軼事紀錄","評定量表","檢核表","紙筆測驗。"],"a":"B","al":"B","c":"評定量表","e":"書法、圖畫的品質往往有程度差異，評定量表可依構圖、筆法等面向分級，最適切。檢核表偏「有／無」；軼事記錄描述事件脈絡；紙筆測驗則不能直接取代對作品品質的評定。","p":"81-82","u":"observe","k":"評定量表是依幾個面向，把表現分成不同等級打分，例如構圖 1～5 分、筆法 1～5 分，適合評「品質好到什麼程度」。檢核表只勾「有／沒有」，像出門前檢查鑰匙帶了沒。軼事紀錄是把觀察到的具體事件文字描述下來。書法、圖畫作品的好壞有程度之分，所以用評定量表最合適。","s":["關鍵字：書法、圖畫作品——要評品質高低。","品質有程度差異，需要分級，對應評定量表。","檢核表只有有無，軼事紀錄只是描述，紙筆測驗量不到作品，選 B。"],"w":{"A":"✗ 軼事紀錄用來描述有意義的行為事件，不是作品品質分級工具。","B":"✓ 評定量表可依各面向分等級，適合評作品品質的程度。","C":"✗ 檢核表只記錄「有／無」，分不出寫得多好。","D":"✗ 紙筆測驗無法直接評定書法、畫作的品質。"},"m":"有沒有用檢核表，好不好用評定量表。"},{"n":161,"q":"依據學生在前一個試題是否答對來選答下一道試題，這種測驗稱之為：","o":["適性測驗","標準化測驗","速度測驗","難度測驗"],"a":"A","al":"A","c":"適性測驗","e":"依前一題是否答對，調整下一題的難度或選題，使題目更貼近受試者能力，稱適性測驗。標準化強調程序一致；速度測驗重完成速度；「難度測驗」不是這種逐題調整程序的名稱。","p":"6、25；適性測驗補充","u":"alt","k":"適性測驗是會「看人出題」的測驗：你答對就給難一點的題，答錯就給簡單一點的題，讓題目越來越貼近你的能力。就像打電動會自動調整難度。現在多用電腦執行，稱電腦化適性測驗。它和標準化測驗、速度測驗是不同分類方式的名稱。","s":["關鍵字：「依前一題是否答對來選下一題」。","依作答反應調整題目，正是適性測驗的定義。","選 A。"],"w":{"A":"✓ 依前一題對錯選下一題，就是適性測驗。","B":"✗ 標準化測驗強調施測、計分、解釋程序一致，不是逐題調整。","C":"✗ 速度測驗題目簡單但限時，看作答快慢。","D":"✗ 難度測驗（能力測驗）時間充足、題目由易到難，看能做到多難，不是逐題選題。"},"m":"答對變難、答錯變易，看人出題叫適性。"},{"n":162,"q":"王老師為自然科老師，他在命自然試卷之前先要做一份命題計畫，即設計雙向細目表，他要設計雙向細目表時，下列那一個敘述是錯誤的？","o":["試題要兼顧教學目標和課程內容","各單元在整份試題所佔的比例要大致均衡","各教學目標的認知層次所佔的比例要相等","在教學目標與課程內容交叉的部分細格中所分配的比例可以是 0"],"a":"C","al":"C","c":"細目表權重","e":"各認知層次的比例應依目標重要性、教學重點等決定，不必一律相等，因此 C 最明確錯誤。內容與目標須兼顧；不適用的交叉格可為 0。B 的「大致均衡」也應理解為合理代表各單元，而非每單元機械式平均分配。","p":"38、61-68","u":"bloom","k":"雙向細目表是命題前的藍圖，一軸是教材內容（單元），另一軸是教學目標（如 Bloom 的記憶、理解、應用…），每一格寫要出幾題或配多少分。就像蓋房子前畫設計圖。各格比例要依教學重點與目標重要性決定，不必每個認知層次一樣多；不適合的交叉格（例如某單元沒有評鑑層次的內容）可以是 0。","s":["題目問「錯誤」的敘述。","回想雙向細目表配比原則：依重要性與教學時數分配，不求機械平均。","C 說各認知層次比例要相等，違反原則，選 C。"],"w":{"A":"✗ 正確敘述：雙向細目表本來就是內容和目標兩個向度兼顧。","B":"✗ 正確敘述：各單元比例大致合理、有代表性即可。","C":"✓ 錯誤：認知層次比例應依目標重要性分配，不必相等。","D":"✗ 正確敘述：不適用的交叉細格可以是 0 題。"},"m":"細目表看重點配分，不是平均分；空格可以是 0。"},{"n":163,"q":"進行試題分析時，有關難度(P)與鑑別度(D)的解釋，及二者間之關係，下列敘述何者正確？","o":["難度與鑑別度兩者並無相關","鑑別度出現負值，代表題目太過容易","難度越趨近於 0，鑑別度亦趨近於 0","難度越趨近於 1，鑑別度亦趨近於 1"],"a":"C","al":"C","c":"極端難度與鑑別","e":"P 越接近 0，表示幾乎沒人答對，高低分組答對率都接近 0，兩者差值也只能接近 0，所以 C 正確。同理 P 越接近 1，D 也受限；負 D 表示低分組反而答對較多，不能直接解讀為太容易。","p":"71-74","u":"item","k":"難度 P 是答對的比例，0 到 1，越大越簡單。鑑別度 D＝高分組答對率 PH－低分組答對率 PL，看題目能不能分出高低程度。當 P 接近 0，幾乎沒人答對，PH 和 PL 都接近 0，相減也只剩接近 0；P 接近 1 時，大家都答對，D 也接近 0。P＝.5 時 D 的可能最大值才最大。所以兩者有關係，像拔河時兩隊都沒人或都滿員就分不出勝負。","s":["回想：D＝PH－PL，P 是兩組答對率的平均。","P→0 代表 PH、PL 都→0，所以 D→0；P→1 時 D 也→0。","C 正確，D 選項方向錯，選 C。"],"w":{"A":"✗ 兩者有關：難度極端時會限制鑑別度的最大值。","B":"✗ 負鑑別度是低分組答對比高分組多，代表題目可能有問題，不是太容易。","C":"✓ 幾乎沒人答對時，高低分組都約 0，鑑別度也趨近 0。","D":"✗ 難度趨近 1 是大家都答對，鑑別度反而趨近 0，不是 1。"},"m":"太難太易都分不出高下，P＝.5 鑑別潛力最大。"},{"n":164,"q":"心理測驗中「鑑別度」的概念，以下哪一選項的文字較正確？","o":["題目愈簡單，鑑別度愈低","測驗題目能夠區分出高下的程度","鑑別度愈低，鑑別指數愈高","試題答對人數與答錯人數的百分比"],"a":"B","al":"B","c":"鑑別度意義","e":"鑑別度衡量題目區分不同能力／成就受試者的程度，故選 B。越簡單不一定一路越低，須看實際答對率分布；C 的指數方向自相矛盾；D 只比較答對與答錯總數，沒有比較高低分組。","p":"74","u":"item","k":"鑑別度是題目能不能分辨出程度好與程度差的學生。就像好的篩子能把大顆和小顆分開。常用 D＝PH－PL 計算，D 越大代表越能區分。它必須比較高分組和低分組，只看全班答對、答錯人數，那是難度不是鑑別度。","s":["回想鑑別度的定義：區分高低能力的程度。","B 直接說出定義。","檢查其他選項：A 太絕對，C 自相矛盾，D 是難度概念，選 B。"],"w":{"A":"✗ 太絕對：題目簡單不一定鑑別度一路越低，要看高低分組實際答對率。","B":"✓ 鑑別度就是題目區分受試者高下的程度。","C":"✗ 鑑別度低，鑑別指數就低，兩者方向相同，此句自相矛盾。","D":"✗ 答對與答錯人數的比例描述的是難度，沒有分高低分組。"},"m":"鑑別度比的是高分組和低分組，不是全班對錯人數。"},{"n":165,"q":"下列有關試題鑑別度的敘述何者是正確的？","o":["鑑別度指數是介於-1 到+1 之間","試題鑑別度是指該試題學生通過的比例","試題難度越高，越具有鑑別度","試題難度越低，越具有鑑別度"],"a":"A","al":"A","c":"D 的範圍","e":"PH、PL 均介於 0 和 1，因此 D＝PH－PL 的範圍為 -1 至 +1，A 正確。全體通過比例是難度 P，不是 D；題目越難或越易也不保證越能區分能力，兩端極端難度通常反而限制 D。","p":"71-74","u":"item","k":"鑑別度 D＝PH－PL。PH 和 PL 都是比例，最小 0、最大 1，所以兩者相減最大是 1－0＝＋1（高分組全對、低分組全錯），最小是 0－1＝－1（低分組全對、高分組全錯）。因此 D 介於 －1 到 ＋1。至於「通過比例」是難度 P，題目太難或太易都會壓低鑑別度。","s":["寫出公式 D＝PH－PL，PH、PL 都在 0～1。","最大值 1－0＝1，最小值 0－1＝－1，範圍 －1～＋1。","A 正確，選 A。"],"w":{"A":"✓ D＝PH－PL，兩個 0～1 的比例相減，範圍為 －1 到 ＋1。","B":"✗ 學生通過的比例是難度 P 的定義，不是鑑別度。","C":"✗ 題目太難時高低分組都答錯，鑑別度反而低。","D":"✗ 題目太易時高低分組都答對，鑑別度也低。"},"m":"D＝PH－PL，最多 ＋1，最少 －1。"},{"n":166,"q":"測驗偏差(test bias)會導致測驗的公平性遭到質疑，下列對於測驗偏差的敘述何者錯誤？","o":["測驗會導致偏差是能力相同但來自不同群體的個人，在某份測驗上答對試題的機率不一樣","測驗在編製的過程、實施和解釋時都有可能造成偏差","偏差可能來自於文化、種族、語言、性別和社經地位","改變社會環境就可以消弭測驗偏差"],"a":"D","al":"D","c":"測驗公平性","e":"測驗偏差可能出現在編製、施測與解釋，也可能涉及文化或語言等無關因素；只改變社會環境無法保證消弭，故 D 錯。A 在傳統題意上描述相同能力者的群體差異；嚴謹上，差異試題功能仍須进一步審查，才判定是否為不公平偏差。","p":"24、47、58-59、91","u":"itemtype","k":"測驗偏差是指測驗對某些群體不公平：能力一樣的人，只因文化、語言、性別、社經背景不同，答對機率就不同。例如題目用到城市孩子才熟悉的捷運情境，山區孩子就吃虧。偏差可能出現在編題、施測、解釋各階段，要靠審題、試題分析、調整施測方式來減少，不是改變社會環境就能消除。嚴謹來說，A 描述的群體差異（差異試題功能）還要再審查，才能判定是不公平的偏差。","s":["題目問「錯誤」的敘述。","回想偏差的定義、來源與處理方式。","D 把責任推給社會環境，且「就可以消弭」太絕對，選 D。"],"w":{"A":"✗ 正確：同能力者因群體不同而答對機率不同，是偏差的傳統定義（嚴謹上需再審查才判定）。","B":"✗ 正確：編製、實施、解釋都可能產生偏差。","C":"✗ 正確：文化、種族、語言、性別、社經都是常見來源。","D":"✓ 錯誤：偏差要從測驗本身改進，只改變社會環境無法保證消除。"},"m":"偏差從測驗本身改，不是等社會改變。"},{"n":167,"q":"王老師持續且客觀描述發生在曉華小朋友身邊具有觀察價值的事件，王老師採用的教學評鑑方法是","o":["表現技術","問卷調查","軼事記錄","檢核表。"],"a":"C","al":"C","c":"軼事記錄","e":"對具有觀察價值的具體事件，以客觀敘述記錄情境、行為與反應，屬軼事記錄。問卷靠填答取得資料；檢核表按預定項目勾選有無。記錄時應先描述可觀察事實，再另列解釋，避免把猜測當事實。","p":"87、92-96","u":"observe","k":"軼事紀錄是教師把觀察到、有意義的具體事件，客觀地寫下來，像寫日記但只寫看到的事實：時間、情境、行為、反應。寫的時候要先記事實，再另外寫自己的解釋，不要把猜測當成事實。檢核表是事先列好項目打勾；問卷要靠對方填答。","s":["關鍵字：「持續且客觀描述」「具有觀察價值的事件」。","描述具體事件的文字紀錄，就是軼事紀錄。","選 C。"],"w":{"A":"✗ 表現技術泛指實作類評量方式，不是描述事件的紀錄方法。","B":"✗ 問卷調查是請人填答取得資料，不是教師直接描述事件。","C":"✓ 客觀描述有意義的具體事件，正是軼事紀錄。","D":"✗ 檢核表是依預定項目勾選有無，不是文字描述。"},"m":"記下有意義的小故事，先寫事實再寫解釋，叫軼事紀錄。"},{"n":168,"q":"下列何者不是檔案評量的特色？","o":["允許學生參與","可分享學習成就","適應個別化目標","兼具信、效度"],"a":"D","al":"D","c":"檔案評量的限制","e":"學生參與、分享成果及配合個別目標，是檔案評量常見特色；但信度與效度須靠取樣、規準及評分品質建立，不能保證天然兼具，故 D 不是必然特色。不要把「有助完整理解學生」直接等同「信效度一定高」。","p":"84-88","u":"portfolio","k":"檔案評量是有目的地長期蒐集學生的作品、紀錄和反思，像一本成長相簿，看見努力與進步。它的特色是學生參與選件、可分享成果、配合個別目標。但它的弱點正是信度和效度：評分主觀、每人內容不同，難以一致，需要清楚的規準和取樣才能補強。所以「兼具信效度」不是它的特色。","s":["題目問「不是」特色。","想想檔案評量的優點（參與、分享、個別化）與限制（信效度難建立）。","D 是它的限制而非特色，選 D。"],"w":{"A":"✗ 是特色：學生參與選擇作品與反思。","B":"✗ 是特色：檔案可以和家長、同學分享成就。","C":"✗ 是特色：能配合每個學生的個別目標。","D":"✓ 不是特色：檔案評量的信效度要靠規準和取樣努力建立，常是弱點。"},"m":"檔案評量看得見成長，但信效度是它的罩門。"},{"n":169,"q":"檔案評量、實作評量等另類評量(alternative assessment)目前頗受重視，試問下列何者不是另類評量興起的原因？","o":["認知心理學的興起","傳統評量呈現諸多缺失","標準化測驗窄化教學方向","可以提高評量的信度"],"a":"D","al":"D","c":"另類評量興起","e":"認知研究強調思考歷程，傳統測驗亦有窄化教學、忽略真實應用等限制，因此另類評量興起。信度則常是實作／檔案評量需要努力處理的問題，不能保證提高，故 D 不是主要興起理由。","p":"25-27、75、78、84","u":"alt","k":"另類評量指傳統紙筆測驗以外的方式，如實作、檔案評量。興起原因有三：認知心理學重視思考歷程與知識建構；傳統評量有缺失，偏重記憶；標準化測驗讓老師考什麼就教什麼，窄化教學。但另類評量評分較主觀，信度反而常是它需要克服的問題，不是興起理由。","s":["題目問「不是」興起原因。","列出興起原因：認知心理學、傳統評量缺失、窄化教學。","提高信度反而是另類評量的弱點，選 D。"],"w":{"A":"✗ 是原因：認知心理學重視學習歷程，推動另類評量。","B":"✗ 是原因：傳統評量偏重記憶、脫離真實情境。","C":"✗ 是原因：標準化測驗容易造成考試領導教學、窄化教學。","D":"✓ 不是原因：另類評量評分主觀，信度通常較低，是待克服的問題。"},"m":"另類評量贏在效度與歷程，輸在信度。"},{"n":170,"q":"下列何者不是有關「檔案評量」的主要理念？","o":["是實作評量的方式之ㄧ","強調找出學生的優點","以富創意的方式來呈現學習成長的歷程","容易配合全班教學目標實施評量。"],"a":"D","al":"D","c":"檔案評量理念","e":"檔案評量重個別成長、學生優勢與反思，需要持續選材及回饋，並不以「容易配合全班統一目標」為主要理念，故選 D。它可以是實作評量的一種形式，也可以有共同目標，但仍須保留個別化與多元證據。","p":"85-88","u":"portfolio","k":"檔案評量的主要理念是：它屬於實作評量的一種；強調找出學生的優點；用有創意、多元的方式呈現學習成長歷程；重視個別化與自我反思。因為每個學生的檔案內容不同，要花時間個別回饋，所以它並不「容易配合全班統一目標」，這反而是紙筆測驗的長處。","s":["題目問「不是」主要理念。","檔案評量重個別、重優點、重歷程。","D 強調全班一致、容易實施，與個別化理念相反，選 D。"],"w":{"A":"✗ 是理念：檔案評量是實作評量的一種形式。","B":"✗ 是理念：強調看見學生的優點與進步。","C":"✗ 是理念：用多元有創意的方式呈現成長歷程。","D":"✓ 不是理念：檔案評量重個別化，不以容易配合全班目標為主。"},"m":"檔案評量重個人成長，不是全班齊步走。"},{"n":171,"q":"檔案評量方式的內容及應用相當多元，其主要特徵為","o":["其主要目的為評比學生的學習表現","強調在實驗情境中進行","重視個別差異現象以調整評量過程與方式","著重時間點的取樣而非持續性的過程。"],"a":"C","al":"C","c":"個別化與持續性","e":"檔案評量會考慮學生差異，調整內容、資料型態與評量方式，因此 C 正確。它主要呈現努力、進步與成就，不只排名；不限定實驗情境；強調一段時間的累積，而非單一時間點取樣。","p":"86-88","u":"portfolio","k":"檔案評量會依學生的差異調整內容、資料型態和評量方式，重視個別差異；它在真實的學習情境中進行，而且是長時間持續蒐集，像拍成長縮時影片，而不是只拍一張照片。目的在呈現努力、進步與成就，不是為了排名比較。","s":["抓檔案評量的關鍵特徵：個別化、持續、真實情境。","逐項比對：A 偏評比，B 錯在實驗情境，D 錯在單一時間點。","C 符合，選 C。"],"w":{"A":"✗ 主要目的是呈現成長與進步，不是評比排名。","B":"✗ 檔案評量在真實學習情境中進行，不是實驗情境。","C":"✓ 重視個別差異，並據以調整評量內容與方式。","D":"✗ 剛好相反：它重視持續的過程，不是單一時間點取樣。"},"m":"檔案評量像縮時影片：個別化、持續拍。"},{"n":172,"q":"檔案評量的特質與輔導活動的學習歷程頗為吻合，值得多加使用。但下列哪一個做法較無法提高學生製作檔案的品質？","o":["提高家長參與意願，以及激勵學生製作檔案動機","教師先行擬定檔案目標與設計重點，再讓學生依序製作","定期檢核學生檔案資料的蒐集情形","定期與家長就檔案內容溝通學生學習情形，並研擬協助策略。"],"a":"B","al":"B","c":"學生參與檔案規劃","e":"檔案評量重視學生參與目標、選材與省思；由教師先全盤決定，再讓學生依序完成，較削弱主體性，所以 B 較不利。家長參與、定期檢核與溝通，都有助持續蒐集有意義的學習證據。","p":"86-88","u":"portfolio","k":"檔案評量很重視學生的主體性：學生參與訂目標、挑作品、寫反思，才會真正投入。若老師先把目標和重點全部定好，學生只是照順序完成，就變成交作業，品質和意義都會打折。家長參與、定期檢核、和家長溝通，則能讓檔案持續累積有意義的學習證據。","s":["題目問「較無法」提高品質的做法。","檔案評量核心：學生參與規劃與反思。","B 由教師全權決定，削弱學生參與，選 B。"],"w":{"A":"✗ 能提高品質：家長支持與學生動機有助持續製作。","B":"✓ 較無法提高：教師全盤決定、學生照做，失去檔案評量的學生主體性。","C":"✗ 能提高品質：定期檢核可及早發現缺漏並給回饋。","D":"✗ 能提高品質：與家長溝通可共同研擬協助策略。"},"m":"檔案要學生自己參與規劃，老師全包就變普通作業。"},{"n":173,"q":"實作評量(performance assessment)能測出認知領域的能力，其中「表現事實、概念、原則和通則，與其彼此間的關連性」是較屬於下列何者？","o":["敘述性知識(declarative knowledge)","程序性知識(procedural knowledge)","認知策略(cognitive strategies)","後設認知策略(metacognitivestrategies)"],"a":"A","al":"A","c":"敘述性知識","e":"事實、概念、原則、通則及其關係，主要是「知道是什麼」，屬敘述性／陳述性知識。程序性知識是「知道怎麼做」；認知策略是處理資訊與解題方法；後設認知策略則監控、調整自己的思考過程。","p":"64-67、75-76；知識分類補充","u":"bloom","k":"知識可以分幾類：敘述性知識（陳述性知識）是「知道是什麼」，像事實、概念、原則及彼此的關係，例如知道光合作用需要陽光。程序性知識是「知道怎麼做」，像會操作顯微鏡。認知策略是處理資訊、解決問題的方法。後設認知策略是「想自己的想法」，監控和調整自己的學習。","s":["關鍵字：「事實、概念、原則和通則與其關連」。","這些都是「知道是什麼」的內容。","對應敘述性知識，選 A。"],"w":{"A":"✓ 事實、概念、原則及其關係都是「知道是什麼」，屬敘述性知識。","B":"✗ 程序性知識是「知道怎麼做」，例如操作步驟。","C":"✗ 認知策略是處理資訊、解決問題的方法。","D":"✗ 後設認知策略是監控與調整自己的思考過程。"},"m":"知道是什麼叫敘述性，知道怎麼做叫程序性。"},{"n":174,"q":"針對實作評量，以下哪一陳述較正確？","o":["可節省人力、時間與金錢","測驗情境易控制","可同時評量認知與技能方面的目標","易受語文能力的干擾"],"a":"C","al":"C","c":"實作的多向度性","e":"操作、展演或作品能同時呈現知識理解與技能運用，故 C 正確。實作常耗時、需人力及較複雜評分；情境不一定容易控制；是否受語文干擾則取決於任務設計，不能當作共同主要特徵。","p":"75-84","u":"performance","k":"實作評量是讓學生實際動手做、表演或完成作品，教師依規準評分。例如讓學生做實驗，可以同時看到他懂不懂原理（認知）和會不會操作（技能）。它的缺點是耗時、費人力、評分複雜，情境也不容易標準化控制。它常被用來減少紙筆測驗受語文能力干擾的問題。","s":["回想實作評量的優缺點。","優點：能同時評認知與技能、較真實；缺點：費時費力、情境難控制。","C 是優點且敘述正確，選 C。"],"w":{"A":"✗ 剛好相反：實作評量耗費人力、時間與金錢。","B":"✗ 實作情境較複雜，不易控制與標準化。","C":"✓ 實際操作能同時呈現知識理解和技能表現。","D":"✗ 實作評量通常能減少語文干擾，易受語文干擾是紙筆測驗的問題。"},"m":"實作評量一次看懂不懂和會不會，但很花時間。"},{"n":175,"q":"李老師想要教導特教學校學生打電話的技巧，他要求學生打一通電話給老師，並從中評定學生的表現。李老師用的是下列哪 一種評量方法？","o":["檔案評量","動態評量","功能性評量","真實評量"],"a":"D","al":"D","c":"真實生活任務","e":"直接讓學生打一通電話，觀察能否在實際任務運用所學，最符合真實評量。題幹未呈現前測—介入—後測，所以不是動態；也未蒐集長期作品。功能性評量可關注生活技能需求，但本題最直接線索是實際打電話的表現。","p":"77、87、99","u":"alt","k":"真實評量是讓學生在接近真實生活的情境中完成任務，看他能不能把所學用出來。例如學打電話，就真的打一通電話，不是寫考卷選答案。動態評量要有「前測—教學介入—後測」；檔案評量要長期蒐集作品；功能性評量雖也關心生活技能，但本題最直接的線索是「真的去做那件生活任務」。","s":["關鍵字：「要求學生打一通電話」——真實生活任務。","在真實情境中評定表現，對應真實評量。","沒有介入歷程、沒有長期蒐集，選 D。"],"w":{"A":"✗ 檔案評量要長期蒐集作品與反思，題幹只有一次任務。","B":"✗ 動態評量要有前測、介入、後測，題幹沒有教學介入。","C":"✗ 功能性評量多用來分析行為功能或生活需求，本題重點是實際任務表現。","D":"✓ 讓學生真的打電話並評定表現，是真實評量。"},"m":"真的打電話來評打電話，就是真實評量。"},{"n":176,"q":"下列有關動態評量(dynamic evaluation)的敘述，何者正確？","o":["重視學生的學習結果","各次評量都是彼此獨立的","強調問題解決的過程","能做為學生編班的依據"],"a":"C","al":"C","c":"動態評量的過程","e":"動態評量透過提示、互動與教學，觀察學生如何解決問題及產生改變，因此 C 正確。它不只重最後結果，也不把各次評量視為完全獨立；單純編班不是此題最能代表動態評量的核心功能。","p":"87、100-101","u":"alt","k":"動態評量是「邊教邊評」：先測，再給提示、示範等協助，再測，看學生在幫助下能進步多少，以及他是怎麼解題的。它的理論根據是維高斯基的近側發展區，也就是學生自己做不到、但有人幫一把就做得到的範圍。所以它重視解題歷程與學習潛能，各次評量彼此相連，不是只看結果。","s":["回想動態評量：前測—介入—後測，重歷程與潛能。","A 重結果、B 各次獨立，都與動態評量相反。","C 強調問題解決歷程，選 C。"],"w":{"A":"✗ 動態評量重視學習歷程與潛能，不只重結果。","B":"✗ 各次評量是連續、相關的，前測結果決定介入方式。","C":"✓ 動態評量強調觀察學生解決問題的過程。","D":"✗ 編班安置偏向安置性評量的功能，不是動態評量的核心。"},"m":"動態評量：測、教、再測，看歷程和潛能。"},{"n":177,"q":"以動態評量來評量學生的能力，請問以下敘述何者正確？","o":["必須採用標準化的提示","強調學習結果的評量","屬於效標參照評量","能將測驗的結果和教學緊密結合。"],"a":"D","al":"D","c":"評量與教學結合","e":"動態評量透過提示、示範等介入，檢查學生如何學會，故 D 正確。提示可以標準化，也可以依個別需求調整，A 的「必須」過強；它重歷程與潛能，不只結果；也不能直接把它等同效標參照分類。","p":"87、100-101","u":"alt","k":"動態評量的最大特色是把評量和教學綁在一起：評量中就給提示、示範，看學生怎麼學會，再據此調整教學。提示可以是標準化的分層提示，也可以依個別需要臨場調整，所以「必須」標準化太絕對。它重視歷程與潛能，而且不能直接歸為效標參照評量。","s":["關鍵字：動態評量的核心＝評量與教學結合。","檢查絕對字：A 的「必須」過強。","D 直接描述核心特色，選 D。"],"w":{"A":"✗ 「必須」太絕對：提示可以標準化，也可以依個別需求調整。","B":"✗ 動態評量重歷程與潛能，不是只看結果。","C":"✗ 動態評量重點在介入與改變，不能直接等同效標參照分類。","D":"✓ 評量中給予介入，結果直接回饋教學，兩者緊密結合。"},"m":"動態評量把教學放進評量裡。"},{"n":178,"q":"陳老師開設「科學閱讀」的選修課程，該課程的學期成績評量包括閱讀反思(占 30%)、小組辯論(占 30%)、專題報告與發表(占 40%)。陳老師的評量方式較屬於下列何者？","o":["動態評量","實作評量","適性評量","診斷性評量"],"a":"B","al":"B","c":"實作評量的形式","e":"閱讀反思是建構反應，小組辯論是口語表現，專題報告與發表是作品和展演，均屬實作評量。配分多元不等於適性；題幹未呈現動態介入或針對困難原因作診斷，故 B 最合適。","p":"75-82","u":"performance","k":"實作評量是讓學生用寫、說、做、展演等方式表現所學，而不是只選答案。閱讀反思是學生自己寫出來的建構反應，小組辯論是口語表現，專題報告與發表是作品和展演，全部都是實作。至於「配分多元」不等於適性評量，題幹也沒有前測—介入—後測或找困難原因的過程。","s":["拆解三項評量：反思（寫）、辯論（說）、專題發表（做與展演）。","三者都是學生實際表現，屬實作評量。","沒有介入、沒有依能力調題、沒有診斷困難，選 B。"],"w":{"A":"✗ 動態評量要有教學介入與再評量，題幹沒有。","B":"✓ 反思、辯論、專題報告與發表都是實作表現。","C":"✗ 適性評量是依作答調整題目難度，配分多元不等於適性。","D":"✗ 診斷性評量要找學習困難原因，題幹是學期成績評定。"},"m":"寫、說、做、演出來給你看，都是實作評量。"},{"n":179,"q":"為瞭解學生的學習成效，素養導向的評量設計應與核心素養、學習重點及學習目標具有對應性。此項做法較強調評量的何種概念？","o":["重測信度","外在效度","內容效度","內部一致性信度"],"a":"C","al":"C","c":"素養與目標對應","e":"評量設計與核心素養、學習重點、目標相互對應，重點是測驗内容是否涵蓋應評量的學習，也就是內容效度。重測和內部一致性是信度；外在效度多指研究結果能否推論至其他情境。","p":"38、68","u":"validity","k":"內容效度是題目有沒有代表該評量的內容與目標。素養導向評量要和核心素養、學習重點、學習目標對應，就像考試範圍要對準課本與教學目標，這正是內容效度。重測信度和內部一致性信度談的是分數穩不穩定；外在效度多用在研究，指結果能否推論到其他情境。","s":["關鍵字：評量設計與核心素養、學習重點、學習目標「對應」。","對應教學內容與目標＝內容效度。","A、D 是信度，B 是研究推論，選 C。"],"w":{"A":"✗ 重測信度看同一測驗隔一段時間分數是否穩定，與對應目標無關。","B":"✗ 外在效度指研究結果能否推論到其他情境，不是評量設計的對應。","C":"✓ 評量與素養、學習重點、目標對應，就是內容效度。","D":"✗ 內部一致性信度看題目之間是否測同一特質，屬信度。"},"m":"評量對準素養與目標，就是內容效度。"},{"n":180,"q":"進行信度估計時，增加量表/測驗的題目數，通常可以提升此量表/測驗的信度。有關此一做法可以提高信度的原因，下列敘述何者較不適切？","o":["增加的題目與原試題具有同質性","題目數多，可增加答對的題數使分數較高","題目數多，可提升測驗範圍內容的涵蓋度","題目數多，分數較不易受猜題等機遇因素所影響"],"a":"B","al":"B","c":"增加題數的作用","e":"增加同質且品質良好的題目，可擴大取樣、減少猜測等偶然因素的相對影響；「答對題數變多、總分變高」卻不是信度提高的原因，所以 B 不適切。信度談的是測量一致性，不是分數高低。","p":"56、58-59","u":"reliability","k":"信度是測量的一致性，也就是誤差小不小，不是分數高不高。增加同質、品質好的題目能提高信度，原因是：題目和原題量同一能力；內容取樣更廣、更有代表性；猜題等偶然因素被平均掉，影響變小。就像量身高量十次取平均，比量一次可靠，但身高不會因此變高。","s":["題目問「較不適切」的理由。","信度關心一致性與誤差，和分數高低無關。","B 以「分數變高」當理由，選 B。"],"w":{"A":"✗ 適切：新增題目同質，才能提高一致性。","B":"✓ 不適切：信度看一致性，答對題數多、分數高和信度無關。","C":"✗ 適切：題數多，內容取樣更有代表性。","D":"✗ 適切：題數多，猜題等機遇因素相對影響變小。"},"m":"信度看穩不穩，不看分數高不高。"},{"n":181,"q":"白雲國中小在自治市長選舉前，先讓學生認識選舉權的來源、什麼是選舉權，再讓學生從領票、圈票、投票及開票的歷程，模擬自治市長選舉的流程。此過程涉及知識向度的哪些類型？","o":["事實性知識、概念性知識、程序性知識","事實性知識、概念性知識、後設認知知識","事實性知識、程序性知識、後設認知知識","概念性知識、程序性知識、後設認知知識"],"a":"A","al":"A","c":"知識向度","e":"認識選舉權的來源涉及事實知識，理解選舉權概念涉及概念知識，實際經歷領票到開票的順序涉及程序知識，因此選 A。題幹未強調學生監控自己的認知策略或反思學習，故不以後設認知知識為主。","p":"64-67","u":"bloom","k":"修訂版 Bloom 分類把知識分四種：事實性知識是基本的名詞與細節（如選舉權從哪裡來）；概念性知識是概念、分類與原理（如什麼是選舉權）；程序性知識是做事的步驟與方法（如領票、圈票、投票、開票的流程）；後設認知知識是對自己認知的覺察與調整。題幹分別對應前三種。","s":["拆題幹：選舉權的來源→事實性知識。","什麼是選舉權→概念性知識；模擬投票流程→程序性知識。","題幹沒有學生反思自己的學習，排除後設認知，選 A。"],"w":{"A":"✓ 來源是事實、什麼是選舉權是概念、投開票流程是程序。","B":"✗ 題幹沒有學生監控或反思自己的認知，不含後設認知知識。","C":"✗ 漏了概念性知識，又多了題幹沒有的後設認知。","D":"✗ 漏了事實性知識，又多了後設認知知識。"},"m":"是什麼→事實與概念，怎麼做→程序，想自己的想→後設。"},{"n":182,"q":"此表為選擇題高、低分組作答人數的資料，下列敘述何者正確？組別選項A B* C D 未作答高分組 5 6 4 3 0低分組 5 5 4 5 1*為正確答案","o":["難度= .29、鑑別度= .03","難度= .33、鑑別度= .08","此題之鑑別度低，無法有效區分高低能力的學生","選項 A 與選項 B 的回答人數相近，顯示答案應有爭議"],"a":"C","al":"C","c":"組數不等的 P 與 D","e":"高分組總數為 18，低分組含未作答共 20；PH＝6／18≈.333，PL＝5／20＝.25。兩組平均 P≈.292，D≈.083，故 A、B 各有一個數值錯，C 的低鑑別度判斷正確。兩選項人數接近不能直接證明答案有爭議。","p":"71-74","x":"若用全體答對率，P＝11／38≈.289，仍約 .29；低分組的未作答也須算在分母。","u":"item","k":"難度 P 是答對比例；鑑別度 D＝高分組答對率 PH－低分組答對率 PL。算比例時，分母要用該組的總人數，包含未作答的人。這題高分組 5＋6＋4＋3＋0＝18 人，低分組 5＋5＋4＋5＋1＝20 人。D 只有約 .08，屬於很低的鑑別度（一般 .40 以上才算很好），分不太出高低能力。若改用全體答對率算 P，11／38≈.29，結果相同。","s":["算組人數：高分組 5＋6＋4＋3＋0＝18；低分組 5＋5＋4＋5＋1＝20（未作答也要算）。","PH＝6÷18≈.333；PL＝5÷20＝.250。","P＝(.333＋.250)÷2≈.29（全體 11÷38≈.289 也約 .29）。","D＝.333－.250≈.08。","對照選項：A 的 D 錯（.03），B 的 P 錯（.33），C 的低鑑別判斷正確，選 C。"],"w":{"A":"✗ 難度 .29 對，但鑑別度應約 .08，不是 .03。","B":"✗ 鑑別度 .08 對，但難度應約 .29；.33 只是高分組的答對率。","C":"✓ D≈.08 很低，表示這題無法有效區分高低能力學生。","D":"✗ 選項人數接近不能證明答案有爭議，要看誘答選項的高低分組分布。"},"m":"分母含未作答；D 只有 .08，題目分不出高下。"},{"n":183,"q":"下列何者最符合標準參照評量的意涵？","o":["馬拉松比賽得冠軍","通過機車駕照考試","通過研究所入學考試","通過縣市的教師甄試"],"a":"B","al":"B","c":"達標與競爭錄取","e":"機車駕照考試按固定要求判定是否通過，屬標準參照。馬拉松冠軍、研究所入學及教師甄試在本題的競爭錄取脈絡中，重相互比較與名額限制。不要只看到「通過」兩字就選，應看通過依據。","p":"12-14、30","u":"reference","k":"標準參照評量是拿學生的表現和一個固定標準比，達到就通過，和別人考多少無關，像駕照考試，大家都達標就大家都過。常模參照評量是和別人比，看你排第幾，像比賽或有名額的考試。判斷時不要只看「通過」兩個字，要看通過的依據是固定標準還是名次與名額。","s":["看每個情境的通過依據：固定標準，還是和他人比較？","駕照考試達到固定標準就通過，不限名額。","冠軍、入學、甄試都看名次與名額，選 B。"],"w":{"A":"✗ 得冠軍是和其他選手比名次，屬常模參照。","B":"✓ 駕照考試依固定標準判定通過與否，是標準參照。","C":"✗ 研究所入學有名額，按排名錄取，偏常模參照。","D":"✗ 教師甄試錄取有限，依相對排序，偏常模參照。"},"m":"跟標準比是標準參照，跟別人比是常模參照。"},{"n":184,"q":"教師可以用哪些方式來進行形成性評量？甲、隨堂小考  乙、作業   丙、課堂問答 丁、期末考","o":["甲乙丙","甲乙丁","甲丙丁","乙丙丁"],"a":"A","al":"A","c":"形成性評量方式","e":"隨堂小考、作業與課堂問答都可蒐集當下學習證據、據以調整教學，故甲乙丙較合題意。期末考通常主要統整學期成績，因此本題排除丁。實際上形成性與否取決於結果用途，不單由工具或時間名稱決定。","p":"29","u":"purpose","k":"形成性評量是在教學過程中進行，目的是了解學生學得如何，好即時調整教學，像廚師邊煮邊試味道。隨堂小考、作業、課堂問答都能隨時拿到學習證據。期末考在學期結束評定成果，是總結性評量，像客人吃完給評分。嚴格說，形成性與否要看結果用途，不只看工具名稱。","s":["回想形成性評量：教學中、為了調整教學。","逐項判斷：小考、作業、問答都在教學過程中。","期末考是總結性，排除丁，選甲乙丙 A。"],"w":{"A":"✓ 隨堂小考、作業、課堂問答都能在教學中回饋與調整。","B":"✗ 含期末考，期末考主要是總結性評量。","C":"✗ 漏了作業，又含期末考。","D":"✗ 漏了隨堂小考，又含期末考。"},"m":"邊煮邊試是形成性，吃完評分是總結性。"},{"n":185,"q":"為瞭解學生的學習成效，素養導向的評量設計應與核心素養、學習重點及學習目標具有對應性。就評量的概念而言，此項做法較強調評量的何種概念？","o":["重測信度","外在效度","內容效度","內部一致性信度"],"a":"C","al":"C","c":"素養與目標對應","e":"評量設計與核心素養、學習重點、目標相互對應，重點是測驗内容是否涵蓋應評量的學習，也就是內容效度。重測和內部一致性是信度；外在效度多指研究結果能否推論至其他情境。","p":"38、68","u":"validity","k":"評量的內容效度是指題目能否代表要評量的學習內容與目標。素養導向評量強調和核心素養、學習重點、學習目標相對應，等於確認「考的就是要學的」，所以是在強調內容效度。信度（重測、內部一致性）談的是分數穩定；外在效度則是研究上能否推論到別的情境。","s":["關鍵字：評量和素養、學習重點、目標「具有對應性」。","內容與目標的對應就是內容效度。","排除信度與研究用語，選 C。"],"w":{"A":"✗ 重測信度是同一份測驗兩次施測的穩定性，屬信度。","B":"✗ 外在效度是研究結果的可推論性，不是評量內容對應。","C":"✓ 評量與素養、學習重點、目標對應，即內容效度。","D":"✗ 內部一致性信度看題目間的同質性，屬信度。"},"m":"考的就是要學的，叫內容效度。"},{"n":186,"q":"郭老師在進行鄉野踏查單元時，請學生帶著平板，透過拍照、訪談來記錄該研究區域；之後以小組為單位，製作該區域的導覽影片；爾後，每組將上述資料彙整為一個檔案，上傳至雲端；最後，郭老師再依據評分規準對檔案進行評量。郭老師的評量方式最符合下列何種取向？","o":["評量即學習(assessment as learning)","學習中的評量(assessment in learning)","對學習的評量(assessment of learning)","為了學習的評量(assessment for learning)"],"a":"C","al":"C","c":"對學習的評量","e":"情境最後由教師依規準評定已完成的檔案，主要判斷學習成果，最接近 assessment of learning。若以證據回饋並調整教學是 for learning；若由學生自我監控與反思則是 as learning。使用檔案或數位工具本身不決定取向。","p":"29、85-88；補充 S5","u":"purpose","k":"評量有三種取向：對學習的評量（assessment of learning）是學習結束後評定成果，偏總結；為了學習的評量（for learning）是用評量證據回饋、調整教學，偏形成；評量即學習（as learning）是學生自我監控、自我評量與反思。這題最後由老師依規準評分已完成的檔案，重點在判定成果，所以是對學習的評量。用檔案或平板，本身不決定取向。","s":["找題幹最後一步：教師依規準對完成的檔案評分。","評定已完成的學習成果＝對學習的評量。","沒有提到回饋調整或學生自評，選 C。"],"w":{"A":"✗ 評量即學習要由學生自我監控與反思，題幹是教師評分。","B":"✗ 學習中的評量不是常見三分法的標準用語，題幹也無過程中回饋。","C":"✓ 教師依規準評定已完成作品，屬對學習的評量。","D":"✗ 為了學習的評量要用結果回饋並調整教學，題幹沒有。"},"m":"of 評成果、for 調教學、as 學生自省。"},{"n":187,"q":"在進行實驗時，某位學生使用了一把已經「零點偏移」的電子天平來多次測量同一個砝碼的質量，結果每一次的測量值都比實際質量多出相同的數值。請問，這種誤差最主要屬於哪一種類型？","o":["樣本誤差(Sampling Error)","隨機誤差(Random Error)","系統誤差(SystematicError)","操作性誤差(Operational Error)"],"a":"C","al":"C","c":"固定零點偏移","e":"同一砝碼每次都被多報相同數值，是固定、同方向的系統誤差。反覆測量可能十分一致，卻仍不準確。抽樣誤差來自樣本與母群體差異；隨機誤差不具固定規律；本題未描述偶發操作失誤。","p":"46-47","u":"reliability","k":"測量誤差分兩種。系統誤差是每次都朝同一方向、偏同樣多，像一台永遠多 2 公斤的體重計，量很多次都一致，但都不準，它影響的是效度（準確）。隨機誤差是忽大忽小、沒有規律，影響的是信度（穩定）。抽樣誤差則是樣本和母群體的差異。天平零點偏移、每次多出相同數值，正是系統誤差。","s":["關鍵字：「零點偏移」「每一次都多出相同的數值」。","固定方向、固定大小的誤差＝系統誤差。","選 C。"],"w":{"A":"✗ 樣本誤差是樣本和母群體的差異，本題只測同一個砝碼。","B":"✗ 隨機誤差忽大忽小、沒有規律，本題每次偏差相同。","C":"✓ 每次固定多出相同數值，是系統誤差。","D":"✗ 題幹沒有描述偶發的操作失誤，問題出在儀器本身。"},"m":"每次偏一樣多是系統誤差，忽大忽小是隨機誤差。"},{"n":188,"q":"某學者指出，A 測驗具備「建構效度」 。關於A 測驗的設計，下列哪一項敘述最能反映建構效度的特徵？","o":["測驗題目文字簡明、語意清楚且結構嚴謹","測驗題目全都根據課程大綱及雙向細目表編寫","測驗表面看來與欲測量的特質有關，容易被受試者接受","測驗內容依據相關理論架構設計，能有效測量所欲評估的心理特質"],"a":"D","al":"D","c":"理論架構與構念","e":"依相關理論架構設計，並能反映欲評估的心理特質，最直接是建構效度。A 偏題目文字品質；B 偏內容效度；C 偏表面效度。建構效度還須相應證據支持，不能僅宣稱依據理論就視為已充分證明。","p":"37-38、59","u":"validity","k":"建構效度是測驗能否量到理論上的抽象心理特質。做法是先根據理論定義特質，再依架構設計題目，最後用因素分析、與相關變項的關聯等證據來檢驗。要和其他概念分清楚：依雙向細目表編題是內容效度；看起來像在量某特質、讓人容易接受是表面效度；文字清楚只是命題品質。","s":["關鍵字：建構效度＝理論架構＋心理特質。","逐項對應：A 命題品質、B 內容效度、C 表面效度。","D 依理論設計並測量心理特質，選 D。"],"w":{"A":"✗ 文字簡明清楚是命題技巧與題目品質，不是效度類型。","B":"✗ 依課程大綱和雙向細目表編題，是內容效度。","C":"✗ 表面看來相關、容易被接受，是表面效度。","D":"✓ 依理論架構設計並測量心理特質，正是建構效度（仍需證據支持）。"},"m":"理論撐腰量特質是建構，看起來像是表面效度。"},{"n":189,"q":"為瞭解學生的學習成效，素養導向的評量設計應與核心素養、學習重點及學習目標具有對應性。此項做法較強調評量的何種概念？","o":["重測信度","外在效度","內容效度","內部一致性信度"],"a":"C","al":"C","c":"素養與目標對應","e":"評量設計與核心素養、學習重點、目標相互對應，重點是測驗内容是否涵蓋應評量的學習，也就是內容效度。重測和內部一致性是信度；外在效度多指研究結果能否推論至其他情境。","p":"38、68","u":"validity","k":"內容效度關心「題目有沒有對準該評的學習內容與目標」。這題的情境是素養導向評量要和核心素養、學習重點、學習目標相互對應，就像射箭要對準靶心，所以是在強調內容效度。這題和前面幾題同型，記住：重測、內部一致性是信度，外在效度是研究推論的概念。","s":["關鍵字：「對應性」——評量和目標對得上。","對應內容與目標＝內容效度。","選 C。"],"w":{"A":"✗ 重測信度屬信度，看分數跨時間是否穩定。","B":"✗ 外在效度是研究結果能否推廣，不是評量和目標的對應。","C":"✓ 評量對應素養、學習重點與目標，是內容效度。","D":"✗ 內部一致性信度屬信度，看題目之間的一致。"},"m":"對準學習目標射箭，就是內容效度。"},{"n":190,"q":"張老師編製了兩份內容相似的英文測驗，分別讓學生作答，並比較兩次測驗分數的相關性。請問這是哪一種信度評估方式？","o":["折半信度","再測信度","複本信度","評分者信度"],"a":"C","al":"C","c":"複本信度","e":"兩份內容等同／相近的題本，比較其分數相關，屬複本信度。重測用同一題本跨時間；折半把同一題本拆半；評分者信度比較評分者。實際上「相似」還須檢查內容、難度及測量特質是否足夠等值。","p":"48-55","u":"reliability","k":"信度有幾種估計方法。複本信度是編兩份內容、難度相當的題本（像 A 卷、B 卷），讓同一群人都寫，再求兩份分數的相關。重測信度是同一份測驗隔一段時間再考一次；折半信度是把同一份測驗拆成兩半求相關；評分者信度是比較不同評分者打的分數。要注意「相似」的兩份題本還必須夠等值，才能算真正的複本。","s":["關鍵字：「兩份內容相似的測驗」「比較兩次分數的相關」。","兩份等值題本求相關＝複本信度。","選 C。"],"w":{"A":"✗ 折半信度是把同一份測驗拆成兩半，不是兩份題本。","B":"✗ 再測信度用同一份測驗前後施測兩次。","C":"✓ 兩份內容相當的題本求分數相關，是複本信度。","D":"✗ 評分者信度比較不同評分者的評分一致性。"},"m":"A 卷 B 卷是複本，同卷考兩次是重測，一卷切兩半是折半。"},{"n":191,"q":"某國中打算評估學生的英語能力，以決定是否要在暑假開設額外的英語加強班。目前有兩種方式可以選擇：方式一是使用一套由教育部門統一編製、有著嚴格施測與評分標準的英語能力測驗；方式二是由該國中的英語教師自行設計一份英語考卷，在各自的班上施測，評分方式也由各教師自行決定。請問，上述哪種方式屬於標準化測驗？","o":["方式一","方式二","兩種方式都是","兩種方式都不是"],"a":"A","al":"A","c":"標準化程序","e":"方式一有統一編製及嚴格施測、評分標準，符合標準化測驗；方式二由各教師自訂題目與施評方式，屬非標準化自編測驗。判斷重點在程序規範的一致性，不是只看施測人數或主辦單位名稱。","p":"9-11","u":"standard","k":"標準化測驗是由專家編製，題目、施測程序、計分方式、分數解釋都有統一規定，通常還有常模，讓不同地方、不同老師施測結果都能比較。就像全國統一的體適能檢測。教師自編測驗由老師自己出題、自己決定施測和評分方式，彈性大但缺乏統一程序。判斷關鍵是程序是否一致，不是施測人數多少。","s":["找判斷依據：題目、施測、評分是否有統一規範。","方式一統一編製、嚴格施測與評分標準；方式二各師自訂。","只有方式一是標準化測驗，選 A。"],"w":{"A":"✓ 統一編製、嚴格施測與評分標準，符合標準化測驗。","B":"✗ 各教師自行出題與評分，屬教師自編測驗。","C":"✗ 方式二缺乏統一程序，不是標準化測驗。","D":"✗ 方式一具備標準化程序，所以不是兩者都不是。"},"m":"題目、施測、計分、解釋都統一，才叫標準化。"},{"n":192,"q":"有關檔案評估(portfolio assessment)的敘述，下列何者正確？","o":["較適用於發展正常的幼兒","屬於形成性評估，而非總結性評估","常用於比較個別幼兒與其他幼兒的表現","可評估個別幼兒的認知、技能發展與學習風格"],"a":"D","al":"D","c":"檔案評量的範圍","e":"長期蒐集作品、觀察及反思，可了解幼兒認知、技能與學習特徵，因此 D 正確。檔案可用於不同發展需求的幼兒，也可有形成性或總結性用途；重個人進步與目標，不以人際比較為主要特徵。","p":"85-88","u":"portfolio","k":"檔案評量是長期蒐集幼兒的作品、觀察紀錄與反思，能全面看見個別幼兒的認知、技能發展與學習風格。它適用於各種發展狀況的幼兒，包括特殊需求幼兒；可以用於形成性，也可以用於總結性；重點是看個人自己的成長，而不是和別的幼兒比較。","s":["回想檔案評量：長期、多元、重個人成長。","檢查絕對或錯誤字：A「較適用正常」、B「而非總結」、C「比較他人」。","D 符合檔案評量的範圍，選 D。"],"w":{"A":"✗ 檔案評量也適用於有特殊需求的幼兒，不限發展正常。","B":"✗ 檔案評量可兼具形成性與總結性用途。","C":"✗ 它重視個人進步，不以和他人比較為主。","D":"✓ 多元長期資料可評估幼兒的認知、技能與學習風格。"},"m":"檔案評量看自己和過去比，不跟別人比。"},{"n":193,"q":"李老師設計了一份包含20題的數學測驗，並將同一份測驗在相隔兩週後，對同一班級的學生重複施測。李老師將兩次測驗的總分進行皮爾森積差相關分析，得到相關係數為0.85。根據上述情境，下列哪一項最正確地描述這份數學測驗信度的計算方式？","o":["這是利用內部一致性信度的計算方法","這是利用評分者間一致性信度的計算方法","這是利用重測信度的計算方法","這是利用折半信度的計算方法"],"a":"C","al":"C","c":"重測信度計算","e":"同一班、同一份 20 題測驗，隔兩週再施測，求兩次總分的相關 .85，即重測信度。不是把題目相互比較的內部一致性，也不是比較不同評分者或兩半測驗。解釋 .85 時仍須留意練習與記憶效應。","p":"48-49、55","u":"reliability","k":"重測信度是用同一份測驗，對同一群人隔一段時間施測兩次，再求兩次分數的相關，看分數穩不穩定，像同一台體重計隔兩週再量。相關 .85 表示穩定度不錯，但要留意練習與記憶效應，間隔太短可能高估。內部一致性、折半信度都只考一次，評分者信度是比評分者。","s":["關鍵字：同一份測驗、同一班、隔兩週、兩次總分求相關。","同測驗跨時間求相關＝重測信度。","選 C。"],"w":{"A":"✗ 內部一致性信度只施測一次，看題目之間的一致性。","B":"✗ 評分者間信度比較不同評分者的評分，題幹沒有多位評分者。","C":"✓ 同一測驗隔兩週重測，兩次分數相關 .85，是重測信度。","D":"✗ 折半信度是一次施測後把測驗拆成兩半求相關。"},"m":"同卷隔一段時間再考，算相關就是重測信度。"},{"n":194,"q":"王老師為了更準確地評估學生的英文閱讀能力，設計了一份20題的英文閱讀測驗。後來，王老師考慮是否要把題目數量增加到40題，希望以此提升測驗的信度。在討論這個決定時，幾位老師提出了不同的理由，說明為什麼增加題目數量通常會讓信度提高。請問，下列哪一項對於「增加題目數可以提升信度」的理由較不適切？","o":["新增的題目和原來的題目測量的是相同的英文閱讀能力","題目數量增加，可以讓學生答對的題目變多，總分較高","題目數量增加，可以讓測驗涵蓋更多不同的閱讀內容","題目數量增加，使總分較不容易受到猜題等偶然因素的影響"],"a":"B","al":"B","c":"分數提高不是信度提高","e":"增加題數能提高信度的理由，是適當增加同質內容取樣、減少偶然因素的影響，不是讓總分變高，所以 B 不適切。若只把所有人成績加 20 分，平均提高但一致性不會因此自動改善，可用此例分辨兩者。","p":"56、58-59","u":"reliability","k":"增加題數能提高信度，前提是新題和原題測同一能力（同質）。理由有兩個：內容取樣變多、更有代表性；猜題、恍神等偶然因素被平均掉，影響變小。但信度講的是測量一致性，和分數高低無關。如果把全班每人都加 20 分，平均變高，但分數的一致性一點也沒變，可用這個例子分辨。","s":["題目問「較不適切」的理由。","信度＝一致性、誤差小，與總分高低無關。","B 用「總分較高」解釋信度，選 B。"],"w":{"A":"✗ 適切：新增題目測相同能力，是提高信度的前提。","B":"✓ 不適切：總分變高不代表一致性提高，信度與分數高低無關。","C":"✗ 適切：涵蓋更多閱讀內容，取樣更有代表性。","D":"✗ 適切：題數多，猜題等偶然因素影響變小。"},"m":"每人加 20 分平均變高，信度不變。"},{"n":195,"q":"方老師規劃以實作成果來評定學生整學期的學習成效，並以公告的表現水準(1 到 6 級) 確認其成就等級。此規劃屬於何種性質的評量？","o":["形成性評量","診斷性評量","常模參照評量","效標參照評量"],"a":"D","al":"D","c":"效標參照","e":"依公告的 1～6 級表現水準確認成就等級，是與固定標準比較，故選 D。整學期結束評定也有總結性用途，但選項未列；它不是為過程即時回饋或找困難原因，也沒有按同儕名次決定級別。","p":"12-14、29-30","u":"reference","k":"效標參照評量（標準參照）是拿學生表現和事先訂好的標準比，像公告的 1～6 級表現水準，達到哪個描述就給哪一級，不看別人考得如何。常模參照才是看你在團體中的名次。這題在學期末評定成效，也帶有總結性用途，但選項沒有總結性，所以抓「公告的表現水準」選效標參照。","s":["關鍵字：「公告的表現水準（1 到 6 級）」確認成就等級。","和固定標準比，屬效標（標準）參照。","總結性未列；不是過程回饋、不是找困難、不是排名，選 D。"],"w":{"A":"✗ 形成性評量在教學過程中回饋調整，題幹是整學期成果評定。","B":"✗ 診斷性評量在找學習困難的原因，題幹沒有。","C":"✗ 常模參照依同儕名次決定，題幹是依固定等級標準。","D":"✓ 依公告的表現水準判定等級，是效標參照評量。"},"m":"對照公告等級描述，就是效標參照。"},{"n":196,"q":"呂老師依據雙向細目表進行段考命題，再請該領域科目的教師進行審題。從這兩項 作為，呂老師所關心的測驗概念為下列何者？","o":["內容效度、預測效度","內容效度、內容效度","內容效度、內部一致性信度","效標關聯效度、評分者信度"],"a":"B","al":"B","c":"兩種內容效度證據","e":"雙向細目表確保內容與目標的代表性；請同領域教師審題，以專業判斷檢查題目適切性，兩者都支持內容效度，選 B。審题不是請多人實際評分，所以不能直接當成評分者信度。","p":"38、68","u":"validity","k":"內容效度可以從兩個方向建立：命題前用雙向細目表，把教材內容和教學目標排好配比，確保題目有代表性；命題後請同領域老師審題，用專業判斷檢查題目是否合適、是否涵蓋。兩個動作都在保證「考的是該考的」，所以都是內容效度。審題不是請多人評分，不能當成評分者信度。","s":["拆兩個動作：依雙向細目表命題、請同領域教師審題。","雙向細目表→內容效度；專家審題→內容效度。","兩個都是內容效度，選 B。"],"w":{"A":"✗ 審題不是拿測驗去預測未來表現，不是預測效度。","B":"✓ 雙向細目表與專家審題都在確保內容代表性，都是內容效度。","C":"✗ 審題不是在算題目間的一致性，不是內部一致性信度。","D":"✗ 雙向細目表不是和外部效標比較；審題也不是多人實際評分。"},"m":"命題前細目表、命題後審題，兩招都是內容效度。"},{"n":197,"q":"阿德的國語文成績很好，教師批閱他的作文時總是傾向給較高的分數。這是屬於下列何種現象？","o":["月暈效應(halo effect)","蝴蝶效應(butterfly effect)","回沖效應(washback effect)","比馬龍效應(Pygmalion effect )"],"a":"A","al":"A","c":"月暈效應","e":"教師原先認為阿德國文好，這個整體印象使他在批閱此次作文時給較高分，是月暈效應。比馬龍是期待影響學生後續表現；回沖效應是考試影響教學與學習；蝴蝶效應不是本題的評分偏誤。","p":"54、57","u":"observe","k":"月暈效應（光環效應）是評分者對某人的整體印象或其他方面的表現，影響了對另一件事的評分。就像覺得某人長得帥，就覺得他什麼都好。阿德國文成績好，老師改作文就傾向給高分，正是月暈效應。比馬龍效應是老師的期待讓學生後來真的表現更好；回沖效應是考試反過來影響教學與學習。","s":["關鍵字：因為「成績很好」的印象，批閱作文「傾向給高分」。","整體印象影響評分＝月暈效應。","選 A。"],"w":{"A":"✓ 對學生的好印象影響作文評分，是月暈效應。","B":"✗ 蝴蝶效應指微小變化引起巨大後果，不是評分偏誤。","C":"✗ 回沖效應是考試影響教學與學習方式。","D":"✗ 比馬龍效應是教師期待影響學生日後的實際表現，不是評分偏高。"},"m":"印象好就分數高是月暈；期待讓人變好是比馬龍。"},{"n":198,"q":"小英為幼幼班新生，每日早上家長離開幼兒園後，都會獨自哭泣一段時間才停止，之後直到放學都沒有哭。老師想了解小英的分離焦慮情形，以找出適當的輔導方式。下列哪些蒐集資料的方法較適合？甲、檢核表(checklists) 乙、時間取樣(time sampling) 丙、事件取樣(event sampling)丁、軼事記錄(anecdotal records)","o":["甲乙","甲丁","乙丙","丙丁"],"a":"D","al":"D","c":"事件取樣與軼事記錄","e":"哭泣集中在家長離開時，事件取樣可記錄分離前後情境與反應，軼事記錄可保留具體脈絡，故選丙丁。時間取樣若在其他時段抽看，可能漏掉短暫事件；檢核表雖可記有無，較難充分解釋發生過程與輔導需求。","p":"92-98","u":"observe","k":"觀察取樣有兩種。時間取樣是在固定時段裡記錄行為有沒有出現，適合經常發生的行為。事件取樣是鎖定某個特定事件，記錄它發生前後的情境、經過與反應，適合特定時刻才出現的行為。小英只在家長離開後哭，用事件取樣最能抓到；搭配軼事紀錄，把具體經過寫下來，更能找出輔導方法。檢核表只記有無，說不清過程。","s":["關鍵字：哭泣只發生在「家長離開後」，其他時間不哭。","特定情境才出現的行為→事件取樣；需要具體脈絡→軼事紀錄。","時間取樣可能漏掉、檢核表說不清過程，選丙丁 D。"],"w":{"A":"✗ 檢核表與時間取樣都難以捕捉特定時刻的事件經過。","B":"✗ 檢核表只記有無，難以說明分離焦慮的發生過程。","C":"✗ 時間取樣若抽到其他時段，會漏掉只在早上發生的哭泣。","D":"✓ 事件取樣鎖定分離事件，軼事紀錄保留具體脈絡，最適合。"},"m":"偶發特定事件用事件取樣，常出現的行為用時間取樣。"},{"n":199,"q":"有關形成性評估(formative assessment)的敘述，下列何者較正確？ 甲、評估內容與課程教學活動相關 乙、主要用來篩選有學習困難的幼兒 丙、指教師在教學活動結束後所做的評估 丁、教師可據以調整課程內容或教學方法","o":["甲乙","甲丁","乙丁",""],"a":"B","al":"B（原 D 缺文）","c":"形成性評量目的","e":"甲把評量和課程活動連結，丁用結果調整內容或教學，兩者符合形成性評量，故現有選項取 B。乙主要偏篩檢／診斷用途；丙只以活動結束時間定義，忽略是否用來回饋學習，因此不充分。","p":"29；補充 S5","x":"原 PDF 的 D 選項只有標號，沒有內容，本版明示缺漏。B 可由現有敘述判斷，但未取得完整原題前，不宣稱已驗證所有選項的唯一性。","u":"purpose","k":"形成性評量（形成性評估）是在教學過程中進行，內容和當下課程活動相關，目的是用結果回饋學習、調整課程內容或教學方法。篩選學習困難比較偏篩檢或診斷性評量；「活動結束後才做」則像總結性評量的時間點，而且忽略了用結果調整教學這個核心。原 PDF 的 D 選項只有標號沒有內容，本版明示缺漏；B 可由現有敘述判斷，但未取得完整原題前不保證所有選項唯一。","s":["逐項判斷甲乙丙丁是否符合形成性評量。","甲（和教學活動相關）、丁（據以調整教學）符合。","乙偏診斷、丙偏總結，選甲丁 B。"],"w":{"A":"✗ 含乙，篩選學習困難幼兒偏篩檢或診斷性評量。","B":"✓ 甲與課程活動相關、丁用結果調整教學，都符合形成性評量。","C":"✗ 含乙，篩選困難不是形成性評量的主要用途。","D":"✗ 原題缺文"},"m":"形成性：跟著教學走，用結果改教學。"},{"n":200,"q":"老師在評估幼兒 1 至 10 點數能力時，發現四歲的小勳無法正確說出撲克牌花色圖案 的數量。於是帶著小勳一邊將木珠一對一的放在撲克牌的花色圖案上，一邊點數。 進行數次後，再請小勳自己抽牌並點數，此時小勳皆能點數正確。老師所進行的是 下列哪一種評估方式？","o":["動態評估(dynamic assessment)","檔案評估(portfolio assessment)","生態評估(ecological assessment)","診斷性評估(diagnostic assessment"],"a":"A","al":"A","c":"教學介入與再評量","e":"先發現點數困難，再用木珠一對一配對作鷹架，練習後讓幼兒獨立點數，形成前測—介入—後測的連續歷程，屬動態評估。檔案重資料累積；生態重環境需求；診斷雖能找困難，但本題更明確包含介入後的學習反應。","p":"87、100-101","u":"alt","k":"動態評量是「測—教—再測」的連續歷程：先發現學生做不到，再給鷹架協助，接著看他能不能自己做到。鷹架就像蓋房子的臨時架子，幫一把，等會了就拆掉。小勳先點數錯，老師用木珠一對一配對陪他點，練習後他自己抽牌也能點對，這就是動態評估。診斷性評量雖也找困難，但本題明確包含了介入後的學習反應。","s":["找歷程：前測（點數錯）→介入（木珠一對一點數）→後測（自己點對）。","前測—介入—後測＝動態評估。","選 A。"],"w":{"A":"✓ 發現困難後給予鷹架，再看獨立表現，是動態評估。","B":"✗ 檔案評估要長期蒐集作品與紀錄，題幹是一次教學互動。","C":"✗ 生態評估分析幼兒在各環境中需要的技能，題幹沒有環境分析。","D":"✗ 診斷性評估只找困難原因，題幹還包含介入後的進步。"},"m":"測、教、再測，看幫一把後能進步多少，叫動態評量。"}];
const MCQ_FILTERS = [['all', '全部'], ['todo', '還沒做'], ['wrong', '答錯過']];

function MCQPage() {
  const [rec, setRec] = useState(() => load('mcq', {}));
  const [filter, setFilter] = useState(() => load('mcqf', 'all'));
  const [cur, setCur] = useState(() => load('mcqn', 1));
  const [jump, setJump] = useState('');
  useEffect(() => save('mcq', rec), [rec]);
  useEffect(() => save('mcqf', filter), [filter]);
  useEffect(() => save('mcqn', cur), [cur]);
  const list = useMemo(() => MCQ.filter(x => filter === 'all' || (filter === 'todo' ? !rec[x.n] : rec[x.n] && rec[x.n].wrong)), [filter, rec]);
  const q = MCQ.find(x => x.n === cur) || MCQ[0];
  const inList = list.includes(q), pos = list.indexOf(q);
  const r = rec[q.n], picked = r && r.pick, unit = UNITS.find(x => x.id === q.u);
  const doneN = MCQ.filter(x => rec[x.n]).length, okN = MCQ.filter(x => rec[x.n] && rec[x.n].ok).length;
  const wrongN = MCQ.filter(x => rec[x.n] && rec[x.n].wrong).length;
  const go = n => { setCur(n); setJump(''); window.scrollTo({ top: document.querySelector('.tabbar').offsetTop, behavior: 'instant' }); };
  const step = d => { const L = inList ? list : MCQ, i = (inList ? pos : MCQ.indexOf(q)) + d; if (L[i]) go(L[i].n); };
  // 答錯過的題目保留 wrong 標記，重做答對後才移出「答錯過」
  const pick = k => setRec(o => ({ ...o, [q.n]: { pick: k, ok: q.a ? k === q.a : null, wrong: q.a ? k !== q.a : false } }));
  const redo = () => setRec(o => { const n = { ...o }; delete n[q.n]; return n; });
  const doJump = e => { e.preventDefault(); const n = +jump; if (MCQ.some(x => x.n === n)) go(n); };
  const cls = k => !picked ? '' : k === q.a ? 'right' : k === picked ? 'wrong' : 'dim';
  return html`<div>
    <section className="sheet" aria-label="考古題進度">
      <div className="mcq-sum"><span className="meta">已做 <b>${doneN}</b> / ${MCQ.length} 題</span><span className="meta">答對 <b>${okN}</b> 題</span><span className="meta">答錯過 <b>${wrongN}</b> 題</span></div>
      <div className="mcq-dots" aria-hidden="true">${MCQ.map(x => html`<i key=${x.n} className=${(rec[x.n] ? (rec[x.n].ok ? 'ok' : 'no') : '') + (x.n === q.n ? ' cur' : '')}></i>`)}</div>
      <div className="mcq-filter" style=${{ marginTop: '12px' }}>
        ${MCQ_FILTERS.map(([v, l]) => html`<button key=${v} className=${'btn ' + (filter === v ? 'on' : '')} aria-pressed=${filter === v} onClick=${() => { setFilter(v); const L = MCQ.filter(x => v === 'all' || (v === 'todo' ? !rec[x.n] : rec[x.n] && rec[x.n].wrong)); if (L.length && !L.includes(q)) go(L[0].n); }}>${l}</button>`)}
        <form onSubmit=${doJump} className="mcq-filter"><input className="mcq-jump" inputMode="numeric" placeholder="題號" aria-label="跳到第幾題" value=${jump} onInput=${e => setJump(e.target.value)} /><button className="btn" type="submit">跳題</button></form>
      </div>
      <p className="meta" style=${{ marginBottom: 0 }}>${filter === 'all' ? '依原題號作答，點選項立刻看答案與解析。' : list.length ? `這個篩選共 ${list.length} 題。` : filter === 'todo' ? '全部都做過了。' : '目前沒有答錯過的題目。'}</p>
    </section>
    <section className="sheet" aria-label="作答區" style=${{ marginTop: '16px' }}>
      <div className="qhead"><span className="num">第 ${q.n} 題</span>${picked && html`<span className="type">${q.c}</span>`}${!q.a && html`<span className="type">不計分</span>`}</div>
      <p className="qtext">${q.q}</p>
      <div className="mcq-opts" role="group" aria-label="選項">
        ${q.o.map((t, i) => { const k = 'ABCD'[i]; return html`<button key=${k} className=${'mcq-opt ' + cls(k)} disabled=${!!picked} aria-pressed=${picked === k} onClick=${() => pick(k)}><span className="k">(${k})</span><span>${t || '（原題缺文）'}</span></button>`; })}
      </div>
      ${picked && html`<div className="mcq-res" role="status">
        <h3>${!q.a ? '本題題意有疑義，不計分' : r.ok ? '答對了' : `答錯了，你選 ${picked}`}</h3>
        <p><b>答案：${q.al}</b></p>
        ${q.k ? html`
          <h4>這題在考什麼</h4><p>${q.k}</p>
          ${q.s && q.s.length > 0 && html`<h4>解題步驟</h4><ol className="mcq-steps">${q.s.map((t, i) => html`<li key=${i}>${t}</li>`)}</ol>`}
          <h4>每個選項</h4><ul className="mcq-why">${'ABCD'.split('').map(k => q.w && q.w[k] && html`<li key=${k} className=${k === q.a ? 'ok' : ''}><b>(${k})</b> ${q.w[k]}</li>`)}</ul>
          <p className="mcq-mem"><b>一句話記住：</b>${q.m}</p>` : html`<p>${q.e}</p>`}
        ${q.x && html`<p className="note">提醒：${q.x}</p>`}
        <p className="meta">講義頁碼：${q.p}</p>
      </div>`}
      ${picked && unit && html`<details className="mcq-unit" key=${q.n}><summary>看原理圖：${unit.t}</summary>
        <figure className="figure-wrap"><div className="fig">${(UNIT_FIGS[unit.fig] || FIGS[unit.fig])()}</div></figure>
        ${unit.b.map((t, i) => html`<p key=${i}>${t}</p>`)}
        <p className="mcq-mem"><b>口訣：</b>${unit.m}</p>
      </details>`}
      <div className="mcq-nav">
        <button className="btn" disabled=${(inList ? pos : MCQ.indexOf(q)) <= 0} onClick=${() => step(-1)}>‹ 上一題</button>
        ${picked && html`<button className="btn ghost" onClick=${redo}>重做這題</button>`}
        <button className="btn primary" disabled=${(inList ? pos : MCQ.indexOf(q)) >= (inList ? list : MCQ).length - 1} onClick=${() => step(1)}>下一題 ›</button>
      </div>
    </section>
    <p className="meta">題目來自《教檢題庫（學生版）20260630》，原稿缺第 93、137 題。答案與解析依林俊瑩《學習評量》講義整理，是研讀用參考，不是老師公布的正式答案。</p>
  </div>`;
}

function App() {
  const TABS = ['notes', 'review', 'practice', 'mcq'];
  const [tab, setTabRaw] = useState(() => { const h = (location.hash || '').slice(1); const old = load('tab', 'notes'); return TABS.includes(h) ? h : TABS.includes(old) ? old : 'notes'; });
  const [topic, setTopic] = useState(() => { const p = load('ptopic', 'all'); return p === 'all' || TOPICS.some(t => t.id === p) ? p : 'all'; });
  const [attack, setAttack] = useState(null);
  const [focus, setFocus] = useState(null);
  const [theme, setTheme] = useState(() => load('theme', 'system'));
  const tts = useTTS(), game = useStudy();
  useWakeLock(!!(tts.player && tts.player.playing));
  useEffect(() => save('tab', tab), [tab]);
  useEffect(() => save('ptopic', topic), [topic]);
  useEffect(() => { if (theme === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme; save('theme', theme); }, [theme]);
  const setTab = t => { tts.stop(); setTabRaw(t); window.scrollTo({ top: 0 }); };
  const startAttack = id => { if (tts.player) tts.stop(); setAttack(id); };
  const closeAttack = () => { if (tts.player) tts.stop(); setAttack(null); };
  const read = id => { closeAttack(); setTab('notes'); setFocus(id); };
  const practice = id => { setTopic(id); setTab('practice'); };
  return html`<div style=${{ paddingBottom: tts.player ? 'calc(var(--player-h, 170px) + 24px)' : 0 }}>
    <header className=${'mast' + (tab !== 'notes' ? ' compact' : '')}>
      <div className="mastrow"><p className="eyebrow"><span className="issue-dot"></span>口試特訓<span className="eyebrow-sub">・圖解學習誌</span></p>
        <div className="theme-switch" role="group" aria-label="外觀">${[['system', '自動', '跟隨裝置的深淺色設定'], ['light', '白天', '白天版：淺色'], ['dark', '晚上', '晚上版：深色']].map(([v, l, tip]) => html`<button key=${v} aria-pressed=${theme === v} title=${tip} onClick=${() => setTheme(v)}>${l}</button>`)}</div></div>
      <div className="cover-layout"><div className="cover-copy"><p className="issue-label">本期專題｜測驗與學習評量</p>
        <h1>評量筆記</h1>
        ${tab === 'notes' && html`<div className="cover-actions"><button className="btn primary" onClick=${() => read('process')}>開始閱讀 <span aria-hidden="true">↗</span></button><button className="cover-link" onClick=${() => setTab('review')}>回想練習 →</button></div>`}
      </div>${tab === 'notes' && html`<div className="cover-illustration"><${CoverArt} /></div>`}</div>
      <div className="mast-meta"><span><b>15</b> 個理論主題</span><span><b>${QUESTIONS.length}</b> 題口試練習</span><button onClick=${() => setTab('mcq')}><b>${MCQ.length}</b> 題考古題 <span aria-hidden="true">↗</span></button><button onClick=${() => setTab('review')}><b>${game.dueN}</b> 個主題待複習 <span aria-hidden="true">↗</span></button></div>
      <div className="topic-dots" role="group" aria-label="15 個主題的熟悉程度，點圓點到該主題">${TOPICS.map((t, i) => { const st = game.status(t.id), lab = `${String(i + 1).padStart(2, '0')} ${t.title}：${studyLabel(st)}`; return html`<button key=${t.id} className=${st.kind} title=${lab} aria-label=${lab} onClick=${() => read(t.id)}><i></i></button>`; })}</div>
      <p className="dot-legend" aria-hidden="true"><span><i className="ok"></i>已熟悉</span><span><i className="dmg"></i>待複習</span><span><i></i>尚未完成回想</span></p>
    </header>
    <div className="tabbar"><nav className="tabs" aria-label="學習分頁">
      ${[['notes','主題閱讀'],['review','回想練習'],['practice','口試練習'],['mcq','考古題']].map(([v,l]) => html`<button className="tab" aria-current=${tab === v ? 'page' : undefined} aria-selected=${tab === v} key=${v} onClick=${() => setTab(v)}>${l}</button>`)}
    </nav></div>
    ${tab === 'notes' && html`<${Notes} tts=${tts} game=${game} onPractice=${practice} onAttack=${startAttack} focus=${focus} clearFocus=${() => setFocus(null)} />`}
    ${tab === 'review' && html`<${Review} game=${game} tts=${tts} onAttack=${startAttack} onRead=${read} />`}
    ${tab === 'practice' && html`<${Practice} tts=${tts} game=${game} topic=${topic} setTopic=${setTopic} />`}
    ${tab === 'mcq' && html`<${MCQPage} />`}
    <footer>內容依課堂知識庫與題庫整理。朗讀使用裝置內建語音。熟悉程度、複習日期、答題紀錄與草稿只存在這個瀏覽器；舊版進度已接續保留。</footer>
    ${attack && html`<${RecallSession} key=${attack} id=${attack} game=${game} tts=${tts} onClose=${closeAttack} onRead=${read} />`}
    <${Player} tts=${tts} />
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
