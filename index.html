<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>評量筆記・口試特訓</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=LXGW+WenKai+TC:wght@400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* 閱讀優先：大字、留白、主題心智圖，讀懂後遮住答案主動回想。 */
:root {
  --redpen: #C7372B;
  --hit: #34752A;
  --partial: #855D12;
  --hl: #FFE27A;
  --miss-bg: rgba(199, 55, 43, .12);
  --partial-bg: rgba(176, 118, 16, .15);
  --hit-bg: rgba(60, 149, 48, .14);
  --curve: #2C78C2;
  --curve-fill: rgba(44, 120, 194, .14);
  --shade: rgba(44, 120, 194, .38);
  --outline: #3A2A18;
  --wood: #A0632E;
  --wood-dark: #6B3E19;
  --grass: #8CC152;
  --grass-dot: rgba(255, 255, 255, .16);
  --gold: #F4BE2E;
  --elixir: #B44BD6;
  --btn-green: #57B12B;
  --btn-blue: #2F8FDB;
  --btn-red: #D9412B;
  --btn-gold: #F2B53A;
  --on-btn: #FFFFFF;
  --paper: #F7F4E9; --sheet: #FFFEF8; --ink: #292A26; --ink-soft: #606259; --rule: #D4D3C5;
  --accent: #28654B; --accent-soft: #EAF2DE; --edge: #30332D; --shadow: #30332D;
  --mint: #DCEAB6; --lilac: #E8DCF5; --sky: #DCEEF1; --peach: #F8DCCF; --yellow: #F7E493;
  --cover: #F0D975; --cover-ink: #30332D; --art-green: #5C9569; --art-blue: #78ADB7;
  --art-orange: #DB8F61; --art-paper: #FFFCED; --grid: rgba(48,51,45,.075); --caption: #EEF0E4;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-game: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-hand: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", var(--f-body);
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --redpen: #FF8576; --hit: #84D26A; --partial: #EDBE5C;
    --hl: rgba(255, 214, 90, .30); --miss-bg: rgba(255, 133, 118, .16); --partial-bg: rgba(237, 190, 92, .16);
    --hit-bg: rgba(132, 210, 106, .15); --curve: #7DB6EE; --curve-fill: rgba(125, 182, 238, .14); --shade: rgba(125, 182, 238, .36);
    --outline: #0E0A06; --wood: #7A4A22; --wood-dark: #4A2C11; --grass: #3D6A25; --grass-dot: rgba(255, 255, 255, .07);
    --gold: #F0B92A; --elixir: #CE7BEA;
    --paper: #1E2522; --sheet: #29312C; --ink: #F3F1E4; --ink-soft: #C4C8BA; --rule: #566253;
    --accent: #BFDB9B; --accent-soft: #364D3B; --edge: #BBC5AF; --shadow: #101813;
    --mint: #3D523B; --lilac: #4B4059; --sky: #344E54; --peach: #574135; --yellow: #534E30;
    --cover: #D7C377; --cover-ink: #282D25; --art-green: #639875; --art-blue: #8CBAC2;
    --art-orange: #DBA17C; --art-paper: #F7EED5; --grid: rgba(235,241,221,.06); --caption: #344039;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --redpen: #FF8576; --hit: #84D26A; --partial: #EDBE5C;
  --hl: rgba(255, 214, 90, .30); --miss-bg: rgba(255, 133, 118, .16); --partial-bg: rgba(237, 190, 92, .16);
  --hit-bg: rgba(132, 210, 106, .15); --curve: #7DB6EE; --curve-fill: rgba(125, 182, 238, .14); --shade: rgba(125, 182, 238, .36);
  --outline: #0E0A06; --wood: #7A4A22; --wood-dark: #4A2C11; --grass: #3D6A25; --grass-dot: rgba(255, 255, 255, .07);
  --gold: #F0B92A; --elixir: #CE7BEA;
  --paper: #1E2522; --sheet: #29312C; --ink: #F3F1E4; --ink-soft: #C4C8BA; --rule: #566253;
  --accent: #BFDB9B; --accent-soft: #364D3B; --edge: #BBC5AF; --shadow: #101813;
  --mint: #3D523B; --lilac: #4B4059; --sky: #344E54; --peach: #574135; --yellow: #534E30;
  --cover: #D7C377; --cover-ink: #282D25; --art-green: #639875; --art-blue: #8CBAC2;
  --art-orange: #DBA17C; --art-paper: #F7EED5; --grid: rgba(235,241,221,.06); --caption: #344039;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 18.0px; line-height: 1.7; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 56px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.35; }
.ico { width: 16px; height: 16px; flex: none; }

.mast { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
.eyebrow { font-size: 16px; letter-spacing: .1em; color: var(--ink-soft); }
.mast h1 { font-size: clamp(24px, 6vw, 34px); }
.rules { display: flex; flex-wrap: wrap; gap: 6px; font-size: 16px; }
.rules span { border: 1px solid var(--rule); background: var(--sheet); padding: 2px 10px; border-radius: 999px; }
.rules b { color: var(--accent); }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--paper); display: flex; gap: 4px; margin-top: 14px; border-bottom: 1px solid var(--rule); padding-top: 6px; }
.tab { flex: 1; max-width: 220px; border: 1px solid transparent; border-bottom: none; background: none; padding: 10px 14px; border-radius: 8px 8px 0 0; color: var(--ink-soft); font-weight: 500; margin-bottom: -1px; font-size: 18.0px; }
.tab[aria-selected="true"] { background: var(--sheet); border-color: var(--rule); color: var(--ink); font-weight: 700; }
.tab small { font-family: var(--f-mono); font-weight: 400; font-size: 16px; color: var(--ink-soft); margin-left: 4px; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 7px 14px; font-size: 16.8px; min-height: 38px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); font-weight: 700; padding-inline: 18px; }
.btn.ghost { border-color: var(--accent); color: var(--accent); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.btn.known { background: var(--hit-bg); border-color: var(--hit); color: var(--hit); font-weight: 700; }
.link { background: none; border: none; color: var(--accent); padding: 0; text-decoration: underline; text-underline-offset: 3px; font-size: 16.8px; }
.meta { font-size: 16px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; min-width: 0; }

/* ---------- 重點背誦 ---------- */
.notes-top { display: grid; gap: 12px; margin: 16px 0; }
@media (min-width: 900px) { .notes-top { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; } }
.howto { margin: 6px 0 12px; padding-left: 20px; font-size: 16.8px; display: grid; gap: 2px; }
.memobar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toc { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.toc a { display: inline-flex; align-items: center; gap: 6px; font-size: 16.2px; color: var(--ink); text-decoration: none; border: 1px solid var(--rule); background: var(--paper); padding: 4px 10px 4px 4px; border-radius: 999px; }
.toc a span { font-family: var(--f-mono); font-size: 16px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 0 6px; }
.toc a.ok span { background: var(--hit); color: var(--sheet); }
.toc a.cur { border-color: var(--accent); }
.voicebox h2 { font-size: 19.2px; }
.voicebox .row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; align-items: center; margin-top: 8px; font-size: 16.2px; }
.voicebox select { width: 100%; border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 6px 8px; font-size: 16.8px; }
.voicebox .hint { font-size: 16px; color: var(--ink-soft); margin: 8px 0 0; }
.voicebox .warn { font-size: 16px; color: var(--redpen); margin: 8px 0 0; }
input[type=range] { width: 100%; accent-color: var(--accent); }

.topics { display: grid; gap: 18px; }
.topic { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 64px); }
.topic.playing { box-shadow: 0 0 0 2px var(--accent); }
.topic.isknown { border-color: var(--hit); }
.thead { display: flex; gap: 12px; align-items: flex-start; }
.tno { font-family: var(--f-mono); font-weight: 600; font-size: 26.4px; color: var(--accent); line-height: 1.2; }
.isknown .tno { color: var(--hit); }
.tmod { font-size: 16px; color: var(--ink-soft); letter-spacing: .06em; }
.thead h2 { font-size: 24.0px; }
.tacts { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.open { margin: 0 0 14px; padding: 12px 14px; background: var(--accent-soft); border-radius: 8px; font-family: var(--f-display); font-weight: 600; font-size: 19.8px; line-height: 1.7; }
.open .tag { display: block; font-family: var(--f-body); font-size: 16px; font-weight: 700; letter-spacing: .12em; color: var(--accent); margin-bottom: 2px; }
.fig { margin: 0 0 14px; }
.pts { display: grid; gap: 10px; margin: 0; }
.pts > div { border-left: 3px solid var(--rule); padding-left: 12px; }
.pts dt { font-weight: 700; color: var(--ink); }
.pts dd { margin: 2px 0 0; color: var(--ink); font-size: 17.4px; }
.traps { margin-top: 14px; border: 1px dashed var(--redpen); border-radius: 8px; padding: 10px 12px; }
.traps b { color: var(--redpen); font-size: 16px; letter-spacing: .1em; }
.traps ul { margin: 4px 0 0; padding-left: 18px; font-size: 16.8px; display: grid; gap: 3px; }
.cover { position: relative; display: block; border: 1px dashed var(--accent); border-radius: 8px; background: var(--paper); cursor: pointer; min-height: 44px; overflow: hidden; }
.cover .blur { display: block; filter: blur(7px); opacity: .55; user-select: none; pointer-events: none; padding: 4px 8px; max-height: 120px; overflow: hidden; }
.cover .cap { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; font-weight: 700; color: var(--accent); text-align: center; padding: 4px; }

/* 圖解元件 */
.tl { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.tl-step { border: 1px solid var(--rule); border-top: 4px solid var(--accent); border-radius: 8px; padding: 8px 10px; background: var(--sheet); font-size: 16px; min-width: 0; }
.tl-step .when { font-family: var(--f-mono); font-size: 16px; color: var(--ink-soft); }
.tl-step .nm { font-family: var(--f-display); font-weight: 700; font-size: 19.2px; }
.tl-step .who { display: inline-block; margin-top: 4px; font-size: 16px; padding: 0 6px; border-radius: 4px; background: var(--partial-bg); color: var(--partial); font-weight: 700; }
.tl-axis { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 16px; color: var(--ink-soft); }
.tl-axis i { flex: 1; height: 2px; background: linear-gradient(90deg, var(--rule), var(--accent)); }
.two { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
@media (min-width: 560px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.panel { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.panel h3 { font-size: 18.0px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.panel h3 small { font-family: var(--f-body); font-weight: 500; font-size: 16px; color: var(--accent); }
.panel ul { margin: 6px 0 0; padding-left: 18px; font-size: 16.2px; display: grid; gap: 2px; }
.sbars { display: grid; gap: 4px; margin-top: 8px; }
.sbar { display: grid; grid-template-columns: 34px minmax(0, 1fr) 62px; gap: 6px; align-items: center; font-size: 16px; font-variant-numeric: tabular-nums; }
.sbar .tr { height: 12px; background: var(--paper); border-radius: 3px; position: relative; }
.sbar .tr i { position: absolute; inset: 0 auto 0 0; background: var(--curve); border-radius: 3px; opacity: .75; }
.sbar .tr i.fail { background: var(--redpen); }
.sbar .tr .cut { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--redpen); }
.sbar b { font-weight: 600; font-size: 16px; }
.tree { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
@media (min-width: 560px) { .tree { grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); } }
.branch { border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; min-width: 0; }
.branch > .hd { background: var(--accent-soft); padding: 7px 10px; font-weight: 700; font-family: var(--f-display); }
.branch > .hd small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 16px; color: var(--ink-soft); }
.leaf { padding: 7px 10px; border-top: 1px solid var(--rule); font-size: 16.2px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.leaf .to { font-size: 16px; font-weight: 700; color: var(--hit); background: var(--hit-bg); padding: 0 7px; border-radius: 4px; }
.targets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 640px) { .targets { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.target { border: 1px solid var(--rule); border-radius: 8px; padding: 8px; text-align: center; font-size: 16px; min-width: 0; }
.target svg { width: 100%; max-width: 130px; height: auto; display: block; margin: 0 auto 4px; }
.target.no { opacity: 1; }
.target b { display: block; }
.target small { color: var(--ink-soft); }
.rbars { display: grid; gap: 6px; }
.rbar { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 16px; }
.rbar .tr { height: 18px; background: var(--paper); border-radius: 4px; overflow: hidden; }
.rbar .tr i { display: flex; align-items: center; height: 100%; padding-left: 8px; font-style: normal; font-size: 16px; color: var(--sheet); background: var(--curve); font-weight: 700; white-space: nowrap; }
.rbar .tr i.low { background: var(--redpen); }
.factors { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.factor { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 16px; }
.factor b { display: block; font-family: var(--f-display); font-size: 17.4px; }
.stairs { display: flex; align-items: flex-end; gap: 4px; height: 150px; }
.stair { flex: 1; min-width: 0; background: var(--accent-soft); border: 1px solid var(--rule); border-bottom: none; border-radius: 6px 6px 0 0; display: flex; flex-direction: column; align-items: center; padding-top: 6px; font-weight: 700; font-size: 16.8px; }
.stair small { font-weight: 400; font-size: 16px; color: var(--ink-soft); }
.stair.top { background: var(--accent); color: var(--sheet); }
.stair.top small { color: var(--sheet); }
.oldrow { display: flex; gap: 4px; border-top: 2px solid var(--ink); padding-top: 4px; font-size: 16px; color: var(--ink-soft); text-align: center; }
.oldrow span { flex: 1; min-width: 0; }
.oldrow .chg { color: var(--redpen); font-weight: 700; }
.kgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 12px; }
.kcell { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 16px; }
.kcell b { display: block; font-family: var(--f-display); font-size: 17.4px; }
.kcell .eg { color: var(--accent); font-weight: 700; }
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.flow .box { flex: 1 1 120px; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 16px; min-width: 0; }
.flow .box b { display: block; font-family: var(--f-display); font-size: 18.0px; }
.flow .box.mid { background: var(--accent-soft); border-color: var(--accent); }
.flow .arr { align-self: center; color: var(--accent); font-weight: 700; }
.shifts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.shift { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 16px; }
.shift .ft { font-weight: 700; }
.shift .ft s { color: var(--ink-soft); font-weight: 400; }
.dec { display: grid; gap: 6px; }
.decrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 16.2px; }
.decrow .ans { font-weight: 700; color: var(--hit); background: var(--hit-bg); border-radius: 4px; padding: 1px 8px; white-space: nowrap; }
.decrow small { display: block; color: var(--ink-soft); font-size: 16px; }

/* 互動：偏態、常態、試題分析、檔案評量 */
.chartrow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
@media (min-width: 900px) { .chartrow { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); } }
svg.chart { width: 100%; height: auto; display: block; touch-action: none; }
svg text { font-family: var(--f-body); fill: var(--ink-soft); font-size: 16px; }
svg .mono { font-family: var(--f-mono); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.presets button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 4px 12px; font-size: 16px; min-height: 32px; }
.presets button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.rangecap { display: flex; justify-content: space-between; font-size: 16px; color: var(--ink-soft); }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 16.8px; margin: 0; }
.facts dt { color: var(--ink-soft); }
.facts dd { margin: 0; font-weight: 500; }
.facts dd.key { font-family: var(--f-display); font-size: 20.4px; font-weight: 700; color: var(--accent); }
.facts .mono { font-family: var(--f-mono); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.field label { display: block; font-size: 16px; color: var(--ink-soft); letter-spacing: .04em; }
.field input { width: 100%; border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 5px 8px; font-family: var(--f-mono); font-size: 21.6px; font-weight: 600; font-variant-numeric: tabular-nums; }
.field small { font-family: var(--f-mono); font-size: 16px; color: var(--ink-soft); }
.readout { margin-top: 12px; font-size: 16.8px; line-height: 1.75; }
.readout .alert { display: block; margin-top: 6px; color: var(--redpen); font-weight: 700; }
.note { font-size: 16px; color: var(--ink-soft); margin-top: 6px; }
.calc { display: grid; gap: 10px; }
.calc .vals { display: flex; flex-wrap: wrap; gap: 8px; }
.calc .val { border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px; min-width: 120px; }
.calc .val span { display: block; font-size: 16px; color: var(--ink-soft); }
.calc .val b { font-family: var(--f-mono); font-size: 26.4px; }
.calc .verdict { font-size: 16.8px; }
.calc .verdict b.bad { color: var(--redpen); } .calc .verdict b.good { color: var(--hit); }
.scroll { overflow-x: auto; }
table.cmp { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 16.2px; }
.cmp th, .cmp td { border-bottom: 1px solid var(--rule); padding: 8px; text-align: left; vertical-align: top; }
.cmp thead th { font-family: var(--f-display); font-size: 16.8px; border-bottom: 2px solid var(--ink); }
.cmp thead th.pf { color: var(--hit); }
.cmp td.pf { background: var(--hit-bg); }
.cmp td.dim { font-weight: 700; white-space: nowrap; }
.cmp td.dim em { display: block; font-style: normal; font-weight: 500; font-size: 16px; color: var(--accent); }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 16.2px; color: var(--ink-soft); margin-bottom: 8px; cursor: pointer; }
.sortgame { margin-top: 14px; border-top: 1px dashed var(--rule); padding-top: 12px; }
.sortgame h3 { font-size: 18.0px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.sortgame h3 small { font-family: var(--f-mono); font-size: 16px; color: var(--ink-soft); font-weight: 400; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 8px; margin-top: 10px; }
.item { border: 1px solid var(--rule); border-radius: 8px; padding: 9px 11px; display: grid; gap: 6px; min-width: 0; }
.item.right { border-color: var(--hit); background: var(--hit-bg); }
.item.wrong { border-color: var(--redpen); background: var(--miss-bg); }
.item .name { font-weight: 500; font-size: 16.8px; }
.item .acts { display: flex; gap: 6px; }
.item .acts button { flex: 1; border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; font-size: 16.2px; padding: 6px 0; }
.item .why { font-size: 16px; }
.item .why b.r { color: var(--hit); } .item .why b.w { color: var(--redpen); }

/* ---------- 口試練習 ---------- */
.pbar { display: grid; gap: 10px; margin: 16px 0 12px; }
.pfilter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pfilter select { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 7px 10px; font-size: 16.8px; min-height: 38px; max-width: 100%; }
.pfilter select#qsel { flex: 1 1 200px; min-width: 0; }
.progress { display: flex; gap: 3px; flex-wrap: wrap; }
.progress i { width: 12px; height: 12px; border-radius: 3px; background: var(--rule); }
.progress i.done { background: var(--partial); }
.progress i.good { background: var(--hit); }
.progress i.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (min-width: 980px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); } }
.qhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 16px; color: var(--ink-soft); }
.qhead .num { font-family: var(--f-mono); font-weight: 600; color: var(--accent); font-size: 16.8px; }
.qhead .type { border: 1px solid var(--rule); border-radius: 4px; padding: 0 6px; }
.qtext { font-family: var(--f-display); font-size: 21.6px; font-weight: 600; margin: 6px 0 12px; line-height: 1.6; }
.hintbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.kwhint { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.kwhint span { font-size: 16px; padding: 1px 9px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.answer { width: 100%; min-height: 238px; resize: vertical; border: 1px solid var(--rule); border-radius: 6px; padding: 0 12px; font-family: var(--f-hand); font-size: 20.4px; line-height: 34px;
  background-color: var(--sheet); background-image: linear-gradient(transparent 33px, var(--rule) 33px); background-size: 100% 34px; background-attachment: local; }
.answer::placeholder { color: var(--ink-soft); }
.samplenote { font-size: 16px; color: var(--partial); margin: 0 0 6px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.timer { font-family: var(--f-mono); font-size: 16.8px; }
.spacer { flex: 1; }
.tip { font-size: 16px; color: var(--ink-soft); margin: 10px 0 0; }
.empty { color: var(--ink-soft); text-align: center; padding: 36px 10px; }
.stale { font-size: 16px; color: var(--partial); background: var(--partial-bg); padding: 6px 10px; border-radius: 6px; margin-bottom: 12px; }
.score { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: center; padding-bottom: 14px; border-bottom: 1px dashed var(--rule); }
.score .big { grid-row: span 2; font-family: var(--f-mono); font-size: 50.4px; font-weight: 600; line-height: 1; color: var(--redpen); }
.score .big small { font-size: 18.0px; color: var(--ink-soft); }
.bar { display: grid; grid-template-columns: 88px minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-size: 16px; }
.track { height: 8px; background: var(--rule); border-radius: 4px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s; }
.bar .pt { font-family: var(--f-mono); text-align: right; }
.secttl { font-family: var(--f-display); font-size: 18.0px; margin: 16px 0 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.secttl small { font-family: var(--f-body); font-weight: 400; color: var(--ink-soft); font-size: 16px; }
.kwlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.kwlist li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 16.8px; }
.pill { font-size: 16px; font-weight: 700; text-align: center; padding: 1px 0; border-radius: 4px; }
.pill.hit { color: var(--hit); background: var(--hit-bg); }
.pill.partial { color: var(--partial); background: var(--partial-bg); }
.pill.miss { color: var(--redpen); background: var(--miss-bg); }
.kwlist .lack { display: block; font-size: 16px; color: var(--redpen); }
.advice { margin: 0; padding-left: 20px; font-size: 16.8px; display: grid; gap: 4px; }
.advice li::marker { color: var(--redpen); }
.marked { white-space: pre-wrap; font-size: 18.0px; line-height: 1.95; border-left: 3px solid var(--rule); padding-left: 12px; margin: 0; overflow-wrap: anywhere; }
.marked.hand { font-family: var(--f-hand); font-size: 19.2px; }
.m-hit { background: var(--hl); color: inherit; border-radius: 2px; }
.m-partial { background: none; color: inherit; text-decoration: underline wavy var(--partial); text-underline-offset: 4px; }
.mm-hit { background: var(--hit-bg); color: inherit; border-radius: 2px; }
.mm-partial { background: var(--partial-bg); color: inherit; border-radius: 2px; }
.mm-miss { background: var(--miss-bg); color: var(--redpen); font-weight: 700; border-radius: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 16px; color: var(--ink-soft); font-weight: 400; font-family: var(--f-body); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
.chk { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chk span { font-size: 16px; padding: 1px 9px; border-radius: 4px; border: 1px solid var(--rule); }
.chk .ok { color: var(--hit); border-color: var(--hit); }
.chk .no { color: var(--redpen); border-color: var(--redpen); }
.disclaim { font-size: 16px; color: var(--ink-soft); margin: 14px 0 0; }

/* ---------- 部落風：已改為閱讀版，舊資料保留相容 ---------- */
/* ---------- 底部播放列 ---------- */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--sheet); border-top: 1px solid var(--rule); box-shadow: 0 -6px 20px rgba(0, 0, 0, .08);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.player .in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.player .now { flex: 1; min-width: 0; font-size: 16px; }
.player .now b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 16.8px; }
.player .now span { color: var(--ink-soft); font-family: var(--f-mono); font-size: 16px; }
.pbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--rule); background: var(--sheet); display: grid; place-items: center; padding: 0; flex: none; }
.pbtn.main { background: var(--accent); border-color: var(--accent); color: var(--sheet); width: 46px; height: 46px; }
.player select { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 4px; font-family: var(--f-mono); font-size: 16px; }
footer { margin-top: 30px; font-size: 16px; color: var(--ink-soft); }
@media (max-width: 420px) { .player .hide-sm { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
/* ---------- 閱讀版：插畫知識雜誌與筆記卡 ---------- */
:root { --module-color: var(--mint); }
[data-module="0"] { --module-color: var(--mint); }
[data-module="1"] { --module-color: var(--lilac); }
[data-module="2"] { --module-color: var(--sky); }
[data-module="3"] { --module-color: var(--peach); }
[data-module="4"] { --module-color: var(--yellow); }
body { margin: 0; font-size: 18px; line-height: 1.85; background-image: radial-gradient(var(--grid) .7px, transparent .7px); background-size: 7px 7px; }
.wrap { max-width: 1184px; padding-top: 24px; }
h1, h2, h3 { overflow-wrap: anywhere; }
button, a, input, select, textarea { touch-action: manipulation; }
button, select, input:not([type=range]), .presets button, .item .acts button { min-height: 44px; }
input[type=range] { min-height: 40px; }
button, select { max-width: 100%; }
.btn, .link { font-size: 16px; min-height: 44px; }
.btn { border: 1.5px solid var(--edge); border-radius: 8px; line-height: 1.6; justify-content: center; font-weight: 700; background: var(--sheet); padding: 10px 16px; box-shadow: 2px 2px 0 var(--shadow); }
.btn:active:not(:disabled) { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--shadow); }
.btn.primary, .btn.blue, .btn.gold { color: var(--sheet); background: var(--ink); border-color: var(--edge); }
.btn.red, .btn.ghost { color: var(--ink); background: var(--yellow); border-color: var(--edge); }
.btn.on { background: var(--mint); color: var(--ink); border-color: var(--edge); }
.cover-link { background: none; border: 0; padding: 8px 0; font-size: 17px; font-weight: 700; text-align: left; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; color: inherit; }
.mast { display: block; padding: 0; border: 0; }
.mastrow { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 0 0 16px; border-bottom: 2px solid var(--edge); }
.eyebrow { letter-spacing: .04em; font-size: 16px; margin: 0; display: flex; align-items: center; gap: 10px; }
.issue-dot { width: 12px; height: 12px; background: var(--accent); border-radius: 50%; display: inline-block; flex: none; }
.theme-control { display: flex; gap: 8px; align-items: center; font-size: 16px; }
.theme-control select { background: var(--sheet); border: 1px solid var(--edge); border-radius: 6px; padding: 4px 8px; font-size: 16px; }
.cover-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: center; padding: 44px 42px 32px; background: var(--cover); color: var(--cover-ink); border-radius: 0 0 38% 5% / 0 0 6% 3%; position: relative; margin-top: 18px; }
.issue-label { font-size: 16px; font-weight: 700; border-bottom: 1px solid currentColor; width: fit-content; margin: 0 0 24px; padding-bottom: 5px; }
.mast h1 { font-family: var(--f-display); font-size: clamp(36px, 4.5vw, 56px); line-height: 1.2; margin: 0; letter-spacing: .04em; }
.cover-actions { margin-top: 28px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.cover-actions .btn.primary { color: var(--art-paper); background: var(--cover-ink); border-color: var(--cover-ink); box-shadow: none; font-size: 17px; gap: 22px; }
.cover-illustration { position: relative; min-width: 0; }
.cover-art { width: 100%; display: block; height: auto; }
.mast-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-bottom: 2px solid var(--edge); padding: 20px 0 16px; font-size: 16px; }
.mast-meta b { font-family: var(--f-mono); font-size: 24px; margin-right: 6px; }
.mast-meta button { font-size: inherit; color: inherit; border: 0; background: none; padding: 0; }
.mast.compact .cover-layout { padding: 24px; grid-template-columns: 1fr; border-radius: 0 0 16px 16px; }
.mast.compact h1 { font-size: 30px; }
.mast.compact .issue-label { display: none; }
.mast.compact .mast-meta { padding-block: 8px; }
.tabs { padding: 12px 0 0; margin-top: 0; gap: 8px; border-bottom: 2px solid var(--edge); background: var(--paper); }
.tab { max-width: none; font-size: 18px; padding: 12px 4px; border: 1.5px solid transparent; border-radius: 8px 8px 0 0; margin: 0; font-weight: 700; }
.tab[aria-selected=true] { background: var(--sheet); color: var(--ink); border: 1.5px solid var(--edge); border-bottom: 0; position: relative; }
.tab[aria-selected=true]::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 3px; background: var(--sheet); }
.notes-top { display: grid; grid-template-columns: minmax(0,1fr); gap: 16px; margin: 36px 0; }
.desk-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; }
.desk-heading h2 { font-size: 30px; margin: 0; }
.feature-question { display: grid; grid-template-columns: 200px minmax(0,1fr); align-items: center; gap: 28px; padding: 24px; background: var(--sheet); border: 1.5px solid var(--edge); border-radius: 12px; box-shadow: 4px 4px 0 var(--shadow); }
.feature-art { background: var(--lilac); border-radius: 46% 54% 52% 48%; }
.chapter-art { display: block; width: 100%; height: auto; }
.feature-question h3 { font-family: var(--f-body); font-size: 27px; line-height: 1.5; margin-block: 8px; }
.small-label { font-size: 16px; display: inline-block; background: var(--yellow); border-radius: 4px; padding: 2px 8px; font-weight: 700; }
.reading-search { display: grid; gap: 8px; margin-top: 32px; }
.reading-search label { font-weight: 700; font-size: 18px; }
.reading-search input { width: 100%; min-width: 0; font-size: 18px; background: var(--sheet); border: 1.5px solid var(--edge); border-radius: 8px; padding: 12px 14px; }
.filter-row { display: flex; flex-wrap: wrap; gap: 10px; margin-block: 16px 24px; }
.listen-all { margin-left: auto; }
.issue-directory { border-top: 1px dashed var(--edge); padding-top: 16px; }
summary { cursor: pointer; min-height: 44px; font-size: 18px; font-weight: 700; }
.issue-directory > summary { font-size: 24px; font-family: var(--f-display); padding-block: 8px; }
.issue-directory > summary > span { font-family: var(--f-body); font-size: 16px; font-weight: 400; color: var(--ink-soft); margin-left: 12px; display: inline-block; }
.chapter-directory { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 20px; margin-block: 20px; }
.chapter-group { min-width: 0; border: 1.5px solid var(--edge); background: var(--sheet); border-radius: 12px; overflow: hidden; }
.chapter-group:last-child { grid-column: 1/-1; }
.chapter-group > header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--module-color); border-bottom: 1.5px solid var(--edge); }
.chapter-group h3 { font-family: var(--f-body); font-size: 24px; }
.chapter-index { font-size: 20px; font-family: var(--f-mono); }
.chapter-group .chapter-art { width: 78px; margin: -10px 0 -10px auto; flex: none; }
.toc { display: grid; grid-template-columns: 1fr; gap: 0; margin: 0; }
.toc a { color: var(--ink); background: none; border: 0; border-top: 1px solid var(--rule); border-radius: 0; padding: 14px 20px; font-size: 17px; line-height: 1.6; min-height: 52px; align-items: baseline; gap: 10px; }
.toc a:hover { background: var(--module-color); }
.toc a > span:first-child { font-size: 16px; padding: 0; min-width: 26px; color: var(--ink-soft); background: none; flex: none; }
.toc a.ok > span:first-child { color: var(--accent); background: none; }
.toc-arrow { margin-left: auto; background: none !important; color: var(--ink) !important; }
.voicebox { padding: 16px 20px !important; border: 1px dashed var(--edge) !important; background: var(--caption) !important; box-shadow: none !important; }
.voicebox summary > span { font-size: 16px; margin-left: 8px; font-weight: 400; color: var(--ink-soft); }
.voicebox .hint, .voicebox .warn, .voicebox .row, .voicebox select { font-size: 16px; }
.sheet { padding: 28px; border: 1.5px solid var(--edge); border-radius: 12px; box-shadow: 3px 3px 0 var(--shadow); }
.topics { gap: 44px; }
.topic { padding: 0; scroll-margin-top: 88px; border-radius: 14px; overflow: clip; }
.topic.isknown { border-color: var(--edge); }
.thead { display: flex; align-items: center; gap: 16px; padding: 28px 32px; background: var(--module-color); border-bottom: 1.5px solid var(--edge); }
.topic-heading { flex: 1; min-width: 0; }
.topic .thead .chapter-art { width: 160px; flex: none; }
.tmod { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; font-size: 16px; letter-spacing: 0; }
.topic-chapter { font-size: 16px; color: var(--ink); }
.study-status { font-size: 16px; color: var(--ink); border: 1px solid var(--edge); border-radius: 20px; padding: 1px 10px; background: var(--sheet); }
.topic-title { display: flex; gap: 14px; align-items: baseline; margin-top: 16px; }
.tno, .isknown .tno { font-family: var(--f-mono); color: var(--ink); font-size: 28px; font-weight: 600; line-height: 1.4; }
.thead h2 { font-family: var(--f-body); font-size: 30px; margin: 0; line-height: 1.5; font-weight: 900; }
.topic > :not(.thead):not(.topic-end) { margin-left: 32px; margin-right: 32px; }
.tacts { gap: 10px; margin-block: 24px; }
.open { font-family: var(--f-body); padding: 0; background: var(--sheet); border: 1.5px solid var(--edge); border-radius: 10px; overflow: hidden; font-size: 20px; line-height: 1.9; margin-block: 24px 32px; }
.open .tag { display: block; background: var(--yellow); color: var(--ink); border-bottom: 1.5px solid var(--edge); padding: 8px 20px; font-size: 16px; font-weight: 700; letter-spacing: .02em; margin: 0; }
.open p { margin: 0; padding: 20px; font-weight: 700; }
.reading-label { font-family: var(--f-body); font-size: 21px; margin-top: 32px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.section-number { display: inline-grid; place-items: center; min-width: 34px; height: 34px; border: 1.5px solid var(--edge); border-radius: 50%; background: var(--module-color); font-family: var(--f-mono); font-size: 16px; flex: none; color: var(--ink); }
.figure-wrap { margin-block: 16px 32px; }
.figure-wrap .fig { margin-bottom: 12px; }
.figure-wrap > figcaption { border-top: 1px dashed var(--rule); color: var(--ink-soft); font-size: 16px; padding-top: 8px; }
.fig .panel, .fig .branch, .fig .tl-step, .fig .factor, .fig .kcell, .fig .target, .fig .shift, .fig .box { border: 1.5px solid var(--edge); }
.fig .panel h3, .fig .branch > .hd { background: var(--module-color); color: var(--ink); padding: 10px; border-radius: 5px; }
.fig .panel h3 small { color: var(--ink); }
.fig .tl-step { border-top: 8px solid var(--module-color); }
.fig .tl { gap: 14px; }
.fig .tl .nm { margin-block: 6px; font-size: 22px; }
.fig .sbar { grid-template-columns: 24px minmax(0,1fr) 72px; }
.fig .rbar { grid-template-columns: 110px minmax(0,1fr); }
.fig .rbar .tr { height: auto; min-height: 28px; }
.fig .rbar .tr i { white-space: normal; min-width: 78px; }
.fig .targets { grid-template-columns: repeat(2,minmax(0,1fr)); }
.fig .target { font-size: 18px; padding: 16px; }
.fig .target small { font-size: 16px; }
.fig .field input { font-size: 20px; min-width: 0; width: 100%; }
.fig .stairs { height: auto; display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; }
.fig .stair { height: auto !important; padding: 12px 4px; border: 1.5px solid var(--edge); background: var(--module-color); font-size: 18px; }
.fig .stair.top { background: var(--ink); color: var(--sheet); }
.fig .stair small { font-size: 16px; overflow-wrap: anywhere; }
.fig .oldrow { margin-top: 12px; flex-wrap: wrap; font-size: 16px; }
.fig .oldrow span { flex: 1 1 25%; }
.fig .chart { min-width: 540px; }
.chart-scroll { overflow-x: auto; overscroll-behavior-inline: contain; border: 1px solid var(--rule); border-radius: 8px; }
.chart-hint { font-size: 16px; color: var(--ink-soft); margin: 8px 0; }
.fig .decrow { grid-template-columns: minmax(0,1fr); border: 1px solid var(--edge); }
.fig .flow .arr { color: var(--ink); font-size: 24px; }
.concept-map { margin-block: 32px; padding: 24px; background-color: var(--caption); background-image: linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size: 20px 20px; border: 1.5px solid var(--edge); border-radius: 12px; }
.concept-map figcaption { font-size: 20px; font-weight: 700; margin-bottom: 20px; line-height: 1.8; }
.map-hint { display: block; font-size: 16px; color: var(--ink-soft); font-weight: 400; margin-top: 8px; }
.map-root { border: 1.5px solid var(--edge); border-radius: 30px; padding: 12px 20px; background: var(--module-color); color: var(--ink); font-size: 20px; font-weight: 700; text-align: center; }
.map-branches { display: grid; gap: 16px; padding: 20px 0 0 20px; border-left: 2px solid var(--edge); margin-left: 20px; }
.map-node { width: 100%; display: flex; align-items: baseline; text-align: left; gap: 10px; position: relative; padding: 12px; background: var(--sheet); color: var(--ink); border: 1.5px solid var(--edge); border-radius: 10px; font-size: 18px; line-height: 1.7; }
.map-node::before { content: ''; position: absolute; width: 20px; border-top: 2px solid var(--edge); left: -22px; top: 25px; }
.map-node[aria-expanded=true] { background: var(--module-color); box-shadow: 2px 3px 0 var(--shadow); }

<div class="wrap" id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);

/* ---------- 本機暫存（只存在這台瀏覽器） ---------- */
const KEY = 'exam-review-v2:';
function load(k, d) { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }

/* ---------- 重點背誦：15 個主題（依課堂知識庫模組一～五） ---------- */
const TOPICS = [
  { id: 'process', mod: '模組一・測驗分類', title: '依教學歷程：四種評量', fig: 'timeline',
    open: '依教學歷程，評量分成安置性、形成性、診斷性、總結性四種，差別在「什麼時候做」和「為了什麼做」。',
    pts: [
      ['安置性｜教學前', '了解學生的起點行為、先備知識與舊經驗，對應教案準備活動的引起動機、銜接舊經驗。例如開學第一週的單元前測。'],
      ['形成性｜教學中', '用隨堂小考、學習單、課堂問答確認學生學會沒有，作為老師立即調整下一節教學策略的依據。'],
      ['診斷性｜教學中或教學後', '針對反覆出現困難的學生做錯題分析，找出迷思概念與學習盲點，進行補救教學或提出轉介證明。'],
      ['總結性｜教學後', '段考、期末考，評定整體學習成就、提供成績等第。'],
    ],
    traps: ['全班形成性評量考不好，責任在老師，代表教學策略要調整，所以平時小考就算計分，比重也應該很低。', '總結性評量的責任在學生。', '假日帶回家的學習單，需要家長共同參與、共同承擔學習責任。'] },
  { id: 'reference', mod: '模組一・測驗分類', title: '常模參照 vs. 標準參照', fig: 'reference',
    open: '口訣「常模比高低，標準看過關」：常模參照看在團體中的相對位置，標準參照看有沒有達到事先決定的門檻。',
    pts: [
      ['常模參照｜相對位置', '和常模團體比較，分出高低排名。重視鑑別度與高信度，適用於總結性評量、範圍廣、異質性大的團體。例如學測、國中會考、教甄前 20% 進複試、PR 值。'],
      ['標準（效標）參照｜絕對門檻', '依教學前事先決定的學習目標與表現標準，判斷通過與否，不和別人比。最適合精熟學習，適用於形成性與診斷性評量。例如教檢 60 分及格、駕照、全民英檢、游泳 1～10 級、實作成績 1～6 級。'],
    ],
    traps: ['標準參照在及格邊緣是「一刀切」，60 分過、59 分不過，所以信度通常較低，主要看效度。', '有「分級」不代表是常模參照：游泳 1～10 級、實作 1～6 級都是標準參照。'] },
  { id: 'standard', mod: '模組一・測驗分類', title: '標準化測驗 vs. 教師自編測驗', fig: 'standard',
    open: '標準化測驗由專業單位統一編製、施測、計分並建立常模；非標準化測驗是老師依自己班級的需求自編。',
    pts: [
      ['標準化測驗', '編製、施測程序、計分標準與常模都一致，全台灣花蓮、台南、台北考同一份。優點是公平、客觀、可以跨區比較，連分數也能標準化；缺點是容易窄化教學。'],
      ['非標準化（教師自編）測驗', '依班級特定需求與教學目標設計，只在自己班上施測，彈性高、能反映個別差異。例如自編英語隨堂考、「羅東夜市」踏查學習單。'],
    ],
    traps: ['「標準化」講的是編製過程，「標準參照」講的是分數怎麼解釋，兩組概念不要混在一起。'] },
  { id: 'perform', mod: '模組一・測驗分類', title: '最大表現 vs. 典型表現（Cronbach）', fig: 'performTree',
    open: 'Cronbach 依作答表現分兩種：最大表現要「盡力考到最好」、有對錯；典型表現只要「誠實作答」、沒有對錯。',
    pts: [
      ['最大表現測驗', '測能力極限或學習成果。成就測驗（如段考，測已學過的內容）最重視內容效度；性向測驗、智力測驗（測未來潛能）最重視預測效度。'],
      ['典型表現測驗', '測平常真實的樣子。情意測驗、人格問卷（內外向）、興趣量表、生活適應量表、工作滿意度調查、學習動機量表，最重視建構（構念）效度。'],
    ],
    traps: ['題目一出現「學習動機量表、焦慮量表、自我概念量表、人格問卷」，就是典型表現測驗，配建構（構念）效度。'] },
  { id: 'relval', mod: '模組二・信度與效度', title: '信度與效度的關係', fig: 'targets',
    open: '效度是正確性，受系統誤差影響；信度是穩定性與一致性，受隨機誤差影響。編測驗要先求效度，再談信度。',
    pts: [
      ['效度＝正確性', '能真實測出想測的特質的程度，受系統誤差影響。'],
      ['信度＝穩定、一致、可靠', '測驗結果穩不穩定，受隨機誤差影響。公式 X＝T＋E：觀察分數等於真實分數加誤差。'],
      ['四句必背', '效度高，信度一定高；信度低，效度一定低；信度高，效度不一定高；所以信度是效度的必要條件，不是充分條件。'],
    ],
    traps: ['飛鏢全部穩穩射在左下角：很集中（信度高），卻偏離紅心（效度低）。', '不會有「信度低、效度高」這種情況。'] },
  { id: 'validity', mod: '模組二・信度與效度', title: '三大效度', fig: 'validityTree',
    open: '效度分三大類：內容效度、效標關聯效度（又分同時效度和預測效度）、建構效度。',
    pts: [
      ['內容效度', '試題有沒有涵蓋教學目標與教材範圍，也就是所教即所考。成就測驗最重視，編製時用雙向細目表確保。'],
      ['效標關聯效度', '和外在公認有效的效標求相關。同時效度：新測驗和魏氏智力量表、全國學力測驗同時施測，看能不能取代；預測效度：用現在的分數預測未來表現，有時間差，例如性向測驗、模擬考預測會考。'],
      ['建構（構念）效度', '測量理論上的抽象心理特質，例如學習動機、焦慮、自我概念、人格。'],
    ],
    traps: ['成就測驗配內容效度，性向測驗配預測效度，典型表現量表配建構效度。'] },
  { id: 'reliability', mod: '模組二・信度與效度', title: '信度種類與影響因素', fig: 'relBars',
    open: '再測信度通常最高，評分者信度最低；影響信度的三大因素是題數、難度、團體異質性。',
    pts: [
      ['再測信度（重測信度、穩定係數）', '同一份考卷隔一段時間（如兩週）對同一批人再考一次，像「影分身」，通常是所有信度中最高的。'],

  { id: 4, topic: 'performance', also: ['observe'], type: '比較', category: '實作評量與評分工具',

    examples: ['試教', '論文', '打電話', '電話', '郵局', '寄信', '康乃馨', '瘖啞', '廚師', '廚藝', '書法', '圖畫', '分離焦慮', '哭', '出國', '音樂會'],
    exampleHint: '特教學生實際撥電話評打電話技巧、帶一年級去郵局寄信；檢核表＝分離焦慮有沒有哭；評定量表＝書法、圖畫作品。',
    model: '1. 實作評量是指要求學生實際動手操作、展演或完成作品（如試教、寫論文、打電話技巧、郵局寄信），重過程與結果。\n2. 優點：比標準化測驗更能提供有效解釋、引導有意義的學習、具「情境相關（脈絡化）」、較不受語文能力干擾（如瘖啞人士仍可展現廚藝或繪畫）。\n3. 限制：非常耗時花錢、測驗情境不易控制、評分標準難界定、易受主觀影響導致「評分者信度」偏低。\n4. 評分工具區別：\n   - 檢核表（Checklist）是指僅判斷行為「是/否、有/無」出現（如分離焦慮哭泣觀察、出國物品清單）。\n   - 評定量表（Rating Scale）：當行為或作品品質有明顯差距，可區分出不同「等級高低」時使用（如書法、圖畫作品評分）。\n   - 評分規程（Rubrics）：雙向表格，事先向學生說明作業期待標準與各等級規準，供學生修改作業並提升評分客觀性與公平性。' },
  { id: 5, topic: 'standard', also: ['reference', 'skew'], type: '綜合', category: '標準化、參照與偏態',

    keywords: [

      { label: '左偏態(負偏/太簡單/天花板效應)', groups: [['左偏', '負偏'], { name: '題目太簡單', t: ['簡單', '容易'] }, ['天花板', '高限']] },

    exampleHint: '常模：學測、會考、教甄前 20% 進複試；標準：教檢 60 分及格、駕照、游泳 1~10 級、實作 1~6 級。',
    model: '1. 編製過程：分為「標準化測驗」（專業部門統一編製、嚴格施測與計分標準，全台考同一份，具跨區可比較性與公平性）與「非標準化測驗」（教師依班級需求自編，具彈性）。\n2. 分數解釋：分為「常模參照」（與團體常模比高低、看相對位置如 PR 值，重鑑別度與高信度，如學測、教甄前20%複試）與「標準/效標參照」（依教學前事先決定的標準看是否過關，屬絕對位置，如教檢60分及格、游泳1~10級、學期實作1~6級）。\n3. 偏態分布（看長尾巴位置）：\n   - 左偏態（負偏態）：長尾巴在左邊低分區，多數人考高分，代表題目「太簡單」（天花板/高限效應），眾數 > 中位數 > 平均數。\n   - 右偏態（正偏態）：長尾巴在右邊高分區，多數人考低分，代表題目「太難」（地板/低限效應），平均數 > 中位數 > 眾數。' },

    exampleHint: '事實＝動物園裡的豬狗羊；概念＝哺乳類；程序＝釣魚方法、四則運算；後設認知＝考前看考古題抓方向；評鑑＝比較畢旅去日本或墾丁。',
    model: '1. 認知歷程六層次（由低至高）：記憶 ➔ 了解 ➔ 應用 ➔ 分析 ➔ 評鑑（判斷好壞對錯） ➔ 創造。\n2. 四大知識向度（由具體至抽象）：\n   - 事實知識是指單一具體名詞（如化學符號、豬狗羊）。\n   - 概念知識是指抽象分類與原理（如「哺乳類動物」）。\n   - 程序知識：有嚴格操作步驟的技能與方法（如四則運算、釣魚方法、使用量筒）。\n   - 後設認知知識：策略、情境脈絡與自我知識（如看考古題抓方向、避開塞車路線、對應存在主義的自我定位）。\n3. 雙向細目表：成就測驗的命題藍圖，結合「教材內容單元」與「認知歷程目標」以確保「內容效度」。原則上各單元配分須均衡，但各認知層次題數比例不強求相等。' },
  { id: 7, topic: 'process', type: '比較', category: '依教學歷程分類的四種評量',
    question: '依教學歷程，評量可分為哪四種？請說明各自的實施時機與目的；若全班形成性評量都考不好，責任在誰？',
    keywords: [
      { label: '安置性評量(教學前/起點行為)', groups: [['安置'], { name: '教學前／起點行為', t: ['教學前', '起點', '先備', '舊經驗'] }] },

    ],
    examples: ['隨堂', '小考', '學習單', '段考', '期末考', '家長', '引起動機', '開學', '錯題'],
    exampleHint: '開學前了解舊經驗（安置）；隨堂小考、學習單（形成）；錯題分析找迷思再補救（診斷）；段考、期末考（總結）；假日學習單需家長共同參與。',
    model: '1. 安置性評量：教學前（開學前、單元開始前）實施，了解學生的起點行為、先備知識與舊經驗，對應教案準備活動的引起動機與銜接舊經驗。\n2. 形成性評量：教學過程中實施（隨堂小考、學習單、課堂問答），掌握教學進度、確認學生是否學會，作為教師立即調整教學策略的依據。若全班考不好，責任在老師，代表教學策略需要調整，因此平時小考即使計分，比重也應極低；假日學習單則需家長共同參與、共同承擔學習責任。\n3. 診斷性評量：教學中或教學後，針對反覆出現學習困難的學生進行錯題分析，找出迷思概念與學習盲點，以進行補救教學或提出轉介證明。\n4. 總結性評量：教學結束後（段考、期末考）實施，評定整體學習成就並提供成績等第，責任在學生。' },
  { id: 8, topic: 'perform', type: '比較', category: '最大表現 vs. 典型表現',

    examples: ['段考', '學習動機量表', '內外向', '興趣量表', '智力測驗', '生活適應', '工作滿意度', '人格問卷'],
    exampleHint: '最大表現：段考（成就）、智力或性向測驗；典型表現：學習動機量表、人格問卷（內外向）、興趣量表、工作滿意度調查。',
    model: '1. 由 Cronbach 依作答表現提出。\n2. 最大表現測驗：要求受試者盡力考到最好，有標準答案、有對錯之分，測量能力極限或學習成果。\n   - 成就測驗：測量教學後的學習成果（如段考），最重視內容效度。\n   - 性向測驗／智力測驗：測量未來發展潛能，最重視預測效度。\n3. 典型表現測驗：要求受試者正常表現、誠實作答即可，沒有對錯之分，例如情意測驗、人格問卷（內外向）、興趣量表、生活適應量表、工作滿意度調查、學習動機量表。最重視建構（構念）效度。' },
  { id: 9, topic: 'reliability', type: '定義', category: '信度種類與影響因素',

      { label: '難度適中(P≈0.50)', groups: [['難度'], { name: '適中（P≈0.50）', t: ['適中', '0\\.5', '50%', '百分之50', '百分之五十'] }] },
      { label: '團體異質性高信度高', groups: [['異質'], { name: '同質班信度降低', t: ['同質', '資優班', '音樂班', '體育班', '標準差'] }] },

    examples: ['影分身', '雙胞胎', '月暈', '申論', '資優班', '音樂班', '體育班', '兩週', '兩周'],
    exampleHint: '再測像「影分身」隔兩週再考一次；複本像雙胞胎 A、B 卷；評分者受月暈效應影響；資優班、音樂班同質性高，信度會下降。',
    model: '1. 信度種類：\n   - 再測信度（重測信度、穩定係數）是指同一份測驗隔一段時間（如兩週）對同一批人施測兩次，通常是所有信度中最高的。\n   - 複本信度：難度與結構相似的 A、B 兩卷。\n   - 內部一致性信度：折半信度、Cronbach α。\n   - 評分者間信度是指多位評分者對同一份作業、申論題或實作評分的一致程度，受月暈效應等主觀因素影響，是所有信度中最低的。\n2. 影響信度的三大因素：\n   - 試題題數：適度增加同質性題目，可提高信度。\n   - 試題難易度：難度適中（P≈0.50）時信度與鑑別度最高，太難或太簡單都會降低信度。\n   - 團體異質性：團體程度差異越大、標準差越大，信度越高；資優班、音樂班、體育班等同質性高的班級，信度會降低。' },

      { label: '預測效度(預測未來表現)', groups: [['預測效度'], { name: '預測未來表現', t: ['未來', '時間差', '模擬考'] }] },
      { label: '建構效度(抽象心理特質)', groups: [CONSTRUCT, { name: '抽象心理特質', t: ['抽象', '心理', '特質', '理論', '動機', '焦慮', '自我概念'] }] },
    ],
    examples: ['雙向細目表', '魏氏', '模擬考', '會考', '學習動機', '焦慮', '自我概念', '性向測驗', '段考', '學力測驗'],
    exampleHint: '段考用雙向細目表（內容）；新智力測驗與魏氏同時施測（同時）；模擬考預測會考（預測）；學習動機、焦慮量表（建構）。',
    model: '1. 內容效度：試題是否涵蓋教學目標與教材範圍（所教即所考），成就測驗最重視，編製時以雙向細目表確保。\n2. 效標關聯效度：與外在公認有效的效標求關聯。\n   - 同時效度（並行效度）：新編測驗與現有公認效標（如魏氏智力量表、全國學力測驗）同時施測比較，看能否取代原測驗。\n   - 預測效度：以現在的分數預測未來表現，有時間差，如性向測驗、模擬考預測會考。\n3. 建構效度（構念效度）：測量理論上的抽象心理特質，凡學習動機量表、焦慮量表、自我概念量表、人格問卷等典型表現測驗，都看建構效度。' },
  { id: 11, topic: 'item', type: '定義', category: '試題分析：難度與鑑別度',
    question: '請說明試題分析中高低分組的分組方式，以及難度（P）與鑑別度（D）的計算、理想數值；若鑑別度為負值代表什麼？',
    keywords: [
      { label: '前後27%分高低分組', groups: [['27'], { name: '高分組／低分組', t: ['高分組', '低分組'] }] },
      { label: '難度P＝(PH＋PL)/2', groups: [['難度'], { name: 'P＝(PH＋PL)÷2', t: ['ph\\+pl', '通過率', '除以2', '除以二', '/2', '相加'] }] },
      { label: '難度0.50最佳(0.40～0.60)', groups: [{ name: 'P＝0.50 最佳', t: ['0\\.5', '50%', '百分之50', '百分之五十'] }, { name: '理想範圍 0.40～0.60', t: ['0\\.4', '0\\.6', '適中'] }] },
      { label: '鑑別度D＝PH－PL', groups: [['鑑別度'], { name: 'D＝PH－PL', t: ['ph-pl', 'ph−pl', '相減', '減去', '減掉'] }] },
      { label: '負鑑別度＝高分組答錯/題目有誤', groups: [['負'], { name: '高分組答錯、題目或答案有誤', t: ['高分組.{0,6}錯', '低分組.{0,6}對', '答案.{0,4}錯', '題目.{0,4}(錯|誤)', '誤解', '有問題'] }] },
    ],
    examples: ['掐頭去尾', '誤解', '標準答案', '給錯', '例如某題', '計算'],
    exampleHint: '「掐頭去尾法」取前後 27%；舉一題算給老師聽，例如 PH＝0.8、PL＝0.4，P＝0.6、D＝0.4；鑑別度 −0.2 代表高分組可能誤解題意或答案給錯。',
    model: '1. 分組方式：採「掐頭去尾法」，取全體考生成績前 27% 為高分組（PH），後 27% 為低分組（PL）。\n2. 難度（P）：P＝(PH＋PL)÷2，即通過率，最佳值為 0.50，理想範圍 0.40～0.60。\n3. 鑑別度（D）：D＝PH－PL，正值越大代表越能區分高分組與低分組。\n4. 負鑑別度：代表高分組答錯、低分組反而答對，通常是題目出錯、高分組誤解題意或標準答案給錯，需要修題。' },
  { id: 12, topic: 'trend', type: '綜合', category: '現代評量新趨勢',
    question: '請說明現代評量的四大新趨勢；多元評量可以使用紙筆測驗嗎？另類評量興起的原因為何，它能提高信度嗎？',
    keywords: [
      { label: '靜態→動態評量', groups: [['動態評量', '動態']] },

      { label: '單一→多元評量(可含紙筆)', groups: [['多元評量', '多元'], { name: '可以使用紙筆', t: ['紙筆'] }] },

      { label: '另類評量無法提高信度', groups: [['信度'], { name: '無法提高', t: ['無法', '不能', '不會', '降低', '偏低'] }] },
    ],
    examples: ['托福', 'toefl', '英檢', '科學閱讀', '辯論', '專題', '買東西', '商店', '前測'],
    exampleHint: '陳老師「科學閱讀」：省思 30%＋辯論 30%＋專題 40%（多元）；讓低年級到商店買東西評算數（真實）；托福、英檢（CAT）。',
    model: '1. 四大新趨勢：\n   - 靜態評量 ➔ 動態評量：前測、教學介入、後測，評估學習潛能。\n   - 虛假評量 ➔ 真實性評量：也就是在真實生活脈絡中解決問題。\n   - 單一評量 ➔ 多元評量：例如科學閱讀課以省思 30%、辯論 30%、專題報告 40% 評分。\n   - 適性評量／電腦適性測驗（CAT）：如托福、英檢，電腦依作答動態調整題目難度，估算真實能力。\n2. 多元評量可以使用紙筆測驗，紙筆只是其中一種工具、不是唯一工具即可，因此同時包含主觀與客觀資訊。\n3. 另類評量興起原因：受奧蘇貝爾（Ausubel）「有意義的學習」影響、傳統評量有諸多缺失、標準化測驗會窄化教學。但另類評量主觀性較強，無法提高評量的信度。' },
  { id: 13, topic: 'observe', type: '比較', category: '觀察紀錄與評定方法',
    question: '請說明軼事紀錄法適用的評量，以及事件取樣、時間取樣、實距紀錄三種觀察取樣法的差異；並比較等第法與心象法。',
    keywords: [

      { label: '事件取樣(特定事件發生才記)', groups: [['事件取樣'], { name: '特定事件發生才記錄', t: ['特定', '發生', '爭吵', '哭'] }] },

      { label: '實距紀錄(持續時間長度)', groups: [['實距'], { name: '行為持續多久', t: ['持續', '多久', '長度'] }] },
      { label: '等第法(先分堆再評名次) vs. 心象法(與心中標準比/可從缺)', groups: [['等第法'], { name: '先分堆再給名次', t: ['分堆', '金牌', '銀牌', '名次'] }, ['心象法'], { name: '與心中標準比、可從缺', t: ['從缺', '心中', '過往', '以前'] }] },
    ],
    examples: ['爭吵', '分離', '哭', '美術', '蘭花', '茶葉', '從缺', '小傳記', '個案'],
    exampleHint: '軼事紀錄像寫個案小傳記；事件取樣＝爭吵或分離哭泣發生時才記錄；等第法＝美術、茶葉、蘭花比賽先分五堆；心象法＝本屆未達標就「優等從缺」。',
    model: '1. 軼事紀錄法是指像寫個案小傳記一樣，客觀記錄學生在自然情境中發生的特殊重要行為或事件，最適合運用於情意教學的評量（態度、願不願意積極配合）。\n2. 三大觀察取樣法：\n   - 事件取樣法是指特定事件（如爭吵、分離哭泣）出現時才開始觀察，記錄始末。\n   - 時間取樣法：在固定時間間隔觀察特定行為是否發生。\n   - 實距紀錄法：記錄某行為持續發生的時間長度。\n3. 等第法 vs. 心象法：等第法是先把美術作品、茶葉、蘭花等分堆（如五堆），再分出金牌、銀牌、銅牌、優等、入選；心象法是評審心中已有過往的高標準，若本屆作品都未達標，就會出現「優等從缺」。' },
  { id: 14, topic: 'process', type: '情境', category: '安置性與形成性評量',

    exampleHint: '開學第一週的單元前測（安置）、每節課的學習單（形成）。',
    model: '1. 單元前測屬於「安置性評量」：在教學前實施，目的是了解學生的起點行為、先備知識與舊經驗（例如學過哪些分數概念），作為安排教學起點的依據。\n2. 每節課的學習單屬於「形成性評量」：在教學過程中實施，目的是確認學生是否學會、掌握教學進度，作為老師立即調整下一節教學策略的依據。若全班都沒學會，責任在老師，需調整教學。' },

      { label: '常模參照＝相對位置', groups: [['常模參照'], { name: '相對位置', t: ['相對', '排名', '比高低', 'pr', '百分等級'] }] },

    model: '1. 常模參照是指將個人分數與常模團體比較，了解個人在團體中的相對位置（比高低、看 PR 值）。重視鑑別度與高信度，適用於總結性評量、範圍廣、異質性大的團體。例如學測、國中會考、教甄排名前 20% 進複試。\n2. 標準（效標）參照是指依教學前事先決定的學習目標與表現標準（絕對門檻），判斷學生是否通過，不與他人比較。最適合精熟學習，適用於形成性與診斷性評量。例如教師資格檢定 60 分及格、駕照考試、游泳 1～10 級。\n3. 口訣：常模比高低，標準看過關。' },

  { id: 19, topic: 'standard', type: '比較', category: '標準化 vs. 教師自編',

function skewStats(s) {
  const alpha = s * 7, xi = 50 - s * 32, om = 22;
  const xs = [], fs = [];
  for (let x = 0; x <= 100; x += 0.5) { const u = (x - xi) / om; xs.push(x); fs.push(phi(u) * Phi(alpha * u)); }
  const tot = fs.reduce((a, b) => a + b, 0);
  let mean = 0; fs.forEach((f, i) => mean += xs[i] * f); mean /= tot;
  let acc = 0, median = 50; for (let i = 0; i < fs.length; i++) { acc += fs[i]; if (acc >= tot / 2) { median = xs[i]; break; } }
  let mi = 0; fs.forEach((f, i) => { if (f > fs[mi]) mi = i; });
  return { xs, fs, fmax: fs[mi], mean, median, mode: xs[mi] };
}

// 舊 stage 保留為間隔複習階段；不刪除舊版資源與作答資料。
const INTERVALS = [0, 1, 3, 7, 14];
const MAX_LV = 4;
const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => fmtDate(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return fmtDate(new Date(y, m - 1, d + n)); };
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const mdText = s => s ? `${+s.slice(5, 7)}/${+s.slice(8, 10)}` : '';
const studyLabel = st => st.kind === 'new' ? '尚未完成回想' : st.kind === 'dmg' ? '待複習' : '已熟悉';
function initialProgress() {
  const saved = load('village', null);
  if (saved) return saved;
  const known = load('known', {}), out = {};
  Object.keys(known).forEach(id => { if (known[id]) out[id] = { stage: 1, due: addDays(today(), 1), best: 3 }; });
  return out;
}
function useStudy() {
  const [village, setVillage] = useState(initialProgress);
  // 只在原本有舊版 known 或有 village 時保留等值資料；不清空任何其他鍵。
  useEffect(() => { if (Object.keys(village).length) save('village', village); }, [village]);
  const qstars = load('qstars', {});
  const status = id => {
    const v = village[id];
    if (!v) return { stage: 0, kind: 'new' };
    if (v.needsReview || (v.due && today() >= v.due)) return { ...v, kind: 'dmg' };
    return { ...v, kind: v.stage ? 'ok' : 'new' };
  };
  function recordRecall(id, complete) {
    const prev = village[id] || { stage: 0, best: 0 }, st = status(id);
    const stage = complete ? (st.kind === 'ok' ? prev.stage : Math.min(MAX_LV, (prev.stage || 0) + 1)) : (prev.stage || 0);
    const due = complete ? (st.kind === 'ok' ? prev.due : addDays(today(), INTERVALS[stage])) : today();
    setVillage(v => ({ ...v, [id]: { ...prev, stage, due, best: Math.max(prev.best || 0, complete ? 3 : 0), needsReview: !complete, lastReview: today() } }));
    return { due, complete };
  }
  return { status, qstars, recordRecall, builtN: TOPICS.filter(t => status(t.id).stage > 0).length,
    dueN: TOPICS.filter(t => status(t.id).kind === 'dmg').length };
}

/* ---------- 主動回想：答案先遮住，再逐步自評 ---------- */
function RecallSession({ id, game, tts, onClose, onRead }) {
  const t = TOPICS.find(x => x.id === id);
  const steps = useMemo(() => recallSteps(t), [id]);
  const [i, setI] = useState(0);
  const [shown, setShown] = useState(false);
  const [marks, setMarks] = useState([]);
  const [result, setResult] = useState(null);
  const btnRef = useRef(null);
  const pctOf = m => Math.round(m.length / steps.length * 100);
  useEffect(() => {
    const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
    const origin = document.activeElement;
    const f = e => {
      if (e.key === 'Escape') onClose();
      if (e.key === 'Tab') {
        const nodes = [...document.querySelectorAll('.battle button:not(:disabled), .battle a[href]')];
        const first = nodes[0], last = nodes[nodes.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last?.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first?.focus(); }
      }
    };
    addEventListener('keydown', f);
    return () => { document.body.style.overflow = prev; removeEventListener('keydown', f); if (origin?.isConnected) origin.focus(); };
  }, []);
  useEffect(() => { if (btnRef.current) btnRef.current.focus(); }, [i, shown, result]);
  const step = steps[i];
  const speaking = tts.currentKey === 'atk' && tts.player && tts.player.playing;
  const judge = ok => {
    if (tts.player) tts.stop();
    const m = [...marks]; m[i] = ok; setMarks(m);
    if (i + 1 < steps.length) { setI(i + 1); setShown(false); return; }
    const complete = m.length === steps.length && m.every(Boolean);
    setResult({ wrong: steps.filter((s, k) => !m[k]), ...game.recordRecall(id, complete) });
  };
  const restart = () => { setI(0); setShown(false); setMarks([]); setResult(null); };
  const msg = !result ? '' : result.complete
    ? `這次全部講對了。下次複習：${mdText(result.due)}。`
    : '先看需要補強的內容，再遮住答案說一次。這個主題已加入待複習。';
  const head = result ? '回想結果' : '回想練習';
  return html`<div className="battle" role="dialog" aria-modal="true" aria-label=${`${head}：${t.short}`}>
    <div className="bcard">
      <div className="bhead">
        <h2 className="gtitle">${head}：${t.short}</h2>

        <button className="pbtn" aria-label="關閉回想練習" onClick=${onClose}><${StopI} /></button>
      </div>
      ${!result ? html`<div className="bbody">
        <div>
          <div className="dbar"><i style=${{ width: pctOf(marks) + '%' }}></i></div>
          <div className="bstep">第 ${i + 1}／${steps.length} 項・開場句 → 重點 → 易錯提醒</div>
        </div>
        <div className="bq">${step.title}</div>
        <div className="bprompt">${step.prompt}</div>
        ${!shown ? html`<button ref=${btnRef} className="btn primary" style=${{ minHeight: '54px', justifyContent: 'center', fontSize: '17px' }} onClick=${() => setShown(true)}>我講完了，揭曉答案</button>`
          : html`<div className="bans">${Array.isArray(step.ans) ? html`<ul>${step.ans.map(x => html`<li key=${x}>${x}</li>`)}</ul>` : step.ans}</div>
            <div className="bacts">
              <button ref=${btnRef} className="btn primary" onClick=${() => judge(true)}>講對了</button>
              <button className="btn red" onClick=${() => judge(false)}>沒講對</button>
            </div>
            <div><button className="link" disabled=${!tts.supported} onClick=${() => speaking ? tts.pause() : tts.play([{ key: 'atk', label: `${t.short}：${step.title}`, text: ansText(step.ans) }])}>${speaking ? '停止朗讀' : '聽答案'}</button></div>`}
        <p className="note" style=${{ margin: 0 }}>判定要誠實：關鍵字和意思都講到才算「講對了」。</p>
      </div>` : html`<div className="bbody bres">

        <div className="big">${result.complete ? '這次都記住了' : '再複習一下'}</div>
        <div>能獨立說出的項目：${marks.filter(Boolean).length}／${steps.length}</div>
        <p className="msg">${msg}</p>
        ${result.wrong.length > 0 && html`<div className="bans"><b>沒講對的地方</b><ul>${result.wrong.map(s => html`<li key=${s.title}><b>${s.title}</b>：${ansText(s.ans).replace(/\n/g, ' ')}</li>`)}</ul></div>`}
        <div className="bacts" style=${{ width: '100%' }}>
          <button ref=${btnRef} className="btn primary" onClick=${restart}>再回想一次</button>
          <button className="btn blue" onClick=${() => onRead(id)}>回到閱讀</button>
          <button className="btn" onClick=${onClose}>結束練習</button>
        </div>
      </div>`}
    </div>
  </div>`;
}

    <div className="topics">

/* ---------- 口試練習頁 ---------- */
function Practice({ tts, game, topic, setTopic }) {
  const [qid, setQid] = useState(() => load('qid', 1));
  const [drafts, setDrafts] = useState(() => load('drafts', null) || { 1: SAMPLE });
  const [scores, setScores] = useState(() => load('scores', {}));
  const [graded, setGraded] = useState(() => {
    const d = load('drafts', null) || { 1: SAMPLE }; const id = load('qid', 1);
    return d[id] ? { [id]: d[id] } : {};
  });
  const [hints, setHints] = useState(false);
  const [sec, setSec] = useState(0);
  const [running, setRunning] = useState(false);
  const [undo, setUndo] = useState(null);
  const stt = useSTT();
  useWakeLock(stt.on);
  const list = useMemo(() => QUESTIONS.filter(q => inTopic(q, topic)), [topic]);
  const quizList = useMemo(() => list.map(questionQuiz), [list]);
  const q = list.find(x => x.id === qid) || list[0];
  const pos = list.indexOf(q);
  const text = drafts[q.id] || '';

  useEffect(() => save('drafts', drafts), [drafts]);
  useEffect(() => save('scores', scores), [scores]);
  useEffect(() => { save('qid', q.id); setSec(0); setRunning(false); setHints(false); if (stt.on) stt.stop(); }, [q.id]);
  // 語音聽考念到哪一題，畫面就切到那一題。
  useEffect(() => {
    const k = tts.currentKey;
    if (k && k.startsWith('qq-')) { const id = +k.slice(3); if (id !== q.id && list.some(x => x.id === id)) setQid(id); }
  }, [tts.currentKey]);
  useEffect(() => { if (!running) return; const t = setInterval(() => setSec(s => s + 1), 1000); return () => clearInterval(t); }, [running]);

  const result = useMemo(() => graded[q.id] != null ? grade(q, graded[q.id]) : null, [q, graded]);
  const gradedText = graded[q.id];
  const stale = gradedText != null && gradedText !== text;
  const modelLayers = useMemo(() => result ? matchKeywords(q, q.model).kws.map((k, i) => ({ spans: k.spans, status: result.kws[i].status })) : [], [q, result]);

  const go = id => { setQid(id); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const setText = v => setDrafts(d => ({ ...d, [q.id]: v }));
  const gradeNow = (id, t) => {
    const total = grade(QUESTIONS.find(x => x.id === id), t).total;
    setGraded(g => ({ ...g, [id]: t })); setScores(s => ({ ...s, [id]: total }));
  };
  const doGrade = () => { gradeNow(q.id, text); setRunning(false); };
  // 口說作答：「重新口說」先清空（保留一次復原），「接著說」接在原本的文字後面；說完自動檢查。
  const hasText = !!text.trim() && text !== SAMPLE;
  const talk = more => {
    if (tts.player) tts.stop();
    const id = q.id, prev = text === SAMPLE ? '' : text;
    const base = more && prev.trim() ? prev.replace(/\s+$/, '') + '\n' : '';
    const ok = stt.start({
      onText: t => setDrafts(d => ({ ...d, [id]: base + t })),
      onDone: t => { setRunning(false); if (t.trim()) { setDrafts(d => ({ ...d, [id]: base + t })); gradeNow(id, base + t); } },
    });
    if (!ok) return;
    if (!more) { setUndo(prev.trim() ? { id, text: prev } : null); setDrafts(d => ({ ...d, [id]: '' })); setSec(0); }
    setRunning(true);
  };
  const quizOn = !!(tts.player && tts.player.playing && tts.currentKey && tts.currentKey.startsWith('qq-'));
  const listen = (key, label, body) => { if (stt.on) stt.stop(); if (speaking(key)) tts.pause(); else tts.play([{ key, label, text: body }]); };
  const draw = () => {
    if (list.length < 2) return;
    // 優先抽需要補強的題目；舊版最佳紀錄仍計入。
    const weak = list.filter(x => x.id !== q.id && !((scores[x.id] || 0) >= 90 || (game.qstars[x.id] || 0) >= 3));
    const pool = weak.length ? weak : list.filter(x => x.id !== q.id);
    go(pool[Math.floor(Math.random() * pool.length)].id);
  };
  const mmss = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
  const charCount = text.replace(/\s/g, '').length;
  const doneN = Object.keys(scores).length, goodN = QUESTIONS.filter(x => ((scores[x.id] || 0) >= 90 || (game.qstars[x.id] || 0) >= 3)).length;
  const qKey = 'q-' + q.id, mKey = 'm-' + q.id;
  const speaking = k => tts.currentKey === k && tts.player && tts.player.playing;

  const advice = [];
  if (result) {
    const miss = result.kws.filter(k => k.status !== 'hit');
    if (miss.length) advice.push(`先補上關鍵字：${miss.map(k => k.label.replace(/\(.*?\)/g, '')).join('、')}。每一段的第一句就講出來，老師才聽得到。`);
    if (result.found && !result.frontOk) advice.push('關鍵字出現得太晚：開頭先把核心概念講一遍，再逐一解釋。');
    if (result.defScore < 1) advice.push('定義講得不夠：多用「○○是指……」「也就是……」把每個概念講清楚。');
    if (result.exScore < 1) advice.push(`補上課堂實例：${q.exampleHint}`);
    if (!advice.length) advice.push('結構完整：關鍵字 → 定義 → 實例都有了。不看範本再講一次，控制在 3 分鐘內。');
  }

  return html`<div>
    <div className="pbar">
      <div className="pfilter">
        <label htmlFor="tsel" className="meta">主題</label>
        <select id="tsel" value=${topic} onChange=${e => setTopic(e.target.value)}>
          <option value="all">全部主題（${QUESTIONS.length} 題）</option>
          ${TOPICS.map((t, i) => html`<option key=${t.id} value=${t.id}>${String(i + 1).padStart(2, '0')} ${t.title}（${QUESTIONS.filter(x => inTopic(x, t.id)).length}）</option>`)}
        </select>
        <button className="btn primary" onClick=${draw}>隨機抽題</button>
      </div>
      <div className="pfilter">
        <button className="btn" aria-label="上一題" disabled=${pos <= 0} onClick=${() => go(list[pos - 1].id)}>‹</button>
        <select id="qsel" value=${q.id} onChange=${e => go(+e.target.value)} aria-label="選擇題目">
          ${list.map(x => html`<option key=${x.id} value=${x.id}>${x.id}. ${x.category}（${x.type}）${scores[x.id] != null ? '・' + scores[x.id] + '分' : ''}</option>`)}
        </select>
        <button className="btn" aria-label="下一題" disabled=${pos >= list.length - 1} onClick=${() => go(list[pos + 1].id)}>›</button>
      </div>
      <div>
        <div className="progress" aria-label="練習進度">${list.map(x => html`<i key=${x.id} title=${x.id + '. ' + x.category} className=${(scores[x.id] != null || game.qstars[x.id] ? 'done' : '') + (x.id === q.id ? ' cur' : '')}></i>`)}</div>
        <span className="meta">全部 ${QUESTIONS.length} 題：已練 ${doneN} 題，曾達 90 分 ${goodN} 題。隨機抽題會優先抽需要補強的題目。</span>
      </div>
      ${tts.supported && html`<div className="pfilter quiz-acts">
        <button className=${'btn ' + (quizOn ? 'on' : '')} onClick=${() => { if (quizOn) { tts.pause(); return; } if (stt.on) stt.stop(); tts.play(quizList, pos); }}>${quizOn ? html`<${PauseI} />暫停聽考` : html`<${Speaker} />語音聽考：從第 ${q.id} 題開始（${list.length - pos} 題）`}</button>
        <label className="gap-field" htmlFor="gap-practice">作答時間<${GapSelect} tts=${tts} id="gap-practice" /></label>
      </div>`}
    </div>
    <div className="grid2">
      <section className="sheet sticky" aria-label="作答區">
        <div className="qhead"><span className="num">第 ${q.id} 題</span><span className="type">${q.type}</span><span>${topicName(q.topic)}</span></div>
        <p className="qtext">${q.question}</p>
        <div className="hintbar">
          <button className=${'btn ' + (speaking(qKey) ? 'on' : 'ghost')} disabled=${!tts.supported} onClick=${() => listen(qKey, `第 ${q.id} 題題目`, q.question)}>
            ${speaking(qKey) ? html`<${PauseI} />停止` : html`<${Speaker} />聽題目`}</button>
          <button className="link" onClick=${() => setHints(h => !h)}>${hints ? '收起關鍵字提示' : '偷看關鍵字提示'}</button>
        </div>
        ${hints && html`<div className="kwhint">${q.keywords.map(k => html`<span key=${k.label}>${k.label}</span>`)}</div>`}
        ${q.id === 1 && text === SAMPLE && html`<p className="samplenote">↓ 這是範例回答（故意漏了幾個關鍵字），可直接清空換成你自己的。</p>`}
        <label htmlFor="answer" className="meta">${stt.supported ? '你的口試回答（按「開始口說」直接說，也可以打字）' : '你的口試回答（對著麥克風講，用聽寫轉成文字；也可以打字）'}</label>
        ${stt.supported && html`<div className="mic-row">
          ${stt.on ? html`<button className="btn rec" onClick=${() => stt.stop()}><${StopI} />停止並檢查</button><span className="rec-dot" role="status">收音中</span>`
            : hasText ? html`<button className="btn primary" onClick=${() => talk(false)}><${MicI} />重新口說</button><button className="btn" onClick=${() => talk(true)}><${MicI} />接著說</button>`
            : html`<button className="btn primary" onClick=${() => talk(false)}><${MicI} />開始口說</button>`}
          ${!stt.on && undo && undo.id === q.id && html`<button className="link" onClick=${() => { setText(undo.text); setUndo(null); }}>復原口說前的文字</button>`}
        </div>`}
        ${stt.err && html`<p className="mic-warn" role="alert">${stt.err}</p>`}
        <textarea id="answer" className=${'answer' + (stt.on ? ' listening' : '')} value=${text} readOnly=${stt.on} onChange=${e => setText(e.target.value)}
          placeholder=${stt.on ? '正在聽你說……' : '先講關鍵字，再講定義，最後舉課堂例子……'}></textarea>
        <div className="toolbar">
          <button className="btn primary" disabled=${stt.on} onClick=${doGrade}>檢查回答</button>
          <button className="btn" disabled=${stt.on} onClick=${() => setText('')}>清空</button>
          <span className="spacer"></span>
          <span className="meta">${charCount} 字</span>
          <span className="timer">${mmss}</span>
          <button className="btn" onClick=${() => setRunning(r => !r)}>${running ? '暫停' : '計時'}</button>
          <button className="btn" onClick=${() => { setSec(0); setRunning(false); }}>歸零</button>
        </div>
        <p className="tip">${stt.supported
          ? '講完按「停止並檢查」，會自動比對關鍵字。iPhone 要先開啟聽寫（設定 → 一般 → 鍵盤 → 啟用聽寫）並連上網路；術語聽錯可以直接改字，再按「檢查回答」。草稿只存在這台裝置。'
          : '口說作答：iPhone、Android 點輸入框後按鍵盤上的麥克風；Mac 連按兩下 Fn 開啟聽寫。講完按「檢查回答」，看看有沒有漏掉重點。草稿只存在這台裝置。'}</p>
      </section>

      <section className="sheet" aria-label="批改結果" aria-live="polite">
        ${!result ? html`<div className="empty">講完按「檢查回答」，這裡會用紅筆標出漏掉的關鍵字，並對照滿分範本。</div>` : html`<div>
          ${stale && html`<div className="stale">回答已修改，按「檢查回答」更新結果。</div>`}
          <div className="score">
            <div className="big">${result.total}<small> / 100</small></div>
            <div className="bar"><span>基本分・關鍵字</span><span className="track"><i style=${{ width: (result.base / 50 * 100) + '%' }}></i></span><span className="pt">${Math.round(result.base)}/50</span></div>
            <div className="bar"><span>滿分・定義實例</span><span className="track"><i style=${{ width: (result.elab / 50 * 100) + '%' }}></i></span><span className="pt">${Math.round(result.elab)}/50</span></div>
          </div>
          <div className="chk">
            <span className=${result.frontOk ? 'ok' : 'no'}>${result.frontOk ? '✓' : '✗'} 關鍵字先講</span>
            <span className=${result.defScore >= 1 ? 'ok' : 'no'}>${result.defScore >= 1 ? '✓' : '✗'} 定義句 ${result.defCount} 處</span>
            <span className=${result.exScore >= 1 ? 'ok' : 'no'}>${result.exScore >= 1 ? '✓' : '✗'} 實例${result.exTerms.length ? '：' + result.exTerms.slice(0, 4).join('、') : (result.exMarker ? '（有「例如」但沒講課堂例子）' : '（沒有舉例）')}</span>
          </div>
          <h3 className="secttl">核心關鍵字 <small>命中 ${result.kws.filter(k => k.status === 'hit').length} ／ ${result.kws.length}</small></h3>
          <ul className="kwlist">
            ${result.kws.map(k => html`<li key=${k.label}>
              <span className=${'pill ' + k.status}>${{ hit: '✓ 命中', partial: '△ 部分', miss: '✗ 漏掉' }[k.status]}</span>
              <span>${k.label}${k.lack.length > 0 && html`<span className="lack">缺：${k.lack.join('、')}</span>`}</span>
            </li>`)}
          </ul>
          <h3 className="secttl">怎麼補分</h3>
          <ul className="advice">${advice.map((a, i) => html`<li key=${i}>${a}</li>`)}</ul>
          <h3 className="secttl">你的回答 <span className="legend"><span><i style=${{ background: 'var(--hl)' }}></i>命中</span><span><i style=${{ borderBottom: '2px solid var(--partial)' }}></i>部分命中</span></span></h3>
          ${gradedText ? html`<${Marked} text=${gradedText} hand=${true} prefix="m-" layers=${result.kws.map(k => ({ spans: k.spans, status: k.status === 'miss' ? 'hit' : k.status }))} />` : html`<p className="meta">（空白）</p>`}
          <h3 className="secttl">滿分範本
            <button className=${'btn ' + (speaking(mKey) ? 'on' : '')} disabled=${!tts.supported} onClick=${() => listen(mKey, `第 ${q.id} 題滿分範本`, q.model)}>${speaking(mKey) ? html`<${PauseI} />停止` : html`<${Speaker} />聽範本`}</button>
            <span className="legend"><span><i style=${{ background: 'var(--miss-bg)', outline: '1px solid var(--redpen)' }}></i>你漏掉的</span><span><i style=${{ background: 'var(--partial-bg)' }}></i>部分</span><span><i style=${{ background: 'var(--hit-bg)' }}></i>已命中</span></span></h3>
          <${Marked} text=${q.model} prefix="mm-" layers=${modelLayers} />
          <p className="disclaim">估計分只依字面比對關鍵字與句型，用來檢查有沒有漏講，實際給分以老師判斷為準。第 1～6 題來自課堂題庫，第 7～46 題依課堂知識庫補充。</p>
        </div>`}
      </section>
    </div>
  </div>`;
}

/* ---------- 底部播放列 ---------- */
const RATES = [0.8, 0.9, 1, 1.1, 1.2, 1.3, 1.5];
function Player({ tts }) {
  const p = tts.player, ref = useRef(null);
  // 播放列高度隨字幕變動：寫進 --player-h，頁面底部留出同樣的空間。
  useEffect(() => {
    const el = ref.current, root = document.documentElement;
    if (!el) return;
    const put = () => root.style.setProperty('--player-h', el.offsetHeight + 'px');
    put();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(put) : null;
    if (ro) ro.observe(el);
    return () => { if (ro) ro.disconnect(); root.style.removeProperty('--player-h'); };
  }, [!!p]);
  if (!p) return null;
  const it = p.items[p.idx];
  const gap = p.phase === 'gap' && !p.ended;
  const status = p.error ? p.error : p.ended ? '播放完畢' : !p.playing ? (gap && p.left >= 0 ? `已暫停・作答剩 ${p.left} 秒` : '已暫停')
    : gap ? (p.left < 0 ? '換你說，說完按「揭曉」' : `換你說・剩 ${p.left} 秒`)
    : p.quiz ? (p.part === 'a' ? '答案' : '題目') : `第 ${p.unit + 1}／${p.total} 句`;
  return html`<div className="player" role="region" aria-label="朗讀播放" ref=${ref}>
    <div className="in">
      <div className="now"><b>${it.label}</b><span className=${p.error ? 'warnline' : undefined}>${p.items.length > 1 ? `${p.idx + 1}／${p.items.length}・` : ''}${status}</span></div>
      ${gap && p.playing && p.left >= 0 && p.gapTotal > 0 && html`<div className="dbar countdown" aria-hidden="true"><i style=${{ width: (p.left / p.gapTotal * 100) + '%' }}></i></div>`}
      ${p.phase === 'say' && p.line && !p.ended && html`<p className="line">${p.line}</p>`}
      ${p.items.length > 1 && html`<button className="pbtn" aria-label="上一個" onClick=${() => tts.jump(-1)}><${PrevI} /></button>`}
      <button className="pbtn main" aria-label=${p.playing ? '暫停' : '播放'} onClick=${() => p.playing ? tts.pause() : tts.resume()}>${p.playing ? html`<${PauseI} />` : html`<${PlayI} />`}</button>
      ${p.items.length > 1 && html`<button className="pbtn" aria-label="下一個" onClick=${() => tts.jump(1)}><${NextI} /></button>`}
      ${gap && html`<button className="btn primary reveal" onClick=${tts.reveal}>揭曉</button>`}
      <select className="hide-sm" aria-label="語速" value=${tts.rate} onChange=${e => tts.setRate(+e.target.value)}>
        ${RATES.map(r => html`<option key=${r} value=${r}>${r}×</option>`)}
        ${!RATES.includes(tts.rate) && html`<option value=${tts.rate}>${tts.rate}×</option>`}
      </select>
      <button className="pbtn" aria-label="關閉播放" onClick=${tts.stop}><${StopI} /></button>
    </div>
  </div>`;
}

function App() {
  const TABS = ['notes', 'review', 'practice'];
  const [tab, setTabRaw] = useState(() => { const h = (location.hash || '').slice(1); const old = load('tab', 'notes'); return TABS.includes(h) ? h : TABS.includes(old) ? old : 'notes'; });
  const [topic, setTopic] = useState(() => { const p = load('ptopic', 'all'); return p === 'all' || TOPICS.some(t => t.id === p) ? p : 'all'; });
  const [attack, setAttack] = useState(null);
  const [focus, setFocus] = useState(null);
  const [theme, setTheme] = useState(() => load('theme', 'system'));
  const tts = useTTS(), game = useStudy();
  useWakeLock(!!(tts.player && tts.player.playing));
  useEffect(() => save('tab', tab), [tab]);
  useEffect(() => save('ptopic', topic), [topic]);
  useEffect(() => { if (theme === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme; save('theme', theme); }, [theme]);
  const setTab = t => { tts.stop(); setTabRaw(t); window.scrollTo({ top: 0 }); };
  const startAttack = id => { if (tts.player) tts.stop(); setAttack(id); };
  const closeAttack = () => { if (tts.player) tts.stop(); setAttack(null); };
  const read = id => { closeAttack(); setTab('notes'); setFocus(id); };
  const practice = id => { setTopic(id); setTab('practice'); };
  return html`<div style=${{ paddingBottom: tts.player ? 'calc(var(--player-h, 170px) + 24px)' : 0 }}>
    <header className=${'mast' + (tab !== 'notes' ? ' compact' : '')}>
      <div className="mastrow"><p className="eyebrow"><span className="issue-dot"></span>口試特訓・圖解學習誌</p>
        <label className="theme-control">外觀<select aria-label="外觀" value=${theme} onChange=${e => setTheme(e.target.value)}><option value="system">跟隨系統</option><option value="light">淺色</option><option value="dark">深色</option></select></label></div>
      <div className="cover-layout"><div className="cover-copy"><p className="issue-label">本期專題｜測驗與學習評量</p>
        <h1>評量筆記</h1>
        ${tab === 'notes' && html`<div className="cover-actions"><button className="btn primary" onClick=${() => read('process')}>開始閱讀 <span aria-hidden="true">↗</span></button><button className="cover-link" onClick=${() => setTab('review')}>回想練習 →</button></div>`}
      </div>${tab === 'notes' && html`<div className="cover-illustration"><${CoverArt} /></div>`}</div>
      <div className="mast-meta"><span><b>15</b> 個理論主題</span><span><b>46</b> 題口試練習</span><button onClick=${() => setTab('review')}><b>${game.dueN}</b> 個主題待複習 <span aria-hidden="true">↗</span></button></div>
    </header>
    <nav className="tabs" aria-label="學習分頁">
      ${[['notes','主題閱讀'],['review','回想練習'],['practice','口試練習']].map(([v,l]) => html`<button className="tab" aria-current=${tab === v ? 'page' : undefined} aria-selected=${tab === v} key=${v} onClick=${() => setTab(v)}>${l}</button>`)}
    </nav>
    ${tab === 'notes' && html`<${Notes} tts=${tts} game=${game} onPractice=${practice} onAttack=${startAttack} focus=${focus} clearFocus=${() => setFocus(null)} />`}
    ${tab === 'review' && html`<${Review} game=${game} tts=${tts} onAttack=${startAttack} onRead=${read} />`}
    ${tab === 'practice' && html`<${Practice} tts=${tts} game=${game} topic=${topic} setTopic=${setTopic} />`}
    <footer>內容依課堂知識庫與題庫整理。朗讀使用裝置內建語音。熟悉程度、複習日期、答題紀錄與草稿只存在這個瀏覽器；舊版進度已接續保留。</footer>
    ${attack && html`<${RecallSession} key=${attack} id=${attack} game=${game} tts=${tts} onClose=${closeAttack} onRead=${read} />`}
    <${Player} tts=${tts} />
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
